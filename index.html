/* Recuerda la última página visitada (por usuario) para que, al recargar la página del
   navegador, el sistema vuelva ahí en vez de mandarlo siempre a Inicio. Para el PCA y el Plan
   Semanal guarda también el id del registro abierto, para reabrirlo (no el borrador sin guardar:
   eso se pierde igual que antes, ya que solo existe en memoria). */
var SUBVIEW_ID_FIELD = {pcaform:'editingPca', semanalform:'editingSemanal', tallerform:'editingTaller'};
var SUBVIEW_RETURN_FIELD = {pcaform:'pcaReturnTo', semanalform:'semanalReturnTo', tallerform:'tallerReturnTo'};
function guardarUltimaVista(){
  var d = currentDocente();
  if(!d) return;
  var idField = SUBVIEW_ID_FIELD[state.subview];
  var registro = idField && state[idField];
  try{
    localStorage.setItem('lastView_' + d.id, JSON.stringify({
      subview: state.subview,
      id: registro ? registro.id : null,
      returnTo: SUBVIEW_RETURN_FIELD[state.subview] ? state[SUBVIEW_RETURN_FIELD[state.subview]] : null
    }));
  }catch(e){}
}
/* No se restaura la vista de "editar a este docente" (adminEditDocente/adminNewDocente): depende
   de un working copy que no sobrevive un recargo, y reabrirla a ciegas podría confundir más de lo
   que ayuda — se queda simplemente en la pestaña "admin". */
var SUBVIEW_SIN_RESTAURAR = {adminEditDocente:'admin', adminNewDocente:'admin'};
var RESTORED_LAST_VIEW = false;
var RESTORE_STARTED_AT = null;
function intentarRestaurarUltimaVista(d){
  if(RESTORED_LAST_VIEW) return;
  if(RESTORE_STARTED_AT===null) RESTORE_STARTED_AT = Date.now();
  var saved;
  try{
    var raw = localStorage.getItem('lastView_' + d.id);
    saved = raw ? JSON.parse(raw) : null;
  }catch(e){ saved = null; }
  if(!saved || !saved.subview){ RESTORED_LAST_VIEW = true; return; }
  if(SUBVIEW_SIN_RESTAURAR[saved.subview]){
    RESTORED_LAST_VIEW = true;
    if(state.subview !== SUBVIEW_SIN_RESTAURAR[saved.subview]) go(SUBVIEW_SIN_RESTAURAR[saved.subview]);
    return;
  }
  var col = saved.subview==='pcaform' ? LS.PCA : (saved.subview==='semanalform' ? LS.SEMANAL : (saved.subview==='tallerform' ? LS.TALLER : null));
  if(!col){
    RESTORED_LAST_VIEW = true;
    if(saved.subview !== state.subview) go(saved.subview);
    return;
  }
  if(!saved.id){ RESTORED_LAST_VIEW = true; return; }
  var existe = load(col).some(function(x){ return x.id===saved.id; });
  if(existe){
    RESTORED_LAST_VIEW = true;
    if(col===LS.PCA) openPcaForm(saved.id, saved.returnTo||'pcalist');
    else if(col===LS.SEMANAL) openSemanalForm(saved.id, saved.returnTo||'semanallist');
    else openTallerForm(saved.id, saved.returnTo||'tallerlist');
  } else if(Date.now() - RESTORE_STARTED_AT > 4000){
    // Se agotó la espera de los listeners en tiempo real, o el registro ya no existe (se borró):
    // mejor quedarse en Inicio que esperar indefinidamente.
    RESTORED_LAST_VIEW = true;
  }
  // si no existe todavía pero no se ha agotado el tiempo, se reintenta solo — cada onSnapshot
  // llama a render() al llegar datos nuevos, y render() vuelve a invocar esta función.
}

/* ============================= RENDER ROOT ============================= */
function render(){
  if(ES_FORMULARIO_PUBLICO){ renderFormularioPublico(); return; }
  var root = document.getElementById('app');
  if(!FB_READY){
    root.innerHTML = '<div class="center-screen"><div class="hint">Conectando…</div></div>';
    return;
  }
  if(!getSessionId()){
    root.innerHTML = state.authView === 'register' ? renderRegister() : renderLogin();
    bindAuthEvents();
  } else if(!currentDocente()){
    root.innerHTML = '<div class="center-screen"><div class="hint">Cargando tu perfil…</div></div>';
  } else {
    intentarRestaurarUltimaVista(currentDocente());
    root.innerHTML = renderShell();
    bindShellEvents();
  }
}

/* Mapea los códigos de error de Firebase Auth a mensajes en español para el usuario. */
function mapAuthError(err){
  var code = err && err.code;
  var MAP = {
    'auth/invalid-email': 'El correo no es válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ese correo ya está registrado. Inicia sesión o usa "¿Olvidaste tu contraseña?".',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/network-request-failed': 'No se pudo conectar. Revisa tu conexión a internet.',
    'auth/requires-recent-login': 'Por seguridad, cierra sesión, vuelve a entrar, e intenta este cambio de inmediato.'
  };
  return (code && MAP[code]) || (err && err.message) || 'Ocurrió un error inesperado.';
}

async function doLogin(){
  var email = (document.getElementById('loginId').value || '').trim();
  var pw = document.getElementById('loginPw').value || '';
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email || !pw){ errEl.textContent='Ingresa tu correo y contraseña.'; errEl.classList.add('show'); return; }
  try{
    await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pw);
    /* onAuthStateChanged (ver FIREBASE BOOTSTRAP) se encarga de cargar el perfil, activar los
       listeners en tiempo real, y llamar a render() — aquí no hace falta hacerlo. */
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doResetPassword(){
  var email = (document.getElementById('loginId').value || '').trim();
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email){ errEl.textContent='Escribe tu correo arriba primero, luego haz clic en "¿Olvidaste tu contraseña?".'; errEl.classList.add('show'); return; }
  try{
    await window.FB.sendPasswordResetEmail(window.FB.auth, email);
    toast('Te enviamos un correo a ' + email + ' para restablecer tu contraseña.', 'success');
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doRegister(){
  var errEl = document.getElementById('registerError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('regTitulo').value.trim();
  var nombres = document.getElementById('regNombres').value.trim();
  var apellidos = document.getElementById('regApellidos').value.trim();
  var ci = document.getElementById('regCI').value.trim();
  var telefono = document.getElementById('regTelefono').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var usuarioId = document.getElementById('regUserId').value.trim();
  var pw = document.getElementById('regPw').value;

  if(!nombres || !apellidos || !ci || !email || !usuarioId || !pw) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Ingresa un correo institucional válido.');
  if(pw.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');

  var snap;
  try{
    snap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
  }catch(err){ return fail(mapAuthError(err)); }
  var existentes = []; snap.forEach(function(d){ existentes.push(d.data()); });
  if(existentes.some(function(d){ return (d.usuarioId||'').toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  /* Toda cuenta que se registra por sí misma queda como 'docente' — nunca 'admin' — reforzado
     también en las reglas de seguridad de Firestore, para que nadie pueda auto-otorgarse el rol
     de administrador. Un administrador ya existente promueve a alguien desde Editar Docente, o
     si el sistema está recién desplegado y todavía no hay ningún admin, se cambia el campo
     "role" a "admin" manualmente una sola vez desde la consola de Firebase (Firestore → docentes). */
  var role = 'docente';

  var cred;
  try{
    cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pw);
  }catch(err){ return fail(mapAuthError(err)); }

  var docente = {
    id: cred.user.uid,
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono,
    email: email, usuarioId: usuarioId,
    role: role,
    createdAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DOCENTES, docente.id), docente);
  }catch(err){
    return fail('Tu cuenta se creó pero no se pudo guardar tu perfil (' + mapAuthError(err) + '). Cierra esta página e intenta iniciar sesión de nuevo.');
  }

  toast('¡Bienvenido/a, ' + docente.nombres + '! Tu cuenta fue creada.', 'success');
  /* onAuthStateChanged toma el control desde aquí (perfil ya escrito arriba antes de que llegue). */
}

/* ============================= ROLES ============================= */
/* Además de 'docente', hay tres roles con acceso administrativo pleno y equivalente entre sí
   (Administrador, Directivo, DECE): todos ven Administración, Inspección General, Base de Datos
   y el módulo DECE. Se mantienen como valores de rol distintos (no fusionados) para identificar
   correctamente quién hizo qué (p.ej. "Atendido por" en un caso DECE), aunque hoy sus permisos
   sean idénticos. */
var STAFF_ROLES = ['admin','directivo','dece'];
function isStaffRole(role){ return STAFF_ROLES.indexOf(role) !== -1; }
/* Inspector General: rol acotado — ve y administra solo Inspección General (Estudiantes,
   Asistencia, Disciplina, Reportes) y su propio Perfil/Carga Horaria, nada más. No es "staff"
   (isStaffRole sigue sin incluirlo) porque no debe tener acceso a Administración, DECE ni Base
   de Datos — ver renderShell (filtro del menú) y attachRealtimeListeners (sincronización). */
function puedeVerInspeccion(role){ return isStaffRole(role) || role==='inspector'; }
var ROLE_LABELS = { admin:'Administrador', directivo:'Directivo', dece:'DECE', inspector:'Inspector General', docente:'Docente' };
function rolePillHtml(role){
  if(role==='admin') return '<span class="pill pill-gold">Administrador</span>';
  if(role==='directivo') return '<span class="pill pill-blue">Directivo</span>';

function renderShell(){
  var d = currentDocente();
  var isAdmin = isStaffRole(d.role);
  var esInspector = d.role === 'inspector';
  if(!isAdmin && (state.subview === 'admin' || state.subview === 'adminEditDocente' || state.subview === 'adminNewDocente' || state.subview === 'manualadmin' || state.subview === 'dece' || state.subview === 'dececonsultas')) state.subview = 'dashboard';
  if(!puedeVerInspeccion(d.role) && state.subview === 'inspeccion') state.subview = 'dashboard';
  /* El Inspector General solo puede ver "Perfil y Datos del Docente" e "Inspección General" —
     si por cualquier vía (estado viejo, enlace directo) queda apuntando a otra sección, lo manda
     de vuelta a Inicio. */
  if(esInspector && ['pcalist','pcaform','semanallist','semanalform','tallerlist','tallerform','observacion','misasistencia','fichadeteccion','database','manualdocente','manualadmin'].indexOf(state.subview)!==-1){ state.subview = 'dashboard'; }
  function navItemActive(item){
    return (state.subview === item.key
      || (state.subview==='pcaform' && item.key==='pcalist' && state.pcaReturnTo!=='admin')
      || (state.subview==='semanalform' && item.key==='semanallist' && state.semanalReturnTo!=='admin')
      || (state.subview==='tallerform' && item.key==='tallerlist' && state.tallerReturnTo!=='admin')
      || ((state.subview==='pcaform'||state.subview==='semanalform'||state.subview==='tallerform') && item.key==='admin' && (state.pcaReturnTo==='admin'||state.semanalReturnTo==='admin'||state.tallerReturnTo==='admin'))
      || ((state.subview==='adminEditDocente'||state.subview==='adminNewDocente') && item.key==='admin'));
  }
  var navHtml = NAV_GROUPS.filter(function(group){
    if(esInspector) return group.label==='Perfil y Datos del Docente' || group.label==='Inspección';
    return true;
  }).map(function(group){
    var visibleItems = group.items.filter(function(item){
      if(item.staffOrInspector) return isAdmin || esInspector;
      if(item.showIf && !item.showIf(d, isAdmin)) return false;
      if(item.hideIf && item.hideIf(d, isAdmin)) return false;
      return !item.adminOnly || isAdmin;
    });
    if(!visibleItems.length) return '';
    var hasActive = visibleItems.some(navItemActive);
    /* Por defecto la categoría se abre sola si contiene la página activa; si el usuario la
       colapsa/expande a mano, se respeta esa elección mientras siga en esa página. */
    var collapsed = (group.label in state.navCollapsed) ? state.navCollapsed[group.label] : !hasActive;
    var itemsHtml = visibleItems.map(function(item){
      var active = navItemActive(item);
      return '<button data-nav="'+item.key+'" class="'+(active?'active':'')+'"><span class="ic">'+item.ic+'</span>'+item.label+'</button>';
    }).join('');
    return ''
    + '<div class="nav-group nav-hue-' + (group.hue||'blue') + (collapsed?'':' expanded') + '">'
    + '  <button type="button" class="nav-group-header" data-navgroup="' + escapeHtml(group.label) + '" aria-expanded="' + (!collapsed) + '">'
    + '    <span class="nav-group-label">' + escapeHtml(group.label) + '</span>'
    + '    <span class="nav-group-chevron">›</span>'
    + '  </button>'
    + '  <div class="nav-group-items">' + itemsHtml + '</div>'
    + '</div>';
  }).join('');

  var sub;
  if(state.subview === 'cargahoraria') sub = renderCargaHoraria(d);
  else if(state.subview === 'pcalist') sub = renderPcaList(d);
  else if(state.subview === 'pcaform') sub = renderPcaForm(d);
  else if(state.subview === 'semanallist') sub = renderSemanalList(d);
  else if(state.subview === 'semanalform') sub = renderSemanalForm(d);
  else if(state.subview === 'tallerlist') sub = renderTallerList(d);
  else if(state.subview === 'tallerform') sub = renderTallerForm(d);
  else if(state.subview === 'perfil') sub = renderPerfil(d);
  else if(state.subview === 'database') sub = renderDatabase(d);
  else if(state.subview === 'admin') sub = renderAdmin(d);
  else if(state.subview === 'adminEditDocente') sub = renderAdminEditDocente(d);
  else if(state.subview === 'adminNewDocente') sub = renderAdminNewDocente(d);
  else if(state.subview === 'manualdocente') sub = renderManualDocente();
  else if(state.subview === 'manualadmin') sub = renderManualAdmin();
  else if(state.subview === 'inspeccion') sub = renderInspeccion(d);
  else if(state.subview === 'observacion') sub = renderObservacion(d);
  else if(state.subview === 'misasistencia') sub = renderMiAsistencia(d);
  else if(state.subview === 'dece') sub = renderDece(d);
  else if(state.subview === 'fichadeteccion') sub = renderFichaDeteccion(d);
  else if(state.subview === 'dececonsultas') sub = renderDeceConsultas(d);
  else sub = renderDashboard(d);

  return ''
  + '<div class="mobile-topbar"><button id="btnOpenSidebar">☰</button><span class="name">UEP Simón Bolívar</span></div>'
  + '<div class="sidebar-scrim ' + (state.sidebarOpen ? 'show' : '') + '" id="sidebarScrim"></div>'
  + '<div class="shell">'
  + '  <aside class="sidebar ' + (state.sidebarOpen ? 'open' : '') + '">'
  + '    <div class="brand"><img src="{{LOGO_B64}}" alt="Logo" /><div><div class="name">UEP “Simón Bolívar”</div><div class="year">Año lectivo 2026-2027</div></div></div>'
  + '    <nav>' + navHtml + '</nav>'
  + '    <div class="spacer"></div>'
  + '    <div class="who"><div class="who-name">' + escapeHtml(d.nombres) + ' ' + escapeHtml(d.apellidos) + '</div><div class="who-role">' + escapeHtml(ROLE_LABELS[d.role] || 'Docente') + '</div><button id="btnLogout">Cerrar sesión</button></div>'
  + '  </aside>'
  + '  <main class="content">' + sub + '</main>'
  + '</div>';
}

function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.onclick = function(){ go(btn.getAttribute('data-nav')); };
  });
  document.querySelectorAll('[data-navgroup]').forEach(function(btn){
    btn.onclick = function(){
      var label = btn.getAttribute('data-navgroup');
      var currentlyCollapsed = btn.closest('.nav-group').className.indexOf('expanded') === -1;
      state.navCollapsed[label] = !currentlyCollapsed;
      render();
    };
  });
  var logout = document.getElementById('btnLogout');
  if(logout) logout.onclick = function(){ state.subview='dashboard'; window.FB.signOut(window.FB.auth); };
  var openBtn = document.getElementById('btnOpenSidebar');
  if(openBtn) openBtn.onclick = function(){ state.sidebarOpen = true; render(); };
  var scrim = document.getElementById('sidebarScrim');
  if(scrim) scrim.onclick = function(){ state.sidebarOpen = false; render(); };

  + '  <div class="field"><label>Nueva contraseña</label><input type="password" id="perfilPw" placeholder="Déjalo en blanco para no cambiarla" /></div>'
  + '  <button class="btn btn-primary" id="btnSavePerfil" style="margin-top:6px;">Guardar cambios</button>'
  + '</div>';
}
async function doSavePerfil(){
  var d = currentDocente();
  var errEl = document.getElementById('perfilError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('perfilTitulo').value.trim();
  var nombres = document.getElementById('perfilNombres').value.trim();
  var apellidos = document.getElementById('perfilApellidos').value.trim();
  var ci = document.getElementById('perfilCI').value.trim();
  var telefono = document.getElementById('perfilTelefono').value.trim();
  var usuarioId = document.getElementById('perfilUserId').value.trim();
  var pw = document.getElementById('perfilPw').value;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(pw && pw.length < 6) return fail('La nueva contraseña debe tener al menos 6 caracteres.');
  var docentes = allDocentes();
  if(docentes.some(function(x){ return x.id !== d.id && x.usuarioId.toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');

  if(pw){
    try{
      await window.FB.updatePassword(window.FB.auth.currentUser, pw);
    }catch(err){ return fail(mapAuthError(err)); }
  }

  /* No mutar `d` directamente: currentDocente() devuelve la MISMA referencia que vive en
     FS_CACHE.DOCENTES, así que mutarla antes de save() hace que el detector de cambios compare
     el registro contra sí mismo (ya mutado) y no vea diferencia — el cambio nunca se escribe a
     Firestore, aunque la UI muestre "guardado" porque la caché local sí quedó actualizada. Hay
     que construir un objeto nuevo. */
  var toSave = Object.assign({}, d, {
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono, usuarioId: usuarioId
  });

  save(LS.DOCENTES, docentes.map(function(x){ return x.id === d.id ? toSave : x; }));
  render();
  toast('Tus datos se actualizaron correctamente.', 'success');
}
function bindPerfilEvents(){
  document.getElementById('btnSavePerfil').onclick = doSavePerfil;
}

  var secBd = manualSection('sec-10', '10. Base de Datos (respaldo)', ''

    + '<h3>Al guardar mi PCA o Plan Semanal me sale un aviso de que "se modificó en otro dispositivo o pestaña" — ¿qué significa "Sobrescribir" y "Cancelar"?</h3>'

  var secPresentacion = manualSection('sec-a9', '8. Presentación de Planes y de PCA — cómo se calcula la Observación', ''
    + '<p>Estas 4 pestañas (2 para Planes Semanales, 2 para PCA, cada una dividida en Escuela/Colegio como en la sección 6) le dicen al administrador, de un vistazo, quién entregó su planificación <b>a tiempo</b>, quién la entregó <b>incompleta</b> y quién la entregó <b>atrasada</b> — sin que nadie tenga que revisar plan por plan manualmente.</p>'

    + '<tr><td><span style="color:#D69E00; background:#FFF6D9; padding:3px 9px; border-radius:99px; font-weight:700; font-size:11px; white-space:nowrap;">Atrasado</span></td><td>El plan está <b>completo</b>, pero esa fecha es <b>después</b> de la Fecha Límite.</td></tr>'
    + '<tr><td><span style="color:#5B6B85; background:#EEF1F6; padding:3px 9px; border-radius:99px; font-weight:700; font-size:11px; white-space:nowrap;">Sin fecha límite definida</span></td><td>El plan está completo, pero esa categoría todavía no tiene ninguna Fecha Límite registrada (ve a la sección 9, Fechas Límite).</td></tr>'

    + '<p>Elige un rango de fechas (por ejemplo, un mes completo) y verás, por cada docente y agrupado por mes, cada Plan Semanal con su fecha de creación, su Fecha Límite y su Observación — además de si en esa semana el docente registró Tareas en casa, Talleres en clase, o evaluó con Lecciones (detectado automáticamente del texto que escribió en el campo Evaluación de cada día).</p>'
    + '<h3>Presentación de PCA — ¿qué significa "completo"?</h3>'
    + '<p>Un PCA se considera completo cuando, en cada una de las primeras unidades hasta ' + corteTextoManual + ', <b>todas las semanas que el docente creó</b> tienen sus 4 casilleros llenos: <b>Destreza</b>, <b>Temas y Subtemas</b>, <b>Nivel de Logro Intermedio</b> y <b>Nivel de Logro Avanzado</b>. No basta con que una sola semana tenga algo escrito — si cualquier semana de esas primeras unidades le falta aunque sea uno de esos 4 campos, o si alguna de esas unidades no tiene ninguna semana creada, el PCA entero queda como <b>Incompleto</b>, sin importar qué tan avanzado esté el resto. Este corte de unidades lo define el administrador (ver el botón "¿A partir de cuántas unidades llenas se considera \'a tiempo\'?" en la propia pantalla de Presentación de PCA) y puede ser distinto para Escuela y para Colegio.</p>'
    + '<p>A diferencia de Planes Semanales, aquí la fecha que se compara contra la Fecha Límite <b>no es la de creación</b> del PCA, sino la fecha en la que <b>quedó completo por última vez</b> (columna "Completado el") — un PCA se puede crear a tiempo pero seguir llenándose semana a semana durante varios días, y lo que importa para la Observación es cuándo de verdad terminó de cumplir el criterio de arriba.</p>'

        + '<tr><td>Jorge Añazco</td><td>19/09/2026</td><td>—</td><td>15/09/2026</td><td><span style="color:#D62828; background:#FBE4E4; padding:3px 9px; border-radius:99px; font-weight:700; font-size:11px;">Incompleto</span></td></tr>'

/* Lee cualquier archivo de imagen (jpg, png, webp, heic si el navegador lo soporta, etc.), lo
   redimensiona a tamaño carnet y lo comprime a JPEG antes de guardarlo como base64 en Firestore
   (no hay almacenamiento de archivos aparte en esta app). */
function resizeImageFileToDataUrl(file, maxW, maxH, quality, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var ratio = Math.min(maxW/img.width, maxH/img.height, 1);
      var w = Math.max(1, Math.round(img.width*ratio)), h = Math.max(1, Math.round(img.height*ratio));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ callback(null); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

/* --- Inspección · Estudiantes: importar desde Excel/CSV -----------------------------------
   Lector .xlsx dependiente-cero: un .xlsx es un ZIP con XML adentro, así que reutilizamos el
   mismo ZIP/OOXML hecho a mano que ya existe para exportar .docx (makeZip, docxEsc). Para leer
   entradas comprimidas dentro del ZIP (lo normal en un .xlsx real de Excel/Sheets) usamos
   DecompressionStream('deflate-raw'), una API nativa del navegador — no una librería externa. */
function readZipEntriesFromLocalHeaders(bytes){
  var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  var entries = {};
  var pos = 0;
  while(pos + 30 <= bytes.length && view.getUint32(pos, true) === 0x04034b50){
    var method = view.getUint16(pos+8, true);
    var compSize = view.getUint32(pos+18, true);
    var nameLen = view.getUint16(pos+26, true);
    var extraLen = view.getUint16(pos+28, true);
    var nameStart = pos + 30;
    var name = new TextDecoder('utf-8').decode(bytes.subarray(nameStart, nameStart+nameLen));
    var dataStart = nameStart + nameLen + extraLen;
    var dataEnd = dataStart + compSize;
    entries[name] = {method: method, data: bytes.subarray(dataStart, dataEnd)};
    pos = dataEnd;
  }
  return entries;
}
async function inflateRaw(bytes){
  if(!window.DecompressionStream) throw new Error('Tu navegador no admite descomprimir archivos .xlsx. Usa Chrome o Edge actualizados, o guarda el archivo como .csv.');
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function getZipEntryText(entries, name){
  var e = entries[name];
  if(!e) return null;
  var raw = e.method === 8 ? await inflateRaw(e.data) : e.data;
  return new TextDecoder('utf-8').decode(raw);
}
function colLetterToIndex(ref){
  var m = ref.match(/^[A-Z]+/);
  if(!m) return 0;
  var n = 0;
  for(var i=0;i<m[0].length;i++){ n = n*26 + (m[0].charCodeAt(i) - 64); }
  return n - 1;
}
function parseSharedStrings(xmlText){
  if(!xmlText) return [];
  var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  var siEls = doc.getElementsByTagName('si');
  var out = [];
  for(var i=0;i<siEls.length;i++) out.push(siEls[i].textContent || '');
  return out;
}
function parseWorksheetRows(xmlText, sst){
  var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  var rowEls = doc.getElementsByTagName('row');
  var rowsOut = [];
  for(var i=0;i<rowEls.length;i++){
    var cellEls = rowEls[i].getElementsByTagName('c');
    var rowArr = [];
    for(var j=0;j<cellEls.length;j++){
      var c = cellEls[j];
      var ref = c.getAttribute('r') || '';
      var idx = ref ? colLetterToIndex(ref) : j;
      var type = c.getAttribute('t');
      var value = '';
      if(type === 'inlineStr'){
        var isEl = c.getElementsByTagName('is')[0];
        value = isEl ? isEl.textContent : '';
      } else {
        var vEl = c.getElementsByTagName('v')[0];
        var raw = vEl ? vEl.textContent : '';
        value = (type === 's') ? (sst[parseInt(raw,10)] || '') : raw;
      }
      rowArr[idx] = value;
    }
    rowsOut.push(rowArr);
  }
  return rowsOut;
}
async function parseXlsxFirstSheet(bytes){
  var entries = readZipEntriesFromLocalHeaders(bytes);
  var sheetKey = entries['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml'
    : Object.keys(entries).filter(function(k){ return /^xl\/worksheets\/sheet\d+\.xml$/i.test(k); }).sort()[0];
  if(!sheetKey) throw new Error('No se encontró ninguna hoja en el archivo. ¿Es un .xlsx válido?');
  var sheetXml = await getZipEntryText(entries, sheetKey);
  var sstXml = await getZipEntryText(entries, 'xl/sharedStrings.xml');
  return parseWorksheetRows(sheetXml, sstXml ? parseSharedStrings(sstXml) : []);
}
function detectCsvDelimiter(headerLine){
  var counts = {',': (headerLine.match(/,/g)||[]).length, ';': (headerLine.match(/;/g)||[]).length, '\t': (headerLine.match(/\t/g)||[]).length};
  var best = ',';
  if(counts[';'] > counts[best]) best = ';';
  if(counts['\t'] > counts[best]) best = '\t';
  return best;
}
function parseCsvText(text){
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){ return l.length>0; });
  if(!lines.length) return [];
  var delim = detectCsvDelimiter(lines[0]);
  return lines.map(function(line){
    var cells = [], cur = '', inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQuotes){
        if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQuotes = false; }
        else cur += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === delim){ cells.push(cur); cur=''; }
        else cur += ch;
      }
    }
    cells.push(cur);
    return cells;
  });
}
var COMBINING_MARKS_RE = new RegExp(String.fromCharCode(91,92,117,48,51,48,48,45,92,117,48,51,54,102,93), 'g');
function normImportHeader(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(COMBINING_MARKS_RE,'');
}
var ESTUDIANTE_IMPORT_HEADERS = {
  nombres: ['nombres','nombre'],
  apellidos: ['apellidos','apellido'],
  ci: ['cedula','ci'],
  nivel: ['nivel','nivel educativo'],
  especialidad: ['especialidad'],
  curso: ['curso','grado','curso/grado'],
  nombreRepresentante: ['representante','nombre del representante','nombre representante'],
  telefonoRepresentante: ['telefono','telefono representante','telefono del representante']
};
function mapImportedRowsToEstudianteRows(rows){
  if(!rows.length) return [];
  var headerRow = (rows[0]||[]).map(normImportHeader);
  var colIndex = {};
  Object.keys(ESTUDIANTE_IMPORT_HEADERS).forEach(function(field){
    var aliases = ESTUDIANTE_IMPORT_HEADERS[field];
    var idx = headerRow.findIndex(function(h){ return aliases.indexOf(h)!==-1; });
    if(idx!==-1) colIndex[field] = idx;
  });
  function cell(r, field){ return colIndex[field]!=null ? String(r[colIndex[field]]==null ? '' : r[colIndex[field]]).trim() : ''; }
  var out = [];
  for(var i=1;i<rows.length;i++){
    var r = rows[i] || [];
    var nombres = cell(r,'nombres'), apellidos = cell(r,'apellidos');
    if(!nombres && !apellidos) continue;
    var nivelRaw = cell(r,'nivel'), especialidadRaw = cell(r,'especialidad'), cursoRaw = cell(r,'curso');
    var nivel = NIVELES.find(function(n){ return normImportHeader(n)===normImportHeader(nivelRaw); }) || '';
    var especialidad = '';
    if(nivel){
      especialidad = especialidadesFor(nivel).find(function(e){ return normImportHeader(e)===normImportHeader(especialidadRaw); }) || '';
    }
    var curso = '', cursoManual = '';
    if(nivel){
      var match = cursosFor(nivel, especialidad).find(function(c){ return normImportHeader(c)===normImportHeader(cursoRaw); });
      if(match) curso = match;
      else if(cursoRaw){ curso = 'Otro…'; cursoManual = cursoRaw; }
    }
    out.push({
      id: uid('est'), nombres: nombres, apellidos: apellidos, ci: cell(r,'ci'),
      nivel: nivel, especialidad: especialidad, curso: curso, cursoManual: cursoManual,
      nombreRepresentante: cell(r,'nombreRepresentante'), telefonoRepresentante: cell(r,'telefonoRepresentante')
    });
  }
  return out;
}
async function doImportEstudiantesFile(ev){
  var file = ev.target.files[0];
  if(!file) return;
  var errEl = document.getElementById('estImportError');
  if(errEl) errEl.classList.remove('show');
  try{
    var rows;
    if(/\.csv$/i.test(file.name)) rows = parseCsvText(await file.text());
    else rows = await parseXlsxFirstSheet(new Uint8Array(await file.arrayBuffer()));
    var imported = mapImportedRowsToEstudianteRows(rows);
    if(!imported.length){ throw new Error('No se encontraron filas válidas. Revisa que la primera fila tenga los encabezados (Nombres, Apellidos, Nivel, Curso…) y que haya datos debajo.'); }
    estudianteEditRows = imported;
    renderInspEstMasivoBodyOnly();
    toast(imported.length + ' fila(s) importada(s) desde el archivo. Revisa nivel/curso y guarda.', 'success');
  }catch(err){
    console.error('Error al importar archivo de estudiantes', err);

/* Plantilla descargable (.xlsx) con los encabezados esperados + una fila de ejemplo. Reutiliza
   makeZip/docxEsc (ya definidos para el exportador de .docx) — mismo principio: un .xlsx es un
   ZIP de XML, sin necesitar ninguna librería externa. */
function buildXlsxTemplateBlob(){
  var headers = ['Nombres','Apellidos','Cédula','Nivel','Especialidad','Curso','Representante','Teléfono'];
  var ejemplo = ['María','Torres Salazar','2100456789','Básica Media','','5.º EGB A','Juan Torres','0991234567'];
  var cols = ['A','B','C','D','E','F','G','H'];
  function cellXml(col, rowNum, text){
    return '<c r="'+col+rowNum+'" t="inlineStr"><is><t xml:space="preserve">'+docxEsc(text)+'</t></is></c>';
  }
  var row1 = '<row r="1">' + headers.map(function(h,i){ return cellXml(cols[i],1,h); }).join('') + '</row>';
  var row2 = '<row r="2">' + ejemplo.map(function(v,i){ return cellXml(cols[i],2,v); }).join('') + '</row>';
  var sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+row1+row2+'</sheetData></worksheet>';
  var workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Estudiantes" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  var enc = new TextEncoder();
  var zipBytes = makeZip([
    {name:'[Content_Types].xml', data: enc.encode(contentTypes)},
    {name:'_rels/.rels', data: enc.encode(rootRels)},
    {name:'xl/workbook.xml', data: enc.encode(workbookXml)},
    {name:'xl/_rels/workbook.xml.rels', data: enc.encode(workbookRels)},
    {name:'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml)}
  ]);
  return new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* Toma de asistencia por el propio docente, para sus propios cursos (según su Carga Horaria):
   alimenta la MISMA colección `asistencia` que usa Inspección General, así que lo que el docente
   marca aquí aparece automáticamente en los reportes de Inspección para ese curso y fecha.
   A diferencia de Inspección (que edita las 11 horas del día completas), aquí el docente elige a
   partir de qué hora empieza su clase y cuántas horas dicta — porque varios docentes distintos
   llenan horas distintas del mismo día para el mismo curso. Por eso el guardado NO usa save()
   (que reescribiría el documento entero y podría borrar las horas que otro docente acabe de
   guardar): usa setDoc con merge:true, enviando solo los períodos que este docente tocó, para que
   Firestore fusione los cambios de todos sin que se pisen entre sí. */
function renderMiAsistencia(d){
  var f = state.misAsisFiltro || (state.misAsisFiltro = {nivel:'', especialidad:'', curso:'', fecha: todayISO(), horas:[]});

  + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="maEspecialidad" '+(especialidades.length?'':'disabled')+'>' + optionsHtml(especialidades, f.especialidad, especialidades.length?'Elija un elemento…':'No aplica') + '</select></div>'
  + '  </div>'

}

    var existing = load(LS.ASISTENCIA).find(function(x){ return x.id === docId; });

      ? Object.assign({}, existing, {periodos: JSON.parse(JSON.stringify(existing.periodos||{}))})

    }).join('');
    return '<tr><td>' + escapeHtml(e.apellidos) + ' ' + escapeHtml(e.nombres) + '</td>' + cells + '</tr>';
  }).join('');
  return ''
  + '<div class="card" style="margin-top:16px;">'
  + '  <h2>Asistencia · ' + escapeHtml(f.curso==='Otro…'?'':f.curso) + ' · ' + fmtDate(f.fecha) + '</h2>'
  + '  <div class="card-sub">Haz clic en cada celda para cambiar el estado: sin marcar → P (presente) → A (atraso) → F (falta).</div>'
  + '  <div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th>Estudiante</th>' + headCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>'

function bindMiAsistenciaEvents(){
  var d = currentDocente();
  var f = state.misAsisFiltro;
  var nivelSel = document.getElementById('maNivel');
  if(nivelSel) nivelSel.onchange = function(e){ f.nivel=e.target.value; f.especialidad=''; f.curso=''; state.editingMiAsistencia=null; render(); };
  var espSel = document.getElementById('maEspecialidad');
  if(espSel) espSel.onchange = function(e){ f.especialidad=e.target.value; f.curso=''; state.editingMiAsistencia=null; render(); };
  var cursoSel = document.getElementById('maCurso');
  if(cursoSel) cursoSel.onchange = function(e){ f.curso=e.target.value; state.editingMiAsistencia=null; render(); };
  var fechaInp = document.getElementById('maFecha');
  if(fechaInp) fechaInp.onchange = function(e){ f.fecha=e.target.value; state.editingMiAsistencia=null; render(); };
  document.querySelectorAll('.maasis-hora-cb').forEach(function(cb){
    cb.onchange = function(){
      var n = parseInt(cb.value,10);
      var idx = f.horas.indexOf(n);
      if(cb.checked){ if(idx===-1) f.horas.push(n); } else { if(idx!==-1) f.horas.splice(idx,1); }
      renderMiAsistenciaResultOnly();
    };
  });

}
function bindMiAsistenciaResultEvents(){
  var f = state.misAsisFiltro;
  var a = state.editingMiAsistencia;
  if(!a) return;
  document.querySelectorAll('[data-maasis-cell]').forEach(function(btn){
    btn.onclick = function(){
      var parts = btn.getAttribute('data-maasis-cell').split('|');
      var periodo = parts[0], estId = parts[1];
      var cur = (a.periodos[periodo] && a.periodos[periodo][estId]) || '';
      var next = cur==='' ? 'P' : (cur==='P' ? 'A' : (cur==='A' ? 'F' : ''));
      a.periodos[periodo] = a.periodos[periodo] || {};
      if(next===''){ delete a.periodos[periodo][estId]; } else { a.periodos[periodo][estId] = next; }
      renderMiAsistenciaResultOnly();
    };
  });
  var todosBtn = document.getElementById('btnMiAsisTodosPresentes');
  if(todosBtn) todosBtn.onclick = function(){
    var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
    periodosElegidosMiAsistencia(f).forEach(function(n){
      a.periodos[n] = a.periodos[n] || {};
      estudiantes.forEach(function(e){ a.periodos[n][e.id] = 'P'; });
    });
    renderMiAsistenciaResultOnly();
  };
  var desmarcarBtn = document.getElementById('btnMiAsisDesmarcarTodos');
  if(desmarcarBtn) desmarcarBtn.onclick = function(){
    /* A diferencia de Inspección (que sobrescribe el documento entero al guardar), Mi Asistencia
       guarda con setDoc(..., {merge:true}) para no pisar las horas que otro docente ya guardó ese
       mismo día — y en un merge de Firestore, una clave que simplemente no se envía NO se borra
       (se conserva tal cual estaba). Por eso aquí hay que dejar la clave presente con valor ''
       (que la pantalla ya trata igual que "sin marcar") en vez de con delete: así el guardado sí
       viaja y sí limpia lo que había en la nube. */
    var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
    periodosElegidosMiAsistencia(f).forEach(function(n){
      a.periodos[n] = a.periodos[n] || {};
      estudiantes.forEach(function(e){ a.periodos[n][e.id] = ''; });
    });
    renderMiAsistenciaResultOnly();
  };
  var saveBtn = document.getElementById('btnGuardarMiAsistencia');
  if(saveBtn) saveBtn.onclick = guardarMiAsistencia;
}
async function guardarMiAsistencia(){
  var f = state.misAsisFiltro;
  var a = state.editingMiAsistencia;
  if(!a) return;
  var periodosPayload = {};
  periodosElegidosMiAsistencia(f).forEach(function(n){ periodosPayload[n] = a.periodos[n] || {}; });
  var payload = {
    id: a.id, nivel: a.nivel, especialidad: a.especialidad||'', curso: a.curso, fecha: a.fecha,
    periodos: periodosPayload, registradoPor: currentDocente().id, updatedAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.ASISTENCIA, a.id), payload, {merge:true});
    toast('Asistencia guardada.', 'success');
  }catch(err){
    console.error('Error guardando asistencia', err);
    toast('No se pudo guardar la asistencia: ' + (err.message||err.code||err), 'error');
  }
}

function bindInspIncidenteFormEvents(){
  var i = state.editingIncidente;
  var filtro = state.incFormFiltro || (state.incFormFiltro = {nivel:'', curso:''});
  document.getElementById('incFecha').oninput = function(e){ i.fecha = e.target.value; };
  document.getElementById('incHora').oninput = function(e){ i.hora = e.target.value; };
  var pnSel = document.getElementById('incPersonalNombreSel');
  if(pnSel) pnSel.onchange = function(e){
    if(e.target.value==='__otro__'){ state.incPersonalManualMode = true; i.personalNombre=''; }
    else { state.incPersonalManualMode = false; i.personalNombre = e.target.value; }

  };
  var pnManual = document.getElementById('incPersonalNombreManual'); if(pnManual) pnManual.oninput = function(e){ i.personalNombre = e.target.value; };
  var pc = document.getElementById('incPersonalCargo'); if(pc) pc.oninput = function(e){ i.personalCargo = e.target.value; };
  var fn = document.getElementById('incFiltroNivel'); if(fn) fn.onchange = function(e){ filtro.nivel = e.target.value; filtro.curso=''; render(); };
  var fc = document.getElementById('incFiltroCurso'); if(fc) fc.onchange = function(e){ filtro.curso = e.target.value; render(); };
  var es = document.getElementById('incEstudiante'); if(es) es.onchange = function(e){ i.estudianteId = e.target.value; };
  document.getElementById('incTipoFalta').onchange = function(e){ i.tipoFalta = e.target.value; };
  document.getElementById('incCategoria').onchange = function(e){ i.categoria = e.target.value; render(); };
  var cm = document.getElementById('incCategoriaManual'); if(cm) cm.oninput = function(e){ i.categoriaManual = e.target.value; };
  document.getElementById('incCitacion').onchange = function(e){ i.citacionRepresentante = e.target.checked; };
  var dece = document.getElementById('incDece'); if(dece) dece.onchange = function(e){ i.derivadoDece = e.target.checked; };
  document.getElementById('incEstado').onchange = function(e){ i.estado = e.target.value; };
  document.querySelectorAll('.rte-editable').forEach(function(el){
    var key = el.getAttribute('data-rte-field');
    el.addEventListener('input', function(){ i[key] = el.innerHTML; });
  });
  bindRteToolbars(document.querySelector('.card'));
  document.getElementById('btnAddNota').onclick = function(){
    var input = document.getElementById('incNuevaNota');
    var v = (input.value||'').trim();
    if(!v) return;
    i.bitacora = i.bitacora || [];
    i.bitacora.push({fecha: todayISO(), nota: v});
    render();
  };
  document.getElementById('btnGuardarIncidente').onclick = doSaveIncidente;
  document.getElementById('btnCancelarIncidente').onclick = function(){ state.editingIncidente=null; state.inspDiscView='lista'; render(); };
  var delBtn = document.getElementById('btnEliminarIncidente');
  if(delBtn) delBtn.onclick = function(){
    confirmDialog('¿Eliminar este incidente?', function(){
      eliminarConDeshacer(LS.INCIDENTES, i.id, 'Incidente eliminado.', 'Incidente restaurado.');
      state.editingIncidente=null; state.inspDiscView='lista'; render();
    });
  };
}
function doSaveIncidente(){
  var i = state.editingIncidente;
  var errEl = document.getElementById('incError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!i.fecha) return fail('Elige la fecha del incidente.');
  if(i.tipoInvolucrado==='Personal' && !(i.personalNombre||'').trim()) return fail('Escribe el nombre de la persona.');
  if(i.tipoInvolucrado==='Estudiante' && !i.estudianteId) return fail('Elige el estudiante.');
  var d = currentDocente();
  var toSave = Object.assign({}, i, {
    descripcion: sanitizeRte(i.descripcion), accionTomada: sanitizeRte(i.accionTomada),
    registradoPor: i.registradoPor || d.id, updatedAt: nowISO(), createdAt: i.createdAt || nowISO()
  });
  var all = load(LS.INCIDENTES);
  var exists = all.some(function(x){ return x.id===i.id; });
  save(LS.INCIDENTES, exists ? all.map(function(x){ return x.id===i.id?toSave:x; }) : all.concat([toSave]));
  state.editingIncidente=null; state.inspDiscView='lista'; render();
  toast('Incidente guardado correctamente.', 'success');
}

/* Reporte fotográfico: fotos de los estudiantes (campo `foto`, subido desde el formulario de
   ingreso de Inspección General → Estudiantes), agrupadas por curso en hojas A4 de 5x5 (25 por
   página); si el curso tiene más de 25 estudiantes se agregan páginas adicionales con la misma
   distribución. */
function renderRepFotografico(){
  var f = state.repFotograficoFiltro || (state.repFotograficoFiltro = {nivel:'', especialidad:'', curso:''});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosDeEstudiantesRegistrados(f.nivel, f.especialidad);
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Nivel</label><select class="cell-select" id="rfNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="rfEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
    + '  </div>'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Curso</label><select class="cell-select" id="rfCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
    + '  </div>'
    + '</div>';
  if(!f.nivel || !f.curso) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  if(!estudiantes.length) return selHtml + '<div class="card"><div class="hint">No hay estudiantes registrados en este curso.</div></div>';
  var PAGINA = 25;
  var paginas = [];
  for(var i=0;i<estudiantes.length;i+=PAGINA) paginas.push(estudiantes.slice(i,i+PAGINA));
  var cursoTexto = f.nivel + (f.especialidad?' · '+f.especialidad:'') + ' · ' + f.curso;
  var paginasHtml = paginas.map(function(pagina, idx){
    var cards = pagina.map(function(e){
      return '<div class="foto-card">'
        + (e.foto ? '<img src="'+e.foto+'" alt="" />' : '<div class="foto-card-vacio">👤</div>')
        + '<div class="foto-card-nombre">' + escapeHtml(e.apellidos) + '<br/>' + escapeHtml(e.nombres) + '</div>'
        + '</div>';
    }).join('');
    return '<div class="foto-report-page">'
      + repInstitucionalHead('Reporte Fotográfico' + (paginas.length>1 ? ' — página ' + (idx+1) + ' de ' + paginas.length : ''))
      + '  <div class="pca-section" style="padding-bottom:10px;"><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(cursoTexto)+'" /></div></div>'
      + '  <div class="foto-grid">' + cards + '</div>'
      + '</div>';
  }).join('');
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepFotografico">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repFotograficoDoc">'
  + paginasHtml
  + '</div>';
}

  var espSel = document.getElementById('rfEspecialidad'); if(espSel) espSel.onchange = function(e){ f.especialidad=e.target.value; f.curso=''; render(); };

}

  if(!f.nivel || !f.curso || !f.fechaInicio) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  var dias = [0,1,2,3,4].map(function(i){ return addDays(f.fechaInicio, i); });
  var docsPorDia = dias.map(function(fecha){

function renderRepIndividual(){
  var f = state.repIndividualFiltro || (state.repIndividualFiltro = {estudianteId:'', fechaInicio:'', fechaFin: todayISO()});

  var estOpts = '<option value="">Elija un elemento…</option>' + estudiantes.map(function(e){
    return '<option value="'+e.id+'" '+(f.estudianteId===e.id?'selected':'')+'>'+escapeHtml(e.apellidos+' '+e.nombres)+'</option>';
  }).join('');
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field"><label>Estudiante</label><select class="cell-select" id="riEstudiante">' + estOpts + '</select></div>'
    + '  <div class="field-row" style="margin-top:8px;"><div class="field"><label>Desde</label><input class="cell-input" type="date" id="riInicio" value="'+escapeHtml(f.fechaInicio)+'" /></div><div class="field"><label>Hasta</label><input class="cell-input" type="date" id="riFin" value="'+escapeHtml(f.fechaFin)+'" /></div></div>'
    + '</div>';
  if(!f.estudianteId) return selHtml;
  var e = estudiantes.find(function(x){ return x.id===f.estudianteId; });
  if(!e) return selHtml;
  var docs = load(LS.ASISTENCIA).filter(function(a){
    return a.nivel===e.nivel && (a.especialidad||'')===(e.especialidad||'') && a.curso===cursoRealDe(e)
      && (!f.fechaInicio || a.fecha >= f.fechaInicio) && (!f.fechaFin || a.fecha <= f.fechaFin);
  }).sort(function(a,b){ return a.fecha.localeCompare(b.fecha); });
  var totales = {P:0,A:0,F:0};
  var filas = [];
  docs.forEach(function(a){
    var marcasDia = [];

    });

  });

  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepIndividual">Imprimir / PDF (A4)</button></div>'

  + '  <div class="pca-section">'

  + '    <div class="grid-3" style="margin-top:10px;"><div class="field"><label>Total Presente</label><input class="cell-input tabular" readonly value="'+totales.P+'" /></div><div class="field"><label>Total Atrasos</label><input class="cell-input tabular" readonly value="'+totales.A+'" /></div><div class="field"><label>Total Faltas</label><input class="cell-input tabular" readonly value="'+totales.F+'" /></div></div>'

function renderRepMensual(){
  var f = state.repMensualFiltro || (state.repMensualFiltro = {nivel:'', especialidad:'', curso:'', mes: todayISO().slice(0,7)});
  var espOpts = especialidadesFor(f.nivel);

  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Nivel</label><select class="cell-select" id="rmNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="rmEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
    + '  </div>'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Curso</label><select class="cell-select" id="rmCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Mes</label><input class="cell-input" type="month" id="rmMes" value="'+escapeHtml(f.mes)+'" /></div>'
    + '  </div>'
    + '</div>';
  if(!f.nivel || !f.curso || !f.mes) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  var docs = load(LS.ASISTENCIA).filter(function(a){
    return a.nivel===f.nivel && (a.especialidad||'')===(f.especialidad||'') && a.curso===f.curso && (a.fecha||'').indexOf(f.mes)===0;
  });
  var totalesPorEst = {};
  estudiantes.forEach(function(e){ totalesPorEst[e.id] = {P:0,A:0,F:0}; });
  docs.forEach(function(a){
    PERIODOS.forEach(function(p){
      var marcas = a.periodos[p.n] || {};
      Object.keys(marcas).forEach(function(estId){
        if(!totalesPorEst[estId]) return;
        totalesPorEst[estId][marcas[estId]]++;
      });
    });
  });
  var rows = estudiantes.slice().sort(function(a,b){ return totalesPorEst[b.id].F - totalesPorEst[a.id].F; }).map(function(e){
    var t = totalesPorEst[e.id];
    return '<tr><td>'+escapeHtml(e.apellidos+' '+e.nombres)+'</td><td class="tabular">'+t.P+'</td><td class="tabular">'+t.A+'</td><td class="tabular">'+t.F+'</td></tr>';
  }).join('') || '<tr><td colspan="4" class="hint">No hay estudiantes en este curso.</td></tr>';
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepMensual">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repMensualDoc">'
  + repInstitucionalHead('Consolidado Mensual de Asistencia')
  + '  <div class="pca-section">'
  + '    <div class="grid-2"><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(f.nivel+(f.especialidad?' · '+f.especialidad:'')+' · '+f.curso)+'" /></div><div class="field"><label>Mes</label><input class="cell-input" readonly value="'+escapeHtml(f.mes)+'" /></div></div>'
  + '    <div class="hint" style="margin:8px 0;">Los totales suman las marcas de las 11 horas curriculares en cada día del mes (no días completos).</div>'
  + '    <div class="table-wrap" style="margin-top:8px;"><table><thead><tr><th>Estudiante</th><th>Presente</th><th>Atrasos</th><th>Faltas</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  </div>'

  + '</div>';

/* Docentes que dictan en un nivel educativo (según su Carga Horaria), y las asignaturas que
   ese docente en particular dicta en ese nivel — para las listas desplegables en cascada
   Nivel Educativo → Docente → Asignatura del formulario de Observación de Clases. */
function docentesPorNivel(nivel){
  return allDocentes().filter(function(x){
    return misCargaRows(x.id).some(function(r){ return r.nivel===nivel; });
  }).sort(function(a,b){ return (a.nombres||'').localeCompare(b.nombres||''); });
}
function asignaturasDeDocentePorNivel(docenteId, nivel){
  var set = {};
  misCargaRows(docenteId).filter(function(r){ return r.nivel===nivel; }).forEach(function(r){ if(r.asignatura) set[r.asignatura]=1; });
  return Object.keys(set).sort();
}

function bindObsFormEvents(){
  var o = state.editingObservacion;

  document.getElementById('btnObsVolver').onclick = function(){ state.editingObservacion=null; state.obsView='lista'; render(); };

  if(!editable){
    document.querySelectorAll('#obsDoc input, #obsDoc select, #obsDoc textarea, #obsDoc button').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('#obsDoc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable','false'); });
    return;
  }

  document.getElementById('obsFecha').oninput = function(e){ o.fecha = e.target.value; };
  document.getElementById('obsHora').oninput = function(e){ o.hora = e.target.value; };
  document.getElementById('obsNivel').onchange = function(e){ o.nivel = e.target.value; o.docenteId=''; o.asignatura=''; render(); };
  document.getElementById('obsDocente').onchange = function(e){ o.docenteId = e.target.value; o.asignatura=''; render(); };
  document.getElementById('obsAsignatura').onchange = function(e){ o.asignatura = e.target.value; };
  document.getElementById('obsObservador').oninput = function(e){ o.observador = e.target.value; };

  document.querySelectorAll('[data-obs-radio]').forEach(function(radio){
    radio.addEventListener('change', function(){
      if(radio.checked) o.respuestas[radio.getAttribute('data-obs-radio')] = radio.value;
    });
  });
  document.querySelectorAll('[data-obs-num]').forEach(function(inp){
    inp.addEventListener('input', function(){
      o.respuestas[inp.getAttribute('data-obs-num')] = inp.value;
    });
  });
  document.querySelectorAll('.rte-editable').forEach(function(el){
    var key = el.getAttribute('data-rte-field');
    el.addEventListener('input', function(){ o[key] = el.innerHTML; });
  });
  bindRteToolbars(document.getElementById('obsDoc'));

  document.getElementById('obsError').classList.remove('show');
  document.getElementById('btnObsGuardar').onclick = doSaveObservacion;
}
function doSaveObservacion(){
  var o = state.editingObservacion;
  var errEl = document.getElementById('obsError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!o.fecha || !o.docenteId){ return fail('Elige la fecha y el docente observado.'); }
  var d = currentDocente();
  var toSave = Object.assign({}, o, {
    comentarios_p1: sanitizeRte(o.comentarios_p1), comentarios_p2: sanitizeRte(o.comentarios_p2),
    registradoPor: o.registradoPor || d.id, createdAt: o.createdAt || nowISO(), updatedAt: nowISO()
  });
  var all = load(LS.OBSERVACIONES);
  var exists = all.some(function(x){ return x.id===o.id; });
  save(LS.OBSERVACIONES, exists ? all.map(function(x){ return x.id===o.id?toSave:x; }) : all.concat([toSave]));
  state.editingObservacion=null; state.obsView='lista'; render();
  toast('Observación guardada correctamente.', 'success');
}

function bindFdiCamposGenericos(root, estudiante, editable, onCambioCondicional){
  if(!editable) return;
  root.querySelectorAll('[data-fdi-field]').forEach(function(el){
    var key = el.getAttribute('data-fdi-field');
    el.addEventListener('input', function(){ estudiante[key] = el.value; });
    if(el.tagName==='SELECT') el.addEventListener('change', function(){
      estudiante[key] = el.value;
      if(key==='nivelEducativo'){
        estudiante.curso = '';
        if(onCambioCondicional) onCambioCondicional();
      }
    });
  });
  root.querySelectorAll('[data-fdi-arr]').forEach(function(el){
    var key = el.getAttribute('data-fdi-arr');
    var idx = parseInt(el.getAttribute('data-fdi-idx'),10);
    el.addEventListener('input', function(){ estudiante[key][idx] = el.value; });
  });
  var grupos = {};
  root.querySelectorAll('[data-fdi-group]').forEach(function(el){ grupos[el.getAttribute('data-fdi-group')] = el.type; });
  var condicionales = ['padresMigrantes','familiaresDiscapacidad','discapacidad','condicionMedica','alergiasSalud','embarazada','tieneConQuienDejarHijo','repitioAnios','extracurricularParticipa'];
  Object.keys(grupos).forEach(function(key){
    var esCondicional = condicionales.indexOf(key)!==-1;
    root.querySelectorAll('[data-fdi-group="'+key+'"]').forEach(function(el){
      el.addEventListener('change', function(){
        if(grupos[key]==='radio'){
          estudiante[key] = el.value;
        } else {
          estudiante[key] = Array.from(root.querySelectorAll('[data-fdi-group="'+key+'"]:checked')).map(function(x){ return x.value; }).join('; ');
        }
        if(esCondicional && onCambioCondicional) onCambioCondicional();
      });
    });
  });
}

function renderDece(d){
  return (state.deceView === 'form') ? renderDeceForm(d) : renderDeceLista(d);

function bindDeceEvents(){
  if(state.deceView === 'form') bindDeceFormEvents();
  else bindDeceListaEvents();
}

/* Lista de fichas en el mismo orden y filtro que ve el DECE en "Registro Acumulativo General",
   usada para las flechas de navegación (Primero/Anterior/Siguiente/Último) del formulario. */
function deceListaOrdenada(){
  var f = state.deceFiltro || {};
  return load(LS.DECE).slice()
    .sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); })
    .filter(function(c){ return !f.estado || c.estado === f.estado; });
}
function deceNavBarHtml(prefijo){
  var e = state.editingDece || {};
  var lista = deceListaOrdenada();
  var idx = lista.findIndex(function(x){ return x.id===e.id; });
  var total = lista.length;
  var posTxt = (idx>=0 && total) ? ('Ficha ' + (idx+1) + ' de ' + total) : (total ? (total + ' ficha' + (total===1?'':'s') + ' registradas') : 'No hay fichas guardadas');
  var atFirst = idx<=0;
  var atLast = idx<0 || idx>=total-1;
  var disabledPrev = (atFirst || !total) ? 'disabled' : '';
  var disabledNext = (atLast || !total) ? 'disabled' : '';
  return '<div class="pca-toolbar no-print" style="flex-wrap:wrap; gap:8px;">'
    + '<button class="btn btn-ghost btn-sm" data-dece-nav="first" data-nav-prefix="'+prefijo+'" '+disabledPrev+'>&laquo; Al principio</button>'
    + '<button class="btn btn-ghost btn-sm" data-dece-nav="prev" data-nav-prefix="'+prefijo+'" '+disabledPrev+'>&lsaquo; Anterior</button>'
    + '<div class="hint" style="margin:0 4px; white-space:nowrap;">' + escapeHtml(posTxt) + '</div>'
    + '<button class="btn btn-ghost btn-sm" data-dece-nav="next" data-nav-prefix="'+prefijo+'" '+disabledNext+'>Siguiente &rsaquo;</button>'
    + '<button class="btn btn-ghost btn-sm" data-dece-nav="last" data-nav-prefix="'+prefijo+'" '+disabledNext+'>Al final &raquo;</button>'
    + '</div>';
}
/* Navega sin guardar los cambios pendientes de la ficha actual — igual que "Volver a la lista",
   para no autoguardar por sorpresa datos a medio llenar. Si el DECE quiere conservar cambios
   antes de pasar a otra ficha, debe presionar "Guardar" primero. */
function deceNavegar(dir){
  var e = state.editingDece;
  var lista = deceListaOrdenada();
  if(!lista.length) return;
  var actual = lista.findIndex(function(x){ return x.id===e.id; });
  var idx;
  if(dir==='first') idx = 0;
  else if(dir==='last') idx = lista.length-1;
  else if(dir==='prev') idx = actual<=0 ? 0 : actual-1;
  else idx = (actual<0) ? 0 : Math.min(actual+1, lista.length-1);
  state.editingDece = JSON.parse(JSON.stringify(lista[idx]));
  render();
}

function doSaveFichaDatos(){
  var e = state.editingDece;
  var errEl = document.getElementById('dcError');
  function fail(msg){ if(errEl){ errEl.textContent = msg; errEl.classList.add('show'); } }
  if(errEl) errEl.classList.remove('show');
  if(!(e.estudianteNombre||'').trim()) return fail('Escribe los apellidos y nombres del/la estudiante.');
  var all = load(LS.DECE);
  if((e.cedulaEstudiante||'').trim()){
    var duplicado = all.find(function(x){ return x.id!==e.id && (x.cedulaEstudiante||'').trim() === e.cedulaEstudiante.trim(); });
    if(duplicado) return fail('Ya existe un Registro Acumulativo General con esta cédula (' + (duplicado.estudianteNombre||'estudiante sin nombre') + '). Ábrelo desde Consultas en vez de crear uno nuevo.');
  }
  var toSave = Object.assign({}, e, { createdAt: e.createdAt || nowISO(), updatedAt: nowISO() });
  var exists = all.some(function(x){ return x.id===e.id; });
  save(LS.DECE, exists ? all.map(function(x){ return x.id===e.id?toSave:x; }) : all.concat([toSave]));
  if(!exists){
    toast('Ficha guardada. Recuerda imprimirla y firmarla — es la copia oficial.', 'success');
    printAsPdf();
  } else {
    toast('Ficha guardada correctamente.', 'success');
  }
  state.editingDece=null; state.deceView='lista'; render();
}

/* ============================= CONSULTAS DEL DECE =============================
   Búsqueda para el DECE: por cédula encuentra el Registro Acumulativo General (Ficha de Datos
   Informativos, que sí guarda cédula) y, a partir del nombre de ese estudiante, su historial de
   Fichas de Detección (que NO guardan cédula — el docente que las envía normalmente no tiene
   acceso a esa información — por eso se correlacionan por nombre). También agrupa todas las
   Fichas de Detección recibidas por curso y, dentro de cada curso, alfabéticamente por
   estudiante, para que el DECE pueda revisar todo un curso de un vistazo. */
function nombresCoinciden(a, b){
  var na = normImportHeader(a), nb = normImportHeader(b);
  if(!na || !nb) return false;
  return na === nb || na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1;
}
/* Búsqueda por cédula usada en Ficha de Detección: busca únicamente en el Registro Acumulativo
   General (Ficha de Datos Informativos, colección `dece`), NUNCA en Inspección General
   (Estudiantes) — a propósito, para que Nombre/Nivel/Curso salgan de los datos que llenó el
   representante, no de la matrícula de Inspección. */
function buscarInfoPorCedula(cedula){
  cedula = (cedula||'').trim();
  if(!cedula) return null;
  var fichaDatos = load(LS.DECE).find(function(x){ return (x.cedulaEstudiante||'').trim() === cedula; });
  if(!fichaDatos) return null;
  return {
    nombre: fichaDatos.estudianteNombre || '',
    nivel: fichaDatos.nivelEducativo || '',
    curso: fichaDatos.curso || ''
  };
}
function fichasDeteccionAgrupadasHtml(){
  var todas = load(LS.FICHA_DETECCION);
  var grupos = {};
  todas.forEach(function(f){
    var clave = (f.nivelBgu||'Sin nivel') + ' - ' + (f.curso||'Sin curso');
    (grupos[clave] = grupos[clave] || []).push(f);
  });
  var claves = Object.keys(grupos).sort();
  if(!claves.length) return '<div class="hint">Todavía no hay fichas de detección registradas.</div>';
  return claves.map(function(clave){
    var filas = grupos[clave].slice().sort(function(a,b){ return (a.estudianteNombre||'').localeCompare(b.estudianteNombre||''); });
    return '<div style="margin-bottom:18px;">'
      + '<div class="pill pill-blue" style="margin-bottom:8px;">' + escapeHtml(clave) + ' - ' + filas.length + '</div>'
      + '<div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Fecha</th><th>Docente</th><th>Estado</th><th></th></tr></thead><tbody>'
      + filas.map(function(f){
          return '<tr><td>' + escapeHtml(f.estudianteNombre||'—') + '</td><td class="tabular">' + fmtDate(f.fecha) + '</td><td>' + escapeHtml(f.docenteNombreFormal||'—') + '</td><td>' + fdEstadoPillHtml(f.estado) + '</td><td><button class="btn btn-ghost btn-sm" data-consulta-abrir-fd="'+f.id+'">Abrir</button></td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '</div>';
  }).join('');
}
function renderDeceConsultas(d){
  var q = (state.deceConsultaQuery || '').trim();
  /* Busca por cédula O por nombre — el nombre debe compararse contra `estudianteNombre`, el
     campo que llena el representante legal en el Registro Acumulativo General (antes solo se
     comparaba la cédula aquí, así que buscar por nombre nunca encontraba nada en esta lista). */
  var fichaDatos = q ? load(LS.DECE).filter(function(x){
    return (x.cedulaEstudiante||'').trim() === q || (q.length >= 3 && nombresCoinciden(x.estudianteNombre, q));
  }) : [];
  var nombreRef = fichaDatos.length ? fichaDatos[0].estudianteNombre : (q.length >= 3 ? q : '');
  var fichasDeteccion = q ? load(LS.FICHA_DETECCION).filter(function(f){
    return (f.cedulaEstudiante||'').trim() === q || (nombreRef && nombresCoinciden(f.estudianteNombre, nombreRef));
  }) : [];
  fichasDeteccion = fichasDeteccion.slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });

  var resultadoHtml = '';
  if(q){
    if(!fichaDatos.length && !fichasDeteccion.length){
      resultadoHtml = '<div class="hint">No se encontraron registros con "' + escapeHtml(q) + '". Puedes buscar por número de cédula o por el nombre del estudiante tal como lo escribió el representante en el Registro Acumulativo General.</div>';
    } else {
      if(fichaDatos.length > 1){
        resultadoHtml += '<div class="lock-banner" style="background:var(--red-100); color:var(--red-600); border:none;">Se encontraron ' + fichaDatos.length + ' Registros Acumulativos con la misma cédula - revisa si hay un duplicado para eliminar.</div>';
      }
      if(fichaDatos.length){
        resultadoHtml += fichaDatos.map(function(e){
          return '<div style="border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; margin-bottom:14px;">'
            + '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">'
            + '  <div><div style="font-weight:700; font-size:15px;">' + escapeHtml(e.estudianteNombre||'—') + '</div><div class="hint">Cédula: ' + escapeHtml(e.cedulaEstudiante||'—') + ' · ' + fdiEstadoPillHtml(e.estado) + '</div></div>'
            + '  <button class="btn btn-primary btn-sm" data-consulta-abrir-datos="' + e.id + '">Ver Registro Acumulativo General</button>'
            + '</div></div>';
        }).join('');
      }
      resultadoHtml += '<div class="hint" style="font-weight:700; margin:14px 0 6px;">Historial de Fichas de Detección' + (fichasDeteccion.length ? '' : ' - ninguna encontrada') + '</div>';
      if(fichasDeteccion.length){
        resultadoHtml += '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Docente</th><th>Nivel / Curso</th><th>Estado</th><th></th></tr></thead><tbody>'
          + fichasDeteccion.map(function(f){
              return '<tr><td class="tabular">' + fmtDate(f.fecha) + '</td><td>' + escapeHtml(f.docenteNombreFormal||'—') + '</td><td>' + escapeHtml(f.nivelBgu||'—') + (f.curso?' · '+escapeHtml(f.curso):'') + '</td><td>' + fdEstadoPillHtml(f.estado) + '</td><td><button class="btn btn-ghost btn-sm" data-consulta-abrir-fd="'+f.id+'">Abrir</button></td></tr>';
            }).join('')
          + '</tbody></table></div>';
      }
    }
  }

  return ''
  + '<div class="page-head"><div><div class="eyebrow">Departamento de Consejería Estudiantil</div><h1>Consultas</h1><p>Busca a un estudiante por su número de cédula para ver su Registro Acumulativo General y su historial de Fichas de Detección.</p></div></div>'
  + '<div class="card" style="margin-bottom:20px;">'
  + '  <div class="field-row">'
  + '    <div class="field"><label>Buscar por cédula (o nombre del estudiante)</label><input class="cell-input" id="dcConsultaInput" value="' + escapeHtml(q) + '" placeholder="N.º de cédula o nombre…" /></div>'
  + '  </div>'
  + '  <button class="btn btn-primary btn-sm" id="btnDeceConsultaBuscar" style="margin-top:10px;">Buscar</button>'
  + '</div>'
  + (q ? '<div class="card" style="margin-bottom:20px;">' + resultadoHtml + '</div>' : '')
  + '<div class="card">'
  + '  <h3 style="margin-top:0;">Fichas de Detección recibidas, agrupadas por curso</h3>'
  + fichasDeteccionAgrupadasHtml()
  + '</div>';
}

function doEnviarFormularioPublico(){
  var e = state.formularioPublico;
  var errEl = document.getElementById('fpError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!(e.estudianteNombre||'').trim()) return fail('Escribe los apellidos y nombres del/la estudiante.');
  var btn = document.getElementById('btnEnviarFormularioPublico');
  btn.disabled = true; btn.textContent = 'Enviando…';
  e.origen = 'publico';
  e.createdAt = e.createdAt || nowISO();
  e.updatedAt = nowISO();
  e.docenteId = (window.FB.auth.currentUser && window.FB.auth.currentUser.uid) || '';
  window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DECE, String(e.id)), e).then(function(){
    state.formularioPublicoEnviado = true;
    render();
  }).catch(function(err){
    console.error('Error enviando formulario público', err);
    btn.disabled = false; btn.textContent = 'Enviar al DECE';
    fail('No se pudo enviar. Revisa tu conexión e intenta de nuevo. (' + (err.message||err.code||err) + ')');
  });
}

function bindFichaDeteccionFormEvents(){

  var d = currentDocente();
  var isStaff = isStaffRole(d.role);
  var editable = isStaff || f.borrador !== false;

  document.getElementById('btnFdVolver').onclick = function(){ state.editingFichaDeteccion=null; state.fichaDeteccionView='lista'; render(); };
  document.getElementById('btnFdPrint').onclick = printAsPdf;

  // "Recibido por" y "Estado" son de uso exclusivo del DECE — se editan aunque la ficha ya esté
  // bloqueada para el docente que la envió.
  var recibidoPorInp = document.getElementById('fdRecibidoPor');
  if(recibidoPorInp){
    f.recibidoPor = recibidoPorInp.value;
    if(isStaff) recibidoPorInp.addEventListener('input', function(e){ f.recibidoPor = e.target.value; });
  }
  var estadoSel = document.getElementById('fdEstado');
  if(estadoSel && isStaff) estadoSel.addEventListener('change', function(e){ f.estado = e.target.value; });

  if(!editable){
    document.querySelectorAll('#fdDoc input, #fdDoc select, #fdDoc textarea, #fdDoc button').forEach(function(el){
      if(el===recibidoPorInp || el===estadoSel) return;
      el.disabled = true;
    });
    return;
  }

  var guardarBtn = document.getElementById('btnFdGuardar');
  if(guardarBtn) guardarBtn.onclick = doSaveFichaDeteccion;

  bindAutoguardadoDelegado('fdDoc', 'fichadeteccion');

  document.getElementById('fdEstudiante').oninput = function(e){ f.estudianteNombre = e.target.value; };
  document.getElementById('fdNivelBgu').onchange = function(e){ f.nivelBgu = e.target.value; f.curso = ''; renderFichaDeteccionFormAgain(); };
  var fdCursoSel = document.getElementById('fdCurso');
  if(fdCursoSel) fdCursoSel.onchange = function(e){ f.curso = e.target.value; };
  document.getElementById('fdFecha').oninput = function(e){ f.fecha = e.target.value; };
  document.getElementById('fdCedula').oninput = function(e){ f.cedulaEstudiante = e.target.value; };
  var btnBuscarCedula = document.getElementById('btnFdBuscarCedula');
  if(btnBuscarCedula) btnBuscarCedula.onclick = function(){
    var info = buscarInfoPorCedula(f.cedulaEstudiante);
    if(!info) return toast('No se encontró ningún estudiante con esa cédula.', 'error');
    if(info.nombre) f.estudianteNombre = info.nombre;
    if(info.nivel) f.nivelBgu = info.nivel;
    if(info.curso) f.curso = info.curso;
    renderFichaDeteccionFormAgain();
    toast('Datos encontrados y completados automáticamente.', 'success');
  };
  document.getElementById('fdRemitidoPor').oninput = function(e){ f.remitidoPor = e.target.value; };
  document.getElementById('fdCualidad').oninput = function(e){ f.cualidadEstudiante = e.target.value; };
  document.getElementById('fdDescripcion').oninput = function(e){ f.descripcionEstudiante = e.target.value; };
  document.getElementById('fdPedido').oninput = function(e){ f.pedidoEspecifico = e.target.value; };
  var especMate = document.getElementById('fdEspecMate');
  if(especMate) especMate.oninput = function(e){ f.dificultadMatematicaEspecifique = e.target.value; };
  var especOtras = document.getElementById('fdEspecOtras');
  if(especOtras) especOtras.oninput = function(e){ f.dificultadOtrasEspecifique = e.target.value; };

  document.querySelectorAll('.fd-dificultad-cb').forEach(function(cb){
    cb.addEventListener('change', function(){
      f.dificultadesAcademicas = Array.from(document.querySelectorAll('.fd-dificultad-cb:checked')).map(function(x){ return x.value; }).join('; ');

/* Guarda en Firestore sin validar ni navegar — usada tanto por el autoguardado (silent=true,
   igual que savePca/saveSemanal) como internamente por doSaveFichaDeteccion. */
function saveFichaDeteccion(f, silent){
  var d = currentDocente();
  var toSave = Object.assign({}, f, {
    docenteId: f.docenteId || d.id,
    docenteNombreFormal: f.docenteNombreFormal || nombreFormal(d),
    docenteCi: f.docenteCi || d.ci || '',
    createdAt: f.createdAt || nowISO(), updatedAt: nowISO()
  });
  var all = load(LS.FICHA_DETECCION);
  var exists = all.some(function(x){ return x.id===f.id; });
  save(LS.FICHA_DETECCION, exists ? all.map(function(x){ return x.id===f.id?toSave:x; }) : all.concat([toSave]));
  state.editingFichaDeteccion = toSave;
  if(!silent) toast('Ficha actualizada correctamente.', 'success');
}
function doSaveFichaDeteccion(){
  var f = state.editingFichaDeteccion;
  var errEl = document.getElementById('fdError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!f.fecha || !(f.estudianteNombre||'').trim() || !(f.nivelBgu||'').trim()) return fail('Completa la fecha, el nombre del estudiante y el Nivel Educativo.');
  var d = currentDocente();
  var eraBorrador = f.borrador !== false;
  f.borrador = false;
  saveFichaDeteccion(f, true);
  if(eraBorrador && !isStaffRole(d.role)){
    toast('Ficha enviada al DECE. Quedará registrada y ya no podrás editarla. Recuerda imprimirla y firmarla.', 'success');
    printAsPdf();
  } else {
    toast('Ficha actualizada correctamente.', 'success');
  }
  state.editingFichaDeteccion=null; state.fichaDeteccionView='lista'; render();
}

var cargaEditRows = null;
function blankCargaRow(){ return {id:uid('cg'), nivel:'', especialidad:'', cursos:[], asignaturas:[], horas:{}}; }
function ensureCargaRows(d){
  if(cargaEditRows) return cargaEditRows;
  var flat = load(LS.CARGA).filter(function(r){ return r.docenteId === d.id; });
  if(flat.length === 0){
    cargaEditRows = [1].map(blankCargaRow);
    return cargaEditRows;
  }
  // Step 1: bucket flat records by (nivel, especialidad, curso) → set of asignaturas, same as before.
  var cursoBuckets = {}, cursoOrder = [];
  flat.forEach(function(r){
    var key = r.nivel + '||' + (r.especialidad||'') + '||' + r.curso;
    if(!cursoBuckets[key]){
      cursoBuckets[key] = {nivel: r.nivel, especialidad: r.especialidad||'', curso: r.curso, asignaturas: [], horas: {}};
      cursoOrder.push(key);
    }
    if(r.asignatura && cursoBuckets[key].asignaturas.indexOf(r.asignatura)===-1) cursoBuckets[key].asignaturas.push(r.asignatura);
    if(r.asignatura && r.horasSemanales) cursoBuckets[key].horas[r.asignatura] = r.horasSemanales;
  });
  // Step 2: merge cursos that share the exact same (nivel, especialidad, asignaturas) into one
  // multi-curso edit row, so bulk-selected combinations collapse back into a single row on reload
  // without corrupting cursos whose asignatura sets differ.
  var rowGroups = {}, rowOrder = [];
  cursoOrder.forEach(function(key){
    var b = cursoBuckets[key];
    var horasSig = b.asignaturas.slice().sort().map(function(a){ return a + ':' + (b.horas[a]||''); }).join('|');
    var sig = b.nivel + '||' + b.especialidad + '||' + horasSig;
    if(!rowGroups[sig]){
      rowGroups[sig] = {id: uid('cg'), nivel: b.nivel, especialidad: b.especialidad, cursos: [], asignaturas: b.asignaturas.slice(), horas: Object.assign({}, b.horas)};
      rowOrder.push(sig);
    }
    if(rowGroups[sig].cursos.indexOf(b.curso)===-1) rowGroups[sig].cursos.push(b.curso);
  });
  cargaEditRows = rowOrder.map(function(k){ return rowGroups[k]; });
  return cargaEditRows;
}
