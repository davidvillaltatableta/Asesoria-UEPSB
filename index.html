function bindPcaFormEvents(){
  var p = state.editingPca;
  var isAdmin = isStaffRole(currentDocente().role);
  var locked = pcaBloqueadoParaDocente(p) && !isAdmin;

  document.getElementById('btnBackToList').onclick = function(){ go(state.pcaReturnTo || 'pcalist'); };
  var saveBtn = document.getElementById('btnSavePca');
  if(saveBtn) saveBtn.onclick = function(){
    savePca(p);
    go(state.pcaReturnTo || 'pcalist');
  };
  document.getElementById('btnExportWordNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaWord(p.id); };
  document.getElementById('btnExportExcelNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaExcel(p.id); };
  document.getElementById('btnExportPdfNow').onclick = printAsPdf;
  var lockToggle = document.getElementById('pfLockToggle');
  if(lockToggle){
    lockToggle.addEventListener('change', function(){
      p.locked = lockToggle.checked;
      var all = load(LS.PCA);
      var found = all.find(function(x){ return x.id===p.id; });
      if(found){ found.locked = p.locked; save(LS.PCA, all); }
      toast(p.locked ? 'Plan bloqueado para el docente.' : 'Plan desbloqueado: el docente ya puede editarlo de nuevo.', 'success');
    });
  }

  if(locked){
    document.querySelectorAll('#pcaDoc input, #pcaDoc select, #pcaDoc textarea, #pcaDoc button').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('#pcaDoc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable','false'); });
    return;
  }
  bindAutoguardadoDelegado('pcaDoc', 'pca');

  document.getElementById('pfNivel').addEventListener('change', function(e){ p.nivel=e.target.value; p.especialidad=''; p.curso=''; p.asignatura=''; renderPcaFormAgain(); });
  document.getElementById('pfEspecialidad').addEventListener('change', function(e){ p.especialidad=e.target.value; p.asignatura=''; renderPcaFormAgain(); });
  document.getElementById('pfCurso').addEventListener('change', function(e){ p.curso=e.target.value; renderPcaFormAgain(); });
  document.getElementById('pfAsignatura').addEventListener('change', function(e){ p.asignatura=e.target.value; renderPcaFormAgain(); });
  var cm = document.getElementById('pfCursoManual'); if(cm) cm.addEventListener('input', function(e){ p.cursoManual = e.target.value; });
  var am = document.getElementById('pfAsignaturaManual'); if(am) am.addEventListener('input', function(e){ p.asignaturaManual = e.target.value; });

  ['pfCargaSemanal','pfT1','pfT2','pfT3','pfRevisado','pfAprobado'].forEach(function(id){
    var el = document.getElementById(id);
    var key = {pfCargaSemanal:'cargaSemanal', pfT1:'semanasT1', pfT2:'semanasT2', pfT3:'semanasT3', pfRevisado:'revisadoPor', pfAprobado:'aprobadoPor'}[id];
    el.addEventListener('input', function(){ p[key] = el.value; });
  });
  var pfLimite = document.getElementById('pfFechaLimite');
  if(pfLimite) pfLimite.addEventListener('change', function(){ p.fechaLimite = pfLimite.value; });

  // Temporalización
  document.getElementById('btnAddTemporalizacion').onclick = function(){
    p.temporalizacion.push({id:uid('tm'), unidad:'Unidad ' + (p.temporalizacion.length+1), nombreUnidad:'', trimestre:'1er Trimestre', semanas:''});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-tmremove]').forEach(function(btn){
    btn.onclick = function(){ p.temporalizacion = p.temporalizacion.filter(function(t){ return t.id!==btn.getAttribute('data-tmremove'); }); renderPcaFormAgain(); };
  });
  document.querySelectorAll('#tmBody tr').forEach(function(tr){
    var id = tr.getAttribute('data-tmrow');
    tr.querySelectorAll('[data-tf]').forEach(function(el){
      var t = p.temporalizacion.find(function(x){ return x.id===id; });
      el.addEventListener('input', function(){ t[el.getAttribute('data-tf')] = el.value; if(el.tagName==='SELECT') renderPcaFormAgain(); });
      if(el.tagName==='SELECT') el.addEventListener('change', function(){ t[el.getAttribute('data-tf')] = el.value; });
      if(el.getAttribute('data-tf')==='semanas') el.addEventListener('change', function(){ renderPcaFormAgain(); });
    });
  });

  // Unidades / semanas
  document.getElementById('btnAddUnidad').onclick = function(){
    var n = p.unidades.length + 1;
    p.unidades.push({id:uid('un'), nombre:'Unidad ' + n, filas:[weekRow(1)]});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-removeunit]').forEach(function(btn){
    btn.onclick = function(){
      if(p.unidades.length<=1){ toast('Debe existir al menos una unidad.', 'error'); return; }
      confirmDialog('¿Eliminar esta unidad y todo su contenido?', function(){
        var unitId = btn.getAttribute('data-removeunit');
        var idx = p.unidades.findIndex(function(u){ return u.id===unitId; });
        var unidadEliminada = p.unidades[idx];
        p.unidades = p.unidades.filter(function(u){ return u.id!==unitId; });
        renderPcaFormAgain();
        toastConDeshacer('Unidad eliminada.', function(){
          if(!p.unidades.some(function(u){ return u.id===unidadEliminada.id; })){
            p.unidades.splice(idx, 0, unidadEliminada);
            renderPcaFormAgain();
          }
          toast('Unidad restaurada.', 'success');
        });
      });
    };
  });
  document.querySelectorAll('[data-unitname]').forEach(function(el){
    el.addEventListener('input', function(){
      var u = p.unidades.find(function(x){ return x.id===el.getAttribute('data-unitname'); });
      u.nombre = el.value;
    });
  });
  document.querySelectorAll('[data-addweek]').forEach(function(btn){
    btn.onclick = function(){
      var u = p.unidades.find(function(x){ return x.id===btn.getAttribute('data-addweek'); });
      var nueva = weekRow(u.filas.length+1);
      var ultima = u.filas[u.filas.length-1];
      if(ultima){
        nueva.fechaInicio = addDays(ultima.fechaInicio, 7);
        nueva.fechaFin = addDays(ultima.fechaFin, 7);
      }
      u.filas.push(nueva);
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-wkremove]').forEach(function(btn){
    btn.onclick = function(){
      var tr = btn.closest('tr');
      var tbody = btn.closest('tbody');
      var unitId = tbody.getAttribute('data-unitbody');
      var u = p.unidades.find(function(x){ return x.id===unitId; });
      u.filas = u.filas.filter(function(f){ return f.id!==btn.getAttribute('data-wkremove'); });
      u.filas.forEach(function(f,i){ f.semana = i+1; });
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-unitbody]').forEach(function(tbody){
    var unitId = tbody.getAttribute('data-unitbody');
    var u = p.unidades.find(function(x){ return x.id===unitId; });
    tbody.querySelectorAll('tr').forEach(function(tr){
      var rowId = tr.getAttribute('data-wkrow');
      var f = u.filas.find(function(x){ return x.id===rowId; });
      tr.querySelectorAll('[data-wf]').forEach(function(el){
        el.addEventListener('input', function(){ f[el.getAttribute('data-wf')] = el.value; });
      });
      tr.querySelectorAll('.rte-editable').forEach(function(el){
        var key = el.getAttribute('data-rte-field');
        el.addEventListener('input', function(){ f[key] = el.innerHTML; });
      });
      bindRteToolbars(tr);
    });
  });
}

function renderPcaFormAgain(){
  document.querySelector('main.content').innerHTML = pcaToolbarHtml(state.editingPca) + renderPcaDocOnly();
  bindPcaFormEvents();
}
function renderPcaDocOnly(){
  // Re-render just the document part (used after any structural edit) by calling full render minus toolbar duplication.
  var full = renderPcaForm(currentDocente());
  var marker = '<div class="pca-doc" id="pcaDoc">';
  return marker + full.split(marker)[1];
}

function savePca(p, silent){
  var d = currentDocente();
  var existingHeader = load(LS.PCA).find(function(x){ return x.id===p.id; });
  var isNew = !existingHeader;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  p.updatedAt = nowISO();
  p.unidadesNombres = p.unidades.map(function(u){ return u.nombre; });
  var header = {
    id:p.id, docenteId:ownerId, nivel:p.nivel, especialidad:p.especialidad,
    curso:p.curso, cursoManual:p.cursoManual||'', asignatura:p.asignatura, asignaturaManual:p.asignaturaManual||'',
    cargaSemanal:p.cargaSemanal, semanasT1:p.semanasT1, semanasT2:p.semanasT2, semanasT3:p.semanasT3, fechaLimite:p.fechaLimite||'',
    temporalizacion:p.temporalizacion, unidadesNombres:p.unidadesNombres,
    elaboradoPor:p.elaboradoPor, revisadoPor:p.revisadoPor, aprobadoPor:p.aprobadoPor,
    locked: !!p.locked,
    createdAt:p.createdAt, updatedAt:p.updatedAt
  };
  var pcas = load(LS.PCA).filter(function(x){ return x.id!==p.id; });
  pcas.push(header);
  save(LS.PCA, pcas);

  var cont = load(LS.CONT).filter(function(c){ return c.pcaId!==p.id; });
  p.unidades.forEach(function(u){
    u.filas.forEach(function(f){
      cont.push({
        id: f.id, pcaId:p.id, docenteId:ownerId, unidad:u.nombre, semana:f.semana,
        fechaInicio:f.fechaInicio, fechaFin:f.fechaFin, destreza:f.destreza,
        nivelLogroIntermedio:f.nivelLogroIntermedio||'', nivelLogroAvanzado:f.nivelLogroAvanzado||'',
        temas:f.temas, pagina:f.pagina, observacion:f.observacion
      });
    });
  });
  save(LS.CONT, cont);
  if(!silent){
    if(isNew && p.fechaLimite && !isStaffRole(d.role)) toast('Plan guardado. Podrás seguir editándolo hasta la fecha límite de entrega.', 'success');
    else toast('Plan curricular guardado correctamente.', 'success');
  }
}

/* Resalta en la barra de herramientas del editor de texto enriquecido qué opciones están
   activas justo donde está el cursor (negrita, subrayado, viñetas, numeración, superíndice,
   subíndice) — así el docente sabe de un vistazo qué formato está usando en ese punto, sin tener
   que adivinar por el texto. */
var RTE_CMDS_CON_ESTADO = ['bold','underline','insertUnorderedList','insertOrderedList','superscript','subscript'];
function actualizarBarraRteActiva(editable){
  var wrap = editable.closest('.rte');
  if(!wrap) return;
  var toolbar = wrap.querySelector('.rte-toolbar');
  if(!toolbar) return;
  toolbar.querySelectorAll('[data-rte-cmd]').forEach(function(btn){
    var cmd = btn.getAttribute('data-rte-cmd');
    var activo = false;
    if(RTE_CMDS_CON_ESTADO.indexOf(cmd)!==-1){
      try{ activo = document.queryCommandState(cmd); }catch(e){ activo = false; }
    }
    btn.classList.toggle('active', activo);
  });
}
/* Resaltado persistente de selección: cuando el docente selecciona texto y luego hace clic en un
   control que le quita el foco al campo (color, símbolo, "Insertar enlace"), el navegador borra
   el resaltado azul nativo aunque la selección siga existiendo internamente. Usamos la CSS Custom
   Highlight API para redibujar esa selección manualmente hasta que el propio docente vuelva a
   hacer clic o a escribir dentro del texto (momento en el que se considera "quitada"). Se degrada
   sin errores en navegadores que no soporten la API (queda el comportamiento anterior). */
var RTE_HIGHLIGHT = (typeof Highlight !== 'undefined' && window.CSS && CSS.highlights) ? new Highlight() : null;
if(RTE_HIGHLIGHT) CSS.highlights.set('rte-manual-selection', RTE_HIGHLIGHT);
function limpiarSeleccionPersistenteRte(){ if(RTE_HIGHLIGHT) RTE_HIGHLIGHT.clear(); }
function guardarSeleccionPersistenteRte(editable){
  if(!RTE_HIGHLIGHT) return;
  var sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.isCollapsed && editable.contains(sel.anchorNode) && editable.contains(sel.focusNode)){
    RTE_HIGHLIGHT.clear();
    RTE_HIGHLIGHT.add(sel.getRangeAt(0).cloneRange());
  }
}
function bindRteToolbars(root){
  if(!root) return;
  root.querySelectorAll('[data-rte-cmd]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var wrap = btn.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      var cmd = btn.getAttribute('data-rte-cmd');
      if(cmd === 'createLink'){
        var sel = window.getSelection();
        var savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
        promptDialog('Ingresa la URL del enlace:', 'https://', function(url){
          limpiarSeleccionPersistenteRte();
          editable.focus();
          if(savedRange){ var sel2 = window.getSelection(); sel2.removeAllRanges(); sel2.addRange(savedRange); }
          document.execCommand('createLink', false, url);
        });
        return;
      }
      if(cmd === 'insertFraction'){
        editable.focus();
        document.execCommand('insertHTML', false, '<sup>1</sup>⁄<sub>2</sub>&nbsp;');
        return;
      }
      editable.focus();
      document.execCommand(cmd, false, null);
      actualizarBarraRteActiva(editable);
    });
  });
  root.querySelectorAll('.rte-editable').forEach(function(editable){
    ['keyup','mouseup','focus','input'].forEach(function(evt){
      editable.addEventListener(evt, function(){ actualizarBarraRteActiva(editable); });
    });
    editable.addEventListener('mousedown', limpiarSeleccionPersistenteRte);
    editable.addEventListener('keydown', limpiarSeleccionPersistenteRte);
    editable.addEventListener('blur', function(){
      var wrap = editable.closest('.rte');
      if(wrap) wrap.querySelectorAll('.rte-toolbar [data-rte-cmd].active').forEach(function(b){ b.classList.remove('active'); });
      guardarSeleccionPersistenteRte(editable);
    });
  });
  root.querySelectorAll('[data-rte-symbol]').forEach(function(sel){
    var savedRange = null;
    sel.addEventListener('mousedown', function(){
      var s = window.getSelection();
      savedRange = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    });
    sel.addEventListener('change', function(){
      var symbol = sel.value;
      if(!symbol) return;
      var wrap = sel.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      limpiarSeleccionPersistenteRte();
      editable.focus();
      if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
      document.execCommand('insertText', false, symbol);
      sel.value = '';
    });
  });
  root.querySelectorAll('[data-rte-colorbtn]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var wrap = btn.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      mostrarMenuColorRte(btn, editable);
    });
  });
  root.querySelectorAll('[data-rte-font]').forEach(function(sel){
    var savedRange = null;
    sel.addEventListener('mousedown', function(){
      var s = window.getSelection();
      savedRange = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    });
    sel.addEventListener('change', function(){
      var fuente = sel.value;
      if(!fuente) return;
      var wrap = sel.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      limpiarSeleccionPersistenteRte();
      editable.focus();
      if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
      document.execCommand('fontName', false, fuente);
      sel.value = '';
    });
  });
  root.querySelectorAll('.rte-editable').forEach(function(editable){
    editable.addEventListener('paste', function(e){
      var cd = e.clipboardData || window.clipboardData;
      if(!cd) return;
      var htmlRaw = cd.getData('text/html');
      var textoPlano = cd.getData('text/plain');
      if(!htmlRaw && !textoPlano) return;
      e.preventDefault();
      insertarPegadoInmediato(editable, htmlRaw, textoPlano);
    });
  });
}
/* Colores del tema (paleta institucional de la app) y colores estándar (la fila clásica que usan
   Word/Excel) para el menú de color de texto — ver mostrarMenuColorRte. */
var RTE_COLORES_TEMA = ['#000000','#FFFFFF','#5B6B85','#16233A','#0A2A5E','#1848A0','#5C93EF','#D6A419','#B01C1C','#1E7B45'];
var RTE_COLORES_ESTANDAR = ['#C00000','#FF0000','#FFC000','#FFFF00','#92D050','#00B050','#00B0F0','#0070C0','#002060','#7030A0'];
var RTE_COLOR_AUTOMATICO = '#16233A';
/* Menú de color de texto al estilo Word/Office: "Automático", una fila de colores del tema, una
   fila de colores estándar, y "Más colores…" que abre el selector nativo del sistema operativo
   para cualquier color personalizado. Reemplaza al <input type="color"> plano de antes. */
function mostrarMenuColorRte(btn, editable){
  var previo = document.getElementById('rteColorMenu');
  if(previo) previo.remove();
  var sel = window.getSelection();
  var savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
  var rect = btn.getBoundingClientRect();
  var menu = document.createElement('div');
  menu.id = 'rteColorMenu';
  menu.className = 'rte-color-menu';
  menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 210)) + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';

  function swatchesHtml(colores){
    return colores.map(function(c){
      return '<button type="button" class="rte-color-swatch" data-color="'+c+'" style="background:'+c+';" title="'+c+'"></button>';
    }).join('');
  }
  menu.innerHTML = ''
    + '<button type="button" class="rte-color-auto" data-color="'+RTE_COLOR_AUTOMATICO+'"><span class="rte-color-auto-swatch"></span>Automático</button>'
    + '<div class="rte-color-label">Colores del tema</div>'
    + '<div class="rte-color-grid">' + swatchesHtml(RTE_COLORES_TEMA) + '</div>'
    + '<div class="rte-color-label">Colores estándar</div>'
    + '<div class="rte-color-grid">' + swatchesHtml(RTE_COLORES_ESTANDAR) + '</div>'
    + '<button type="button" class="rte-color-more" id="rteColorMoreBtn">🎨 Más colores…</button>';
  document.body.appendChild(menu);

  var nativePicker = document.createElement('input');
  nativePicker.type = 'color';
  nativePicker.style.cssText = 'position:fixed; left:' + rect.left + 'px; top:' + rect.bottom + 'px; width:1px; height:1px; opacity:0; pointer-events:none;';
  document.body.appendChild(nativePicker);

  function aplicar(color){
    limpiarSeleccionPersistenteRte();
    editable.focus();
    if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
    document.execCommand('foreColor', false, color);
    btn.setAttribute('data-color', color);
    var barra = btn.querySelector('.rte-color-btn-bar');
    if(barra) barra.style.background = color;
    cerrar();
  }
  menu.querySelectorAll('[data-color]').forEach(function(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(){ aplicar(el.getAttribute('data-color')); });
  });
  var moreBtn = document.getElementById('rteColorMoreBtn');
  moreBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
  moreBtn.addEventListener('click', function(){ nativePicker.click(); });
  nativePicker.addEventListener('input', function(){ aplicar(nativePicker.value); });

  function onOutside(ev){
    if(menu.contains(ev.target) || ev.target === btn || ev.target === nativePicker) return;
    cerrar();
  }
  function cerrar(){
    menu.remove();
    nativePicker.remove();
    document.removeEventListener('mousedown', onOutside, true);
  }
  setTimeout(function(){ document.addEventListener('mousedown', onOutside, true); }, 0);
}
/* Al pegar contenido con formato en un campo de texto enriquecido, ofrece un pequeño menú (como
   en Word) para elegir cómo incorporarlo: manteniendo el formato de origen, combinándolo con uno
   más simple, o solo el texto plano. Si el docente hace clic fuera sin elegir, se pega con el
   formato de origen (la opción menos sorprendente) para que el pegado nunca quede "sin hacer
   nada" por descuido. */
/* Pegado al estilo Word: el contenido se inserta DE INMEDIATO (con el formato de origen, la
   opción menos sorprendente) para que se vea completo apenas se pega — antes, el docente tenía
   que elegir una opción o hacer clic afuera para que el pegado "terminara" de aparecer, lo cual
   se sentía como que el pegado se quedaba a medias. Justo después aparece un botoncito flotante
   "Opciones de pegado" (igual que en Word) que, si se necesita, permite cambiar a "Combinar
   formato" o "Pegar solo texto" — reemplazando lo ya pegado, sin tener que repetir el pegado. Ese
   botón desaparece solo si no se usa (al seguir escribiendo, hacer clic en otro lado, o pasados
   unos segundos). */
function insertarPegadoInmediato(editable, htmlRaw, textoPlano){
  var marcaId = 'pm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var htmlPorDefecto = htmlRaw ? quitarFuenteHtml(sanitizeRte(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
  document.execCommand('insertHTML', false, '<span data-paste-marker="' + marcaId + '">' + htmlPorDefecto + '</span>');
  editable.dispatchEvent(new Event('input', {bubbles:true}));
  var marcador = editable.querySelector('[data-paste-marker="' + marcaId + '"]');
  if(marcador) mostrarBotonOpcionesPegado(editable, marcador, htmlRaw, textoPlano);
}
function mostrarBotonOpcionesPegado(editable, marcador, htmlRaw, textoPlano){
  var previo = document.getElementById('rtePasteOptionsBtn');
  if(previo) previo.remove();
  var previoMenu = document.getElementById('rtePasteSubmenu');
  if(previoMenu) previoMenu.remove();
  var rect = marcador.getBoundingClientRect();
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'rtePasteOptionsBtn';
  btn.className = 'rte-paste-options-btn';
  btn.textContent = '📋 Opciones de pegado ▾';
  btn.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 190)) + 'px';
  btn.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(btn);

  function desenvolverMarcador(){
    if(marcador && marcador.parentNode){
      while(marcador.firstChild) marcador.parentNode.insertBefore(marcador.firstChild, marcador);
      marcador.parentNode.removeChild(marcador);
    }
  }
  var descartarTimer = setTimeout(cerrarTodo, 6000);
  function cerrarTodo(){
    clearTimeout(descartarTimer);
    btn.remove();
    var submenu = document.getElementById('rtePasteSubmenu');
    if(submenu) submenu.remove();
    desenvolverMarcador();
    document.removeEventListener('mousedown', onFueraDelBoton, true);
    editable.removeEventListener('keydown', cerrarTodo);
  }
  function onFueraDelBoton(ev){
    if(btn.contains(ev.target) || document.getElementById('rtePasteSubmenu')) return;
    cerrarTodo();
  }
  editable.addEventListener('keydown', cerrarTodo);
  btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
  btn.addEventListener('click', function(){
    clearTimeout(descartarTimer);
    mostrarSubmenuFormatoPegado(btn, marcador, htmlRaw, textoPlano, cerrarTodo);
  });
  setTimeout(function(){ document.addEventListener('mousedown', onFueraDelBoton, true); }, 0);
}
function mostrarSubmenuFormatoPegado(btn, marcador, htmlRaw, textoPlano, alTerminar){
  var previo = document.getElementById('rtePasteSubmenu');
  if(previo) previo.remove();
  var rect = btn.getBoundingClientRect();
  var menu = document.createElement('div');
  menu.id = 'rtePasteSubmenu';
  menu.className = 'rte-paste-menu';
  menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 190)) + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.innerHTML = ''
    + '<button type="button" data-modo="mantener">Mantener formato de origen</button>'
    + '<button type="button" data-modo="combinar">Combinar formato</button>'
    + '<button type="button" data-modo="texto">Pegar solo texto</button>';
  document.body.appendChild(menu);
  menu.querySelectorAll('button').forEach(function(b){
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){
      var modo = b.getAttribute('data-modo');
      var htmlFinal;
      if(modo === 'texto') htmlFinal = escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      else if(modo === 'combinar') htmlFinal = htmlRaw ? quitarFuenteHtml(limpiarHtmlPegadoCombinado(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      else htmlFinal = htmlRaw ? quitarFuenteHtml(sanitizeRte(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      var contenedorEditable = marcador && marcador.closest('.rte-editable');
      if(marcador) marcador.innerHTML = htmlFinal;
      menu.remove();
      if(contenedorEditable) contenedorEditable.dispatchEvent(new Event('input', {bubbles:true}));
      alTerminar();
    });
  });
  function onFueraDelMenu(ev){
    if(menu.contains(ev.target) || ev.target===btn) return;
    menu.remove();
    document.removeEventListener('mousedown', onFueraDelMenu, true);
  }
  setTimeout(function(){ document.addEventListener('mousedown', onFueraDelMenu, true); }, 0);
}
/* Versión más simple que sanitizeRte para "Combinar formato": conserva negrita/subrayado y
   saltos de línea/párrafo, pero descarta listas, enlaces, colores y demás formato del origen
   (las viñetas de listas se convierten en líneas separadas para no perder la separación). */
/* Etiquetas cuyo contenido NUNCA debe mostrarse como texto (a diferencia de una etiqueta de
   formato desconocida, donde sí queremos conservar el texto interior): Word (y en general
   "Pegar desde Office") agrega un bloque <style> completo con las definiciones de fuentes —
   @font-face, mso-*, etc. — antes del contenido real. Si esas etiquetas se tratan igual que
   cualquier otra etiqueta no permitida (conservando su textContent), ese bloque de CSS aparece
   como texto visible pegado al inicio del documento. */
var RTE_PASTE_TAGS_DESCARTAR = {STYLE:1, SCRIPT:1, HEAD:1, TITLE:1, META:1, LINK:1, 'O:P':1, XML:1};
function limpiarHtmlPegadoCombinado(html){
  if(!html) return '';
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var allowed = {DIV:1,P:1,B:1,STRONG:1,U:1,BR:1};
  function clean(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ node.removeChild(ch); return; }
      if(RTE_PASTE_TAGS_DESCARTAR[ch.tagName]){ node.removeChild(ch); return; }
      if(ch.tagName === 'LI') node.insertBefore(document.createElement('br'), ch);
      if(!allowed[ch.tagName]){
        var text = document.createTextNode(ch.textContent || '');
        node.replaceChild(text, ch);
        return;
      }
      Array.from(ch.attributes).forEach(function(attr){ ch.removeAttribute(attr.name); });
      clean(ch);
    });
  }
  clean(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
/* Por defecto, el texto pegado adopta el tipo de letra que ya tiene el casillero en vez de traer
   consigo la fuente de origen (Word, otra página, etc.) — se aplica a las 2 opciones de pegado
   que conservan formato ("Mantener formato de origen" y "Combinar formato"); "Pegar solo texto"
   ya es texto plano sin fuente. Quita <font face="..."> y cualquier font-family en "style". */
function quitarFuenteHtml(html){
  if(!html) return html;
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  doc.querySelectorAll('[face]').forEach(function(el){ el.removeAttribute('face'); });
  doc.querySelectorAll('[style]').forEach(function(el){
    el.style.removeProperty('font-family');
    if(!el.getAttribute('style')) el.removeAttribute('style');
  });
  return doc.body.firstChild.innerHTML;
}
/* Whitelist sanitizer applied at save time: strips any tag/attribute outside a small allowed
   set (bold/underline/lists/links/line-breaks) so pasted content can't smuggle scripts or
   event-handler attributes into localStorage. */
function sanitizeRte(html){
  if(!html) return '';
  var allowed = {DIV:1,P:1,B:1,STRONG:1,U:1,I:1,EM:1,UL:1,OL:1,LI:1,BR:1,A:1,SPAN:1,SUP:1,SUB:1,FONT:1};
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  function clean(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ node.removeChild(ch); return; }
      if(RTE_PASTE_TAGS_DESCARTAR[ch.tagName]){ node.removeChild(ch); return; }
      if(!allowed[ch.tagName]){
        var text = document.createTextNode(ch.textContent || '');
        node.replaceChild(text, ch);
        return;
      }
      Array.from(ch.attributes).forEach(function(attr){
        if(ch.tagName === 'A' && attr.name === 'href'){
          var v = attr.value || '';
          if(!/^https?:\/\//i.test(v) && !/^mailto:/i.test(v)) ch.removeAttribute('href');
        } else if(ch.tagName === 'FONT' && (attr.name === 'color' || attr.name === 'face')){
          // El selector de color y de tipo de letra de la barra de herramientas usan execCommand,
          // que en este navegador produce <font color="..." face="...">, no <span style="...">
          // — por eso son las únicas etiquetas/atributos de formato "en crudo" que se conservan.
        } else {
          ch.removeAttribute(attr.name);
        }
      });
      if(ch.tagName === 'A') ch.setAttribute('target', '_blank');
      clean(ch);
    });
  }
  clean(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
function richTextToPlain(html){
  if(!html) return '';
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var lines = [];
  var current = '';
  function flush(){ var t = current.trim(); if(t) lines.push(t); current = ''; }
  function inlineText(node){
    var out = '';
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ out += ch.textContent; return; }
      if(ch.nodeType !== 1) return;
      if(ch.tagName === 'BR'){ out += '\n'; return; }
      out += inlineText(ch);
    });
    return out;
  }
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ current += ch.textContent; return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag === 'LI'){ flush(); lines.push('• ' + inlineText(ch).trim()); }
      else if(tag === 'UL' || tag === 'OL'){ flush(); walk(ch); }
      else if(tag === 'BR'){ current += '\n'; }
      else if(tag === 'DIV' || tag === 'P'){ flush(); var t = inlineText(ch).trim(); if(t) lines.push(t); }
      else { current += inlineText(ch); }
    });
  }
  walk(doc.body.firstChild);
  flush();
  return lines.join('\n');
}

/* Une los 3 campos de Nivel de Logro de una fila de Contenidos (destreza=Básico,
   nivelLogroIntermedio, nivelLogroAvanzado) en un solo texto plano legible, para las
   exportaciones (Word/Markdown/CSV) que muestran una sola columna "Nivel de Logro". */
function nivelLogroTextoCompleto(f){
  var partes = [];
  var b = richTextToPlain(f.destreza); if(b) partes.push('Básico:\n' + b);
  var i = richTextToPlain(f.nivelLogroIntermedio); if(i) partes.push('Intermedio:\n' + i);
  var a = richTextToPlain(f.nivelLogroAvanzado); if(a) partes.push('Avanzado:\n' + a);
  return partes.join('\n\n');
}
/* Misma unión que nivelLogroTextoCompleto pero conservando el HTML enriquecido (negritas,
   viñetas…), para la exportación en HTML que sí interpreta etiquetas. */
function nivelLogroHtmlCompleto(f){
  var partes = [];
  if(f.destreza) partes.push('<p><strong>Básico:</strong></p>' + f.destreza);
  if(f.nivelLogroIntermedio) partes.push('<p><strong>Intermedio:</strong></p>' + f.nivelLogroIntermedio);
  if(f.nivelLogroAvanzado) partes.push('<p><strong>Avanzado:</strong></p>' + f.nivelLogroAvanzado);
  return partes.join('');
}

function renderSemanalList(d){ return renderSemanalListInner(d, false); }
function renderAdminSemanal(){ return renderSemanalListInner(currentDocente(), true); }

/* Numeración de Planes Semanales: cada uno guarda su propio número (no es la posición en la
   lista), así que borrar uno no renumera a los demás. El siguiente plan que se crea continúa
   después del número más alto que exista actualmente para ese docente. */
function siguienteNumeroSemanal(docenteId){
  var max = load(LS.SEMANAL).filter(function(s){ return s.docenteId===docenteId; }).reduce(function(m,s){ return Math.max(m, s.numero||0); }, 0);
  return max + 1;
}
/* Agrupa por trimestre y mes según la fecha de inicio del plan. El año lectivo de esta
   institución arranca a fines de agosto (el 1er Trimestre empieza el 31/08), así que agosto
   cuenta como parte del 1er Trimestre y del inicio del ciclo, no como cierre del anterior. Si la
   institución maneja otros cortes, este mapeo es el único lugar que hay que ajustar. */
var MES_A_TRIMESTRE = {8:1, 9:1, 10:1, 11:1, 12:1, 1:2, 2:2, 3:2, 4:3, 5:3, 6:3, 7:3};
var MESES_CAP = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
/* El año lectivo empieza en agosto, así que al agrupar por mes, el ciclo debe empezar en agosto y
   terminar en julio (Ago,Sept,Oct,Nov,Dic,Ene,...,Jul) — no el orden calendario Ene-Dic. Esto se
   usa solo para ORDENAR los grupos de mes; dentro de un mismo mes-del-ciclo, se desempata por año
   calendario para que años lectivos distintos no se mezclen fuera de orden. */
var MES_ORDEN_ANIO_LECTIVO = {8:0, 9:1, 10:2, 11:3, 12:4, 1:5, 2:6, 3:7, 4:8, 5:9, 6:10, 7:11};
function trimestreYMesDe(fechaIso){
  if(!fechaIso) return null;
  var p = fechaIso.split('-');
  var year = parseInt(p[0],10), month = parseInt(p[1],10);
  if(!year || !month) return null;
  return {
    trimestre: MES_A_TRIMESTRE[month] || 1,
    mesKey: year + '-' + String(month).padStart(2,'0'),
    mesLabel: MESES_CAP[month-1] + ' ' + year,
    mesOrdenKey: String(MES_ORDEN_ANIO_LECTIVO[month]).padStart(2,'0') + '-' + year
  };
}

var TRIMESTRE_LABELS = {1:'1er Trimestre', 2:'2do Trimestre', 3:'3er Trimestre'};
function renderSemanalListInner(d, scopeAll){
  var isAdmin = isStaffRole(currentDocente().role);
  var all = load(LS.SEMANAL);
  var planes = scopeAll ? all : all.filter(function(s){ return s.docenteId===d.id; });
  var docentesById = {};
  if(scopeAll) allDocentes().forEach(function(x){ docentesById[x.id] = x; });

  var filtroHtml = '';
  if(scopeAll){
    var filtro = state.adminSemanalFilter;
    if(filtro.docenteId) planes = planes.filter(function(s){ return s.docenteId===filtro.docenteId; });
    if(filtro.fechaInicio) planes = planes.filter(function(s){ return (s.fechaInicio||'') >= filtro.fechaInicio; });
    if(filtro.fechaFin) planes = planes.filter(function(s){ return (s.fechaInicio||'') <= filtro.fechaFin; });
    planes = planes.filter(function(s){
      var asigOk = !filtro.asignatura || s.asignatura===filtro.asignatura;
      if(nivelEsBandaA(s.nivel)) return asigOk;
      var cursoOk = !filtro.curso || s.curso===filtro.curso;
      return asigOk && cursoOk;
    });
    filtroHtml = adminFiltroBarraHtml(filtro, 'asf', 'Curso (7.º EGB a 3.º BGU)');
  }

  function rowHtml(s){
    var lockedForViewer = !!s.locked && !isAdmin;
    var owner = scopeAll ? docentesById[s.docenteId] : null;
    var docenteCell = scopeAll ? '<td>' + (owner ? escapeHtml(nombreFormal(owner)) : '<span class="hint">(docente eliminado)</span>') + '</td>' : '';
    return ''
    + '<tr>'
    + '  <td class="tabular">' + (s.numero ? 'N.º ' + s.numero : '—') + '</td>'
    + docenteCell
    + '  <td><strong>' + escapeHtml(s.asignatura||'(sin asignatura)') + '</strong>' + (s.locked ? ' <span class="pill pill-muted" title="Bloqueado para el docente">🔒</span>' : '') + '</td>'
    + '  <td>' + escapeHtml(s.curso||'—') + '</td>'
    + '  <td>' + fmtDate(s.fechaInicio) + ' al ' + fmtDate(s.fechaFin) + '</td>'
    + '  <td class="tabular">' + (s.dias||[]).length + '</td>'
    + '  <td>' + fmtDateTime(s.updatedAt) + '</td>'
    + '  <td style="white-space:nowrap;">'
    + '    <button class="btn btn-ghost btn-sm" data-edit-semanal="' + s.id + '">' + (lockedForViewer ? 'Ver' : 'Ver / Editar') + '</button> '
    + '    <button class="btn btn-gold btn-sm" data-export-semanal-pdf="' + s.id + '" title="PDF real, sin restricciones de tu vista">PDF ✓</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-word="' + s.id + '">Word</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-excel="' + s.id + '">Excel</button> '
    + (isAdmin || !lockedForViewer ? '    <button class="btn btn-danger btn-sm" data-delete-semanal="' + s.id + '">Eliminar</button>' : '')
    + '  </td>'
    + '</tr>';
  }

  var theadDocente = scopeAll ? '<th>Docente</th>' : '';
  var theadHtml = '<thead><tr><th>N.º</th>' + theadDocente + '<th>Asignatura</th><th>Curso</th><th>Fecha</th><th>Días</th><th>Actualizado</th><th>Acciones</th></tr></thead>';

  var head = scopeAll
    ? '<p class="hint" style="margin-bottom:14px;">Puedes ver, editar y eliminar cualquier plan semanal, incluidos los bloqueados para los docentes.</p>'
    : '<div class="page-head"><div><div class="eyebrow">Plan Semanal</div><h1>Planes Semanales de Clase</h1><p>Un plan por cada semana de clase, enlazado con tu Plan Curricular Anual.</p></div><button class="btn btn-primary" id="btnNewSemanal">+ Nuevo Plan Semanal</button></div>';

  if(planes.length === 0){
    return head + filtroHtml + '<div class="card"><div class="empty-state"><div class="ic">📅</div>' + (scopeAll ? 'No hay planes semanales que coincidan con el filtro.' : 'Todavía no has creado ningún plan semanal.<br/><button class="btn btn-primary" id="btnNewSemanal2" style="margin-top:14px;">Crear el primero</button>') + '</div></div>';
  }

  // Agrupa por trimestre y, dentro de cada trimestre, por mes (según fecha de inicio del plan).
  var trimestres = {1:{}, 2:{}, 3:{}};
  var sinFecha = [];
  planes.forEach(function(s){
    var info = trimestreYMesDe(s.fechaInicio);
    if(!info){ sinFecha.push(s); return; }
    if(!trimestres[info.trimestre][info.mesKey]) trimestres[info.trimestre][info.mesKey] = {label: info.mesLabel, planes: []};
    trimestres[info.trimestre][info.mesKey].planes.push(s);
  });

  var gruposHtml = [1,2,3].map(function(t){
    var meses = trimestres[t];
    var mesKeys = Object.keys(meses).sort();
    if(!mesKeys.length) return '';
    var mesesHtml = mesKeys.map(function(mk){
      var grupo = meses[mk];
      // Dentro del mes, agrupa además por semana (mismo rango Fecha Inicio/Fin) para que los
      // planes de una misma semana (p.ej. varias asignaturas) queden juntos bajo un encabezado.
      var semanas = {}; var semanaOrder = [];
      grupo.planes.forEach(function(s){
        var key = (s.fechaInicio||'') + '|' + (s.fechaFin||'');
        if(!semanas[key]){ semanas[key] = {fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, planes:[]}; semanaOrder.push(key); }
        semanas[key].planes.push(s);
      });
      semanaOrder.sort();
      var semanasHtml = semanaOrder.map(function(sk){
        var g = semanas[sk];
        var filas = g.planes.slice().sort(function(a,b){ return (a.asignatura||'').localeCompare(b.asignatura||''); }).map(rowHtml).join('');
        var label = g.fechaInicio ? ('Semana del ' + fmtDate(g.fechaInicio) + ' al ' + fmtDate(g.fechaFin)) : 'Sin fecha de inicio';
        return '<div style="margin-top:10px;"><h4 style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; font-weight:700;">' + escapeHtml(label) + '</h4><div class="table-wrap"><table>' + theadHtml + '<tbody>' + filas + '</tbody></table></div></div>';
      }).join('');
      return '<div style="margin-top:14px;"><h3 style="font-size:13.5px; color:var(--blue-700); margin-bottom:8px;">' + escapeHtml(grupo.label) + '</h3>' + semanasHtml + '</div>';
    }).join('');
    return '<div class="card"><h2>' + TRIMESTRE_LABELS[t] + '</h2>' + mesesHtml + '</div>';
  }).join('');

  var sinFechaHtml = sinFecha.length
    ? '<div class="card"><h2>Sin fecha asignada</h2><div class="table-wrap"><table>' + theadHtml + '<tbody>' + sinFecha.map(rowHtml).join('') + '</tbody></table></div></div>'
    : '';

  return head + filtroHtml + gruposHtml + sinFechaHtml;
}

function blankDia(){ return {id:uid('dia'), fecha:'', contenidos:'', nivelLogroBasico:'', nivelLogroIntermedio:'', nivelLogroAvanzado:'', actividades:'', recursos:'', evaluacion:''}; }
/* Texto plano de los 3 niveles de logro seleccionados para un día del Plan Semanal, para usarlo
   en las exportaciones (Word/HTML/Markdown/CSV), que muestran una sola línea/columna por día. */

function blankSemanal(d){

  var nivel = niveles[0] || '';
  var especialidades = misEspecialidadesPara(d.id, nivel);
  var especialidad = especialidades[0] || '';
  var cursos = misCursosPara(d.id, nivel, especialidad);
  var curso = cursos[0] || '';
  var asignaturas = misAsignaturasPara(d.id, nivel, especialidad, curso);
  var asignatura = asignaturas[0] || '';
  return {
    id: uid('sem'), docenteId: d.id, numero: siguienteNumeroSemanal(d.id),
    nivel: nivel, especialidad: especialidad, curso: curso, asignatura: asignatura,
    pcaId:'', semanaRowId:'', fechaInicio:'', fechaFin:'', fechaHoraLimite: fechaLimiteVigente('semanal'),
    unidadDidactica:'', bloqueCurricular:'',
    dias:[blankDia()],
    revisadoPor:'Lic. David Villalta', aprobadoPor:'Lcdo. José Gómez',
    locked:false,
    createdAt: nowISO(), updatedAt: nowISO()
  };
}
/* La sección Contenidos del PCA (de donde sale "row.unidad", p.ej. "Unidad 1") y la tabla de
   Temporalización (de donde sale "Nombre de la Unidad", p.ej. "Los números reales") son dos
   listas separadas dentro del mismo PCA — se unen aquí por el texto de "unidad" para mostrar
   "Unidad 1 — Los números reales" en el campo Unidad Didáctica del Plan Semanal. */
function unidadDidacticaConNombre(pcaId, unidadLabel){
  if(!unidadLabel) return '';
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var tm = pca && (pca.temporalizacion||[]).find(function(t){ return t.unidad===unidadLabel; });
  var nombre = tm && tm.nombreUnidad;
  return nombre ? (unidadLabel + ' — ' + nombre) : unidadLabel;
}
/* Usada al vincular automáticamente un PCA (nueva ficha, o al cambiar nivel/curso/asignatura):
   precarga la fecha de la primera semana del PCA para que el docente tenga un punto de partida
   editable, en vez de forzarlo a elegir la semana de una lista. Nivel de Logro y Contenidos
   Esenciales ya NO se precargan aquí: ahora son listas de selección múltiple que el docente
   marca explícitamente (ver parseNivelesLogroTiers / temasSemana en renderSemanalForm). */
function applySemanaSelection(s, pcaId, rowId){
  s.pcaId = pcaId || '';
  s.semanaRowId = rowId || '';
  if(!pcaId) return;
  var row = semanasDePca(pcaId).find(function(r){ return r.id===rowId; });
  if(row){
    s.fechaInicio = row.fechaInicio || s.fechaInicio;
    s.fechaFin = row.fechaFin || s.fechaFin;
    s.unidadDidactica = unidadDidacticaConNombre(pcaId, row.unidad);
    if(s.dias && s.dias[0]) s.dias[0].fecha = s.fechaInicio;
  }
}
/* Usada cuando el docente edita manualmente la Fecha: busca, entre las semanas del PCA
   vinculado, aquella cuyo rango contiene la fecha de inicio ingresada, y si la encuentra
   actualiza Unidad Didáctica. Si no hay coincidencia (p.ej. porque esa semana del PCA todavía
   no tiene Fecha Inicio/Fin registrada, o el docente escribió una fecha distinta), NO se borra
   la semana ya vinculada — así Nivel de Logro y Contenidos Esenciales no desaparecen solo por
   escribir una fecha que no calza exactamente con el rango guardado en el PCA. */
function applyFechaSelection(s){
  if(!s.pcaId){ return; }
  if(!s.fechaInicio){ s.semanaRowId = ''; return; }
  var semanas = semanasDePca(s.pcaId);
  var match = semanas.find(function(r){
    return r.fechaInicio && r.fechaFin && s.fechaInicio >= r.fechaInicio && s.fechaInicio <= r.fechaFin;
  });
  if(match){
    s.semanaRowId = match.id;
    s.fechaFin = match.fechaFin || s.fechaFin;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, match.unidad);
    return;
  }
  // Sin coincidencia por fecha: si todavía no hay ninguna semana vinculada (p.ej. un plan
  // guardado antes de esta función, o cuya semana del PCA nunca tuvo Fecha Inicio/Fin), usa la
  // primera semana del PCA como respaldo en vez de dejar Nivel de Logro/Contenidos sin nada.
  if(!s.semanaRowId && semanas.length){
    s.semanaRowId = semanas[0].id;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, semanas[0].unidad);
  }
}
function recomputeSemanalPca(s){
  var pca = findMiPca(s.docenteId, s.nivel, s.especialidad, s.curso, s.asignatura);
  if(pca) applySemanaSelection(s, pca.id, (semanasDePca(pca.id)[0]||{}).id);
  else { s.pcaId=''; s.semanaRowId=''; s.unidadDidactica=''; }
}

function openSemanalForm(semId, returnTo){

    state.editingSemanal = Object.assign({}, found, { dias: (found.dias||[]).map(function(x){ return Object.assign({}, x); }) });

    if(pca) applySemanaSelection(state.editingSemanal, pca.id, (semanasDePca(pca.id)[0]||{}).id);
  }
  go('semanalform');
}

/* Campo (día) donde se guarda la selección de cada nivel de logro, y etiqueta visible de cada
   columna — usados tanto para armar el HTML como para leer/guardar la selección del docente. */
var NIVEL_LOGRO_DIA_FIELD = {basico:'nivelLogroBasico', intermedio:'nivelLogroIntermedio', avanzado:'nivelLogroAvanzado'};
var NIVEL_LOGRO_DIA_LABEL = {basico:'Básico', intermedio:'Intermedio', avanzado:'Avanzado'};
function nivelesLogroDiaHtml(dia, nivelLogroItems, nivelLogroMotivo, isIngles){
  var tituloCategoria = te('Niveles de Logro', isIngles);
  function grupoHtml(tier, items, seleccion){
    return '<div class="checkbox-grid" style="flex-direction:column; align-items:stretch;">' + items.map(function(it){
      return '<label class="checkbox-pill nivel-logro-pill"><input type="checkbox" class="nivellogro-dia-cb" data-tier="' + tier + '" value="' + escapeHtml(it) + '" ' + (seleccion.indexOf(it)!==-1?'checked':'') + ' /><span>' + escapeHtml(it) + '</span></label>';
    }).join('') + '</div>';
  }
  var columnas = ['basico','intermedio','avanzado'].map(function(tier){
    var itemsEstaSemana = (nivelLogroItems[tier] && nivelLogroItems[tier].estaSemana) || [];
    var itemsPendientes = (nivelLogroItems[tier] && nivelLogroItems[tier].pendientes) || [];
    var seleccion = (dia[NIVEL_LOGRO_DIA_FIELD[tier]]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
    var etiqueta = te(NIVEL_LOGRO_DIA_LABEL[tier], isIngles);
    var body;
    if(nivelLogroMotivo){
      body = '<div class="hint">' + escapeHtml(nivelLogroMotivo) + '</div>';
    } else if(!itemsEstaSemana.length && !itemsPendientes.length){
      body = isIngles
        ? '<div class="hint">The PCA has no ' + etiqueta + ' items for this week.</div>'
        : '<div class="hint">El PCA no tiene ítems de Nivel de Logro ' + etiqueta + ' para esta semana.</div>';
    } else {
      body = ''
        + (itemsEstaSemana.length ? '<div class="hint" style="font-weight:700; margin-bottom:4px;">' + te('De esta semana', isIngles) + '</div>' + grupoHtml(tier, itemsEstaSemana, seleccion) : '')
        + (itemsPendientes.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('Pendientes de la semana anterior', isIngles) + '</div>' + grupoHtml(tier, itemsPendientes, seleccion) : '');
    }
    return '<div><div class="hint" style="font-weight:700; margin-bottom:4px;">' + etiqueta + '</div>' + body + '</div>';
  }).join('');
  return '<div class="field"><label class="semanal-section-title">' + tituloCategoria + '</label><div class="grid-3" style="margin-top:6px; align-items:start;">' + columnas + '</div></div>';
}
function semanalDayHtml(dia, i, total, temasEstaSemana, temasPendientes, motivoSinSemana, nivelLogroItems, nivelLogroMotivo, isIngles){
  var seleccionados = (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  // Incluye también los ya seleccionados en este mismo día aunque ya no estén "disponibles"
  // (para que no desaparezcan de su propia lista al marcarlos).
  var opcionesEstaSemana = temasEstaSemana.slice();
  var opcionesPendientes = temasPendientes.slice();
  seleccionados.forEach(function(t){
    if(opcionesEstaSemana.indexOf(t)===-1 && opcionesPendientes.indexOf(t)===-1) opcionesEstaSemana.push(t);
  });

  function grupoHtml(opciones){
    return '<div class="checkbox-grid">' + opciones.map(function(t){
      return '<label class="checkbox-pill"><input type="checkbox" class="contenidos-cb" value="' + escapeHtml(t) + '" ' + (seleccionados.indexOf(t)!==-1?'checked':'') + ' />' + escapeHtml(t) + '</label>';
    }).join('') + '</div>';
  }

  var contenidosHtml;
  if(motivoSinSemana){
    contenidosHtml = '<div class="hint">' + escapeHtml(motivoSinSemana) + '</div>';
  } else if(!opcionesEstaSemana.length && !opcionesPendientes.length){
    contenidosHtml = '<div class="hint">' + te('No hay más temas disponibles: ya fueron asignados a otro día, o el PCA no tiene temas para esta semana.', isIngles) + '</div>';
  } else {
    contenidosHtml = ''
      + (opcionesEstaSemana.length ? '<div class="hint" style="font-weight:700; margin-bottom:4px;">' + te('Temas de esta semana', isIngles) + '</div>' + grupoHtml(opcionesEstaSemana) : '')
      + (opcionesPendientes.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('Pendientes de la semana anterior', isIngles) + '</div>' + grupoHtml(opcionesPendientes) : '');
  }

  var fechaLarga = dia.fecha ? fmtDateLargo(dia.fecha, isIngles) : te('Elige una fecha', isIngles);
  return ''
  + '<div class="semanal-day" data-day="' + dia.id + '">'
  + '  <div class="day-head"><strong>' + te('Día', isIngles) + ' ' + (i+1) + ' — ' + escapeHtml(fechaLarga) + '</strong>'
  + '    <input type="date" class="cell-input no-print" style="display:inline-block; width:auto; margin-left:10px;" data-df="fecha" value="' + escapeHtml(dia.fecha||'') + '" />'
  + (total>1 ? '<button class="btn btn-danger btn-sm no-print" data-removeday="' + dia.id + '">' + te('Eliminar día', isIngles) + '</button>' : '')
  + '  </div>'
  + '  ' + nivelesLogroDiaHtml(dia, nivelLogroItems, nivelLogroMotivo, isIngles)
  + '  <div class="field" style="margin-top:12px;"><label class="semanal-section-title">' + te('Contenidos Esenciales', isIngles) + '</label>' + contenidosHtml + '</div>'
  + '  <div class="grid-3" style="margin-top:12px; align-items:start;">'
  + '    <div class="field"><label>' + te('Actividades de Aprendizaje', isIngles) + '</label>' + richEditorHtml('actividades', dia.id, dia.actividades||'', te('Escribe las actividades de aprendizaje…', isIngles)) + '</div>'
  + '    <div class="field"><label>' + te('Recursos', isIngles) + '</label>' + richEditorHtml('recursos', dia.id, dia.recursos||'', te('Escribe los recursos…', isIngles)) + '</div>'
  + '    <div class="field"><label>' + te('Evaluación', isIngles) + '</label>' + richEditorHtml('evaluacion', dia.id, dia.evaluacion||'', te('Escribe la evaluación…', isIngles)) + '</div>'
  + '  </div>'
  + '</div>';
}

function renderSemanalForm(d){
  var s = state.editingSemanal || blankSemanal(d);
  state.editingSemanal = s;
  var isAdminViewer = isStaffRole(d.role);
  var isIngles = semanalEsIngles(s);

  var niveles = misNiveles(d.id); if(!niveles.length) niveles = NIVELES;
  var especialidades = misEspecialidadesPara(d.id, s.nivel); if(!especialidades.length) especialidades = especialidadesFor(s.nivel);
  var cursos = misCursosPara(d.id, s.nivel, s.especialidad); if(!cursos.length) cursos = cursosFor(s.nivel, s.especialidad);
  var asignaturas = misAsignaturasPara(d.id, s.nivel, s.especialidad, s.curso); if(!asignaturas.length) asignaturas = asignaturasFor(s.nivel, s.especialidad);

  var semanasDelPca = s.pcaId ? semanasDePca(s.pcaId) : [];
  var semanaActual = s.semanaRowId ? semanasDelPca.find(function(r){ return r.id===s.semanaRowId; }) : null;
  // Diagnóstico: por qué no hay semana vinculada (para que el docente sepa exactamente qué falta,
  // en vez de un solo mensaje genérico de "ingresa una fecha").
  var motivoSinSemana = s.pcaId
    ? (!semanasDelPca.length
        ? te('El Plan Curricular Anual (PCA) vinculado todavía no tiene semanas registradas en Contenidos.', isIngles)
        : (!semanaActual ? te('La fecha ingresada no coincide con el rango Fecha Inicio/Fin de ninguna semana del PCA. Revisa esas fechas en el PCA, o corrige la fecha aquí.', isIngles) : null))
    : te('No se encontró un Plan Curricular Anual (PCA) para este nivel, curso y asignatura. Créalo primero en "Planes Curriculares (PCA)".', isIngles);

  // La semana vinculada (semanaRowId) se conserva a propósito aunque la fecha actual ya no
  // encaje exactamente en su rango (para no perder el enlace por un simple desajuste — ver
  // applyFechaSelection), pero para Nivel de Logro sí debe quedar claro cuando eso pasa: si la
  // fecha del plan ya no coincide con el rango Fecha Inicio/Fin de esa semana del PCA, se
  // muestra "no hay" en vez de dejar los niveles de una semana distinta.
  var semanaCoincide = !!(semanaActual && semanaActual.fechaInicio && semanaActual.fechaFin
    && s.fechaInicio >= semanaActual.fechaInicio && s.fechaInicio <= semanaActual.fechaFin);

  // Los 3 niveles de logro ahora vienen de 3 campos separados del PCA (uno por nivel, ya no hay
  // que detectar palabras clave): cada ítem (viñeta) del PCA se ofrece como opción individual
  // seleccionable en cada día — ver nivelesLogroDiaHtml. Igual que con Contenidos Esenciales, los
  // ítems de la semana del PCA inmediatamente anterior que nunca se marcaron se ofrecen también
  // como "Pendientes de la semana anterior", para que no se pierdan de vista.
  var nivelLogroItems = semanaCoincide
    ? {
        basico: {estaSemana: parseLinesList(semanaActual.destreza), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'basico')},
        intermedio: {estaSemana: parseLinesList(semanaActual.nivelLogroIntermedio), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'intermedio')},
        avanzado: {estaSemana: parseLinesList(semanaActual.nivelLogroAvanzado), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'avanzado')}
      }
    : {basico:{estaSemana:[],pendientes:[]}, intermedio:{estaSemana:[],pendientes:[]}, avanzado:{estaSemana:[],pendientes:[]}};
  var nivelLogroMotivo = motivoSinSemana
    ? motivoSinSemana
    : (!semanaCoincide ? te('No hay una semana del PCA cuya fecha coincida con la fecha puesta en este plan semanal.', isIngles) : null);

  var bloqueOpts = bloquesFor(s.nivel, s.asignatura);
  var bloqueSeleccion = (s.bloqueCurricular||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var bloqueHtml = bloqueOpts
    ? '<div class="checkbox-grid" id="sfBloqueBox">' + bloqueOpts.map(function(b){
        return '<label class="checkbox-pill"><input type="checkbox" class="bloque-cb" value="' + escapeHtml(b) + '" ' + (bloqueSeleccion.indexOf(b)!==-1?'checked':'') + ' />' + escapeHtml(b) + '</label>';
      }).join('') + '</div>'
    : '<input class="cell-input" id="sfBloque" value="' + escapeHtml(s.bloqueCurricular||'') + '" />';

  var temasSemana = semanaActual ? parseLinesList(semanaActual.temas) : [];
  var temasPendientes = semanaActual ? temasPendientesAnteriores(s.pcaId, semanaActual.id) : [];
  // Igual que con los temas de Contenidos Esenciales: un ítem de Nivel de Logro ya marcado en OTRO
  // día de esta misma semana desaparece de la lista de los demás días (pero se conserva en el día
  // donde sí está marcado), para que no quede seleccionable dos veces la misma semana.
  function nivelLogroParaDia(dia){
    var resultado = {};
    ['basico','intermedio','avanzado'].forEach(function(tier){
      var campo = NIVEL_LOGRO_DIA_FIELD[tier];
      var usadosEnOtrosDias = {};
      (s.dias||[]).forEach(function(d2){
        if(d2.id===dia.id) return;
        (d2[campo]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ usadosEnOtrosDias[t]=1; });
      });
      var base = nivelLogroItems[tier] || {estaSemana:[], pendientes:[]};
      resultado[tier] = {
        estaSemana: base.estaSemana.filter(function(t){ return !usadosEnOtrosDias[t]; }),
        pendientes: base.pendientes.filter(function(t){ return !usadosEnOtrosDias[t]; })
      };
    });
    return resultado;
  }
  var diasHtml = (s.dias||[]).map(function(dia, i){
    var usadosEnOtrosDias = {};
    (s.dias||[]).forEach(function(d2){
      if(d2.id===dia.id) return;
      (d2.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ usadosEnOtrosDias[t]=1; });
    });
    var estaSemanaDisponibles = temasSemana.filter(function(t){ return !usadosEnOtrosDias[t]; });
    var pendientesDisponibles = temasPendientes.filter(function(t){ return !usadosEnOtrosDias[t]; });
    return semanalDayHtml(dia, i, (s.dias||[]).length, estaSemanaDisponibles, pendientesDisponibles, motivoSinSemana, nivelLogroParaDia(dia), nivelLogroMotivo, isIngles);
  }).join('');

  return ''
  + semanalToolbarHtml(s)
  + '<div class="pca-doc" id="semanalDoc">'
  + '  <div class="pca-band band-top"><div class="inst">UNIDAD EDUCATIVA PARTICULAR “SIMÓN BOLÍVAR”</div><div>Año lectivo 2026-2027</div></div>'
  + '  <div class="pca-band band-title">' + te('Plan Semanal de Clase', isIngles) + (s.numero ? te(' — N.º ', isIngles) + s.numero : '') + '</div>'
  + '  <div style="text-align:center; padding:10px 20px; background:var(--surface-2); border-bottom:1px solid var(--line-strong);">'
  + '    <div class="hint" style="margin-bottom:4px;">' + te('Fecha y hora límite de entrega', isIngles) + (isAdminViewer ? '' : te(' (definida por el administrador)', isIngles)) + '</div>'
  + (isAdminViewer
      ? '    <input class="cell-input no-print" type="datetime-local" id="sfFechaHoraLimite" style="max-width:260px; margin:0 auto; text-align:center;" value="' + escapeHtml(s.fechaHoraLimite||'') + '" />'
        + '<div class="only-print" style="display:none; font-weight:700;">' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</div>'
      : '    <strong>' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</strong>')
  + '  </div>'
  + '  <div class="pca-band band-section">' + te('Datos Informativos', isIngles) + '</div>'
  + '  <div class="pca-section">'
  + '    <div class="hint" style="margin-bottom:10px;">' + te('Nivel, especialidad, curso y asignatura se enlistan según tu Carga Horaria. La semana se enlaza a tu Plan Curricular Anual (PCA).', isIngles) + '</div>'
  + '    <div class="grid-4">'
  + '      <div class="field"><label>' + te('Nivel Educativo', isIngles) + '</label><select class="cell-select" id="sfNivel">' + optionsHtml(niveles, s.nivel, te('Elija un elemento…', isIngles)) + '</select></div>'
  + '      <div class="field"><label>' + te('Especialidad', isIngles) + '</label><select class="cell-select" id="sfEspecialidad" ' + (especialidades.length?'':'disabled') + '>' + optionsHtml(especialidades, s.especialidad, especialidades.length?te('Elija un elemento…', isIngles):te('No aplica', isIngles)) + '</select></div>'
  + '      <div class="field"><label>' + te('Curso / Grado', isIngles) + '</label><select class="cell-select" id="sfCurso">' + optionsHtml(cursos, s.curso, te('Elija un elemento…', isIngles)) + '</select></div>'
  + '      <div class="field"><label>' + te('Asignatura', isIngles) + '</label><select class="cell-select" id="sfAsignatura">' + optionsHtml(asignaturas, s.asignatura, te('Elija un elemento…', isIngles)) + '</select></div>'
  + '    </div>'

function bindSemanalFormEvents(){
  var s = state.editingSemanal;
  var isAdmin = isStaffRole(currentDocente().role);
  var locked = !!s.locked && !isAdmin;

  document.getElementById('btnBackToSemanalList').onclick = function(){ go(state.semanalReturnTo || 'semanallist'); };
  var saveBtn = document.getElementById('btnSaveSemanal');
  if(saveBtn) saveBtn.onclick = function(){
    saveSemanal(s);
    go(state.semanalReturnTo || 'semanallist');
  };
  document.getElementById('btnExportSemanalWordNow').onclick = function(){ if(!locked) saveSemanal(s, true); exportSemanalWord(s.id); };
  document.getElementById('btnExportSemanalExcelNow').onclick = function(){ if(!locked) saveSemanal(s, true); exportSemanalExcel(s.id); };
  document.getElementById('btnExportSemanalPdfNow').onclick = printAsPdf;
  var lockToggle = document.getElementById('sfLockToggle');
  if(lockToggle){
    lockToggle.addEventListener('change', function(){
      s.locked = lockToggle.checked;
      var all = load(LS.SEMANAL);
      var found = all.find(function(x){ return x.id===s.id; });
      if(found){ found.locked = s.locked; save(LS.SEMANAL, all); }
      toast(s.locked ? 'Plan bloqueado para el docente.' : 'Plan desbloqueado: el docente ya puede editarlo de nuevo.', 'success');
    });
  }

  if(locked){
    document.querySelectorAll('#semanalDoc input, #semanalDoc select, #semanalDoc textarea, #semanalDoc button').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('#semanalDoc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable','false'); });
    return;
  }
  bindAutoguardadoDelegado('semanalDoc', 'semanal');

  document.getElementById('sfNivel').addEventListener('change', function(e){ s.nivel=e.target.value; s.especialidad=''; s.curso=''; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfEspecialidad').addEventListener('change', function(e){ s.especialidad=e.target.value; s.curso=''; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfCurso').addEventListener('change', function(e){ s.curso=e.target.value; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfAsignatura').addEventListener('change', function(e){ s.asignatura=e.target.value; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfFechaInicio').addEventListener('change', function(e){
    s.fechaInicio = e.target.value;
    if(s.dias && s.dias[0]) s.dias[0].fecha = s.fechaInicio;
    applyFechaSelection(s);
    renderSemanalFormAgain();
  });
  document.getElementById('sfFechaFin').addEventListener('change', function(e){ s.fechaFin = e.target.value; renderSemanalFormAgain(); });
  var limiteInput = document.getElementById('sfFechaHoraLimite');
  if(limiteInput) limiteInput.addEventListener('change', function(e){ s.fechaHoraLimite = e.target.value; renderSemanalFormAgain(); });
  document.getElementById('sfUnidad').addEventListener('input', function(e){ s.unidadDidactica = e.target.value; });
  var bloqueInput = document.getElementById('sfBloque');
  if(bloqueInput) bloqueInput.addEventListener('input', function(e){ s.bloqueCurricular = e.target.value; });
  document.querySelectorAll('.bloque-cb').forEach(function(cb){
    cb.addEventListener('change', function(){
      var seleccion = Array.from(document.querySelectorAll('.bloque-cb:checked')).map(function(x){ return x.value; });
      s.bloqueCurricular = seleccion.join('; ');
    });
  });
  document.getElementById('sfRevisado').addEventListener('input', function(e){ s.revisadoPor = e.target.value; });
  document.getElementById('sfAprobado').addEventListener('input', function(e){ s.aprobadoPor = e.target.value; });

  document.querySelectorAll('#diasWrap .semanal-day').forEach(function(box){
    var diaId = box.getAttribute('data-day');
    var dia = s.dias.find(function(x){ return x.id===diaId; });
    box.querySelectorAll('[data-df]').forEach(function(el){
      el.addEventListener('change', function(){ dia[el.getAttribute('data-df')] = el.value; renderSemanalFormAgain(); });
    });
    box.querySelectorAll('.contenidos-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var seleccion = Array.from(box.querySelectorAll('.contenidos-cb:checked')).map(function(x){ return x.value; });
        dia.contenidos = seleccion.join('; ');
        renderSemanalFormAgain();
      });
    });
    ['basico','intermedio','avanzado'].forEach(function(tier){
      var field = NIVEL_LOGRO_DIA_FIELD[tier];
      box.querySelectorAll('.nivellogro-dia-cb[data-tier="'+tier+'"]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var seleccion = Array.from(box.querySelectorAll('.nivellogro-dia-cb[data-tier="'+tier+'"]:checked')).map(function(x){ return x.value; });
          dia[field] = seleccion.join('; ');
          renderSemanalFormAgain();
        });
      });
    });
    box.querySelectorAll('.rte-editable').forEach(function(el){
      var key = el.getAttribute('data-rte-field');
      el.addEventListener('input', function(){ dia[key] = el.innerHTML; });
    });
  });
  bindRteToolbars(document.getElementById('diasWrap'));

  document.getElementById('btnAddDia').onclick = function(){ s.dias.push(blankDia()); renderSemanalFormAgain(); };
  document.querySelectorAll('[data-removeday]').forEach(function(btn){
    btn.onclick = function(){
      if(s.dias.length<=1){ toast('Debe existir al menos un día de clase.', 'error'); return; }
      confirmDialog('¿Eliminar este día de clase?', function(){
        var diaId = btn.getAttribute('data-removeday');
        var idx = s.dias.findIndex(function(x){ return x.id===diaId; });
        var diaEliminado = s.dias[idx];
        s.dias = s.dias.filter(function(x){ return x.id!==diaId; });
        renderSemanalFormAgain();
        toastConDeshacer('Día eliminado.', function(){
          if(!s.dias.some(function(x){ return x.id===diaEliminado.id; })){
            s.dias.splice(idx, 0, diaEliminado);
            renderSemanalFormAgain();
          }
          toast('Día restaurado.', 'success');
        });
      });
    };
  });
}
function renderSemanalFormAgain(){
  document.querySelector('main.content').innerHTML = renderSemanalForm(currentDocente());
  bindSemanalFormEvents();
}

function saveSemanal(s, silent){
  var d = currentDocente();
  var existingHeader = load(LS.SEMANAL).find(function(x){ return x.id===s.id; });
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  s.updatedAt = nowISO();
  var record = {
    id: s.id, docenteId: ownerId, numero: s.numero || (existingHeader && existingHeader.numero) || siguienteNumeroSemanal(ownerId),
    nivel: s.nivel, especialidad: s.especialidad||'', curso: s.curso, asignatura: s.asignatura,
    pcaId: s.pcaId||'', semanaRowId: s.semanaRowId||'', fechaInicio: s.fechaInicio||'', fechaFin: s.fechaFin||'', fechaHoraLimite: s.fechaHoraLimite||'',
    unidadDidactica: s.unidadDidactica||'', bloqueCurricular: s.bloqueCurricular||'',
    dias: (s.dias||[]).map(function(dia){
      return {
        id: dia.id, fecha: dia.fecha||'', contenidos: dia.contenidos||'',
        nivelLogroBasico: dia.nivelLogroBasico||'', nivelLogroIntermedio: dia.nivelLogroIntermedio||'', nivelLogroAvanzado: dia.nivelLogroAvanzado||'',
        actividades: sanitizeRte(dia.actividades||''), recursos: sanitizeRte(dia.recursos||''), evaluacion: sanitizeRte(dia.evaluacion||'')
      };
    }),
    revisadoPor: s.revisadoPor||'', aprobadoPor: s.aprobadoPor||'',
    locked: !!s.locked,
    createdAt: s.createdAt, updatedAt: s.updatedAt
  };
  var all = load(LS.SEMANAL).filter(function(x){ return x.id!==s.id; });
  all.push(record);
  save(LS.SEMANAL, all);
  state.editingSemanal = Object.assign({}, record, { dias: record.dias.map(function(x){ return Object.assign({}, x); }) });
  if(!silent) toast('Plan semanal guardado correctamente.', 'success');
}

/* ============================= ZIP (STORE) + DOCX BUILDER ============================= */
/* Hand-rolled, dependency-free ZIP writer (no compression) so we can produce a real,
   directly-openable .docx (Word) file entirely client-side — no external libraries allowed. */
var CRC_TABLE = (function(){
  var table = [];
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder();
  var localParts = [], centralParts = [], offset = 0;
  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.data;
    var crc = crc32(data);

    var lh = new Uint8Array(30 + nameBytes.length);
    var ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true);
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x21, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, data.length, true);
    ldv.setUint32(22, data.length, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    localParts.push(lh, data);

    var ch = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    centralParts.push(ch);

    offset += lh.length + data.length;
  });

  var centralSize = centralParts.reduce(function(s,p){ return s+p.length; }, 0);
  var centralOffset = offset;
  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  var allParts = localParts.concat(centralParts, [eocd]);
  var total = allParts.reduce(function(s,p){ return s+p.length; }, 0);
  var out = new Uint8Array(total);
  var pos = 0;
  allParts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}

/* Minimal WordprocessingML (OOXML) builders */
function docxEsc(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function docxRunsInline(text, rprXml){
  var lines = String(text===undefined||text===null ? '' : text).split('\n');
  var inner = lines.map(function(line, i){
    return (i>0 ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + docxEsc(line) + '</w:t>';
  }).join('');
  return '<w:r>' + (rprXml||'') + inner + '</w:r>';
}
function docxPara(text, opts){
  opts = opts || {};
  var pPr = '';
  if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
  if(opts.shd) pPr += '<w:shd w:val="clear" w:fill="' + opts.shd + '"/>';
  pPr += '<w:spacing w:before="' + (opts.before!=null?opts.before:40) + '" w:after="' + (opts.after!=null?opts.after:40) + '"/>';
  var pprXml = '<w:pPr>' + pPr + '</w:pPr>';
  var rpr = '';
  if(opts.bold) rpr += '<w:b/>';
  if(opts.color) rpr += '<w:color w:val="' + opts.color + '"/>';
  if(opts.size) rpr += '<w:sz w:val="' + (opts.size*2) + '"/><w:szCs w:val="' + (opts.size*2) + '"/>';
  var rprXml = rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '';
  return '<w:p>' + pprXml + docxRunsInline(text, rprXml) + '</w:p>';
}
function docxCell(text, opts){
  opts = opts || {};
  var tcPr = '<w:tcPr><w:tcW w:w="' + (opts.pct!=null?opts.pct:1000) + '" w:type="pct"/>';
  if(opts.fill) tcPr += '<w:shd w:val="clear" w:fill="' + opts.fill + '"/>';
  tcPr += '<w:vAlign w:val="center"/></w:tcPr>';
  return '<w:tc>' + tcPr + docxPara(text, {bold:opts.bold, color:opts.color, align:opts.align, before:20, after:20}) + '</w:tc>';
}
function docxRow(cells){ return '<w:tr>' + cells.join('') + '</w:tr>'; }
function docxTable(rows, colPcts){
  /* Word necesita <w:tblGrid> con el ancho de cada columna (en twips) para respetar las
     proporciones de w:tcW pct; sin esto, algunas versiones de Word ignoran los anchos por celda y
     el texto largo (p.ej. Nivel de Logro, Temas y subtemas) se ve apretado en columnas angostas.
     Se calcula a partir de los pct de la primera fila (out of 5000 = 100%) sobre un ancho de
     página horizontal A4 tipo, ~10800 twips de contenido. */
  var pageWidthTwips = 10800;
  var gridColsXml = '';
  if(colPcts && colPcts.length){
    gridColsXml = colPcts.map(function(pct){ return '<w:gridCol w:w="' + Math.round(pct/5000*pageWidthTwips) + '"/>'; }).join('');
  }
  return '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>'
    + '<w:top w:val="single" w:sz="4" w:color="C3CEE3"/><w:left w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '<w:bottom w:val="single" w:sz="4" w:color="C3CEE3"/><w:right w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '<w:insideH w:val="single" w:sz="4" w:color="C3CEE3"/><w:insideV w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>' + gridColsXml + '</w:tblGrid>'
    + rows.join('') + '</w:tbl>';
}

function buildPcaDocxXml(p, cont){
  var asig = (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || '';
  var curso = (p.curso==='Otro…' ? p.cursoManual : p.curso) || '';
  var body = '';
  body += docxPara('UNIDAD EDUCATIVA PARTICULAR "SIMÓN BOLÍVAR"   ·   Año lectivo 2026-2027', {bold:true, color:'FFFFFF', size:13, shd:'0A2A5E'});
  body += docxPara('PLAN CURRICULAR ANUAL', {bold:true, color:'FFFFFF', size:16, shd:'123E8C', align:'center'});
  body += docxPara('DATOS INFORMATIVOS', {bold:true, color:'3A2A00', size:11, shd:'F2B705'});
  body += docxTable([
    docxRow([docxCell('Nivel Educativo: ' + (p.nivel||'—'), {pct:2500}), docxCell('Especialidad: ' + (p.especialidad||'No aplica'), {pct:2500})]),

    docxRow([docxCell('Carga horaria semanal: ' + (p.cargaSemanal||'—'), {pct:2500}), docxCell('N.º semanas — 1er: ' + p.semanasT1 + ' · 2do: ' + p.semanasT2 + ' · 3er: ' + p.semanasT3, {pct:2500})])
  ], [2500,2500]);
  body += docxPara('TEMPORALIZACIÓN', {bold:true, color:'3A2A00', size:11, shd:'F2B705'});
  var tmColPcts = [1150,1550,1150,1150];
  var tmRows = [docxRow([
    docxCell('Unidad didáctica', {bold:true, fill:'E7EEFB', pct:tmColPcts[0]}),
    docxCell('Nombre de la Unidad', {bold:true, fill:'E7EEFB', pct:tmColPcts[1]}),
    docxCell('Trimestre', {bold:true, fill:'E7EEFB', pct:tmColPcts[2]}),

  ])];
  (p.temporalizacion||[]).forEach(function(t){

    ]));
  });
  body += docxTable(tmRows, tmColPcts);

  body += docxPara('CONTENIDOS', {bold:true, color:'3A2A00', size:11, shd:'F2B705'});
  (p.unidadesNombres||[]).forEach(function(nombre){
    body += docxPara(nombre, {bold:true, color:'FFFFFF', size:11, shd:'1848A0'});
    var filas = cont.filter(function(c){ return c.unidad===nombre; });
    var contColPcts = [400,900,1250,1200,400,850];
    var rows = [docxRow([
      docxCell('Semana', {bold:true, fill:'E7EEFB', pct:contColPcts[0]}),
      docxCell('Fecha', {bold:true, fill:'E7EEFB', pct:contColPcts[1]}),
      docxCell('Nivel de Logro', {bold:true, fill:'E7EEFB', pct:contColPcts[2]}),
      docxCell('Temas y subtemas', {bold:true, fill:'E7EEFB', pct:contColPcts[3]}),
      docxCell('Página', {bold:true, fill:'E7EEFB', pct:contColPcts[4]}),
      docxCell('Observación', {bold:true, fill:'E7EEFB', pct:contColPcts[5]})
    ])];
    filas.forEach(function(f){
      rows.push(docxRow([
        docxCell(String(f.semana!=null?f.semana:''), {pct:contColPcts[0], align:'center'}),
        docxCell(fmtDate(f.fechaInicio) + ' al ' + fmtDate(f.fechaFin), {pct:contColPcts[1]}),

      ]));
