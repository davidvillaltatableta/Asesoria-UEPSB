function renderSemanalForm(d){
  var s = state.editingSemanal || blankSemanal(d);
  state.editingSemanal = s;
  var isAdminViewer = d.role === 'admin';

  var niveles = misNiveles(d.id); if(!niveles.length) niveles = NIVELES;
  var especialidades = misEspecialidadesPara(d.id, s.nivel); if(!especialidades.length) especialidades = especialidadesFor(s.nivel);
  var cursos = misCursosPara(d.id, s.nivel, s.especialidad); if(!cursos.length) cursos = cursosFor(s.nivel, s.especialidad);
  var asignaturas = misAsignaturasPara(d.id, s.nivel, s.especialidad, s.curso); if(!asignaturas.length) asignaturas = asignaturasFor(s.nivel, s.especialidad);

  var semanasDelPca = s.pcaId ? semanasDePca(s.pcaId) : [];
  var semanaActual = s.semanaRowId ? semanasDelPca.find(function(r){ return r.id===s.semanaRowId; }) : null;
  // Diagnóstico: por qué no hay semana vinculada (para que el docente sepa exactamente qué falta,
  // en vez de un solo mensaje genérico de "ingresa una fecha").
  var motivoSinSemana = s.pcaId
    ? (!semanasDelPca.length
        ? 'El Plan Curricular Anual (PCA) vinculado todavía no tiene semanas registradas en Contenidos.'
        : (!semanaActual ? 'La fecha ingresada no coincide con el rango Fecha Inicio/Fin de ninguna semana del PCA. Revisa esas fechas en el PCA, o corrige la fecha aquí.' : null))
    : 'No se encontró un Plan Curricular Anual (PCA) para este nivel, curso y asignatura. Créalo primero en "Planes Curriculares (PCA)".';

  // La semana vinculada (semanaRowId) se conserva a propósito aunque la fecha actual ya no
  // encaje exactamente en su rango (para no perder el enlace por un simple desajuste — ver
  // applyFechaSelection), pero para Nivel de Logro sí debe quedar claro cuando eso pasa: si la
  // fecha del plan ya no coincide con el rango Fecha Inicio/Fin de esa semana del PCA, se
  // muestra "no hay" en vez de dejar los niveles de una semana distinta.
  var semanaCoincide = !!(semanaActual && semanaActual.fechaInicio && semanaActual.fechaFin
    && s.fechaInicio >= semanaActual.fechaInicio && s.fechaInicio <= semanaActual.fechaFin);

  var nivelLogroTiers = semanaCoincide ? parseNivelesLogroTiers(semanaActual.destreza) : {basico:'', intermedio:'', avanzado:''};
  var nivelLogroSeleccion = (s.nivelLogro||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var NIVEL_LOGRO_LABELS = {basico:'Nivel Básico', intermedio:'Nivel Intermedio', avanzado:'Nivel Avanzado'};
  var nivelLogroHtml;
  if(motivoSinSemana){
    nivelLogroHtml = '<div class="hint">' + escapeHtml(motivoSinSemana) + '</div>';
  } else if(!semanaCoincide){
    nivelLogroHtml = '<div class="hint">No hay una semana del PCA cuya fecha coincida con la fecha puesta en este plan semanal.</div>';
  } else if(!nivelLogroTiers.basico && !nivelLogroTiers.intermedio && !nivelLogroTiers.avanzado){
    nivelLogroHtml = '<div class="hint">El PCA no distingue niveles (básico/intermedio/avanzado) para esta semana.</div>';
  } else {
    nivelLogroHtml = ['basico','intermedio','avanzado'].map(function(grupo){
      if(!nivelLogroTiers[grupo]) return '';
      var value = NIVEL_LOGRO_LABELS[grupo] + ': ' + nivelLogroTiers[grupo];
      return '<label class="checkbox-pill" style="display:flex; align-items:flex-start; height:auto; white-space:normal; padding:8px 10px;"><input type="checkbox" class="nivel-logro-cb" style="margin-top:3px;" value="' + escapeHtml(value) + '" ' + (nivelLogroSeleccion.indexOf(value)!==-1?'checked':'') + ' /><span><strong>' + NIVEL_LOGRO_LABELS[grupo] + '</strong><br/>' + escapeHtml(nivelLogroTiers[grupo]) + '</span></label>';
    }).join('');
    nivelLogroHtml = '<div class="checkbox-grid" style="flex-direction:column; align-items:stretch;">' + nivelLogroHtml + '</div>';
  }

  var bloqueOpts = bloquesFor(s.nivel, s.asignatura);
  var bloqueSeleccion = (s.bloqueCurricular||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var bloqueHtml = bloqueOpts
    ? '<div class="checkbox-grid" id="sfBloqueBox">' + bloqueOpts.map(function(b){
        return '<label class="checkbox-pill"><input type="checkbox" class="bloque-cb" value="' + escapeHtml(b) + '" ' + (bloqueSeleccion.indexOf(b)!==-1?'checked':'') + ' />' + escapeHtml(b) + '</label>';
      }).join('') + '</div>'
    : '<input class="cell-input" id="sfBloque" value="' + escapeHtml(s.bloqueCurricular||'') + '" />';

  var temasSemana = semanaActual ? parseLinesList(semanaActual.temas) : [];
  var temasPendientes = semanaActual ? temasPendientesAnteriores(s.pcaId, semanaActual.id) : [];
  var diasHtml = (s.dias||[]).map(function(dia, i){
    var usadosEnOtrosDias = {};
    (s.dias||[]).forEach(function(d2){
      if(d2.id===dia.id) return;
      (d2.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ usadosEnOtrosDias[t]=1; });
    });
    var estaSemanaDisponibles = temasSemana.filter(function(t){ return !usadosEnOtrosDias[t]; });
    var pendientesDisponibles = temasPendientes.filter(function(t){ return !usadosEnOtrosDias[t]; });
    return semanalDayHtml(dia, i, (s.dias||[]).length, estaSemanaDisponibles, pendientesDisponibles, motivoSinSemana);
  }).join('');

  return ''
  + semanalToolbarHtml(s)
  + '<div class="pca-doc" id="semanalDoc">'
  + '  <div class="pca-band band-top"><div class="inst">UNIDAD EDUCATIVA PARTICULAR “SIMÓN BOLÍVAR”</div><div>Año lectivo 2026-2027</div></div>'
  + '  <div class="pca-band band-title">Plan Semanal de Clase' + (s.numero ? ' — N.º ' + s.numero : '') + '</div>'
  + '  <div style="text-align:center; padding:10px 20px; background:var(--surface-2); border-bottom:1px solid var(--line-strong);">'
  + '    <div class="hint" style="margin-bottom:4px;">Fecha y hora límite de entrega' + (isAdminViewer ? '' : ' (definida por el administrador)') + '</div>'
  + (isAdminViewer
      ? '    <input class="cell-input no-print" type="datetime-local" id="sfFechaHoraLimite" style="max-width:260px; margin:0 auto; text-align:center;" value="' + escapeHtml(s.fechaHoraLimite||'') + '" />'
        + '<div class="only-print" style="display:none; font-weight:700;">' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</div>'
      : '    <strong>' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</strong>')
  + '  </div>'
  + '  <div class="pca-band band-section">Datos Informativos</div>'
  + '  <div class="pca-section">'
  + '    <div class="hint" style="margin-bottom:10px;">Nivel, especialidad, curso y asignatura se enlistan según tu Carga Horaria. La semana se enlaza a tu Plan Curricular Anual (PCA).</div>'
  + '    <div class="grid-4">'
  + '      <div class="field"><label>Nivel Educativo</label><select class="cell-select" id="sfNivel">' + optionsHtml(niveles, s.nivel, 'Elija un elemento…') + '</select></div>'
  + '      <div class="field"><label>Especialidad</label><select class="cell-select" id="sfEspecialidad" ' + (especialidades.length?'':'disabled') + '>' + optionsHtml(especialidades, s.especialidad, especialidades.length?'Elija un elemento…':'No aplica') + '</select></div>'
  + '      <div class="field"><label>Curso / Grado</label><select class="cell-select" id="sfCurso">' + optionsHtml(cursos, s.curso, 'Elija un elemento…') + '</select></div>'

  + '    </div>'
  + '    <div class="grid-2" style="margin-top:14px;">'
  + '      <div class="field"><label>Docente</label><input class="cell-input" value="' + escapeHtml(nombreFormal(d)) + '" readonly /></div>'
  + '      <div class="field"><label>Fecha</label><div style="display:flex; align-items:center; gap:6px;"><input class="cell-input" type="date" id="sfFechaInicio" value="' + escapeHtml(s.fechaInicio||'') + '" /><span class="hint">al</span><input class="cell-input" type="date" id="sfFechaFin" value="' + escapeHtml(s.fechaFin||'') + '" /></div></div>'

function bindSemanalFormEvents(){
  var s = state.editingSemanal;
  var isAdmin = currentDocente().role === 'admin';
  var locked = !!s.locked && !isAdmin;

  document.getElementById('btnBackToSemanalList').onclick = function(){ go(state.semanalReturnTo || 'semanallist'); };
  var saveBtn = document.getElementById('btnSaveSemanal');
  if(saveBtn) saveBtn.onclick = function(){
    saveSemanal(s);
    go(state.semanalReturnTo || 'semanallist');
  };
  document.getElementById('btnExportSemanalWordNow').onclick = function(){ if(!locked) saveSemanal(s, true); exportSemanalWord(s.id); };
  document.getElementById('btnExportSemanalExcelNow').onclick = function(){ if(!locked) saveSemanal(s, true); exportSemanalExcel(s.id); };
  document.getElementById('btnExportSemanalPdfNow').onclick = printAsPdf;
  var lockToggle = document.getElementById('sfLockToggle');
  if(lockToggle){
    lockToggle.addEventListener('change', function(){
      s.locked = lockToggle.checked;
      var all = load(LS.SEMANAL);
      var found = all.find(function(x){ return x.id===s.id; });
      if(found){ found.locked = s.locked; save(LS.SEMANAL, all); }
      toast(s.locked ? 'Plan bloqueado para el docente.' : 'Plan desbloqueado: el docente ya puede editarlo de nuevo.', 'success');
    });
  }

  if(locked){
    document.querySelectorAll('#semanalDoc input, #semanalDoc select, #semanalDoc textarea, #semanalDoc button').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('#semanalDoc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable','false'); });
    return;
  }

  document.getElementById('sfNivel').addEventListener('change', function(e){ s.nivel=e.target.value; s.especialidad=''; s.curso=''; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfEspecialidad').addEventListener('change', function(e){ s.especialidad=e.target.value; s.curso=''; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfCurso').addEventListener('change', function(e){ s.curso=e.target.value; s.asignatura=''; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfAsignatura').addEventListener('change', function(e){ s.asignatura=e.target.value; recomputeSemanalPca(s); renderSemanalFormAgain(); });
  document.getElementById('sfFechaInicio').addEventListener('change', function(e){
    s.fechaInicio = e.target.value;
    if(s.dias && s.dias[0]) s.dias[0].fecha = s.fechaInicio;
    applyFechaSelection(s);
    renderSemanalFormAgain();
  });
  document.getElementById('sfFechaFin').addEventListener('change', function(e){ s.fechaFin = e.target.value; renderSemanalFormAgain(); });
  var limiteInput = document.getElementById('sfFechaHoraLimite');
  if(limiteInput) limiteInput.addEventListener('change', function(e){ s.fechaHoraLimite = e.target.value; renderSemanalFormAgain(); });
  document.getElementById('sfUnidad').addEventListener('input', function(e){ s.unidadDidactica = e.target.value; });
  var bloqueInput = document.getElementById('sfBloque');
  if(bloqueInput) bloqueInput.addEventListener('input', function(e){ s.bloqueCurricular = e.target.value; });
  document.querySelectorAll('.bloque-cb').forEach(function(cb){
    cb.addEventListener('change', function(){
      var seleccion = Array.from(document.querySelectorAll('.bloque-cb:checked')).map(function(x){ return x.value; });
      s.bloqueCurricular = seleccion.join('; ');
    });
  });
  document.querySelectorAll('.nivel-logro-cb').forEach(function(cb){
    cb.addEventListener('change', function(){
      var seleccion = Array.from(document.querySelectorAll('.nivel-logro-cb:checked')).map(function(x){ return x.value; });
      s.nivelLogro = seleccion.join('; ');
    });
  });
  document.getElementById('sfRevisado').addEventListener('input', function(e){ s.revisadoPor = e.target.value; });
  document.getElementById('sfAprobado').addEventListener('input', function(e){ s.aprobadoPor = e.target.value; });

  document.querySelectorAll('#diasWrap .semanal-day').forEach(function(box){
    var diaId = box.getAttribute('data-day');
    var dia = s.dias.find(function(x){ return x.id===diaId; });
    box.querySelectorAll('[data-df]').forEach(function(el){
      el.addEventListener('change', function(){ dia[el.getAttribute('data-df')] = el.value; renderSemanalFormAgain(); });
    });
    box.querySelectorAll('.contenidos-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var seleccion = Array.from(box.querySelectorAll('.contenidos-cb:checked')).map(function(x){ return x.value; });
        dia.contenidos = seleccion.join('; ');
        renderSemanalFormAgain();
      });
    });
    box.querySelectorAll('.rte-editable').forEach(function(el){
      var key = el.getAttribute('data-rte-field');
      el.addEventListener('input', function(){ dia[key] = el.innerHTML; });
    });
  });
  bindRteToolbars(document.getElementById('diasWrap'));

  document.getElementById('btnAddDia').onclick = function(){ s.dias.push(blankDia()); renderSemanalFormAgain(); };
  document.querySelectorAll('[data-removeday]').forEach(function(btn){
    btn.onclick = function(){
      if(s.dias.length<=1){ toast('Debe existir al menos un día de clase.', 'error'); return; }
      confirmDialog('¿Eliminar este día de clase?', function(){
        s.dias = s.dias.filter(function(x){ return x.id!==btn.getAttribute('data-removeday'); });
        renderSemanalFormAgain();
      });
    };
  });
}
function renderSemanalFormAgain(){
  document.querySelector('main.content').innerHTML = renderSemanalForm(currentDocente());
  bindSemanalFormEvents();
}

function saveSemanal(s, silent){
  var d = currentDocente();
  var existingHeader = load(LS.SEMANAL).find(function(x){ return x.id===s.id; });
  var isNew = !existingHeader;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  if(isNew) s.locked = true;
  s.updatedAt = nowISO();
  var record = {
    id: s.id, docenteId: ownerId, numero: s.numero || (existingHeader && existingHeader.numero) || siguienteNumeroSemanal(ownerId),
    nivel: s.nivel, especialidad: s.especialidad||'', curso: s.curso, asignatura: s.asignatura,
    pcaId: s.pcaId||'', semanaRowId: s.semanaRowId||'', fechaInicio: s.fechaInicio||'', fechaFin: s.fechaFin||'', fechaHoraLimite: s.fechaHoraLimite||'',
    unidadDidactica: s.unidadDidactica||'', bloqueCurricular: s.bloqueCurricular||'', nivelLogro: s.nivelLogro||'',
    dias: (s.dias||[]).map(function(dia){
      return {
        id: dia.id, fecha: dia.fecha||'', contenidos: dia.contenidos||'',
        actividades: sanitizeRte(dia.actividades||''), recursos: sanitizeRte(dia.recursos||''), evaluacion: sanitizeRte(dia.evaluacion||'')
      };
    }),
    revisadoPor: s.revisadoPor||'', aprobadoPor: s.aprobadoPor||'',
    locked: !!s.locked,
    createdAt: s.createdAt, updatedAt: s.updatedAt
  };
  var all = load(LS.SEMANAL).filter(function(x){ return x.id!==s.id; });
  all.push(record);
  save(LS.SEMANAL, all);
  state.editingSemanal = Object.assign({}, record, { dias: record.dias.map(function(x){ return Object.assign({}, x); }) });
  if(!silent){
    if(isNew && d.role !== 'admin') toast('Plan semanal guardado. A partir de ahora queda bloqueado: para corregirlo, contacta a un administrador.', 'success');
    else toast('Plan semanal guardado correctamente.', 'success');
  }
}

/* ============================= ZIP (STORE) + DOCX BUILDER ============================= */
/* Hand-rolled, dependency-free ZIP writer (no compression) so we can produce a real,
   directly-openable .docx (Word) file entirely client-side — no external libraries allowed. */
var CRC_TABLE = (function(){
  var table = [];
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder();
  var localParts = [], centralParts = [], offset = 0;
  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.data;
    var crc = crc32(data);

    var lh = new Uint8Array(30 + nameBytes.length);
    var ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true);
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x21, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, data.length, true);
    ldv.setUint32(22, data.length, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    localParts.push(lh, data);

    var ch = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    centralParts.push(ch);

    offset += lh.length + data.length;
  });

  var centralSize = centralParts.reduce(function(s,p){ return s+p.length; }, 0);
  var centralOffset = offset;
  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  var allParts = localParts.concat(centralParts, [eocd]);
  var total = allParts.reduce(function(s,p){ return s+p.length; }, 0);
  var out = new Uint8Array(total);
  var pos = 0;
  allParts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}

/* Minimal WordprocessingML (OOXML) builders */
function docxEsc(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function docxRunsInline(text, rprXml){
  var lines = String(text===undefined||text===null ? '' : text).split('\n');
  var inner = lines.map(function(line, i){
    return (i>0 ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + docxEsc(line) + '</w:t>';
  }).join('');
  return '<w:r>' + (rprXml||'') + inner + '</w:r>';
}
function docxPara(text, opts){
  opts = opts || {};
  var pPr = '';
  if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
  if(opts.shd) pPr += '<w:shd w:val="clear" w:fill="' + opts.shd + '"/>';

/* Converts our sanitized rich-text HTML (bold/underline/lists/links) into OOXML paragraphs,
   so Actividades/Recursos/Evaluación keep their formatting in the exported .docx. */
function docxRunFormatted(text, fmt){
  fmt = fmt || {};
  var rpr = '';
  if(fmt.bold) rpr += '<w:b/>';
  if(fmt.underline || fmt.link) rpr += '<w:u w:val="single"/>';
  if(fmt.link) rpr += '<w:color w:val="1848A0"/>';
  var rprXml = rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '';
  return docxRunsInline(text, rprXml);
}
function docxParaFromRuns(runsXml, opts){
  opts = opts || {};
  var pPr = '<w:spacing w:before="' + (opts.before!=null?opts.before:20) + '" w:after="' + (opts.after!=null?opts.after:20) + '"/>';
  if(opts.indent) pPr += '<w:ind w:left="' + opts.indent + '"/>';
  return '<w:p><w:pPr>' + pPr + '</w:pPr>' + (runsXml || docxRunFormatted('',{})) + '</w:p>';
}
function richTextToDocxParas(html){
  if(!html || !html.trim()) return [docxParaFromRuns(docxRunFormatted('—',{}))];
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var out = [];
  function inlineRuns(node, fmt){
    var runs = '';
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ if(ch.textContent) runs += docxRunFormatted(ch.textContent, fmt); return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      var f2 = Object.assign({}, fmt);
      if(tag==='B'||tag==='STRONG') f2.bold = true;
      if(tag==='U') f2.underline = true;
      if(tag==='A'){ f2.link = true; runs += docxRunFormatted((ch.textContent||'') + ' (' + (ch.getAttribute('href')||'') + ')', f2); return; }
      if(tag==='BR'){ runs += '<w:br/>'; return; }
      runs += inlineRuns(ch, f2);
    });
    return runs;
  }
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){
        if(ch.textContent && ch.textContent.trim()) out.push(docxParaFromRuns(docxRunFormatted(ch.textContent,{})));
        return;
      }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag==='UL' || tag==='OL'){
        Array.from(ch.children).filter(function(c){ return c.tagName==='LI'; }).forEach(function(li, idx){
          var prefix = tag==='OL' ? (idx+1) + '. ' : '• ';
          out.push(docxParaFromRuns(docxRunFormatted(prefix,{}) + inlineRuns(li,{}), {indent:360}));
        });
      } else if(tag==='LI'){
        out.push(docxParaFromRuns(docxRunFormatted('• ',{}) + inlineRuns(ch,{}), {indent:360}));
      } else if(tag==='DIV' || tag==='P'){
        var runs = inlineRuns(ch, {});
        out.push(docxParaFromRuns(runs));
      } else if(tag==='BR'){
        /* skip standalone */
      } else {
        var runs2 = inlineRuns(ch, {});
        if(runs2) out.push(docxParaFromRuns(runs2));
      }
    });
  }
  walk(doc.body.firstChild);
  if(out.length===0) out.push(docxParaFromRuns(docxRunFormatted('—',{})));
  return out;
}

/* Fuera del visor de Claude Artifacts (por ejemplo, cuando este archivo se aloja o se abre
   directamente en un navegador normal) window.claude no existe, así que la descarga se hace con
   el mecanismo estándar del navegador en vez de window.claude.downloads.save(). */
function browserDownloadFallback(filename, data){
  var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* Tries a list of {ext, data} attempts in priority order (best format first).
   Moves to the next attempt only when the viewer rejects the extension itself
   (extension_not_enabled / rejected_extension) — any other failure stops immediately. */
async function saveAttempts(baseName, attempts){
  if(!window.claude || !window.claude.downloads){
    var first = attempts[0];
    browserDownloadFallback(baseName + '.' + first.ext, first.data);
    toast('Archivo .' + first.ext + ' descargado.', 'success');
    return;
  }
  for(var i=0; i<attempts.length; i++){
    var a = attempts[i];
    try{
      await window.claude.downloads.save({filename: baseName + '.' + a.ext, data: a.data});
      toast(i===0
        ? 'Archivo .' + a.ext + ' descargado.'
        : 'Tu vista no admite .' + attempts[0].ext + ' — se descargó como .' + a.ext + ' en su lugar.', 'success');
      return;
    }catch(err){
      var isExtIssue = err && (err.code==='extension_not_enabled' || err.code==='rejected_extension');
      var isLast = i === attempts.length-1;
      if(err && err.code === 'declined') return;
      if(!isExtIssue || isLast){
        if(err) toast('No se pudo descargar el archivo: ' + (err.message||err.code), 'error');
        return;
      }
      // else: extension rejected and more attempts remain — try the next format
    }
  }
}

function exportPcaWord(pcaId){
  var ctx = buildPcaContext(pcaId); if(!ctx) return;
  var p=ctx.p, cont=ctx.cont;

  var docxBlob = buildDocxBlob(p, cont);
  var html = buildPcaWordHtml(p, cont);

  saveAttempts('PCA_' + pcaDisplayName(p), [
    {ext:'docx', data:docxBlob},
    {ext:'html', data:html},
    {ext:'md', data:md}

}

  var lines = [];

  });
  var csv = '﻿' + lines.join('\r\n');

  var tsvLines = lines.map(function(l){
    // simple re-split respecting our own comma quoting is overkill; rebuild from cont directly for txt fallback
    return l;
  });

function buildSemanalDocxBlob(s, d){

    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '</Types>';

    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    + '</Relationships>';

async function doSaveAdminDocente(){
  var target = state.editingAdminDocente;
  var errEl = document.getElementById('adminDocenteError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var original = allDocentes().find(function(x){ return x.id === target.id; }) || target;
  var titulo = target.titulo.trim();
  var nombres = target.nombres.trim();
  var apellidos = target.apellidos.trim();
  var ci = target.ci.trim();
  var telefono = (target.telefono||'').trim();
  var usuarioId = target.usuarioId.trim();
  var role = target.role;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  var all = allDocentes();
  if(all.some(function(x){ return x.id!==target.id && x.usuarioId.toLowerCase()===usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  if(original.role==='admin' && role!=='admin'){
    var otherAdmins = all.filter(function(x){ return x.role==='admin' && x.id!==target.id; });
    if(otherAdmins.length===0) return fail('No puedes quitar el rol de administrador: es el único administrador del sistema.');
  }

async function doCreateAdminDocente(){
  var errEl = document.getElementById('adminNewDocenteError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('anTitulo').value.trim();
  var nombres = document.getElementById('anNombres').value.trim();
  var apellidos = document.getElementById('anApellidos').value.trim();
  var ci = document.getElementById('anCI').value.trim();
  var telefono = document.getElementById('anTelefono').value.trim();
  var email = document.getElementById('anEmail').value.trim();
  var usuarioId = document.getElementById('anUserId').value.trim();
  var role = document.getElementById('anRol').value;
  var pw = document.getElementById('anPw').value;

  if(!nombres || !apellidos || !ci || !email || !usuarioId || !pw) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Ingresa un correo institucional válido.');
  if(pw.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');
  var docentes = allDocentes();
  if(docentes.some(function(x){ return x.usuarioId.toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');

  var cred;
  try{
    /* Se crea en la app secundaria de Firebase para no cerrar la sesión del admin actual. */
    cred = await window.FB.createUserWithEmailAndPassword(window.FB.secondaryAuth, email, pw);
  }catch(err){ return fail(mapAuthError(err)); }
  var docente = {
    id: cred.user.uid,
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono,
    email: email, usuarioId: usuarioId,
    role: role,
    createdAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DOCENTES, docente.id), docente);
  }catch(err){
    await window.FB.signOut(window.FB.secondaryAuth);
    return fail('La cuenta se creó pero no se pudo guardar su perfil (' + mapAuthError(err) + '). Contacta soporte para revisar reglas de Firestore.');
  }
  await window.FB.signOut(window.FB.secondaryAuth);
  toast('Usuario creado correctamente.', 'success');
  state.subview = 'admin'; state.adminTab = 'docentes';
  render();
}
function bindAdminNewDocenteEvents(){
  document.getElementById('btnBackToAdminDocentesNew').onclick = function(){ state.subview='admin'; state.adminTab='docentes'; render(); };
  document.getElementById('btnCreateAdminDocente').onclick = doCreateAdminDocente;
}

function bindAdminCargaEvents(){
  var body = document.getElementById('adminCargaBody');
  if(!body) return;
  var docentesById = {}; allDocentes().forEach(function(x){ docentesById[x.id] = x; });
  function findRow(id){ return adminCargaEditRows.find(function(r){ return r.id===id; }); }

  body.querySelectorAll('tr').forEach(function(tr){
    var id = tr.getAttribute('data-row');
    tr.querySelectorAll('[data-f]').forEach(function(el){
      el.addEventListener('change', function(){
        var row = findRow(id);
        row[el.getAttribute('data-f')] = el.value;
        if(el.getAttribute('data-f') === 'nivel'){ row.especialidad=''; row.curso=''; row.asignatura=''; row.cursoManual=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'especialidad'){ row.asignatura=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'curso' || el.getAttribute('data-f') === 'asignatura'){ renderAdminCargaBodyOnly(docentesById); }
      });
      el.addEventListener('input', function(){
        if(el.tagName === 'INPUT'){ findRow(id)[el.getAttribute('data-f')] = el.value; }
      });
    });
  });
  document.querySelectorAll('[data-admin-remove-carga]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-admin-remove-carga');
      adminCargaEditRows = adminCargaEditRows.filter(function(r){ return r.id!==id; });
      renderAdminCargaBodyOnly(docentesById);
    };
  });
  var saveBtn = document.getElementById('btnSaveAdminCarga');
  if(saveBtn) saveBtn.onclick = function(){
    var toSave = adminCargaEditRows.map(function(r){
      return {
        id: r.id, docenteId: r.docenteId,
        nivel: r.nivel, especialidad: r.especialidad || '',
        curso: r.curso === 'Otro…' ? (r.cursoManual||'') : r.curso,
        asignatura: r.asignatura === 'Otra…' ? (r.asignaturaManual||'') : r.asignatura,
        updatedAt: nowISO()
      };
    }).filter(function(r){ return r.nivel && r.curso && r.asignatura; });
    save(LS.CARGA, toSave);
    adminCargaEditRows = null;
    toast('Carga horaria actualizada (' + toSave.length + ' filas).', 'success');
    render();
  };
}
function renderAdminCargaBodyOnly(docentesById){
  document.getElementById('adminCargaBody').innerHTML = adminCargaEditRows.map(function(r,i){ return adminCargaRowHtml(r,i,docentesById); }).join('');
  bindAdminCargaEvents();
}

/* Toma los Planes Semanales del docente cuya fecha (fechaInicio) cae dentro del rango de corte
   [fechaInicioParte, fechaFinParte] que el admin elige. La puntualidad se calcula comparando la
   fecha y hora en que se CREÓ cada plan contra la Fecha y hora límite que ese MISMO plan tiene
   guardada (campo editable solo por el admin, visible en la parte de arriba del documento) — ya
   no se pide una fecha límite aparte en este formulario. Tareas/Talleres/Lecciones se detectan
   revisando el texto del campo Evaluación de cada día del plan. */
function filasPresentacionDocente(docenteId, fechaInicioParte, fechaFinParte){
  return load(LS.SEMANAL).filter(function(s){
    return s.docenteId===docenteId && s.fechaInicio && s.fechaInicio>=fechaInicioParte && s.fechaInicio<=fechaFinParte;
  }).map(function(s){
    var estado;
    if(!s.fechaHoraLimite) estado = 'sin_limite';
    else {
      var limiteISO = new Date(s.fechaHoraLimite).toISOString();
      estado = (s.createdAt && s.createdAt <= limiteISO) ? 'a_tiempo' : 'con_retraso';
    }
    var evalTexto = (s.dias||[]).map(function(dia){ return richTextToPlain(dia.evaluacion||''); }).join(' ').toLowerCase();
    return {
      numero:s.numero, fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, asignatura:s.asignatura, curso:s.curso,
      createdAt:s.createdAt, fechaHoraLimite:s.fechaHoraLimite, estado:estado,
      tareas: evalTexto.indexOf('tarea')!==-1,
      talleres: evalTexto.indexOf('taller')!==-1,
      lecciones: evalTexto.indexOf('lecci')!==-1
    };
  });
}

/* La fecha límite VIGENTE de una categoría es la más recientemente registrada — esa es la que
   se usa para autorellenar el campo Fecha Límite de un PCA o Plan Semanal nuevo. */
function fechaLimiteVigente(categoria){
  var entradas = load(LS.FECHAS_LIMITE).filter(function(x){ return x.categoria===categoria; });
  if(!entradas.length) return '';
  entradas.sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); });
  return entradas[entradas.length-1].fechaHoraLimite || '';
}
function fechaLimiteRowHtml(x){
  if(state.editingFechaLimiteId === x.id){
    return '<tr>'
      + '<td><input class="cell-input" type="datetime-local" id="fl-edit-fecha-' + x.id + '" value="' + escapeHtml(x.fechaHoraLimite||'') + '" /></td>'
      + '<td><input class="cell-input" id="fl-edit-nota-' + x.id + '" value="' + escapeHtml(x.nota||'') + '" placeholder="p.ej. Trimestre 1" /></td>'
      + '<td>' + fmtDateTime(x.createdAt) + '</td>'
      + '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" data-save-fechalimite="' + x.id + '">Guardar</button> <button class="btn btn-ghost btn-sm" data-cancel-fechalimite="' + x.id + '">Cancelar</button></td>'
      + '</tr>';
  }
  return '<tr>'
    + '<td>' + fmtDateTimeLocal(x.fechaHoraLimite) + '</td>'
    + '<td>' + escapeHtml(x.nota||'—') + '</td>'
    + '<td>' + fmtDateTime(x.createdAt) + '</td>'
    + '<td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" data-edit-fechalimite="' + x.id + '">Editar</button> <button class="btn btn-danger btn-sm" data-delete-fechalimite="' + x.id + '">Eliminar</button></td>'
    + '</tr>';
}
function categoriaFechaLimiteCardHtml(categoria, titulo, agruparPorMes){
  var entradas = load(LS.FECHAS_LIMITE).filter(function(x){ return x.categoria===categoria; });
  var vigente = fechaLimiteVigente(categoria);
  var theadHtml = '<thead><tr><th>Fecha y hora límite</th><th>Nota</th><th>Registrada el</th><th></th></tr></thead>';

  var tableHtml = '';
  if(!entradas.length){
    tableHtml = '';
  } else if(agruparPorMes){
    var porMes = {}; var ordenMeses = [];
    entradas.forEach(function(x){
      var info = trimestreYMesDe((x.fechaHoraLimite||'').slice(0,10));
      var key = info ? info.mesKey : 'zzz-sin-fecha';
      var label = info ? info.mesLabel : 'Sin fecha';
      var ordenKey = info ? info.mesOrdenKey : 'zzz-sin-fecha';
      if(!porMes[key]){ porMes[key] = {label:label, ordenKey:ordenKey, items:[]}; ordenMeses.push(key); }
      porMes[key].items.push(x);
    });
    ordenMeses.sort(function(a,b){ return porMes[a].ordenKey.localeCompare(porMes[b].ordenKey); });
    tableHtml = ordenMeses.map(function(mk){
      var g = porMes[mk];
      var rows = g.items.slice().sort(function(a,b){ return (a.fechaHoraLimite||'').localeCompare(b.fechaHoraLimite||''); }).map(fechaLimiteRowHtml).join('');
      return '<div style="margin-top:18px;"><h3 style="font-size:16px; font-weight:700; color:var(--blue-900); margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid var(--line-strong);">' + escapeHtml(g.label) + '</h3><div class="table-wrap"><table>' + theadHtml + '<tbody>' + rows + '</tbody></table></div></div>';
    }).join('');
  } else {
    var rows = entradas.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).map(fechaLimiteRowHtml).join('');
    tableHtml = '<div class="table-wrap" style="margin-top:14px;"><table>' + theadHtml + '<tbody>' + rows + '</tbody></table></div>';
  }

  return ''
    + '<div class="card">'
    + '  <h2>' + escapeHtml(titulo) + '</h2>'
    + '  <div class="card-sub">' + (vigente ? 'Fecha vigente actual (se usa para autorellenar los nuevos ' + escapeHtml(titulo) + '): <strong>' + escapeHtml(fmtDateTimeLocal(vigente)) + '</strong>' : 'Todavía no hay ninguna fecha límite registrada para esta categoría.') + '</div>'
    + '  <div class="grid-3" style="align-items:end;">'
    + '    <div class="field"><label>Fecha y hora límite</label><input class="cell-input" type="datetime-local" id="fl-fecha-' + categoria + '" /></div>'
    + '    <div class="field"><label>Nota (opcional)</label><input class="cell-input" id="fl-nota-' + categoria + '" placeholder="p.ej. Trimestre 1" /></div>'
    + '    <button class="btn btn-primary" data-add-fechalimite="' + categoria + '" style="height:41px;">+ Agregar</button>'
    + '  </div>'
    + tableHtml
    + '</div>';
}
function renderAdminFechasLimite(){
  return ''
    + '<p class="hint" style="margin-bottom:14px;">La fecha más reciente de cada categoría se usa para autorellenar el campo Fecha Límite de los PCA y Planes Semanales nuevos. El docente no puede editar ese campo, solo verlo.</p>'
    + categoriaFechaLimiteCardHtml('pca', 'PCA', false)

function bindAdminFechasLimiteEvents(){
  document.querySelectorAll('[data-add-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var categoria = btn.getAttribute('data-add-fechalimite');
      var fechaInput = document.getElementById('fl-fecha-' + categoria);
      var notaInput = document.getElementById('fl-nota-' + categoria);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .concat() en vez de .push() sobre load(): load() devuelve la MISMA referencia que
         FS_CACHE, así que empujar directo a ese arreglo hacía que save() comparara el caché
         contra sí mismo (ya con la fila nueva adentro) y creyera que "nada cambió" — la fila
         se veía en pantalla pero nunca se escribía a Firestore. */
      var entradas = load(LS.FECHAS_LIMITE).concat([{id: uid('fl'), categoria: categoria, fechaHoraLimite: fecha, nota: (notaInput.value||'').trim(), createdAt: nowISO()}]);
      save(LS.FECHAS_LIMITE, entradas);
      toast('Fecha límite agregada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-edit-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = btn.getAttribute('data-edit-fechalimite');
      render();
    };
  });
  document.querySelectorAll('[data-cancel-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = null;
      render();
    };
  });
  document.querySelectorAll('[data-save-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-save-fechalimite');
      var fechaInput = document.getElementById('fl-edit-fecha-' + id);
      var notaInput = document.getElementById('fl-edit-nota-' + id);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .map() para construir un objeto y un arreglo nuevos, por la misma razón que en
         "+ Agregar": mutar la entrada y el arreglo que devuelve load() en el sitio hacía que
         save() los comparara contra sí mismos y nunca detectara el cambio. */
      var entradas = load(LS.FECHAS_LIMITE).map(function(x){
        return x.id===id ? Object.assign({}, x, {fechaHoraLimite: fecha, nota: (notaInput.value||'').trim()}) : x;
      });
      save(LS.FECHAS_LIMITE, entradas);
      state.editingFechaLimiteId = null;
      toast('Fecha límite actualizada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-delete-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      confirmDialog('¿Eliminar esta fecha límite?', function(){
        save(LS.FECHAS_LIMITE, load(LS.FECHAS_LIMITE).filter(function(x){ return x.id!==btn.getAttribute('data-delete-fechalimite'); }));
        toast('Fecha límite eliminada.', 'success');
        render();
      });
    };
  });
}

function bindDatabaseEvents(){
  document.getElementById('btnExportAll').onclick = async function(){
    var payload = {
      exportedAt: nowISO(),
      DOCENTES: load(LS.DOCENTES),
      CARGA_HORARIA: load(LS.CARGA),
      PCA: load(LS.PCA),
      CONTENIDOS_ANUALES: load(LS.CONT),
      PLAN_SEMANAL: load(LS.SEMANAL)
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = 'respaldo_seb_' + todayISO() + '.json';
    if(!window.claude || !window.claude.downloads){
      browserDownloadFallback(filename, json);
      toast('Respaldo descargado.', 'success');
      return;
    }
    try{
      await window.claude.downloads.save({filename: filename, data: json});
      toast('Respaldo descargado.', 'success');
    }catch(err){ if(err && err.code!=='declined') toast('No se pudo exportar: ' + (err.message||err.code), 'error'); }
  };
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var res = mergeBy(LS.DOCENTES, data.DOCENTES || []);
        var res2 = mergeBy(LS.CARGA, data.CARGA_HORARIA || []);
        var res3 = mergeBy(LS.PCA, data.PCA || []);
        var res4 = mergeBy(LS.CONT, data.CONTENIDOS_ANUALES || []);
        var res5 = mergeBy(LS.SEMANAL, data.PLAN_SEMANAL || []);
        document.getElementById('importResult').textContent = 'Fusionado: ' + (res+res2+res3+res4+res5) + ' registros procesados.';
        toast('Base de datos fusionada correctamente.', 'success');
        render();
      }catch(err){ toast('El archivo no es un respaldo válido.', 'error'); }
    };
    reader.readAsText(file);
  });
}
function mergeBy(key, incoming){
  var current = load(key);
  var map = {};
  current.forEach(function(r){ map[r.id] = r; });
  incoming.forEach(function(r){ if(r && r.id) map[r.id] = r; });
  save(key, Object.values(map));
  return incoming.length;
}

/* ============================= FIREBASE BOOTSTRAP ============================= */
/* Mantiene FS_CACHE sincronizada en tiempo real con Firestore mientras haya sesión activa:
   onSnapshot entrega el estado inicial y cada cambio posterior (propio o de otro docente/admin),
   así que un simple render() en cada callback basta para reflejar los cambios al instante en
   todas las pestañas/dispositivos abiertos. */
var FS_UNSUBS = [];
function detachRealtimeListeners(){
  FS_UNSUBS.forEach(function(u){ try{ u(); }catch(e){} });
  FS_UNSUBS = [];
}
/* Observación de Clases se lee completa solo si eres admin; un docente solo puede LEER sus
   propias observaciones (nunca escribirlas — eso lo exigen también las reglas de Firestore).
   Firestore exige que una consulta de colección completa esté acotada con un where() que calce
   exactamente con la regla de seguridad basada en resource.data, así que hace falta saber el rol
   ANTES de armar la consulta — por eso esta única lectura puntual (no en tiempo real) de la
   colección "docentes" (de lectura pública) se hace primero y se espera antes de suscribirse. */
async function attachRealtimeListeners(){
  detachRealtimeListeners();
  var soyAdmin = false;
  try{
    var docentesSnap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
    docentesSnap.forEach(function(d){ if(d.id === CURRENT_UID && d.data().role === 'admin') soyAdmin = true; });
  }catch(e){ console.error('No se pudo determinar el rol antes de sincronizar', e); }

  Object.keys(FS_COLLECTION).forEach(function(key){
    var colRef = window.FB.collection(window.FB.db, FS_COLLECTION[key]);
    var queryRef = (key === 'OBSERVACIONES' && !soyAdmin)
      ? window.FB.query(colRef, window.FB.where('docenteId', '==', CURRENT_UID))
      : colRef;
    var unsub = window.FB.onSnapshot(queryRef, function(snap){
      var arr = [];
      snap.forEach(function(docSnap){ arr.push(docSnap.data()); });
      FS_CACHE[key] = arr;
      render();
    }, function(err){
      console.error('Error de sincronización en tiempo real (' + key + ')', err);
      toast('Se perdió la sincronización en tiempo real: ' + (err.message||err.code), 'error');
    });
    FS_UNSUBS.push(unsub);
  });
}

window.addEventListener('firebase-ready', function(){
  window.FB.onAuthStateChanged(window.FB.auth, function(user){
    if(user){
      CURRENT_UID = user.uid;
      attachRealtimeListeners();
    } else {
      CURRENT_UID = null;
      detachRealtimeListeners();
      Object.keys(FS_CACHE).forEach(function(k){ FS_CACHE[k] = []; });
      state.subview = 'dashboard';
    }
    FB_READY = true;
    render();
  });
});

/* ============================= INIT ============================= */
render();
})();
</script>
