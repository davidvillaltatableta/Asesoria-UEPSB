/* Campo (día) donde se guarda la selección de cada nivel de logro, y etiqueta visible de cada
   columna — usados tanto para armar el HTML como para leer/guardar la selección del docente. */
var NIVEL_LOGRO_DIA_FIELD = {basico:'nivelLogroBasico', intermedio:'nivelLogroIntermedio', avanzado:'nivelLogroAvanzado'};
var NIVEL_LOGRO_DIA_LABEL = {basico:'Básico', intermedio:'Intermedio', avanzado:'Avanzado'};
function nivelesLogroDiaHtml(dia, nivelLogroItems, nivelLogroMotivo, isIngles){
  var tituloCategoria = te('Niveles de Logro', isIngles);
  function grupoHtml(tier, items, seleccion){
    return '<div class="checkbox-grid" style="flex-direction:column; align-items:stretch;">' + items.map(function(it){
      return '<label class="checkbox-pill nivel-logro-pill"><input type="checkbox" class="nivellogro-dia-cb" data-tier="' + tier + '" value="' + escapeHtml(it) + '" ' + (seleccion.indexOf(it)!==-1?'checked':'') + ' /><span>' + escapeHtml(it) + '</span></label>';
    }).join('') + '</div>';
  }
  var columnas = ['basico','intermedio','avanzado'].map(function(tier){
    var itemsEstaSemana = (nivelLogroItems[tier] && nivelLogroItems[tier].estaSemana) || [];
    var itemsPendientes = (nivelLogroItems[tier] && nivelLogroItems[tier].pendientes) || [];
    var itemsReforzar = (nivelLogroItems[tier] && nivelLogroItems[tier].reforzar) || [];
    var seleccion = (dia[NIVEL_LOGRO_DIA_FIELD[tier]]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
    var etiqueta = te(NIVEL_LOGRO_DIA_LABEL[tier], isIngles);
    var body;
    if(nivelLogroMotivo){
      body = '<div class="hint">' + escapeHtml(nivelLogroMotivo) + '</div>';
    } else if(!itemsEstaSemana.length && !itemsPendientes.length && !itemsReforzar.length){
      body = isIngles
        ? '<div class="hint">The PCA has no ' + etiqueta + ' items for this week.</div>'
        : '<div class="hint">El PCA no tiene ítems de Nivel de Logro ' + etiqueta + ' para esta semana.</div>';
    } else {
      body = ''
        + (itemsEstaSemana.length ? '<div class="hint" style="font-weight:700; margin-bottom:4px;">' + te('De esta semana', isIngles) + '</div>' + grupoHtml(tier, itemsEstaSemana, seleccion) : '')
        + (itemsPendientes.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('Pendientes de la semana anterior', isIngles) + '</div>' + grupoHtml(tier, itemsPendientes, seleccion) : '')
        + (itemsReforzar.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('De la semana anterior (para reforzar)', isIngles) + '</div>' + grupoHtml(tier, itemsReforzar, seleccion) : '');
    }
    return '<div><div class="hint" style="font-weight:700; margin-bottom:4px;">' + etiqueta + '</div>' + body + '</div>';
  }).join('');
  return '<div class="field"><label class="semanal-section-title">' + tituloCategoria + '</label><div class="grid-3" style="margin-top:6px; align-items:start;">' + columnas + '</div></div>';
}
function semanalDayHtml(dia, i, total, temasEstaSemana, temasPendientes, temasReforzar, motivoSinSemana, nivelLogroItems, nivelLogroMotivo, isIngles){
  var seleccionados = (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  // Incluye también los ya seleccionados en este mismo día aunque ya no estén "disponibles"
  // (para que no desaparezcan de su propia lista al marcarlos).
  var opcionesEstaSemana = temasEstaSemana.slice();
  var opcionesPendientes = temasPendientes.slice();
  var opcionesReforzar = (temasReforzar||[]).slice();
  seleccionados.forEach(function(t){
    if(opcionesEstaSemana.indexOf(t)===-1 && opcionesPendientes.indexOf(t)===-1 && opcionesReforzar.indexOf(t)===-1) opcionesEstaSemana.push(t);
  });

  function grupoHtml(opciones){
    return '<div class="checkbox-grid" style="flex-direction:column; align-items:stretch;">' + opciones.map(function(t){
      return '<label class="checkbox-pill nivel-logro-pill"><input type="checkbox" class="contenidos-cb" value="' + escapeHtml(t) + '" ' + (seleccionados.indexOf(t)!==-1?'checked':'') + ' /><span>' + escapeHtml(t) + '</span></label>';
    }).join('') + '</div>';
  }

  var contenidosHtml;
  if(motivoSinSemana){
    contenidosHtml = '<div class="hint">' + escapeHtml(motivoSinSemana) + '</div>';
  } else if(!opcionesEstaSemana.length && !opcionesPendientes.length && !opcionesReforzar.length){
    contenidosHtml = '<div class="hint">' + te('No hay más temas disponibles: ya fueron asignados a otro día, o el PCA no tiene temas para esta semana.', isIngles) + '</div>';
  } else {
    contenidosHtml = ''
      + (opcionesEstaSemana.length ? '<div class="hint" style="font-weight:700; margin-bottom:4px;">' + te('Temas de esta semana', isIngles) + '</div>' + grupoHtml(opcionesEstaSemana) : '')
      + (opcionesPendientes.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('Pendientes de la semana anterior', isIngles) + '</div>' + grupoHtml(opcionesPendientes) : '')
      + (opcionesReforzar.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">' + te('De la semana anterior (para reforzar)', isIngles) + '</div>' + grupoHtml(opcionesReforzar) : '');
  }

  var fechaLarga = dia.fecha ? fmtDateLargo(dia.fecha, isIngles) : te('Elige una fecha', isIngles);
  return ''
  + '<div class="semanal-day" data-day="' + dia.id + '">'
  + '  <div class="day-head"><strong>' + te('Día', isIngles) + ' ' + (i+1) + ' — ' + escapeHtml(fechaLarga) + '</strong>'
  + '    <input type="date" class="cell-input no-print" style="display:inline-block; width:auto; margin-left:10px;" data-df="fecha" value="' + escapeHtml(dia.fecha||'') + '" />'
  + (total>1 ? '<button class="btn btn-danger btn-sm no-print" data-removeday="' + dia.id + '">' + te('Eliminar día', isIngles) + '</button>' : '')
  + '  </div>'
  + '  ' + nivelesLogroDiaHtml(dia, nivelLogroItems, nivelLogroMotivo, isIngles)
  + '  <div class="field" style="margin-top:12px;"><label class="semanal-section-title">' + te('Contenidos Esenciales', isIngles) + '</label>' + contenidosHtml + '</div>'
  + '  <div class="grid-3" style="margin-top:12px; align-items:start;">'
  + '    <div class="field"><label>' + te('Actividades de Aprendizaje', isIngles) + '</label>' + richEditorHtml('actividades', dia.id, dia.actividades||'', te('Escribe las actividades de aprendizaje…', isIngles)) + '</div>'
  + '    <div class="field"><label>' + te('Recursos', isIngles) + '</label>' + richEditorHtml('recursos', dia.id, dia.recursos||'', te('Escribe los recursos…', isIngles)) + '</div>'
  + '    <div class="field"><label>' + te('Evaluación', isIngles) + '</label>' + richEditorHtml('evaluacion', dia.id, dia.evaluacion||'', te('Escribe la evaluación…', isIngles)) + '</div>'
  + '  </div>'
  + '</div>';
}

function renderSemanalForm(d){
  var s = state.editingSemanal || blankSemanal(d);
  state.editingSemanal = s;
  var isAdminViewer = isStaffRole(d.role);
  var isIngles = semanalEsIngles(s);

  /* Igual que en renderPcaForm: las opciones de Nivel/Curso/Asignatura deben salir de la Carga
     Horaria del DUEÑO del plan (s.docenteId), no de quien lo está viendo, o un administrador que
     abre el plan de otro docente ve las listas vacías (su propia Carga, sin registros). */
  var ownerId = s.docenteId || d.id;
  var niveles = misNiveles(ownerId); if(!niveles.length) niveles = NIVELES;
  var especialidades = misEspecialidadesPara(ownerId, s.nivel); if(!especialidades.length) especialidades = especialidadesFor(s.nivel);
  var cursos = misCursosPara(ownerId, s.nivel, s.especialidad); if(!cursos.length) cursos = cursosFor(s.nivel, s.especialidad);
  var asignaturas = misAsignaturasPara(ownerId, s.nivel, s.especialidad, s.curso); if(!asignaturas.length) asignaturas = asignaturasFor(s.nivel, s.especialidad);

  var semanasDelPca = s.pcaId ? semanasDePca(s.pcaId) : [];
  var semanaActual = s.semanaRowId ? semanasDelPca.find(function(r){ return r.id===s.semanaRowId; }) : null;
  // Diagnóstico: por qué no hay semana vinculada (para que el docente sepa exactamente qué falta,
  // en vez de un solo mensaje genérico de "ingresa una fecha").
  var motivoSinSemana = s.pcaId
    ? (!semanasDelPca.length
        ? te('El Plan Curricular Anual (PCA) vinculado todavía no tiene semanas registradas en Contenidos.', isIngles)
        : (!semanaActual ? te('La fecha ingresada no coincide con el rango Fecha Inicio/Fin de ninguna semana del PCA. Revisa esas fechas en el PCA, o corrige la fecha aquí.', isIngles) : null))
    : te('No se encontró un Plan Curricular Anual (PCA) para este nivel, curso y asignatura. Créalo primero en "Planes Curriculares (PCA)".', isIngles);

  // La semana vinculada (semanaRowId) se conserva a propósito aunque la fecha actual ya no
  // encaje exactamente en su rango (para no perder el enlace por un simple desajuste — ver
  // applyFechaSelection), pero para Nivel de Logro sí debe quedar claro cuando eso pasa: si la
  // fecha del plan ya no coincide con el rango Fecha Inicio/Fin de esa semana del PCA, se
  // muestra "no hay" en vez de dejar los niveles de una semana distinta.
  var semanaCoincide = !!(semanaActual && semanaActual.fechaInicio && semanaActual.fechaFin
    && s.fechaInicio >= semanaActual.fechaInicio && s.fechaInicio <= semanaActual.fechaFin);

  // Los 3 niveles de logro ahora vienen de 3 campos separados del PCA (uno por nivel, ya no hay
  // que detectar palabras clave): cada ítem (viñeta) del PCA se ofrece como opción individual
  // seleccionable en cada día — ver nivelesLogroDiaHtml. Igual que con Contenidos Esenciales, los
  // ítems de la semana del PCA inmediatamente anterior que nunca se marcaron se ofrecen también
  // como "Pendientes de la semana anterior", para que no se pierdan de vista.
  // "Replanificar" (botón en la barra de arriba) agrega un 3er bloque con los ítems de la semana
  // anterior del PCA que YA se cubrieron (los que faltan por cubrir ya están en "Pendientes") —
  // para que el docente pueda elegir reforzarlos aunque ya se hayan dado.
  var replanificarActivo = false;
  function reforzarNivelLogro(tier, pendientes){
    if(!replanificarActivo) return [];
    return nivelLogroSemanaAnteriorCompleta(s.pcaId, semanaActual.id, tier).filter(function(t){ return pendientes.indexOf(t)===-1; });
  }
  var nivelLogroItems = semanaCoincide
    ? {
        basico: {estaSemana: parseLinesList(semanaActual.destreza), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'basico')},
        intermedio: {estaSemana: parseLinesList(semanaActual.nivelLogroIntermedio), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'intermedio')},
        avanzado: {estaSemana: parseLinesList(semanaActual.nivelLogroAvanzado), pendientes: nivelLogroPendientesAnteriores(s.pcaId, semanaActual.id, 'avanzado')}
      }
    : {basico:{estaSemana:[],pendientes:[]}, intermedio:{estaSemana:[],pendientes:[]}, avanzado:{estaSemana:[],pendientes:[]}};
  ['basico','intermedio','avanzado'].forEach(function(tier){ nivelLogroItems[tier].reforzar = reforzarNivelLogro(tier, nivelLogroItems[tier].pendientes); });
  var nivelLogroMotivo = motivoSinSemana
    ? motivoSinSemana
    : (!semanaCoincide ? te('No hay una semana del PCA cuya fecha coincida con la fecha puesta en este plan semanal.', isIngles) : null);

  var bloqueOpts = bloquesFor(s.nivel, s.asignatura);
  var bloqueSeleccion = (s.bloqueCurricular||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var bloqueHtml = bloqueOpts
    ? '<div class="checkbox-grid" id="sfBloqueBox">' + bloqueOpts.map(function(b){
        return '<label class="checkbox-pill"><input type="checkbox" class="bloque-cb" value="' + escapeHtml(b) + '" ' + (bloqueSeleccion.indexOf(b)!==-1?'checked':'') + ' />' + escapeHtml(b) + '</label>';
      }).join('') + '</div>'
    : '<input class="cell-input" id="sfBloque" value="' + escapeHtml(s.bloqueCurricular||'') + '" />';

  var temasSemana = semanaActual ? parseLinesList(semanaActual.temas) : [];
  var temasPendientes = semanaActual ? temasPendientesAnteriores(s.pcaId, semanaActual.id) : [];
  var temasReforzar = (replanificarActivo && semanaActual)
    ? temasSemanaAnteriorCompleta(s.pcaId, semanaActual.id).filter(function(t){ return temasPendientes.indexOf(t)===-1; })
    : [];
  // Igual que con los temas de Contenidos Esenciales: un ítem de Nivel de Logro ya marcado en OTRO
  // día de esta misma semana desaparece de la lista de los demás días (pero se conserva en el día
  // donde sí está marcado), para que no quede seleccionable dos veces la misma semana.
  function nivelLogroParaDia(dia){
    var resultado = {};
    ['basico','intermedio','avanzado'].forEach(function(tier){
      var campo = NIVEL_LOGRO_DIA_FIELD[tier];
      var usadosEnOtrosDias = {};
      (s.dias||[]).forEach(function(d2){
        if(d2.id===dia.id) return;
        (d2[campo]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ usadosEnOtrosDias[t]=1; });
      });
      var base = nivelLogroItems[tier] || {estaSemana:[], pendientes:[], reforzar:[]};
      resultado[tier] = {
        estaSemana: base.estaSemana.filter(function(t){ return !usadosEnOtrosDias[t]; }),
        pendientes: base.pendientes.filter(function(t){ return !usadosEnOtrosDias[t]; }),
        reforzar: (base.reforzar||[]).filter(function(t){ return !usadosEnOtrosDias[t]; })
      };
    });
    return resultado;
  }
  var diasHtml = (s.dias||[]).map(function(dia, i){
    var usadosEnOtrosDias = {};
    (s.dias||[]).forEach(function(d2){
      if(d2.id===dia.id) return;
      (d2.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ usadosEnOtrosDias[t]=1; });
    });
    var estaSemanaDisponibles = temasSemana.filter(function(t){ return !usadosEnOtrosDias[t]; });
    var pendientesDisponibles = temasPendientes.filter(function(t){ return !usadosEnOtrosDias[t]; });
    var reforzarDisponibles = temasReforzar.filter(function(t){ return !usadosEnOtrosDias[t]; });
    return semanalDayHtml(dia, i, (s.dias||[]).length, estaSemanaDisponibles, pendientesDisponibles, reforzarDisponibles, motivoSinSemana, nivelLogroParaDia(dia), nivelLogroMotivo, isIngles);
  }).join('');

  return ''
  + semanalToolbarHtml(s)
  + '<div class="pca-doc" id="semanalDoc">'
  + '  <div class="pca-band band-top"><div class="inst">UNIDAD EDUCATIVA PARTICULAR “SIMÓN BOLÍVAR”</div><div>Año lectivo 2026-2027</div></div>'
  + '  <div class="pca-band band-title">' + te('Plan Semanal de Clase', isIngles) + (s.numero ? te(' — N.º ', isIngles) + s.numero : '') + '</div>'
  + '  <div style="text-align:center; padding:10px 20px; background:var(--surface-2); border-bottom:1px solid var(--line-strong);">'
  + '    <div class="hint" style="margin-bottom:4px;">' + te('Fecha y hora límite de entrega', isIngles) + (isAdminViewer ? '' : te(' (definida por el administrador)', isIngles)) + '</div>'
  + (isAdminViewer
      ? '    <input class="cell-input no-print" type="datetime-local" id="sfFechaHoraLimite" style="max-width:260px; margin:0 auto; text-align:center;" value="' + escapeHtml(s.fechaHoraLimite||'') + '" />'
        + '<div class="only-print" style="display:none; font-weight:700;">' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</div>'
      : '    <strong>' + escapeHtml(fmtDateTimeLocal(s.fechaHoraLimite)) + '</strong>')
  + '  </div>'
  + '  <div class="pca-band band-section">' + te('Datos Informativos', isIngles) + '</div>'
  + '  <div class="pca-section">'
  + '    <div class="hint" style="margin-bottom:10px;">' + te('Nivel, especialidad, curso y asignatura se enlistan según tu Carga Horaria. La semana se enlaza a tu Plan Curricular Anual (PCA).', isIngles) + '</div>'
  + '    <div class="grid-4">'

/* "Replanificar" (botón de la lista de Planes Semanales): duplica un plan existente en uno nuevo,
   agregando en el primer día los temas y niveles de logro COMPLETOS de la semana anterior del PCA
   (ver temasSemanaAnteriorCompleta/nivelLogroSemanaAnteriorCompleta) para reforzarlos, sin perder
   los que ya tenía el plan original. Numera el nuevo plan como el original + ".1" (p.ej. "3.1"),
   o ".2"/".3"... si ya existe ese número (por si se replanifica más de una vez). */
function mergeSemicolonLista(actual, nuevos){
  var items = (actual||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var set = {}; items.forEach(function(t){ set[t]=1; });
  (nuevos||[]).forEach(function(t){ if(!set[t]){ items.push(t); set[t]=1; } });
  return items.join(';');
}
function numeroReplanificado(docenteId, base){
  var existentes = load(LS.SEMANAL).filter(function(s){ return s.docenteId===docenteId; }).map(function(s){ return String(s.numero); });
  var i = 1, candidato;
  do{ candidato = base + '.' + i; i++; } while(existentes.indexOf(candidato)!==-1);
  return candidato;
}
function replanificarSemanal(semId){
  var s = load(LS.SEMANAL).find(function(x){ return x.id===semId; });
  if(!s) return;
  var temasReforzar = s.semanaRowId ? temasSemanaAnteriorCompleta(s.pcaId, s.semanaRowId) : [];
  var basicoReforzar = s.semanaRowId ? nivelLogroSemanaAnteriorCompleta(s.pcaId, s.semanaRowId, 'basico') : [];
  var intermedioReforzar = s.semanaRowId ? nivelLogroSemanaAnteriorCompleta(s.pcaId, s.semanaRowId, 'intermedio') : [];
  var avanzadoReforzar = s.semanaRowId ? nivelLogroSemanaAnteriorCompleta(s.pcaId, s.semanaRowId, 'avanzado') : [];
  if(!temasReforzar.length && !basicoReforzar.length && !intermedioReforzar.length && !avanzadoReforzar.length){
    toast('No se encontró una semana anterior en el PCA con temas o niveles de logro para reforzar.', 'error');
    return;
  }
  var dias = (s.dias||[]).map(function(dia, idx){
    var nuevo = {
      id: uid('dia'), fecha: dia.fecha||'', contenidos: dia.contenidos||'',
      nivelLogroBasico: dia.nivelLogroBasico||'', nivelLogroIntermedio: dia.nivelLogroIntermedio||'', nivelLogroAvanzado: dia.nivelLogroAvanzado||'',
      actividades: dia.actividades||'', recursos: dia.recursos||'', evaluacion: dia.evaluacion||''
    };
    if(idx===0){
      nuevo.contenidos = mergeSemicolonLista(nuevo.contenidos, temasReforzar);
      nuevo.nivelLogroBasico = mergeSemicolonLista(nuevo.nivelLogroBasico, basicoReforzar);
      nuevo.nivelLogroIntermedio = mergeSemicolonLista(nuevo.nivelLogroIntermedio, intermedioReforzar);
      nuevo.nivelLogroAvanzado = mergeSemicolonLista(nuevo.nivelLogroAvanzado, avanzadoReforzar);
    }
    return nuevo;
  });
  var nuevoNumero = numeroReplanificado(s.docenteId, s.numero);
  var nuevo = {
    id: uid('sem'), docenteId: s.docenteId, numero: nuevoNumero,
    nivel: s.nivel, especialidad: s.especialidad||'', curso: s.curso, asignatura: s.asignatura,
    pcaId: s.pcaId||'', semanaRowId: s.semanaRowId||'', fechaInicio: s.fechaInicio||'', fechaFin: s.fechaFin||'', fechaHoraLimite: s.fechaHoraLimite||'',
    unidadDidactica: s.unidadDidactica||'', bloqueCurricular: s.bloqueCurricular||'',
    dias: dias,
    revisadoPor: s.revisadoPor||'', aprobadoPor: s.aprobadoPor||'',
    createdAt: nowISO(), updatedAt: nowISO()
  };
  var all = load(LS.SEMANAL).slice();
  all.push(nuevo);
  save(LS.SEMANAL, all);
  toast('Plan replanificado como N.º ' + nuevoNumero + ', con los temas y niveles de logro de la semana anterior agregados en el primer día.', 'success');
  render();
}
function saveSemanal(s, silent){
  var d = currentDocente();
  var existingHeader = load(LS.SEMANAL).find(function(x){ return x.id===s.id; });
  if(existingHeader && !s._forzarGuardado && hayConflictoGuardado('semanal', existingHeader.updatedAt)){
    if(silent){ toast('No se autoguardó: este plan semanal se modificó en otro dispositivo o pestaña. Recarga la página antes de seguir editando.', 'error'); return; }
    avisarConflictoGuardado('semanal', existingHeader.updatedAt, function(){ s._forzarGuardado = true; saveSemanal(s, silent); });
    return;
  }
  delete s._forzarGuardado;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  s.updatedAt = nowISO();
  var record = {
    id: s.id, docenteId: ownerId, numero: s.numero || (existingHeader && existingHeader.numero) || siguienteNumeroSemanal(ownerId),
    nivel: s.nivel, especialidad: s.especialidad||'', curso: s.curso, asignatura: s.asignatura,
    pcaId: s.pcaId||'', semanaRowId: s.semanaRowId||'', fechaInicio: s.fechaInicio||'', fechaFin: s.fechaFin||'', fechaHoraLimite: s.fechaHoraLimite||'',
    unidadDidactica: s.unidadDidactica||'', bloqueCurricular: s.bloqueCurricular||'',
    dias: (s.dias||[]).map(function(dia){
      return {
        id: dia.id, fecha: dia.fecha||'', contenidos: dia.contenidos||'',
        nivelLogroBasico: dia.nivelLogroBasico||'', nivelLogroIntermedio: dia.nivelLogroIntermedio||'', nivelLogroAvanzado: dia.nivelLogroAvanzado||'',
        actividades: sanitizeRte(dia.actividades||''), recursos: sanitizeRte(dia.recursos||''), evaluacion: sanitizeRte(dia.evaluacion||'')
      };
    }),
    revisadoPor: s.revisadoPor||'', aprobadoPor: s.aprobadoPor||'',
    importadoDeDocente: s.importadoDeDocente||'', importadoFecha: s.importadoFecha||'',
    createdAt: s.createdAt, updatedAt: s.updatedAt
  };
  var all = load(LS.SEMANAL).filter(function(x){ return x.id!==s.id; });
  all.push(record);
  save(LS.SEMANAL, all);
  marcarBaseConflicto('semanal', record.updatedAt);
  state.editingSemanal = Object.assign({}, record, { dias: record.dias.map(function(x){ return Object.assign({}, x); }) });
  if(!silent) toast('Plan semanal guardado correctamente.', 'success');
}

/* ============================= TALLER PRÁCTICO =============================
   Formulario alternativo al Plan Semanal, exclusivo para asignaturas técnicas (Computación,
   Robótica, Informática Aplicada, Diseño Gráfico práctico — ver ASIGNATURAS_TALLER_PRACTICO).
   Sigue el formato institucional "Plan de Clase para Proyectos": en vez de días con Contenidos/
   Actividades, se organiza en FASES (Investigación y Planificación / Construcción del producto /
   Sustentación y Presentación del Producto, agregables una a una) y, dentro de cada fase, en
   SEMANAS (también agregables), cada una enlazada a su propia semana del PCA — igual que el Plan
   Semanal — para que Niveles de Logro y Temas de ESA semana en particular se carguen solos, y la
   Observación de "Completo/Incompleto" siga funcionando por semana. Reutiliza
   fechaLimiteVigente('semanal') como fecha límite (no tiene categoría propia en Fechas Límite). */
var TALLER_FASE_NOMBRES_DEFECTO = ['Investigación y Planificación', 'Construcción del producto', 'Sustentación y Presentación del Producto'];
function siguienteNumeroTaller(docenteId){
  var max = load(LS.TALLER).filter(function(t){ return t.docenteId===docenteId; }).reduce(function(m,t){ return Math.max(m, t.numero||0); }, 0);
  return max + 1;
}
function blankTallerSemana(){
  return {
    id: uid('tsem'), fechaInicio:'', fechaFin:'', semanaRowId:'', contenidos:'',
    nivelLogroBasico:'', nivelLogroIntermedio:'', nivelLogroAvanzado:'',
    actividades:'', recursos:'', tecnica:'', instrumento:''
  };
}
function blankTallerFase(t){
  var n = (t.fases||[]).length;
  return { id: uid('fase'), nombre: TALLER_FASE_NOMBRES_DEFECTO[n] || ('Fase ' + (n+1)), semanas: [blankTallerSemana()] };
}
function blankTaller(d){
  var niveles = misNivelesTallerPara(d.id);
  var nivel = niveles[0] || 'Bachillerato';
  var especialidades = misEspecialidadesPara(d.id, nivel).filter(function(e){ return misAsignaturasTallerPara(d.id, nivel, e).length; });
  var especialidad = especialidades[0] || '';
  var asignaturas = misAsignaturasTallerPara(d.id, nivel, especialidad);
  var asignatura = asignaturas[0] || '';
  var cursos = misCursosTallerPara(d.id, nivel, especialidad, asignatura);
  var curso = cursos[0] || '';
  var t = {
    id: uid('tp'), docenteId: d.id, numero: siguienteNumeroTaller(d.id),
    nivel: nivel, especialidad: especialidad, curso: curso, asignatura: asignatura,
    pcaId:'', fechaInicio:'', fechaFin:'', fechaHoraLimite: fechaLimiteVigente('semanal'),
    productoFinal:'', fases:[],
    revisadoPor:'Lic. David Villalta', aprobadoPor:'Lic. José Gómez',
    createdAt: nowISO(), updatedAt: nowISO()
  };
  t.fases = [blankTallerFase(t)];
  return t;
}
/* Igual que findMiPca + applyFechaSelection del Plan Semanal, pero aplicado a UNA semana dentro de
   una fase del Taller Práctico (no hay un único "semanaRowId" a nivel de todo el documento, cada
   semana de cada fase tiene la suya). No toca t.fechaInicio/t.fechaFin: esas son las fechas del
   PROYECTO completo (Datos Informativos), no de una semana del PCA. */
function recomputeTallerPca(t){
  var pca = findMiPca(t.docenteId, t.nivel, t.especialidad, t.curso, t.asignatura);
  t.pcaId = pca ? pca.id : '';
  (t.fases||[]).forEach(function(fase){
    (fase.semanas||[]).forEach(function(sem){ aplicarFechaSemanaTaller(sem, t.pcaId); });
  });
}
function aplicarFechaSemanaTaller(sem, pcaId){
  if(!pcaId){ sem.semanaRowId=''; return; }
  if(!sem.fechaInicio){ sem.semanaRowId=''; return; }
  var semanas = semanasDePca(pcaId);
  var match = semanas.find(function(r){ return r.fechaInicio && r.fechaFin && sem.fechaInicio >= r.fechaInicio && sem.fechaInicio <= r.fechaFin; });
  if(match){ sem.semanaRowId = match.id; sem.fechaFin = sem.fechaFin || match.fechaFin; return; }
  if(!sem.semanaRowId && semanas.length){ sem.semanaRowId = semanas[0].id; }
}
function openTallerForm(id, returnTo){
  state.tallerReturnTo = returnTo || 'tallerlist';
  var d = currentDocente();
  if(id){
    var found = load(LS.TALLER).find(function(t){ return t.id===id; });
    state.editingTaller = Object.assign({}, found, {
      fases: (found.fases||[]).map(function(f){ return Object.assign({}, f, { semanas: (f.semanas||[]).map(function(s){ return Object.assign({}, s); }) }); })
    });
    marcarBaseConflicto('taller', found.updatedAt);
  } else {
    state.editingTaller = blankTaller(d);
    recomputeTallerPca(state.editingTaller);
  }
  go('tallerform');
}
function tallerToolbarHtml(t){

    + '<div class="pca-toolbar no-print">'

}
/* Arma las casillas de Temas y Niveles de Logro de UNA semana concreta (de una fase concreta) a
   partir de su propia semana del PCA vinculada — mismo mecanismo que el Plan Semanal. */
function tallerSemanaContexto(t, sem){
  var semanasDelPca = t.pcaId ? semanasDePca(t.pcaId) : [];
  var semanaActual = sem.semanaRowId ? semanasDelPca.find(function(r){ return r.id===sem.semanaRowId; }) : null;
  var motivo = t.pcaId
    ? (!semanasDelPca.length ? 'El PCA vinculado todavía no tiene semanas registradas en Contenidos.'
       : (!semanaActual ? 'La fecha no coincide con el rango de ninguna semana del PCA.' : null))
    : 'No se encontró un Plan Curricular Anual (PCA) para este nivel, curso y asignatura.';
  return {semanaActual: semanaActual, motivo: motivo};
}
/* Lo que ya está marcado EN VIVO en cualquier semana de este mismo Taller Práctico, aunque
   todavía no se haya guardado (temasVistosDelPca/nivelLogroVistosDelPca solo ven lo que ya está
   persistido en Firestore, así que sin esto un ítem recién marcado en la semana 1 seguía
   apareciendo como "pendiente" en la semana 2 hasta el próximo guardado). */
function tallerVistosEnVivo(t){
  var temas = {}, niveles = {basico:{}, intermedio:{}, avanzado:{}};
  (t.fases||[]).forEach(function(fase){
    (fase.semanas||[]).forEach(function(s){
      (s.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){ temas[x]=1; });
      ['basico','intermedio','avanzado'].forEach(function(tier){
        var campo = NIVEL_LOGRO_DIA_FIELD[tier];
        (s[campo]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){ niveles[tier][x]=1; });
      });
    });
  });
  return {temas: temas, niveles: niveles};
}
function tallerSemanaRowHtml(t, fase, sem){
  var ctx = tallerSemanaContexto(t, sem), semanaActual = ctx.semanaActual, motivo = ctx.motivo;
  var vivos = tallerVistosEnVivo(t);

  // Igual que en Plan Semanal: los temas/ítems de la semana INMEDIATAMENTE ANTERIOR del PCA que
  // ningún plan (Semanal o Taller) marcó todavía se ofrecen aparte, como "Pendientes de la
  // semana anterior", para que el docente pueda ponerse al día sin perderlos de vista.
  function grupoCbHtml(claseCb, extraAttrs, opciones, seleccion){
    return '<div class="checkbox-grid" style="flex-direction:column; align-items:stretch;">' + opciones.map(function(x){
      return '<label class="checkbox-pill nivel-logro-pill"><input type="checkbox" class="' + claseCb + '" ' + extraAttrs + ' value="' + escapeHtml(x) + '" ' + (seleccion.indexOf(x)!==-1?'checked':'') + ' /><span>' + escapeHtml(x) + '</span></label>';
    }).join('') + '</div>';
  }

  var temasEstaSemana = semanaActual ? parseLinesList(semanaActual.temas) : [];
  var temasPendientes = semanaActual ? temasPendientesAnteriores(t.pcaId, semanaActual.id).filter(function(x){ return temasEstaSemana.indexOf(x)===-1 && !vivos.temas[x]; }) : [];
  var seleccionTemas = (sem.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  seleccionTemas.forEach(function(x){
    if(temasEstaSemana.indexOf(x)===-1 && temasPendientes.indexOf(x)===-1) temasEstaSemana.push(x);
  });
  var temaAttrs = 'data-fase="' + fase.id + '" data-sem="' + sem.id + '"';
  var temasHtml = motivo
    ? '<div class="hint">' + escapeHtml(motivo) + '</div>'
    : (temasEstaSemana.length || temasPendientes.length
        ? ''
          + (temasEstaSemana.length ? '<div class="hint" style="font-weight:700; margin-bottom:4px;">De esta semana</div>' + grupoCbHtml('taller-sem-tema-cb', temaAttrs, temasEstaSemana, seleccionTemas) : '')
          + (temasPendientes.length ? '<div class="hint" style="font-weight:700; margin:10px 0 4px;">Pendientes de la semana anterior</div>' + grupoCbHtml('taller-sem-tema-cb', temaAttrs, temasPendientes, seleccionTemas) : '')
        : '<div class="hint">El PCA no tiene temas registrados para esta semana.</div>');

  var nivelesHtml = motivo ? '' : ['basico','intermedio','avanzado'].map(function(tier){
    var campoPca = NIVEL_LOGRO_PCA_FIELD[tier];
    var campoSem = 'nivelLogro' + tier.charAt(0).toUpperCase() + tier.slice(1);
    var itemsEstaSemana = semanaActual ? parseLinesList(semanaActual[campoPca]) : [];
    var itemsPendientes = semanaActual ? nivelLogroPendientesAnteriores(t.pcaId, semanaActual.id, tier).filter(function(x){ return itemsEstaSemana.indexOf(x)===-1 && !vivos.niveles[tier][x]; }) : [];
    var seleccion = (sem[campoSem]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
    seleccion.forEach(function(x){
      if(itemsEstaSemana.indexOf(x)===-1 && itemsPendientes.indexOf(x)===-1) itemsEstaSemana.push(x);
    });
    if(!itemsEstaSemana.length && !itemsPendientes.length) return '';
    var nivelAttrs = 'data-fase="' + fase.id + '" data-sem="' + sem.id + '" data-tier="' + tier + '"';
    return '<div style="margin-top:6px;"><div class="hint" style="font-weight:700;">' + NIVEL_LOGRO_DIA_LABEL[tier] + '</div>'
      + (itemsEstaSemana.length ? '<div class="hint" style="margin-bottom:2px;">De esta semana</div>' + grupoCbHtml('taller-sem-nivel-cb', nivelAttrs, itemsEstaSemana, seleccion) : '')
      + (itemsPendientes.length ? '<div class="hint" style="margin:6px 0 2px;">Pendientes de la semana anterior</div>' + grupoCbHtml('taller-sem-nivel-cb', nivelAttrs, itemsPendientes, seleccion) : '')
      + '</div>';
  }).join('');

  return '<tr data-fase-row="' + fase.id + '" data-sem-row="' + sem.id + '">'
    + '<td style="min-width:150px; vertical-align:top;">'
    +   '<input type="date" class="cell-input" data-semf="fechaInicio" value="' + escapeHtml(sem.fechaInicio) + '" />'
    +   '<div class="hint" style="text-align:center; margin:2px 0;">al</div>'
    +   '<input type="date" class="cell-input" data-semf="fechaFin" value="' + escapeHtml(sem.fechaFin) + '" />'
    +   (fase.semanas.length>1 ? '<button class="btn btn-danger btn-sm no-print" data-removesem="' + sem.id + '" data-removesemfase="' + fase.id + '" style="margin-top:6px; width:100%;">Quitar semana</button>' : '')
    + '</td>'
    + '<td style="min-width:180px; vertical-align:top;">' + (motivo ? '<div class="hint">' + escapeHtml(motivo) + '</div>' : (nivelesHtml || '<div class="hint">El PCA no tiene ítems de Nivel de Logro para esta semana.</div>')) + '</td>'
    + '<td style="min-width:180px; vertical-align:top;">' + temasHtml + '</td>'
    + '<td style="min-width:220px;">' + richEditorHtml('actividades', sem.id, sem.actividades, 'Actividades académicas de esta semana…') + '</td>'
    + '<td style="min-width:180px;">' + richEditorHtml('recursos', sem.id, sem.recursos, 'Recursos…') + '</td>'
    + '<td style="min-width:160px; vertical-align:top;">'
    +   '<div class="field"><label class="hint">Técnica</label><input class="cell-input" data-semf="tecnica" value="' + escapeHtml(sem.tecnica||'') + '" /></div>'
    +   '<div class="field" style="margin-top:6px;"><label class="hint">Instrumento</label><input class="cell-input" data-semf="instrumento" value="' + escapeHtml(sem.instrumento||'') + '" /></div>'
    + '</td>'
    + '</tr>';
}
function tallerFaseBlockHtml(t, fase){
  var rows = (fase.semanas||[]).map(function(sem){ return tallerSemanaRowHtml(t, fase, sem); }).join('');
  return ''
  + '<div class="unit-block" data-fase="' + fase.id + '">'
  + '  <div class="pca-band band-unit"><input class="unit-head-input" data-fasename="' + fase.id + '" value="' + escapeHtml(fase.nombre) + '" placeholder="Nombre de la fase" />'
  + (t.fases.length>1 ? '    <button class="btn btn-danger btn-sm no-print" data-removefase="' + fase.id + '" style="margin-left:auto; background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.3);">Eliminar fase</button>' : '')

}
function tallerFasesHtml(t){

  + '<div style="padding:14px 20px;"><button class="btn btn-ghost btn-sm" id="btnAddTallerFase">+ Agregar fase</button></div>';
}

function renderTallerFormAgain(){
  document.querySelector('main.content').innerHTML = renderTallerForm(currentDocente());
  bindTallerFormEvents();
}
function bindTallerFormEvents(){
  var t = state.editingTaller;
  var d = currentDocente();
  document.getElementById('btnBackToTallerList').onclick = function(){ go(state.tallerReturnTo || 'tallerlist'); };
  document.getElementById('btnExportTallerPdfNow').onclick = printAsPdf;
  document.getElementById('btnSaveTaller').onclick = function(){ saveTaller(t, false); };
  bindAutoguardadoDelegado('tallerDoc', 'taller');

  document.getElementById('tfNivel').addEventListener('change', function(e){ t.nivel=e.target.value; t.especialidad=''; t.curso=''; t.asignatura=''; recomputeTallerPca(t); renderTallerFormAgain(); });
  var espSel = document.getElementById('tfEspecialidad');
  if(espSel) espSel.addEventListener('change', function(e){ t.especialidad=e.target.value; t.asignatura=''; t.curso=''; recomputeTallerPca(t); renderTallerFormAgain(); });
  document.getElementById('tfAsignatura').addEventListener('change', function(e){ t.asignatura=e.target.value; t.curso=''; recomputeTallerPca(t); renderTallerFormAgain(); });
  document.getElementById('tfCurso').addEventListener('change', function(e){ t.curso=e.target.value; recomputeTallerPca(t); renderTallerFormAgain(); });
  document.getElementById('tfFechaInicio').addEventListener('change', function(e){ t.fechaInicio=e.target.value; marcarAutoguardadoPendiente('taller'); });
  document.getElementById('tfFechaFin').addEventListener('change', function(e){ t.fechaFin=e.target.value; marcarAutoguardadoPendiente('taller'); });
  document.getElementById('tfRevisado').addEventListener('input', function(e){ t.revisadoPor=e.target.value; });
  document.getElementById('tfAprobado').addEventListener('input', function(e){ t.aprobadoPor=e.target.value; });

  document.querySelectorAll('[data-rte-field="productoFinal"]').forEach(function(el){
    el.addEventListener('input', function(){ t.productoFinal = el.innerHTML; });
  });

  document.getElementById('btnAddTallerFase').onclick = function(){ t.fases.push(blankTallerFase(t)); renderTallerFormAgain(); };
  document.querySelectorAll('[data-removefase]').forEach(function(btn){
    btn.onclick = function(){
      var faseId = btn.getAttribute('data-removefase');
      confirmDialog('¿Eliminar esta fase y todas sus semanas?', function(){
        t.fases = t.fases.filter(function(f){ return f.id!==faseId; });
        renderTallerFormAgain();
      });
    };
  });
  document.querySelectorAll('[data-fasename]').forEach(function(el){
    el.addEventListener('input', function(){
      var fase = t.fases.find(function(f){ return f.id===el.getAttribute('data-fasename'); });
      fase.nombre = el.value;
    });
  });
  document.querySelectorAll('[data-addsemana]').forEach(function(btn){
    btn.onclick = function(){
      var fase = t.fases.find(function(f){ return f.id===btn.getAttribute('data-addsemana'); });
      var nueva = blankTallerSemana();
      var ultima = fase.semanas[fase.semanas.length-1];
      if(ultima){
        if(ultima.fechaInicio) nueva.fechaInicio = addDays(ultima.fechaInicio, 7);
        if(ultima.fechaFin) nueva.fechaFin = addDays(ultima.fechaFin, 7);
      }
      aplicarFechaSemanaTaller(nueva, t.pcaId);
      fase.semanas.push(nueva);
      renderTallerFormAgain();
    };
  });
  document.querySelectorAll('[data-removesem]').forEach(function(btn){
    btn.onclick = function(){
      var fase = t.fases.find(function(f){ return f.id===btn.getAttribute('data-removesemfase'); });
      var semId = btn.getAttribute('data-removesem');
      if(fase.semanas.length<=1){ toast('Debe existir al menos una semana en la fase.', 'error'); return; }
      fase.semanas = fase.semanas.filter(function(s){ return s.id!==semId; });
      renderTallerFormAgain();
    };
  });

  document.querySelectorAll('[data-fase-row]').forEach(function(tr){
    var fase = t.fases.find(function(f){ return f.id===tr.getAttribute('data-fase-row'); });
    var sem = fase.semanas.find(function(s){ return s.id===tr.getAttribute('data-sem-row'); });
    tr.querySelectorAll('[data-semf]').forEach(function(el){
      el.addEventListener(el.type==='date' ? 'change' : 'input', function(){
        sem[el.getAttribute('data-semf')] = el.value;
        if(el.getAttribute('data-semf')==='fechaInicio'){ aplicarFechaSemanaTaller(sem, t.pcaId); renderTallerFormAgain(); }
      });
    });
    tr.querySelectorAll('.rte-editable').forEach(function(el){
      var key = el.getAttribute('data-rte-field');
      el.addEventListener('input', function(){ sem[key] = el.innerHTML; });
    });
    tr.querySelectorAll('.taller-sem-tema-cb').forEach(function(cb){
      cb.onchange = function(){
        var seleccion = (sem.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
        var idx = seleccion.indexOf(cb.value);
        if(cb.checked){ if(idx===-1) seleccion.push(cb.value); } else if(idx!==-1) seleccion.splice(idx,1);
        sem.contenidos = seleccion.join(';');
        marcarAutoguardadoPendiente('taller');
      };
    });
    tr.querySelectorAll('.taller-sem-nivel-cb').forEach(function(cb){
      cb.onchange = function(){
        var tier = cb.getAttribute('data-tier');
        var campo = 'nivelLogro' + tier.charAt(0).toUpperCase() + tier.slice(1);
        var seleccion = (sem[campo]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
        var idx = seleccion.indexOf(cb.value);
        if(cb.checked){ if(idx===-1) seleccion.push(cb.value); } else if(idx!==-1) seleccion.splice(idx,1);
        sem[campo] = seleccion.join(';');
        marcarAutoguardadoPendiente('taller');
      };
    });
  });

  bindRteToolbars(document.getElementById('tallerDoc'));
}
function saveTaller(t, silent){
  var d = currentDocente();
  var existingHeader = load(LS.TALLER).find(function(x){ return x.id===t.id; });
  if(existingHeader && !t._forzarGuardado && hayConflictoGuardado('taller', existingHeader.updatedAt)){
    if(silent){ toast('No se autoguardó: este Taller Práctico se modificó en otro dispositivo o pestaña. Recarga la página antes de seguir editando.', 'error'); return; }
    avisarConflictoGuardado('taller', existingHeader.updatedAt, function(){ t._forzarGuardado = true; saveTaller(t, silent); });
    return;
  }
  delete t._forzarGuardado;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  t.updatedAt = nowISO();
  var record = {
    id: t.id, docenteId: ownerId, numero: t.numero || (existingHeader && existingHeader.numero) || siguienteNumeroTaller(ownerId),
    nivel: t.nivel, especialidad: t.especialidad||'', curso: t.curso, asignatura: t.asignatura,
    pcaId: t.pcaId||'', fechaInicio: t.fechaInicio||'', fechaFin: t.fechaFin||'', fechaHoraLimite: t.fechaHoraLimite||'',
    productoFinal: sanitizeRte(t.productoFinal||''),
    fases: (t.fases||[]).map(function(fase){
      return {
        id: fase.id, nombre: fase.nombre||'',
        semanas: (fase.semanas||[]).map(function(sem){
          return {
            id: sem.id, fechaInicio: sem.fechaInicio||'', fechaFin: sem.fechaFin||'', semanaRowId: sem.semanaRowId||'',
            contenidos: sem.contenidos||'',
            nivelLogroBasico: sem.nivelLogroBasico||'', nivelLogroIntermedio: sem.nivelLogroIntermedio||'', nivelLogroAvanzado: sem.nivelLogroAvanzado||'',
            actividades: sanitizeRte(sem.actividades||''), recursos: sanitizeRte(sem.recursos||''),
            tecnica: sem.tecnica||'', instrumento: sem.instrumento||''
          };
        })
      };
    }),
    revisadoPor: t.revisadoPor||'', aprobadoPor: t.aprobadoPor||'',
    importadoDeDocente: t.importadoDeDocente||'', importadoFecha: t.importadoFecha||'',
    createdAt: t.createdAt, updatedAt: t.updatedAt
  };
  var all = load(LS.TALLER).filter(function(x){ return x.id!==t.id; });
  all.push(record);
  save(LS.TALLER, all);
  marcarBaseConflicto('taller', record.updatedAt);
  state.editingTaller = Object.assign({}, record, {
    fases: record.fases.map(function(f){ return Object.assign({}, f, { semanas: f.semanas.map(function(s){ return Object.assign({}, s); }) }); })
  });
  if(!silent) toast('Taller práctico guardado correctamente.', 'success');
}
/* "Replanificar" (botón de la lista de Taller Práctico): duplica un Taller Práctico existente en
   uno nuevo, con todas sus fases y semanas —y los mismos temas y niveles de logro que ya tenía
   marcados— pero editable de forma independiente (no comparte fases/semanas con el original).
   Numera el nuevo como el original + ".1" (p.ej. "3.1"), o ".2"/".3"... si ya existe ese número
   (por si se replanifica más de una vez). Igual que numeroReplanificado/replanificarSemanal. */
function numeroReplanificadoTaller(docenteId, base){
  var existentes = load(LS.TALLER).filter(function(t){ return t.docenteId===docenteId; }).map(function(t){ return String(t.numero); });
  var i = 1, candidato;
  do{ candidato = base + '.' + i; i++; } while(existentes.indexOf(candidato)!==-1);
  return candidato;
}
function replanificarTaller(tallerId){
  var t = load(LS.TALLER).find(function(x){ return x.id===tallerId; });
  if(!t) return;
  var nuevoNumero = numeroReplanificadoTaller(t.docenteId, t.numero);
  var nuevo = {
    id: uid('tp'), docenteId: t.docenteId, numero: nuevoNumero,
    nivel: t.nivel, especialidad: t.especialidad||'', curso: t.curso, asignatura: t.asignatura,
    pcaId: t.pcaId||'', fechaInicio: t.fechaInicio||'', fechaFin: t.fechaFin||'', fechaHoraLimite: fechaLimiteVigente('semanal'),
    productoFinal: t.productoFinal||'',
    fases: (t.fases||[]).map(function(fase){
      return {
        id: uid('fase'), nombre: fase.nombre||'',
        semanas: (fase.semanas||[]).map(function(sem){
          return {
            id: uid('tsem'), fechaInicio: sem.fechaInicio||'', fechaFin: sem.fechaFin||'', semanaRowId: sem.semanaRowId||'',
            contenidos: sem.contenidos||'',
            nivelLogroBasico: sem.nivelLogroBasico||'', nivelLogroIntermedio: sem.nivelLogroIntermedio||'', nivelLogroAvanzado: sem.nivelLogroAvanzado||'',
            actividades: sem.actividades||'', recursos: sem.recursos||'',
            tecnica: sem.tecnica||'', instrumento: sem.instrumento||''
          };
        })
      };
    }),
    revisadoPor: t.revisadoPor||'', aprobadoPor: t.aprobadoPor||'',
    createdAt: nowISO(), updatedAt: nowISO()
  };
  var all = load(LS.TALLER).slice();
  all.push(nuevo);
  save(LS.TALLER, all);
  toast('Taller Práctico replanificado como N.º ' + nuevoNumero + ', con los mismos temas y niveles de logro (editables).', 'success');
  render();
}
function renderTallerListInner(d, scopeAll){
  var isAdmin = isStaffRole(currentDocente().role);
  var talleres = scopeAll ? load(LS.TALLER) : load(LS.TALLER).filter(function(t){ return t.docenteId===d.id; });
  talleres.sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
  var docentesById = {};
  if(scopeAll) allDocentes().forEach(function(x){ docentesById[x.id]=x; });

  function rowHtml(t){
    var owner = scopeAll ? docentesById[t.docenteId] : null;
    var docenteCell = scopeAll ? '<td>' + (owner ? escapeHtml(nombreFormal(owner)) : '<span class="hint">(docente eliminado)</span>') + '</td>' : '';

/* ============================= ZIP (STORE) + DOCX BUILDER ============================= */
/* Hand-rolled, dependency-free ZIP writer (no compression) so we can produce a real,
   directly-openable .docx (Word) file entirely client-side — no external libraries allowed. */
var CRC_TABLE = (function(){
  var table = [];
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder();
  var localParts = [], centralParts = [], offset = 0;
  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.data;
    var crc = crc32(data);

    var lh = new Uint8Array(30 + nameBytes.length);
    var ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true);
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x21, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, data.length, true);
    ldv.setUint32(22, data.length, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    localParts.push(lh, data);

    var ch = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    centralParts.push(ch);

    offset += lh.length + data.length;
  });

  var centralSize = centralParts.reduce(function(s,p){ return s+p.length; }, 0);
  var centralOffset = offset;
  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  var allParts = localParts.concat(centralParts, [eocd]);
  var total = allParts.reduce(function(s,p){ return s+p.length; }, 0);
  var out = new Uint8Array(total);
  var pos = 0;
  allParts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}

/* Minimal WordprocessingML (OOXML) builders */
function docxEsc(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function docxRunsInline(text, rprXml){
  var lines = String(text===undefined||text===null ? '' : text).split('\n');
  var inner = lines.map(function(line, i){
    return (i>0 ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + docxEsc(line) + '</w:t>';
  }).join('');
  return '<w:r>' + (rprXml||'') + inner + '</w:r>';
}
function docxPara(text, opts){
  opts = opts || {};
  var pPr = '';
  if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
  if(opts.shd) pPr += '<w:shd w:val="clear" w:fill="' + opts.shd + '"/>';
  pPr += '<w:spacing w:before="' + (opts.before!=null?opts.before:40) + '" w:after="' + (opts.after!=null?opts.after:40) + '"/>';
  var pprXml = '<w:pPr>' + pPr + '</w:pPr>';
  var rpr = '';
  if(opts.bold) rpr += '<w:b/>';
  if(opts.color) rpr += '<w:color w:val="' + opts.color + '"/>';
  if(opts.size) rpr += '<w:sz w:val="' + (opts.size*2) + '"/><w:szCs w:val="' + (opts.size*2) + '"/>';
  var rprXml = rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '';
  return '<w:p>' + pprXml + docxRunsInline(text, rprXml) + '</w:p>';
}
function docxCell(text, opts){
  opts = opts || {};
  var tcPr = '<w:tcPr><w:tcW w:w="' + (opts.pct!=null?opts.pct:1000) + '" w:type="pct"/>';
  if(opts.fill) tcPr += '<w:shd w:val="clear" w:fill="' + opts.fill + '"/>';
  tcPr += '<w:vAlign w:val="center"/></w:tcPr>';
  return '<w:tc>' + tcPr + docxPara(text, {bold:opts.bold, color:opts.color, align:opts.align, before:20, after:20}) + '</w:tc>';

function docxRow(cells){ return '<w:tr>' + cells.join('') + '</w:tr>'; }
function docxTable(rows, colPcts){
  /* Word necesita <w:tblGrid> con el ancho de cada columna (en twips) para respetar las
     proporciones de w:tcW pct; sin esto, algunas versiones de Word ignoran los anchos por celda y
     el texto largo (p.ej. Nivel de Logro, Temas y subtemas) se ve apretado en columnas angostas.
     Se calcula a partir de los pct de la primera fila (out of 5000 = 100%) sobre un ancho de
     página horizontal A4 tipo, ~10800 twips de contenido. */
  var pageWidthTwips = 10800;
  var gridColsXml = '';
  if(colPcts && colPcts.length){
    gridColsXml = colPcts.map(function(pct){ return '<w:gridCol w:w="' + Math.round(pct/5000*pageWidthTwips) + '"/>'; }).join('');
  }
  return '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>'
    + '<w:top w:val="single" w:sz="4" w:color="C3CEE3"/><w:left w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '<w:bottom w:val="single" w:sz="4" w:color="C3CEE3"/><w:right w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '<w:insideH w:val="single" w:sz="4" w:color="C3CEE3"/><w:insideV w:val="single" w:sz="4" w:color="C3CEE3"/>'
    + '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>' + gridColsXml + '</w:tblGrid>'
    + rows.join('') + '</w:tbl>';
}

function buildDocxBlob(p, cont){

/* Converts our sanitized rich-text HTML (bold/underline/lists/links) into OOXML paragraphs,
   so Actividades/Recursos/Evaluación keep their formatting in the exported .docx. */
function docxRunFormatted(text, fmt){
  fmt = fmt || {};
  var rpr = '';
  if(fmt.bold) rpr += '<w:b/>';
  if(fmt.underline || fmt.link) rpr += '<w:u w:val="single"/>';
  if(fmt.link) rpr += '<w:color w:val="1848A0"/>';
  var rprXml = rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '';
  return docxRunsInline(text, rprXml);
}
function docxParaFromRuns(runsXml, opts){
  opts = opts || {};
  var pPr = '<w:spacing w:before="' + (opts.before!=null?opts.before:20) + '" w:after="' + (opts.after!=null?opts.after:20) + '"/>';
  if(opts.indent) pPr += '<w:ind w:left="' + opts.indent + '"/>';
  return '<w:p><w:pPr>' + pPr + '</w:pPr>' + (runsXml || docxRunFormatted('',{})) + '</w:p>';
}
function richTextToDocxParas(html){
  if(!html || !html.trim()) return [docxParaFromRuns(docxRunFormatted('—',{}))];
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var out = [];
  function inlineRuns(node, fmt){
    var runs = '';
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ if(ch.textContent) runs += docxRunFormatted(ch.textContent, fmt); return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      var f2 = Object.assign({}, fmt);
      if(tag==='B'||tag==='STRONG') f2.bold = true;
      if(tag==='U') f2.underline = true;
      if(tag==='A'){ f2.link = true; runs += docxRunFormatted((ch.textContent||'') + ' (' + (ch.getAttribute('href')||'') + ')', f2); return; }
      if(tag==='BR'){ runs += '<w:br/>'; return; }
      runs += inlineRuns(ch, f2);
    });
    return runs;
  }
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){
        if(ch.textContent && ch.textContent.trim()) out.push(docxParaFromRuns(docxRunFormatted(ch.textContent,{})));
        return;
      }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag==='UL' || tag==='OL'){
        Array.from(ch.children).filter(function(c){ return c.tagName==='LI'; }).forEach(function(li, idx){
          var prefix = tag==='OL' ? (idx+1) + '. ' : '• ';
          out.push(docxParaFromRuns(docxRunFormatted(prefix,{}) + inlineRuns(li,{}), {indent:360}));
        });
      } else if(tag==='LI'){
        out.push(docxParaFromRuns(docxRunFormatted('• ',{}) + inlineRuns(ch,{}), {indent:360}));
      } else if(tag==='DIV' || tag==='P'){
        var runs = inlineRuns(ch, {});
        out.push(docxParaFromRuns(runs));
      } else if(tag==='BR'){
        /* skip standalone */
      } else {
        var runs2 = inlineRuns(ch, {});
        if(runs2) out.push(docxParaFromRuns(runs2));
      }
    });
  }
  walk(doc.body.firstChild);
  if(out.length===0) out.push(docxParaFromRuns(docxRunFormatted('—',{})));
  return out;
}

/* Fuera del visor de Claude Artifacts (por ejemplo, cuando este archivo se aloja o se abre
   directamente en un navegador normal) window.claude no existe, así que la descarga se hace con
   el mecanismo estándar del navegador en vez de window.claude.downloads.save(). */
function browserDownloadFallback(filename, data){
  var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* Tries a list of {ext, data} attempts in priority order (best format first).
   Moves to the next attempt only when the viewer rejects the extension itself
   (extension_not_enabled / rejected_extension) — any other failure stops immediately. */
async function saveAttempts(baseName, attempts){
  if(!window.claude || !window.claude.downloads){
    var first = attempts[0];
    browserDownloadFallback(baseName + '.' + first.ext, first.data);
    toast('Archivo .' + first.ext + ' descargado.', 'success');
    return;
  }
  for(var i=0; i<attempts.length; i++){
    var a = attempts[i];
    try{
      await window.claude.downloads.save({filename: baseName + '.' + a.ext, data: a.data});
      toast(i===0
        ? 'Archivo .' + a.ext + ' descargado.'
        : 'Tu vista no admite .' + attempts[0].ext + ' — se descargó como .' + a.ext + ' en su lugar.', 'success');
      return;
    }catch(err){
      var isExtIssue = err && (err.code==='extension_not_enabled' || err.code==='rejected_extension');
      var isLast = i === attempts.length-1;
      if(err && err.code === 'declined') return;
      if(!isExtIssue || isLast){
        if(err) toast('No se pudo descargar el archivo: ' + (err.message||err.code), 'error');
        return;
      }
      // else: extension rejected and more attempts remain — try the next format
    }
  }
}

/* Color pastel distinto para cada pestaña de Administración, para distinguirlas de un vistazo
   tanto en la barra de pestañas como en el contenido (borde superior de cada tarjeta). */
var ADMIN_TAB_PASTEL = {
  docentes: 'var(--purple-100)',
  carga: 'var(--teal-100)',
  pca: 'var(--indigo-100)',
  semanal: 'var(--green-100)',
  semanalcolegio: 'var(--orange-100)',
  taller: 'var(--teal-100)',
  consultas: 'var(--lime-100)',
  presentacion: 'var(--blue-100)',
  presentacioncolegio: 'var(--gold-100)',
  presentacionpca: 'var(--pink-100)',
  presentacionpcacolegio: 'var(--brown-100)',
  fechaslimite: 'var(--red-100)'
};
/* Atributo style="" para pintar el borde superior de una tarjeta con el pastel de su pestaña.
   Por defecto usa el mapa de Administración; para Inspección General se le pasa INSP_TAB_PASTEL. */
function pastelBorde(tabKey, mapa){
  var color = (mapa || ADMIN_TAB_PASTEL)[tabKey];
  return color ? ' style="border-top:4px solid '+color+';"' : '';
}
/* Submenús del panel de Administración: agrupa las 12 pestañas (antes en una sola fila larga) en
   4 categorías temáticas. Es solo una agrupación VISUAL — state.adminTab sigue siendo la misma
   pestaña de siempre, cada key de ADMIN_GROUPS.tabs debe existir en ADMIN_TABS. */
var ADMIN_GROUPS = [
  {key:'personal', label:'Personal', tabs:['docentes','carga']},
  {key:'curricular', label:'Planificación Curricular', tabs:['pca','semanal','semanalcolegio','taller']},
  {key:'presentaciones', label:'Presentaciones', tabs:['presentacion','presentacioncolegio','presentacionpca','presentacionpcacolegio']},
  {key:'config', label:'Configuración', tabs:['consultas','fechaslimite']}
];
function grupoDeAdminTab(tabKey){
  var g = ADMIN_GROUPS.find(function(gr){ return gr.tabs.indexOf(tabKey)!==-1; });
  return g ? g.key : ADMIN_GROUPS[0].key;
}

function renderAdmin(d){
  if(!isStaffRole(d.role)) return renderDashboard(d);
  var tab = state.adminTab || 'docentes';
  if(!state.adminGroupOpen) state.adminGroupOpen = grupoDeAdminTab(tab);
  var gruposHtml = ADMIN_GROUPS.map(function(grupo){
    var abierto = state.adminGroupOpen === grupo.key;
    var tieneActivo = grupo.tabs.indexOf(tab)!==-1;
    var botonesHtml = grupo.tabs.map(function(tk){
      var t = ADMIN_TABS.find(function(x){ return x.key===tk; });
      var pastel = ADMIN_TAB_PASTEL[tk];
      var estilo = pastel ? ' style="background:'+pastel+'; border-radius:8px 8px 0 0;"' : '';
      return '<button class="'+(tab===tk?'active':'')+'"'+estilo+' data-admintab="'+tk+'">'+t.label+'</button>';
    }).join('');
    return ''
      + '<div class="admin-group' + (abierto?' open':'') + (tieneActivo?' has-active':'') + '">'
      + '  <button class="admin-group-head" data-admingroup="' + grupo.key + '"><span class="admin-group-caret">▸</span><span>' + grupo.label + '</span></button>'
      + (abierto ? '<div class="admin-tabs">' + botonesHtml + '</div>' : '')
      + '</div>';
  }).join('');

  else if(tab === 'semanal') body = renderAdminSemanal('escuela');
  else if(tab === 'semanalcolegio') body = renderAdminSemanal('colegio');
  else if(tab === 'taller') body = renderTallerListInner(d, true);
  else if(tab === 'consultas') body = renderAdminConsultas();
  else if(tab === 'presentacion') body = renderAdminPresentacion('escuela');
  else if(tab === 'presentacioncolegio') body = renderAdminPresentacion('colegio');
  else if(tab === 'presentacionpca') body = renderAdminPresentacionPca('escuela');

async function doSaveAdminDocente(){
  var target = state.editingAdminDocente;
  var errEl = document.getElementById('adminDocenteError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var original = allDocentes().find(function(x){ return x.id === target.id; }) || target;
  var titulo = target.titulo.trim();
  var nombres = target.nombres.trim();
  var apellidos = target.apellidos.trim();
  var ci = target.ci.trim();
  var telefono = (target.telefono||'').trim();
  var usuarioId = target.usuarioId.trim();
  var role = target.role;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  var all = allDocentes();
  if(all.some(function(x){ return x.id!==target.id && x.usuarioId.toLowerCase()===usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  if(isStaffRole(original.role) && !isStaffRole(role)){
    var otherStaff = all.filter(function(x){ return isStaffRole(x.role) && x.id!==target.id; });
    if(otherStaff.length===0) return fail('No puedes quitar este rol: es el único usuario con acceso administrativo del sistema.');
  }

  target.titulo=titulo; target.nombres=nombres; target.apellidos=apellidos; target.ci=ci; target.telefono=telefono;
  target.usuarioId=usuarioId; target.role=role;
  save(LS.DOCENTES, all.map(function(x){ return x.id===target.id ? target : x; }));
  state.editingAdminDocente = null;
  toast('Docente actualizado correctamente.', 'success');
  state.subview = 'admin'; state.adminTab = 'docentes';
  render();
}

      if(otherStaff.length===0){ toast('No puedes eliminar al único usuario con acceso administrativo del sistema.', 'error'); return; }
    }
    confirmDialog('¿Eliminar a ' + target.nombres + ' ' + target.apellidos + ' y TODOS sus datos (carga horaria, planes curriculares, contenidos y planes semanales)? Su cuenta de acceso quedará sin ningún dato ni permiso.', function(){
      var docenteReg = allDocentes().filter(function(x){ return x.id===target.id; });
      var cargaReg = load(LS.CARGA).filter(function(r){ return r.docenteId===target.id; });
      var pcaReg = load(LS.PCA).filter(function(p){ return p.docenteId===target.id; });
      var pcaIds = pcaReg.map(function(p){ return p.id; });
      var contReg = load(LS.CONT).filter(function(c){ return pcaIds.indexOf(c.pcaId)!==-1; });
      var semanalReg = load(LS.SEMANAL).filter(function(s){ return s.docenteId===target.id; });
      var tallerReg = load(LS.TALLER).filter(function(t){ return t.docenteId===target.id; });
      eliminarVariasConDeshacer([
        {key: LS.DOCENTES, ids: docenteReg.map(function(x){return x.id;}), registros: docenteReg},
        {key: LS.CARGA, ids: cargaReg.map(function(x){return x.id;}), registros: cargaReg},
        {key: LS.PCA, ids: pcaIds, registros: pcaReg},
        {key: LS.CONT, ids: contReg.map(function(x){return x.id;}), registros: contReg},
        {key: LS.SEMANAL, ids: semanalReg.map(function(x){return x.id;}), registros: semanalReg},
        {key: LS.TALLER, ids: tallerReg.map(function(x){return x.id;}), registros: tallerReg}
      ], 'Docente eliminado.', 'Docente y sus datos restaurados.');
      state.editingAdminDocente = null;
      state.subview='admin'; state.adminTab='docentes';
      render();
    });
  };
}

async function doCreateAdminDocente(){
  var errEl = document.getElementById('adminNewDocenteError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('anTitulo').value.trim();
  var nombres = document.getElementById('anNombres').value.trim();
  var apellidos = document.getElementById('anApellidos').value.trim();
  var ci = document.getElementById('anCI').value.trim();
  var telefono = document.getElementById('anTelefono').value.trim();
  var email = document.getElementById('anEmail').value.trim();
  var usuarioId = document.getElementById('anUserId').value.trim();
  var role = document.getElementById('anRol').value;
  var pw = document.getElementById('anPw').value;

  if(!nombres || !apellidos || !ci || !email || !usuarioId || !pw) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Ingresa un correo institucional válido.');
  if(pw.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');
  var docentes = allDocentes();
  if(docentes.some(function(x){ return x.usuarioId.toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');

  var cred;
  try{
    /* Se crea en la app secundaria de Firebase para no cerrar la sesión del admin actual. */
    cred = await window.FB.createUserWithEmailAndPassword(window.FB.secondaryAuth, email, pw);
  }catch(err){ return fail(mapAuthError(err)); }
  var docente = {
    id: cred.user.uid,
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono,
    email: email, usuarioId: usuarioId,
    role: role,
    createdAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DOCENTES, docente.id), docente);
  }catch(err){
    await window.FB.signOut(window.FB.secondaryAuth);
    return fail('La cuenta se creó pero no se pudo guardar su perfil (' + mapAuthError(err) + '). Contacta soporte para revisar reglas de Firestore.');
  }
  await window.FB.signOut(window.FB.secondaryAuth);
  toast('Usuario creado correctamente.', 'success');
  state.subview = 'admin'; state.adminTab = 'docentes';
  render();
}

}

var adminCargaEditRows = null;
function ensureAdminCargaRows(){
  if(adminCargaEditRows) return adminCargaEditRows;
  adminCargaEditRows = load(LS.CARGA).map(function(r){ return Object.assign({}, r); });
  return adminCargaEditRows;
}
/* Agrupa las filas de carga por docente (orden alfabético apellidos+nombres); las filas cuyo
   docente ya no existe quedan en un grupo aparte al final. */
function groupCargaByDocente(rows, docentesById){
  var groups = {}; var order = [];
  rows.forEach(function(r){
    var key = r.docenteId || '__sin__';
    if(!groups[key]){ groups[key] = {docenteId: r.docenteId, docente: docentesById[r.docenteId], rows: []}; order.push(key); }
    groups[key].rows.push(r);
  });
  var list = order.map(function(k){ return groups[k]; });
  list.sort(function(a,b){
    if(!a.docente && !b.docente) return 0;
    if(!a.docente) return 1;
    if(!b.docente) return -1;
    return (a.docente.apellidos+a.docente.nombres).localeCompare(b.docente.apellidos+b.docente.nombres);
  });
  return list;
}

function bindAdminCargaEvents(){
  var body = document.getElementById('adminCargaBody');
  if(!body) return;
  var docentesById = {}; allDocentes().forEach(function(x){ docentesById[x.id] = x; });
  function findRow(id){ return adminCargaEditRows.find(function(r){ return r.id===id; }); }

  body.querySelectorAll('tr').forEach(function(tr){
    var id = tr.getAttribute('data-row');
    tr.querySelectorAll('[data-f]').forEach(function(el){
      el.addEventListener('change', function(){
        var row = findRow(id);
        row[el.getAttribute('data-f')] = el.value;
        if(el.getAttribute('data-f') === 'nivel'){ row.especialidad=''; row.curso=''; row.asignatura=''; row.cursoManual=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'especialidad'){ row.asignatura=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'curso' || el.getAttribute('data-f') === 'asignatura'){ renderAdminCargaBodyOnly(docentesById); }
      });
      el.addEventListener('input', function(){
        if(el.tagName === 'INPUT'){ findRow(id)[el.getAttribute('data-f')] = el.value; }
      });
    });
  });
  document.querySelectorAll('[data-admin-remove-carga]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-admin-remove-carga');
      adminCargaEditRows = adminCargaEditRows.filter(function(r){ return r.id!==id; });
      renderAdminCargaBodyOnly(docentesById);
    };
  });
  var saveBtn = document.getElementById('btnSaveAdminCarga');
  if(saveBtn) saveBtn.onclick = function(){
    var toSave = adminCargaEditRows.map(function(r){
      return {
        id: r.id, docenteId: r.docenteId,
        nivel: r.nivel, especialidad: r.especialidad || '',
        curso: r.curso === 'Otro…' ? (r.cursoManual||'') : r.curso,
        asignatura: r.asignatura === 'Otra…' ? (r.asignaturaManual||'') : r.asignatura,
        updatedAt: nowISO()
      };
    }).filter(function(r){ return r.nivel && r.curso && r.asignatura; });
    save(LS.CARGA, toSave);
    adminCargaEditRows = null;
    toast('Carga horaria actualizada (' + toSave.length + ' filas).', 'success');
    render();
  };
}
function renderAdminCargaBodyOnly(docentesById){
  var groups = groupCargaByDocente(adminCargaEditRows, docentesById);
  document.getElementById('adminCargaBody').innerHTML = groups.map(function(g){ return adminCargaGroupHtml(g); }).join('');
  bindAdminCargaEvents();
}

/* ============================= ADMIN: PRESENTACIÓN DE PLANES (solo admin) ============================= */
/* Observación de 3 estados: primero se verifica que el plan esté LLENO (si le faltan campos, es
   INCOMPLETO sin importar la fecha); si está lleno, se compara la fecha de creación contra la
   fecha límite (A TIEMPO o ATRASADO). SIN_LIMITE solo aplica cuando el plan está lleno pero no
   tiene fecha límite guardada, así que no se puede juzgar la puntualidad. */
var PRESENTACION_STYLE = {
  a_tiempo: {label:'Presentó a tiempo', color:'#0F5132', bg:'#E3F5EC'},
  incompleto: {label:'Incompleto', color:'#D62828', bg:'#FBE4E4'},
  con_retraso: {label:'Atrasado', color:'#D69E00', bg:'#FFF6D9'},
  sin_limite: {label:'Sin fecha límite definida', color:'#5B6B85', bg:'#EEF1F6'}
};
function calcularEstadoPresentacion(completo, createdAt, fechaLimite){
  if(!completo) return 'incompleto';
  if(!fechaLimite) return 'sin_limite';
  var limiteISO = new Date(fechaLimite).toISOString();
  return (createdAt && createdAt <= limiteISO) ? 'a_tiempo' : 'con_retraso';
}
function presentacionBadge(estado){
  var st = PRESENTACION_STYLE[estado];
  return '<span style="font-weight:700; font-size:11px; letter-spacing:.02em; padding:4px 10px; border-radius:99px; color:' + st.color + '; background:' + st.bg + '; white-space:nowrap;">' + st.label + '</span>';
}
function siNoBadge(valor){
  return valor
    ? '<span style="font-weight:700; font-size:10.5px; padding:3px 9px; border-radius:99px; color:#0F5132; background:#E3F5EC;">Sí</span>'
    : '<span style="font-weight:700; font-size:10.5px; padding:3px 9px; border-radius:99px; color:#5B6B85; background:#EEF1F6;">No</span>';
}
/* Toma los Planes Semanales del docente cuya fecha (fechaInicio) cae dentro del rango de corte
   [fechaInicioParte, fechaFinParte] que el admin elige. La puntualidad se calcula comparando la
   fecha y hora en que se CREÓ cada plan contra la Fecha y hora límite que ese MISMO plan tiene
   guardada (campo editable solo por el admin, visible en la parte de arriba del documento) — ya
   no se pide una fecha límite aparte en este formulario. Tareas/Talleres/Lecciones se detectan
   revisando el texto del campo Evaluación de cada día del plan. */
function filasPresentacionDocente(docenteId, fechaInicioParte, fechaFinParte, banda){
  return load(LS.SEMANAL).filter(function(s){
    if(s.docenteId!==docenteId || !s.fechaInicio || s.fechaInicio<fechaInicioParte || s.fechaInicio>fechaFinParte) return false;
    return esEscuelaPorNivelCurso(s.nivel, s.curso) === (banda==='escuela');
  }).map(function(s){
    var estado = calcularEstadoPresentacion(semanalEstaCompleto(s), s.createdAt, s.fechaHoraLimite);
    var evalTexto = (s.dias||[]).map(function(dia){ return richTextToPlain(dia.evaluacion||''); }).join(' ').toLowerCase();
    return {
      numero:s.numero, fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, asignatura:s.asignatura, curso:s.curso,
      createdAt:s.createdAt, fechaHoraLimite:s.fechaHoraLimite, estado:estado,
      tareas: evalTexto.indexOf('tarea')!==-1,
      talleres: evalTexto.indexOf('taller')!==-1,
      lecciones: evalTexto.indexOf('lecci')!==-1
    };
  });
}
function renderAdminPresentacion(banda){
  var pf = state.presentacionForm;
  var pastel = ADMIN_TAB_PASTEL[banda==='colegio' ? 'presentacioncolegio' : 'presentacion'];
  var tituloBanda = banda==='colegio' ? 'Presentación de Planes Semanales (Colegio)' : 'Presentación de Planes Semanales (Escuela)';
  var formHtml = ''
    + '<div class="card" style="background:'+pastel+';">'
    + '  <h2>' + tituloBanda + '</h2>'
    + '  <div class="card-sub">Elige el rango de fechas que quieres revisar (por ejemplo, un mes completo). La puntualidad se calcula contra la Fecha y hora límite que cada plan tiene guardada.</div>'
    + '  <div class="grid-2" style="max-width:520px;">'
    + '    <div class="field"><label>Fecha de corte — inicio</label><input class="cell-input" type="date" id="ppFechaInicio" value="' + escapeHtml(pf.fechaInicio||'') + '" /></div>'
    + '    <div class="field"><label>Fecha de corte — fin</label><input class="cell-input" type="date" id="ppFechaFin" value="' + escapeHtml(pf.fechaFin||'') + '" /></div>'
    + '  </div>'
    + '</div>';

  if(!pf.fechaInicio || !pf.fechaFin){
    return formHtml + '<div class="card"><div class="empty-state"><div class="ic">🕒</div>Elige la fecha de inicio y la fecha de fin del rango que quieres revisar.</div></div>';
  }
  if(pf.fechaInicio > pf.fechaFin){
    return formHtml + '<div class="card"><div class="empty-state"><div class="ic">🕒</div>La fecha de inicio no puede ser posterior a la fecha de fin.</div></div>';
  }

  var docentes = allDocentes();
  var bloques = docentes.map(function(doc){
    var filas = filasPresentacionDocente(doc.id, pf.fechaInicio, pf.fechaFin, banda);
    if(!filas.length) return null;
    var rankDocente = banda==='colegio' ? 0 : Math.min.apply(null, filas.map(function(f){ return ordenCursoEscuela(f.curso); }));
    var porMes = {};
    var ordenMeses = [];
    filas.forEach(function(f){
      var info = trimestreYMesDe(f.fechaInicio);
      var key = info ? info.mesKey : 'zzz-sin-fecha';
      var label = info ? info.mesLabel : 'Sin fecha';
      if(!porMes[key]){ porMes[key] = {label:label, filas:[]}; ordenMeses.push(key); }
      porMes[key].filas.push(f);
    });
    ordenMeses.sort();
    var mesesHtml = ordenMeses.map(function(mk){
      var g = porMes[mk];
      var filasHtml = g.filas.slice().sort(function(a,b){ return (a.fechaInicio||'').localeCompare(b.fechaInicio||''); }).map(function(f){
        return '<tr>'
          + '<td class="tabular">' + (f.numero ? 'N.º ' + f.numero : '—') + '</td>'
          + '<td>' + escapeHtml(f.asignatura||'—') + (f.curso ? ' · '+escapeHtml(f.curso) : '') + '</td>'
          + '<td>' + fmtDate(f.fechaInicio) + ' al ' + fmtDate(f.fechaFin) + '</td>'
          + '<td>' + (f.createdAt ? fmtDateTime(f.createdAt) : '—') + '</td>'
          + '<td>' + (f.fechaHoraLimite ? fmtDateTimeLocal(f.fechaHoraLimite) : '—') + '</td>'
          + '<td>' + presentacionBadge(f.estado) + '</td>'
          + '<td style="text-align:center;">' + siNoBadge(f.tareas) + '</td>'
          + '<td style="text-align:center;">' + siNoBadge(f.talleres) + '</td>'
          + '<td style="text-align:center;">' + siNoBadge(f.lecciones) + '</td>'
          + '</tr>';
      }).join('');
      return '<div style="margin-top:12px;"><h3 style="font-size:13.5px; color:var(--blue-700); margin-bottom:8px;">' + escapeHtml(g.label) + '</h3><div class="table-wrap"><table><thead><tr><th>N.º</th><th>Plan (asignatura · curso)</th><th>Semana del plan</th><th>Plan creado el</th><th>Fecha límite</th><th>Observación</th><th>Tareas en casa</th><th>Talleres en clase</th><th>Lecciones</th></tr></thead><tbody>' + filasHtml + '</tbody></table></div></div>';
    }).join('');
    return {doc:doc, rank:rankDocente, html:'<div class="card" style="border-top:4px solid '+pastel+';"><h2>' + escapeHtml(nombreFormal(doc)) + '</h2>' + mesesHtml + '</div>'};
  }).filter(Boolean);

  bloques.sort(function(a,b){
    if(banda==='colegio') return ((a.doc.apellidos||'')+(a.doc.nombres||'')).localeCompare((b.doc.apellidos||'')+(b.doc.nombres||''));
    return a.rank!==b.rank ? a.rank-b.rank : ((a.doc.apellidos||'')+(a.doc.nombres||'')).localeCompare((b.doc.apellidos||'')+(b.doc.nombres||''));
  });

  var bloquesHtml = bloques.map(function(b){ return b.html; }).join('');
  return formHtml + (bloquesHtml || '<div class="card"><div class="empty-state"><div class="ic">📅</div>No hay planes semanales en el rango de fechas indicado.</div></div>');
}

  if(fi) fi.addEventListener('change', function(e){ state.presentacionForm.fechaInicio = e.target.value; render(); });
  var ff = document.getElementById('ppFechaFin');

/* ============================= ADMIN: PRESENTACIÓN DE PCA (solo admin) ============================= */
/* Toma los PCA del docente cuya fecha de creación cae dentro del rango de corte elegido por el
   admin, filtrados por banda (Escuela: Iniciales a 6.º EGB / Colegio: 7.º EGB a 3.º BGU). La
   Observación combina dos cosas: que el PCA esté lleno hasta la unidad de corte configurada y que
   se haya creado antes de la Fecha Límite que ese mismo PCA tiene guardada (editable solo por el
   admin). */
/* El registro de LS.PCA es solo el encabezado — sus semanas viven aparte en LS.CONT (ver
   savePca) — así que para poder evaluar pcaEstaCompleto() aquí hay que reconstruir esa lista de
   unidades con sus filas, igual que hacen openPcaForm/duplicatePca/importarPca al abrir el
   formulario. Sin esto, pcaEstaCompleto() siempre recibía un PCA sin ninguna unidad y marcaba
   "Incompleto" sin importar cuánto contenido real tuviera. */
function unidadesParaCompletitud(pcaId, unidadesNombres){
  var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  return (unidadesNombres||[]).map(function(nombre){
    return { filas: cont.filter(function(c){ return c.unidad===nombre; }) };
  });
}
function filasPresentacionPcaDocente(docenteId, fechaInicioParte, fechaFinParte, banda){
  return load(LS.PCA).filter(function(p){
    var fecha = (p.createdAt||'').slice(0,10);
    if(p.docenteId!==docenteId || !fecha || fecha<fechaInicioParte || fecha>fechaFinParte) return false;
    var curso = p.curso==='Otro…' ? p.cursoManual : p.curso;
    return esEscuelaPorNivelCurso(p.nivel, curso) === (banda==='escuela');
  }).map(function(p){
    var curso = (p.curso==='Otro…' ? p.cursoManual : p.curso) || '—';
    var pcaConUnidades = { unidades: unidadesParaCompletitud(p.id, p.unidadesNombres) };
    var completo = pcaEstaCompleto(pcaConUnidades, unidadCortePca(banda));
    /* Compara contra CUÁNDO QUEDÓ COMPLETO (completadoEn), no contra cuándo se creó — ver la nota
       en savePca. Los PCA guardados antes de que existiera este campo no lo tienen: para esos,
       usa updatedAt (la última edición) como el mejor dato disponible, aunque no sea exacto si
       el docente siguió editando otras cosas después de completarlo. */
    var fechaParaObservacion = p.completadoEn || p.updatedAt;
    var estado = calcularEstadoPresentacion(completo, fechaParaObservacion, p.fechaLimite);
    return {
      asignatura: (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || '—',
      curso: curso, cursoRaw: p.curso==='Otro…' ? p.cursoManual : p.curso,
      nivel: p.nivel||'—', especialidad: p.especialidad||'',
      unidades: (p.unidadesNombres||[]).length,
      createdAt:p.createdAt, completadoEn: completo ? fechaParaObservacion : '', fechaLimite:p.fechaLimite, estado:estado
    };
  });
}
