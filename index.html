/* La fecha límite VIGENTE de una categoría es la más recientemente registrada — esa es la que
   se usa para autorellenar el campo Fecha Límite de un PCA o Plan Semanal nuevo. */
function fechaLimiteVigente(categoria){
  var entradas = load(LS.FECHAS_LIMITE).filter(function(x){ return x.categoria===categoria; });
  if(!entradas.length) return '';
  entradas.sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); });
  return entradas[entradas.length-1].fechaHoraLimite || '';
}
function fechaLimiteRowHtml(x){
  if(state.editingFechaLimiteId === x.id){
    return '<tr>'
      + '<td><input class="cell-input" type="datetime-local" id="fl-edit-fecha-' + x.id + '" value="' + escapeHtml(x.fechaHoraLimite||'') + '" /></td>'
      + '<td><input class="cell-input" id="fl-edit-nota-' + x.id + '" value="' + escapeHtml(x.nota||'') + '" placeholder="p.ej. Trimestre 1" /></td>'
      + '<td>' + fmtDateTime(x.createdAt) + '</td>'
      + '<td style="white-space:nowrap;"><button class="btn btn-primary btn-sm" data-save-fechalimite="' + x.id + '">Guardar</button> <button class="btn btn-ghost btn-sm" data-cancel-fechalimite="' + x.id + '">Cancelar</button></td>'
      + '</tr>';
  }
  return '<tr>'
    + '<td>' + fmtDateTimeLocal(x.fechaHoraLimite) + '</td>'
    + '<td>' + escapeHtml(x.nota||'—') + '</td>'
    + '<td>' + fmtDateTime(x.createdAt) + '</td>'
    + '<td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" data-edit-fechalimite="' + x.id + '">Editar</button> <button class="btn btn-danger btn-sm" data-delete-fechalimite="' + x.id + '">Eliminar</button></td>'
    + '</tr>';
}
function categoriaFechaLimiteCardHtml(categoria, titulo, agruparPorMes){
  var entradas = load(LS.FECHAS_LIMITE).filter(function(x){ return x.categoria===categoria; });
  var vigente = fechaLimiteVigente(categoria);
  var theadHtml = '<thead><tr><th>Fecha y hora límite</th><th>Nota</th><th>Registrada el</th><th></th></tr></thead>';

  var tableHtml = '';
  if(!entradas.length){
    tableHtml = '';
  } else if(agruparPorMes){
    var porMes = {}; var ordenMeses = [];
    entradas.forEach(function(x){
      var info = trimestreYMesDe((x.fechaHoraLimite||'').slice(0,10));
      var key = info ? info.mesKey : 'zzz-sin-fecha';
      var label = info ? info.mesLabel : 'Sin fecha';
      var ordenKey = info ? info.mesOrdenKey : 'zzz-sin-fecha';
      if(!porMes[key]){ porMes[key] = {label:label, ordenKey:ordenKey, items:[]}; ordenMeses.push(key); }
      porMes[key].items.push(x);
    });
    ordenMeses.sort(function(a,b){ return porMes[a].ordenKey.localeCompare(porMes[b].ordenKey); });
    tableHtml = ordenMeses.map(function(mk){
      var g = porMes[mk];
      var rows = g.items.slice().sort(function(a,b){ return (a.fechaHoraLimite||'').localeCompare(b.fechaHoraLimite||''); }).map(fechaLimiteRowHtml).join('');
      return '<div style="margin-top:18px;"><h3 style="font-size:16px; font-weight:700; color:var(--blue-900); margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid var(--line-strong);">' + escapeHtml(g.label) + '</h3><div class="table-wrap"><table>' + theadHtml + '<tbody>' + rows + '</tbody></table></div></div>';
    }).join('');
  } else {
    var rows = entradas.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).map(fechaLimiteRowHtml).join('');
    tableHtml = '<div class="table-wrap" style="margin-top:14px;"><table>' + theadHtml + '<tbody>' + rows + '</tbody></table></div>';
  }

  return ''
    + '<div class="card"'+pastelBorde('fechaslimite')+'>'
    + '  <h2>' + escapeHtml(titulo) + '</h2>'
    + '  <div class="card-sub">' + (vigente ? 'Fecha vigente actual (se usa para autorellenar los nuevos ' + escapeHtml(titulo) + '): <strong>' + escapeHtml(fmtDateTimeLocal(vigente)) + '</strong>' : 'Todavía no hay ninguna fecha límite registrada para esta categoría.') + '</div>'
    + '  <div class="grid-3" style="align-items:end;">'
    + '    <div class="field"><label>Fecha y hora límite</label><input class="cell-input" type="datetime-local" id="fl-fecha-' + categoria + '" /></div>'
    + '    <div class="field"><label>Nota (opcional)</label><input class="cell-input" id="fl-nota-' + categoria + '" placeholder="p.ej. Trimestre 1" /></div>'
    + '    <button class="btn btn-primary" data-add-fechalimite="' + categoria + '" style="height:41px;">+ Agregar</button>'
    + '  </div>'
    + '  <div style="margin-top:10px;">'
    + '    <button class="btn btn-danger btn-sm" data-apply-fechalimite="' + categoria + '" title="Usa la fecha escrita arriba y la escribe en TODOS los ' + (categoria==='pca'?'PCA':'Planes Semanales') + ' que ya existen, reemplazando la que cada uno tenía">⚠️ Aplicar esa fecha a TODOS los ' + (categoria==='pca'?'PCA':'Planes Semanales') + ' ya existentes</button>'
    + '  </div>'
    + tableHtml
    + '</div>';
}

    + categoriaFechaLimiteCardHtml('pca', 'PCA', false)

function bindAdminFechasLimiteEvents(){
  document.querySelectorAll('[data-add-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var categoria = btn.getAttribute('data-add-fechalimite');
      var fechaInput = document.getElementById('fl-fecha-' + categoria);
      var notaInput = document.getElementById('fl-nota-' + categoria);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .concat() en vez de .push() sobre load(): load() devuelve la MISMA referencia que
         FS_CACHE, así que empujar directo a ese arreglo hacía que save() comparara el caché
         contra sí mismo (ya con la fila nueva adentro) y creyera que "nada cambió" — la fila
         se veía en pantalla pero nunca se escribía a Firestore. */
      var entradas = load(LS.FECHAS_LIMITE).concat([{id: uid('fl'), categoria: categoria, fechaHoraLimite: fecha, nota: (notaInput.value||'').trim(), createdAt: nowISO()}]);
      save(LS.FECHAS_LIMITE, entradas);
      toast('Fecha límite agregada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-apply-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var categoria = btn.getAttribute('data-apply-fechalimite');
      var fecha = document.getElementById('fl-fecha-' + categoria).value;
      if(!fecha){ toast('Escribe primero la fecha y hora límite que quieres aplicar.', 'error'); return; }
      if(categoria === 'pca'){
        var todosPca = load(LS.PCA);
        if(!todosPca.length){ toast('Todavía no hay ningún PCA registrado.', 'error'); return; }
        confirmDialog('¿Aplicar la fecha límite ' + fmtDateTimeLocal(fecha) + ' a los ' + todosPca.length + ' PCA que ya existen? Se reemplaza la fecha límite individual que cada uno tenía guardada.', function(){
          save(LS.PCA, todosPca.map(function(p){ return Object.assign({}, p, {fechaLimite: fecha}); }));
          toast('Fecha límite aplicada a ' + todosPca.length + ' PCA existentes.', 'success');
          render();
        }, 'Aplicar a todos');
      } else {
        var todosSem = load(LS.SEMANAL);
        if(!todosSem.length){ toast('Todavía no hay ningún Plan Semanal registrado.', 'error'); return; }
        confirmDialog('¿Aplicar la fecha límite ' + fmtDateTimeLocal(fecha) + ' a los ' + todosSem.length + ' Planes Semanales que ya existen? Se reemplaza la fecha límite individual que cada uno tenía guardada.', function(){
          save(LS.SEMANAL, todosSem.map(function(s){ return Object.assign({}, s, {fechaHoraLimite: fecha}); }));
          toast('Fecha límite aplicada a ' + todosSem.length + ' Planes Semanales existentes.', 'success');
          render();
        }, 'Aplicar a todos');
      }
    };
  });
  document.querySelectorAll('[data-edit-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = btn.getAttribute('data-edit-fechalimite');
      render();
    };
  });
  document.querySelectorAll('[data-cancel-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = null;
      render();
    };
  });
  document.querySelectorAll('[data-save-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-save-fechalimite');
      var fechaInput = document.getElementById('fl-edit-fecha-' + id);
      var notaInput = document.getElementById('fl-edit-nota-' + id);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .map() para construir un objeto y un arreglo nuevos, por la misma razón que en
         "+ Agregar": mutar la entrada y el arreglo que devuelve load() en el sitio hacía que
         save() los comparara contra sí mismos y nunca detectara el cambio. */
      var entradas = load(LS.FECHAS_LIMITE).map(function(x){
        return x.id===id ? Object.assign({}, x, {fechaHoraLimite: fecha, nota: (notaInput.value||'').trim()}) : x;
      });
      save(LS.FECHAS_LIMITE, entradas);
      state.editingFechaLimiteId = null;
      toast('Fecha límite actualizada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-delete-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      confirmDialog('¿Eliminar esta fecha límite?', function(){
        eliminarConDeshacer(LS.FECHAS_LIMITE, btn.getAttribute('data-delete-fechalimite'), 'Fecha límite eliminada.', 'Fecha límite restaurada.');
        render();
      });
    };
  });
}

/* No hay tarea de fondo en un servidor que borre la papelera sola con el tiempo — se revisa y
   purga lo vencido cada vez que un admin abre esta pantalla (que es, en la práctica, la única
   forma en que alguien la va a ver). */
function purgarPapeleraVencida(){
  var actuales = load(LS.PAPELERA);
  var ahora = Date.now();
  var vigentes = actuales.filter(function(e){
    return (ahora - new Date(e.eliminadoEn).getTime()) < PAPELERA_DIAS_RETENCION*24*60*60*1000;
  });
  if(vigentes.length !== actuales.length) save(LS.PAPELERA, vigentes);
}

/* Recordatorio de respaldo semanal: como esta app no tiene servidor propio para programar tareas,
   "automático" se implementa como un aviso que aparece solo cuando ya toca (7 días desde el
   último respaldo descargado) — se guarda la fecha de la última descarga en config/respaldo. Un
   verdadero archivo descargado sin que nadie haga clic no es posible de forma confiable desde el
   navegador (se bloquea o pide confirmación), así que este aviso empuja a hacerlo con un clic. */
var RESPALDO_DIAS_RECORDATORIO = 7;
function configRespaldo(){
  return load(LS.CONFIG).find(function(c){ return c.id==='respaldo'; }) || {id:'respaldo', ultimaDescarga:''};
}
function registrarRespaldoDescargado(){
  var otros = load(LS.CONFIG).filter(function(c){ return c.id!=='respaldo'; });
  save(LS.CONFIG, otros.concat([{id:'respaldo', ultimaDescarga: nowISO()}]));
}
function respaldoRecordatorioHtml(){
  var cfg = configRespaldo();
  var dias = cfg.ultimaDescarga ? Math.floor((Date.now() - new Date(cfg.ultimaDescarga).getTime()) / 86400000) : null;
  if(dias !== null && dias < RESPALDO_DIAS_RECORDATORIO) return '';
  var texto = dias === null
    ? 'Todavía no se ha descargado ningún respaldo desde este panel. Te recomendamos descargar uno ahora y repetirlo cada semana.'
    : 'Han pasado ' + dias + ' días desde tu último respaldo descargado (' + fmtDateTime(cfg.ultimaDescarga) + '). Te recomendamos descargar uno nuevo.';
  return '<div class="lock-banner no-print" style="margin-bottom:14px;">⚠️ ' + escapeHtml(texto) + ' <button class="btn btn-primary btn-sm" id="btnRespaldoRecordatorio" style="margin-left:10px;">Descargar ahora</button></div>';
}
function renderPapeleraLista(){
  var entradas = load(LS.PAPELERA).slice().sort(function(a,b){ return (b.eliminadoEn||'').localeCompare(a.eliminadoEn||''); });
  if(!entradas.length) return '<div class="hint" style="margin-top:10px;">La papelera está vacía.</div>';
  var docentesById = {}; allDocentes().forEach(function(x){ docentesById[x.id]=x; });
  var rows = entradas.map(function(e){
    var vence = addDays((e.eliminadoEn||'').slice(0,10), PAPELERA_DIAS_RETENCION);
    return '<tr>'
      + '<td>' + escapeHtml(e.resumen) + '</td>'
      + '<td>' + escapeHtml(e.eliminadoPorNombre||'—') + '</td>'
      + '<td>' + fmtDateTime(e.eliminadoEn) + '</td>'
      + '<td>' + fmtDate(vence) + '</td>'
      + '<td><button class="btn btn-primary btn-sm" data-restaurar-papelera="' + e.id + '">Restaurar</button> <button class="btn btn-danger btn-sm" data-purgar-papelera="' + e.id + '">Eliminar definitivamente</button></td>'
      + '</tr>';
  }).join('');
  return '<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>Qué se eliminó</th><th>Quién lo eliminó</th><th>Cuándo</th><th>Se borra en serio el</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
/* Las 4 colecciones originales (DOCENTES/CARGA/PCA/CONT/SEMANAL) usan los nombres de siempre en
   el .json por compatibilidad con respaldos viejos; el resto se agregó después con el nombre de
   su propia clave LS. */
var RESPALDO_CAMPOS = {
  DOCENTES:'DOCENTES', CARGA:'CARGA_HORARIA', PCA:'PCA', CONT:'CONTENIDOS_ANUALES', SEMANAL:'PLAN_SEMANAL',
  ESTUDIANTES:'ESTUDIANTES', ASISTENCIA:'ASISTENCIA', INCIDENTES:'INCIDENTES', OBSERVACIONES:'OBSERVACIONES',
  DECE:'DECE', FICHA_DETECCION:'FICHA_DETECCION', FECHAS_LIMITE:'FECHAS_LIMITE', CONFIG:'CONFIG'
};
async function descargarRespaldoCompleto(){
  var payload = { exportedAt: nowISO() };
  Object.keys(RESPALDO_CAMPOS).forEach(function(key){ payload[RESPALDO_CAMPOS[key]] = load(LS[key]); });
  var json = JSON.stringify(payload, null, 2);
  var filename = 'respaldo_seb_' + todayISO() + '.json';
  if(!window.claude || !window.claude.downloads){
    browserDownloadFallback(filename, json);
    registrarRespaldoDescargado();
    toast('Respaldo descargado.', 'success');
    render();
    return;
  }
  try{
    await window.claude.downloads.save({filename: filename, data: json});
    registrarRespaldoDescargado();
    toast('Respaldo descargado.', 'success');
    render();
  }catch(err){ if(err && err.code!=='declined') toast('No se pudo exportar: ' + (err.message||err.code), 'error'); }
}
function bindDatabaseEvents(){
  document.getElementById('btnExportAll').onclick = descargarRespaldoCompleto;
  var btnRecordatorio = document.getElementById('btnRespaldoRecordatorio');
  if(btnRecordatorio) btnRecordatorio.onclick = descargarRespaldoCompleto;
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var total = 0;
        Object.keys(RESPALDO_CAMPOS).forEach(function(key){ total += mergeBy(LS[key], data[RESPALDO_CAMPOS[key]] || []); });
        document.getElementById('importResult').textContent = 'Fusionado: ' + total + ' registros procesados.';
        toast('Base de datos fusionada correctamente.', 'success');
        render();
      }catch(err){ toast('El archivo no es un respaldo válido.', 'error'); }
    };
    reader.readAsText(file);
  });
  document.querySelectorAll('[data-restaurar-papelera]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-restaurar-papelera');
      var entrada = load(LS.PAPELERA).find(function(x){ return x.id===id; });
      confirmDialog('¿Restaurar "' + (entrada?entrada.resumen:'') + '"? Vuelve a aparecer donde estaba antes de eliminarse.', function(){
        restaurarDePapelera(id);
        toast('Restaurado correctamente.', 'success');
        render();
      }, 'Restaurar');
    };
  });
  document.querySelectorAll('[data-purgar-papelera]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-purgar-papelera');
      confirmDialog('¿Eliminar esto de la papelera para siempre? Ya no se podrá recuperar.', function(){
        quitarDePapelera(id);
        toast('Eliminado definitivamente.', 'success');
        render();
      });
    };
  });
}
function mergeBy(key, incoming){
  var current = load(key);
  var map = {};
  current.forEach(function(r){ map[r.id] = r; });
  incoming.forEach(function(r){ if(r && r.id) map[r.id] = r; });
  save(key, Object.values(map));
  return incoming.length;
}

/* ============================= FIREBASE BOOTSTRAP ============================= */
/* Mantiene FS_CACHE sincronizada en tiempo real con Firestore mientras haya sesión activa:
   onSnapshot entrega el estado inicial y cada cambio posterior (propio o de otro docente/admin),
   así que un simple render() en cada callback basta para reflejar los cambios al instante en
   todas las pestañas/dispositivos abiertos. */
var FS_UNSUBS = [];
function detachRealtimeListeners(){
  FS_UNSUBS.forEach(function(u){ try{ u(); }catch(e){} });
  FS_UNSUBS = [];
}
/* Observación de Clases se lee completa solo si eres admin; un docente solo puede LEER sus
   propias observaciones (nunca escribirlas — eso lo exigen también las reglas de Firestore).
   Firestore exige que una consulta de colección completa esté acotada con un where() que calce
   exactamente con la regla de seguridad basada en resource.data, así que hace falta saber el rol
   ANTES de armar la consulta — por eso esta única lectura puntual (no en tiempo real) de la
   colección "docentes" (de lectura pública) se hace primero y se espera antes de suscribirse. */
/* Estudiantes, Asistencia, Incidentes y la Ficha de Datos Informativos (DECE) son de acceso
   exclusivo para roles con acceso administrativo (ver firestore.rules: solo isStaff() puede leer)
   — ni siquiera de forma acotada a lo propio, como sí ocurre con Observaciones/Fichas de
   Detección. Un docente jamás navega
   a esas secciones (no aparecen en su menú), así que no tiene sentido intentar sincronizarlas
   para él: Firestore rechazaría la lectura y solo generaría avisos de error en pantalla.
   ESTUDIANTES y ASISTENCIA salieron de esta lista porque "Mi Asistencia" (menú del docente) las
   necesita: cualquier docente autenticado ve ahora el directorio completo de estudiantes y de
   asistencia de TODA la institución (igual que ya ocurre con carga/pca/semanal, que también se
   sincronizan completos para todos) — la pantalla solo le muestra sus propios cursos, pero un
   docente técnicamente podría inspeccionar en el navegador los datos de otros cursos. */
var COLECCIONES_SOLO_STAFF = ['INCIDENTES', 'DECE', 'PAPELERA'];
/* Ver el comentario dentro de attachRealtimeListeners: evita el redibujado completo (y el
   "congelamiento" que se siente en documentos grandes) cuando el cambio recién llegado es
   simplemente el eco del autoguardado del formulario que el propio docente tiene abierto en este
   momento — su copia en memoria (state.editingPca/editingSemanal/etc.) ya refleja ese cambio. */
function debeOmitirRenderPorEdicionActiva(key){
  /* Mientras el docente tiene abierto un PCA, Plan Semanal o Taller Práctico (formularios pesados,
     con muchos editores de texto enriquecido), CUALQUIER colección que reciba una actualización en
     tiempo real —no solo la propia del formulario— se ignora hasta que salga de esa pantalla. Antes
     esto solo protegía la colección propia (p.ej. SEMANAL mientras edita un Plan Semanal); un cambio
     en cualquier OTRA colección (el eco del autoguardado de otro campo, otro docente guardando algo
     en paralelo, etc.) igual disparaba un redibujado completo de toda la pantalla — visible como un
     "parpadeo" — mientras seguía escribiendo. Su copia en memoria (state.editingPca/editingSemanal/
     editingTaller) ya tiene todo lo que escribió, así que no hace falta reconstruir el HTML por un
     cambio ajeno a lo que está editando. */
  if(state.subview === 'pcaform' && state.editingPca) return true;
  if(state.subview === 'semanalform' && state.editingSemanal) return true;
  if(state.subview === 'tallerform' && state.editingTaller) return true;
  if(key === 'FICHA_DETECCION' && state.subview === 'fichadeteccion' && state.fichaDeteccionView === 'form' && state.editingFichaDeteccion) return true;
  if(key === 'DECE' && state.subview === 'dece' && state.deceView === 'form' && state.editingDece) return true;
  return false;
}
async function attachRealtimeListeners(){
  detachRealtimeListeners();
  var soyAdmin = false;
  var soyInspector = false;
  try{
    var docentesSnap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
    docentesSnap.forEach(function(d){
      if(d.id !== CURRENT_UID) return;
      if(isStaffRole(d.data().role)) soyAdmin = true;
      else if(d.data().role === 'inspector') soyInspector = true;
    });
  }catch(e){ console.error('No se pudo determinar el rol antes de sincronizar', e); }

  Object.keys(FS_COLLECTION).forEach(function(key){
    /* El Inspector General sí necesita INCIDENTES (pestaña Disciplina) aunque no sea "staff" —
       pero NUNCA debe sincronizar DECE (confidencial), la otra colección de esta lista. */
    var permitidoParaInspector = soyInspector && key === 'INCIDENTES';
    if(!soyAdmin && !permitidoParaInspector && COLECCIONES_SOLO_STAFF.indexOf(key)!==-1){ FS_CACHE[key] = []; return; }
    var colRef = window.FB.collection(window.FB.db, FS_COLLECTION[key]);
    var queryRef = ((key === 'OBSERVACIONES' || key === 'FICHA_DETECCION') && !soyAdmin)
      ? window.FB.query(colRef, window.FB.where('docenteId', '==', CURRENT_UID))
      : colRef;
    var unsub = window.FB.onSnapshot(queryRef, function(snap){
      var arr = [];
      snap.forEach(function(docSnap){ arr.push(docSnap.data()); });
      FS_CACHE[key] = arr;
      // El eco de Firestore por el propio autoguardado del docente llega segundos después de
      // escribir; si en ese momento sigue con ese mismo formulario abierto, NO hace falta
      // reconstruir todo el HTML (su copia en memoria ya está al día — es la que se acaba de
      // guardar) y evita el "congelamiento" visible al redibujar un PCA/Plan Semanal grande con
      // muchos editores de texto enriquecido. Las listas y otras vistas sí se siguen refrescando
      // normalmente.
      if(!debeOmitirRenderPorEdicionActiva(key)) render();
    }, function(err){
      console.error('Error de sincronización en tiempo real (' + key + ')', err);
      toast('Se perdió la sincronización en tiempo real: ' + (err.message||err.code), 'error');
    });
    FS_UNSUBS.push(unsub);
  });
}

window.addEventListener('firebase-ready', function(){
  if(ES_FORMULARIO_PUBLICO){
    /* Modo formulario público: solo necesita una sesión anónima para poder ESCRIBIR una ficha
       nueva; nunca activa los listeners en tiempo real ni carga el perfil docente. */
    window.FB.onAuthStateChanged(window.FB.auth, function(user){
      FB_READY = true;
      if(!user){
        window.FB.signInAnonymously(window.FB.auth).catch(function(e){
          console.error('Error de autenticación anónima', e);
        });
      }
      render();
    });
    return;
  }
  window.FB.onAuthStateChanged(window.FB.auth, function(user){
    /* Una sesión anónima (creada por el enlace público del representante legal) puede quedar
       persistida en el mismo navegador; si alguien luego abre el sistema normal con esa sesión
       todavía activa, nunca tendrá un perfil docente — hay que cerrarla en vez de quedarse
       esperando "Cargando tu perfil…" para siempre. */
    if(user && user.isAnonymous){
      window.FB.signOut(window.FB.auth);
      return;
    }
    if(user){
      CURRENT_UID = user.uid;
      attachRealtimeListeners();
    } else {
      CURRENT_UID = null;
      detachRealtimeListeners();
      detenerTodosLosAutoguardados();
      Object.keys(FS_CACHE).forEach(function(k){ FS_CACHE[k] = []; });
      state.subview = 'dashboard';
      RESTORED_LAST_VIEW = false;
      RESTORE_STARTED_AT = null;
    }
    FB_READY = true;
    render();
  });
});

/* ============================= ENLACES EN CAMPOS DE TEXTO SIMPLE ============================= */
/* Los campos de texto enriquecido (Actividades, Recursos, Contenidos…) ya convierten un enlace
   pegado en un <a> clicable (ver linkificarUrls). Los campos de texto SIMPLE (Técnica, Instrumento,
   Página, etc. — un <input>, no un contenteditable) nunca pueden contener HTML, así que un enlace
   pegado ahí se quedaba como texto plano sin forma de abrirlo. Esto agrega, a CUALQUIER
   input.cell-input de tipo texto cuyo valor sea una URL, un botoncito 🔗 que la abre en una pestaña
   nueva — sin tocar cada uno de los formularios: un MutationObserver sobre #app detecta cualquier
   input nuevo (los hay decenas, repartidos en más de 50 formularios) y lo envuelve una sola vez. */
var ENLACE_CAMPO_REGEX = /^(https?:\/\/|www\.)\S+$/i;
function esUrlDeCampo(valor){ return ENLACE_CAMPO_REGEX.test((valor||'').trim()); }
function normalizarUrlCampo(valor){
  var v = (valor||'').trim();
  return /^https?:\/\//i.test(v) ? v : 'https://' + v;
}
function refrescarBotonEnlaceCampo(input, wrap, btn){
  var esUrl = esUrlDeCampo(input.value);
  wrap.classList.toggle('has-link', esUrl);
  if(esUrl) btn.setAttribute('data-url', normalizarUrlCampo(input.value));
}
function activarEnlacesEnCamposDeTexto(root){
  (root||document).querySelectorAll('input.cell-input').forEach(function(input){
    if(input.dataset.linkBtnInit) return;
    if(input.type && input.type !== 'text') return;
    input.dataset.linkBtnInit = '1';
    var wrap = document.createElement('span');
    wrap.className = 'input-link-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'input-link-btn';
    btn.title = 'Abrir enlace';
    btn.textContent = '🔗';
    wrap.appendChild(btn);
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var url = btn.getAttribute('data-url');
      if(url) window.open(url, '_blank', 'noopener');
    });
    input.addEventListener('input', function(){ refrescarBotonEnlaceCampo(input, wrap, btn); });
    refrescarBotonEnlaceCampo(input, wrap, btn);
  });
}
(function(){
  var appRoot = document.getElementById('app');
  if(!appRoot) return;
  var pendiente = null;
  var observer = new MutationObserver(function(){
    if(pendiente) return;
    pendiente = requestAnimationFrame(function(){ pendiente = null; activarEnlacesEnCamposDeTexto(appRoot); });
  });
  observer.observe(appRoot, {childList:true, subtree:true});
})();

/* ============================= INIT ============================= */
render();
})();
</script>
