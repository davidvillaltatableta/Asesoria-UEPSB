/* Iniciales/Preparatoria y Básica Elemental: horas semanales se activa apenas se marca la
   asignatura. Del resto de niveles (que incluyen 7.º EGB en adelante) en adelante, se activa
   solo cuando ya se eligió al menos un curso, para no mostrar un valor ambiguo antes de saber
   el curso/paralelo exacto. */
function horasRequiereCurso(nivel){
  return nivel !== 'Iniciales y Preparatoria' && nivel !== 'Básica Elemental';
}
/* Evita que el docente registre la misma combinación Nivel+Especialidad en dos filas distintas
   de su Carga Horaria: una vez usada en una fila, esa combinación deja de ofrecerse en las
   demás filas (debe seguir agregando cursos/asignaturas dentro de la misma fila en su lugar). */
function cargaPairsUsadosEnOtrasFilas(rows, excludeId){
  var used = {};
  (rows||[]).forEach(function(r){
    if(r.id===excludeId || !r.nivel) return;
    used[r.nivel + '||' + (r.especialidad||'')] = true;
  });
  return used;
}
function cargaNivelAgotado(nivel, used){
  var esps = especialidadesFor(nivel);
  var posibles = esps.length ? esps : [''];
  return posibles.every(function(e){ return used[nivel+'||'+e]; });
}
function cargaRowHtml(r, i, rows){
  var usedPairs = cargaPairsUsadosEnOtrasFilas(rows, r.id);
  var nivelOpts = NIVELES.filter(function(n){ return n===r.nivel || !cargaNivelAgotado(n, usedPairs); });
  var espOpts = especialidadesFor(r.nivel).filter(function(e){ return e===r.especialidad || !usedPairs[r.nivel+'||'+e]; });

  var cursoOpts = cursosFor(r.nivel, r.especialidad);
  var allCursoOpts = cursoOpts.concat((r.cursos||[]).filter(function(c){ return cursoOpts.indexOf(c)===-1; }));
  var cursoBoxHtml = !r.nivel
    ? '<div class="hint">Selecciona primero el nivel educativo.</div>'
    : (allCursoOpts.length===0
        ? '<div class="hint">No hay cursos registrados para este nivel.</div>'
        : allCursoOpts.map(function(c){
            return '<label class="checkbox-pill"><input type="checkbox" class="carga-curso-cb" value="'+escapeHtml(c)+'" '+((r.cursos||[]).indexOf(c)!==-1?'checked':'')+' />'+escapeHtml(c)+'</label>';
          }).join(''));

  var asigOpts = asignaturasFor(r.nivel, r.especialidad);
  // include any already-selected asignaturas not in the standard list (manually added) so they still show as pills
  var allAsigOpts = asigOpts.concat((r.asignaturas||[]).filter(function(a){ return asigOpts.indexOf(a)===-1; }));
  var asigBoxHtml = !r.nivel
    ? '<div class="hint">Selecciona primero el nivel educativo.</div>'
    : (allAsigOpts.length===0
        ? '<div class="hint">No hay asignaturas registradas para este nivel.</div>'
        : allAsigOpts.map(function(a){
            return '<label class="checkbox-pill"><input type="checkbox" class="carga-asig-cb" value="'+escapeHtml(a)+'" '+((r.asignaturas||[]).indexOf(a)!==-1?'checked':'')+' />'+escapeHtml(a)+'</label>';
          }).join(''));

  var horasHtml;
  if(!r.nivel || !(r.asignaturas||[]).length){
    horasHtml = '<div class="hint">—</div>';
  } else if(horasRequiereCurso(r.nivel) && !(r.cursos||[]).length){
    horasHtml = '<div class="hint">Elige primero el curso.</div>';
  } else {
    horasHtml = (r.asignaturas||[]).map(function(a){
      var v = (r.horas && r.horas[a]!=null) ? r.horas[a] : '';
      return '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; white-space:nowrap;"><span style="font-size:12px;">'+escapeHtml(a)+'</span><input type="number" min="0" step="0.5" class="cell-input carga-horas-input" data-asig="'+escapeHtml(a)+'" style="width:56px; flex:none;" value="'+escapeHtml(v)+'" /></div>';
    }).join('');
  }

  return ''
  + '<tr data-row="' + r.id + '">'
  + '  <td class="tabular">' + (i+1) + '</td>'
  + '  <td><select class="cell-select" data-f="nivel">' + optionsHtml(nivelOpts, r.nivel, 'Selecciona…') + '</select></td>'
  + '  <td><select class="cell-select" data-f="especialidad" ' + (espOpts.length? '' : 'disabled') + '>' + optionsHtml(espOpts, r.especialidad, espOpts.length? 'Selecciona…':'No aplica') + '</select></td>'
  + '  <td>'
  + '    <div class="checkbox-grid" data-cursobox="' + r.id + '">' + cursoBoxHtml + '</div>'
  + (r.nivel ? (
      '    <div class="add-inline"><input type="text" class="cell-input carga-curso-manual" data-rowid="'+r.id+'" placeholder="¿No está en la lista? Escríbelo…" /><button type="button" class="btn btn-ghost btn-sm" data-addcursomanual="'+r.id+'">+ Agregar</button></div>'
      + '    <div style="display:flex; gap:8px; margin-top:6px;"><button type="button" class="btn btn-ghost btn-sm" data-cursoall="'+r.id+'">Todos</button><button type="button" class="btn btn-ghost btn-sm" data-cursonone="'+r.id+'">Ninguno</button></div>'
    ) : '')
  + '  </td>'
  + '  <td>'
  + '    <div class="checkbox-grid" data-asigbox="' + r.id + '">' + asigBoxHtml + '</div>'
  + (r.nivel ? (
      '    <div class="add-inline"><input type="text" class="cell-input carga-asig-manual" data-rowid="'+r.id+'" placeholder="¿No está en la lista? Escríbela…" /><button type="button" class="btn btn-ghost btn-sm" data-addasigmanual="'+r.id+'">+ Agregar</button></div>'
      + '    <div style="display:flex; gap:8px; margin-top:6px;"><button type="button" class="btn btn-ghost btn-sm" data-asigall="'+r.id+'">Todas</button><button type="button" class="btn btn-ghost btn-sm" data-asignone="'+r.id+'">Ninguna</button></div>'
    ) : '')
  + '  </td>'
  + '  <td>' + horasHtml + '</td>'
  + '  <td><button class="row-remove" data-remove-row="' + r.id + '" title="Quitar fila">✕</button></td>'
  + '</tr>';
}
function optionsHtml(list, selected, placeholder, labelFn){
  var html = placeholder ? '<option value="">' + escapeHtml(placeholder) + '</option>' : '';
  html += list.map(function(o){ return '<option value="' + escapeHtml(o) + '" ' + (o===selected?'selected':'') + '>' + escapeHtml(labelFn ? labelFn(o) : o) + '</option>'; }).join('');
  return html;
}

function bindCargaHorariaEvents(){
  var editBtn = document.getElementById('btnEditCarga');
  if(editBtn){
    editBtn.onclick = function(){
      cargaEditRows = null;
      state.cargaEditing = true;
      render();
    };
    return;
  }
  var body = document.getElementById('cargaBody');
  function findRow(id){ return cargaEditRows.find(function(r){ return r.id===id; }); }

  body.querySelectorAll('tr').forEach(function(tr){
    var id = tr.getAttribute('data-row');
    tr.querySelectorAll('select[data-f]').forEach(function(el){
      el.addEventListener('change', function(){
        var row = findRow(id);
        row[el.getAttribute('data-f')] = el.value;
        if(el.getAttribute('data-f') === 'nivel'){ row.especialidad=''; row.cursos=[]; row.asignaturas=[]; row.horas={}; renderCargaBodyOnly(); }
        else if(el.getAttribute('data-f') === 'especialidad'){ row.cursos=[]; row.asignaturas=[]; row.horas={}; renderCargaBodyOnly(); }
      });
    });
    tr.querySelectorAll('.carga-curso-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var row = findRow(id);
        row.cursos = row.cursos || [];
        if(cb.checked){ if(row.cursos.indexOf(cb.value)===-1) row.cursos.push(cb.value); }
        else{ row.cursos = row.cursos.filter(function(c){ return c!==cb.value; }); }
        renderCargaBodyOnly();
      });
    });
    tr.querySelectorAll('.carga-asig-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var row = findRow(id);
        row.asignaturas = row.asignaturas || [];
        if(cb.checked){ if(row.asignaturas.indexOf(cb.value)===-1) row.asignaturas.push(cb.value); }
        else{ row.asignaturas = row.asignaturas.filter(function(a){ return a!==cb.value; }); if(row.horas) delete row.horas[cb.value]; }
        renderCargaBodyOnly();
      });
    });
    tr.querySelectorAll('.carga-horas-input').forEach(function(inp){
      inp.addEventListener('input', function(){
        var row = findRow(id);
        row.horas = row.horas || {};
        row.horas[inp.getAttribute('data-asig')] = inp.value;
      });
    });
  });
  document.querySelectorAll('[data-cursoall]').forEach(function(btn){
    btn.onclick = function(){
      var row = findRow(btn.getAttribute('data-cursoall'));
      row.cursos = cursosFor(row.nivel, row.especialidad).slice();
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('[data-cursonone]').forEach(function(btn){
    btn.onclick = function(){ findRow(btn.getAttribute('data-cursonone')).cursos = []; renderCargaBodyOnly(); };
  });
  document.querySelectorAll('[data-addcursomanual]').forEach(function(btn){
    btn.onclick = function(){
      var rowId = btn.getAttribute('data-addcursomanual');
      var input = document.querySelector('.carga-curso-manual[data-rowid="'+rowId+'"]');
      var v = (input.value||'').trim();
      if(!v) return;
      var row = findRow(rowId);
      row.cursos = row.cursos || [];
      var exists = row.cursos.some(function(c){ return c.toLowerCase()===v.toLowerCase(); });
      if(!exists) row.cursos.push(v);
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('.carga-curso-manual').forEach(function(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-addcursomanual="'+input.getAttribute('data-rowid')+'"]').click(); }
    });
  });
  document.querySelectorAll('[data-asigall]').forEach(function(btn){
    btn.onclick = function(){
      var row = findRow(btn.getAttribute('data-asigall'));
      row.asignaturas = asignaturasFor(row.nivel, row.especialidad).slice();
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('[data-asignone]').forEach(function(btn){
    btn.onclick = function(){ var row = findRow(btn.getAttribute('data-asignone')); row.asignaturas = []; row.horas = {}; renderCargaBodyOnly(); };
  });
  document.querySelectorAll('[data-addasigmanual]').forEach(function(btn){
    btn.onclick = function(){
      var rowId = btn.getAttribute('data-addasigmanual');
      var input = document.querySelector('.carga-asig-manual[data-rowid="'+rowId+'"]');
      var v = (input.value||'').trim();
      if(!v) return;
      var row = findRow(rowId);
      row.asignaturas = row.asignaturas || [];
      var exists = row.asignaturas.some(function(a){ return a.toLowerCase()===v.toLowerCase(); });
      if(!exists) row.asignaturas.push(v);
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('.carga-asig-manual').forEach(function(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-addasigmanual="'+input.getAttribute('data-rowid')+'"]').click(); }
    });
  });
  document.querySelectorAll('[data-remove-row]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-remove-row');
      cargaEditRows = cargaEditRows.filter(function(r){ return r.id!==id; });
      renderCargaBodyOnly();
    };
  });
  document.getElementById('btnAddCargaRow').onclick = function(){
    cargaEditRows.push(blankCargaRow());
    renderCargaBodyOnly();
  };
  var cancelBtn = document.getElementById('btnCancelCarga');
  if(cancelBtn) cancelBtn.onclick = function(){
    cargaEditRows = null;
    state.cargaEditing = false;
    render();
  };
  document.getElementById('btnSaveCarga').onclick = function(){
    var d = currentDocente();
    var all = load(LS.CARGA).filter(function(r){ return r.docenteId !== d.id; });
    var toSave = [];
    cargaEditRows.forEach(function(r){
      if(!r.nivel || !(r.cursos||[]).length || !(r.asignaturas||[]).length) return;
      r.cursos.forEach(function(curso){
        r.asignaturas.forEach(function(asig){
          toSave.push({ id: uid('cg'), docenteId: d.id, nivel:r.nivel, especialidad:r.especialidad||'', curso:curso, asignatura:asig, horasSemanales:(r.horas && r.horas[asig])||'', updatedAt: nowISO() });
        });
      });
    });
    save(LS.CARGA, all.concat(toSave));
    toast('Carga horaria guardada (' + toSave.length + ' asignaturas).', 'success');
    cargaEditRows = null;
    state.cargaEditing = false;
    render();
  };
}
function renderCargaBodyOnly(){
  document.getElementById('cargaBody').innerHTML = cargaEditRows.map(function(r,i){ return cargaRowHtml(r,i,cargaEditRows); }).join('');
  bindCargaHorariaEvents();
}

/* ============================= FILTRO ADMIN: Docente / Fecha de corte / Asignatura / Curso =============================
   Compartido entre la lista de PCA y la de Planes Semanales (solo admin). Asignatura y Curso solo
   se habilitan una vez elegido un docente (sus opciones salen de la Carga Horaria de ESE docente).
   El campo Curso solo tiene efecto sobre los PCA/Planes de niveles 7.º EGB a 3.º BGU — para
   Iniciales a 6.º EGB, ver nivelEsBandaA(), el filtro de curso se ignora. */
function adminFiltroBarraHtml(filtro, idPrefix, tituloCurso){
  var docentes = allDocentes().sort(function(a,b){ return (a.nombres||'').localeCompare(b.nombres||''); });
  var docOpts = '<option value="">Todos los docentes</option>' + docentes.map(function(x){
    return '<option value="'+x.id+'" '+(filtro.docenteId===x.id?'selected':'')+'>'+escapeHtml(nombreFormal(x))+'</option>';
  }).join('');
  var asigOpts = filtro.docenteId ? misAsignaturas(filtro.docenteId) : [];
  var cursoOpts = filtro.docenteId ? misCursosTodos(filtro.docenteId) : [];
  return ''
    + '<div class="card" style="margin-bottom:16px;">'

/* Agrupa una lista de registros con docenteId (PCA, Planes Semanales, etc.) por docente, en
   orden alfabético apellidos+nombres; los registros cuyo docente ya no existe quedan al final. */
function groupByDocente(records, docentesById){
  var groups = {}; var order = [];
  records.forEach(function(r){
    var key = r.docenteId || '__sin__';
    if(!groups[key]){ groups[key] = {docenteId: r.docenteId, docente: docentesById[r.docenteId], items: []}; order.push(key); }
    groups[key].items.push(r);
  });
  var list = order.map(function(k){ return groups[k]; });
  list.sort(function(a,b){
    if(!a.docente && !b.docente) return 0;
    if(!a.docente) return 1;
    if(!b.docente) return -1;
    return (a.docente.apellidos+a.docente.nombres).localeCompare(b.docente.apellidos+b.docente.nombres);
  });
  return list;
}

/* Filtro admin de PCA, factorizado para reusarlo tanto al pintar la lista como en los botones de
   bloqueo masivo (que necesitan el mismo conjunto "filtrado ahora mismo" sin repetir la lógica). */
function pcasAdminFiltrados(){
  var filtro = state.adminPcaFilter;
  var pcas = load(LS.PCA).slice();
  if(filtro.docenteId) pcas = pcas.filter(function(p){ return p.docenteId===filtro.docenteId; });
  if(filtro.fechaInicio) pcas = pcas.filter(function(p){ return (p.updatedAt||'').slice(0,10) >= filtro.fechaInicio; });
  if(filtro.fechaFin) pcas = pcas.filter(function(p){ return (p.updatedAt||'').slice(0,10) <= filtro.fechaFin; });
  return pcas.filter(function(p){
    var asigOk = !filtro.asignatura || p.asignatura===filtro.asignatura || p.asignaturaManual===filtro.asignatura;
    if(nivelEsBandaA(p.nivel)) return asigOk;
    var cursoOk = !filtro.curso || p.curso===filtro.curso || p.cursoManual===filtro.curso;
    return asigOk && cursoOk;
  });
}

/* Reutiliza la misma mecánica de copia que duplicatePca (nuevos IDs, sin bloqueo, fecha límite
   vigente, se abre en el formulario sin guardar nada todavía) y además dejar la marca de origen
   (importadoDeDocente/importadoFecha) para que quede trazable de quién se copió el contenido —
   ver el aviso en pcaToolbarHtml. */
function importarPca(pcaId){
  var d = currentDocente();
  var header = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  if(!header) return;
  var docenteFuente = allDocentes().find(function(x){ return x.id===header.docenteId; });
  var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  var unidades = (header.unidadesNombres || []).map(function(nombre){
    var filas = cont.filter(function(c){ return c.unidad===nombre; }).sort(function(a,b){ return (a.semana||0)-(b.semana||0); });
    if(filas.length===0) filas = [weekRow(1)];
    return { id: uid('un'), nombre: nombre, filas: filas.map(function(f){ return Object.assign({}, f, {id: uid('wk')}); }) };
  });
  if(unidades.length===0) unidades = [{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}];
  state.editingPca = Object.assign({}, header, {
    id: uid('pca'), docenteId: d.id, locked: false, fechaLimite: fechaLimiteVigente('pca'),
    temporalizacion: (header.temporalizacion||[]).map(function(t){ return Object.assign({}, t, {id: uid('tm')}); }),
    unidades: unidades, elaboradoPor: nombreFormal(d),
    importadoDeDocente: docenteFuente ? nombreFormal(docenteFuente) : '(docente eliminado)', importadoFecha: nowISO(),
    createdAt: nowISO(), updatedAt: nowISO()
  });
  state.pcaImportando = false; state.pcaImportFiltro = null;
  state.pcaReturnTo = 'pcalist';
  toast('Se importó el PCA de ' + (docenteFuente?nombreFormal(docenteFuente):'otro docente') + '. Ajusta lo que necesites (p.ej. el curso) y presiona "Guardar plan" para crearlo.', 'success');
  go('pcaform');
}

    cargaSemanal:'', semanasT1:13, semanasT2:13, semanasT3:13, fechaLimite: fechaLimiteVigente('pca'),
    temporalizacion:[{id:uid('tm'), unidad:'Unidad 1', nombreUnidad:'', trimestre:'1er Trimestre', semanas:''}],
    unidades:[{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}],
    elaboradoPor: nombreFormal(d),
    revisadoPor:'Lic. David Villalta', aprobadoPor:'Lic. José Gómez',

  };

function weekRow(n){ return {id:uid('wk'), semana:n, fechaInicio:'', fechaFin:'', destreza:'', nivelLogroIntermedio:'', nivelLogroAvanzado:'', temas:'', pagina:'', observacion:''}; }

/* Para "Presentación de PCA": un PCA cuenta como lleno "hasta la Unidad 3" si tiene al menos 3
   unidades creadas y, en cada una de las 3 primeras, al menos una fila de semana con contenido
   real (destreza, temas o algún nivel de logro) — no basta con que la unidad exista vacía. */
/* El número de unidades exigido ("hasta la Unidad N") es configurable por el administrador,
   por separado para Escuela y Colegio — ver configPca() / renderAdminPresentacionPca(). */
function configPca(){
  return load(LS.CONFIG).find(function(c){ return c.id==='pca'; }) || {id:'pca', unidadCorteEscuela:3, unidadCorteColegio:3};
}
function unidadCortePca(banda){
  var cfg = configPca();
  var n = banda==='colegio' ? cfg.unidadCorteColegio : cfg.unidadCorteEscuela;
  return (typeof n === 'number' && n>0) ? n : 3;
}
function guardarConfigPca(cambios){
  var cfg = Object.assign({}, configPca(), cambios, {id:'pca', updatedAt: nowISO()});
  var otros = load(LS.CONFIG).filter(function(c){ return c.id!=='pca'; });
  save(LS.CONFIG, otros.concat([cfg]));
}
/* Criterio estricto: en cada una de las primeras "unidadCorte" unidades, TODAS las semanas que el
   docente creó deben tener sus 4 casilleros de contenido llenos (Destreza, Temas, Nivel de Logro
   Intermedio y Nivel de Logro Avanzado) — no basta con que UNA semana tenga algo escrito en
   cualquiera de esos campos. Una unidad sin ninguna semana creada tampoco cuenta como completa. */
function pcaEstaCompleto(p, unidadCorte){
  var unidades = (p.unidades||[]).slice(0, unidadCorte);
  if(unidades.length < unidadCorte) return false;
  return unidades.every(function(u){
    var filas = u.filas||[];
    if(!filas.length) return false;
    return filas.every(function(f){
      return richTextToPlain(f.destreza||'').trim()
        && richTextToPlain(f.temas||'').trim()
        && richTextToPlain(f.nivelLogroIntermedio||'').trim()
        && richTextToPlain(f.nivelLogroAvanzado||'').trim();
    });
  });
}

function openPcaForm(pcaId, returnTo){
  state.pcaReturnTo = returnTo || 'pcalist';
  var d = currentDocente();
  if(pcaId){
    var header = load(LS.PCA).find(function(p){ return p.id===pcaId; });
    var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
    var unidades = (header.unidadesNombres || []).map(function(nombre){
      var filas = cont.filter(function(c){ return c.unidad===nombre; }).sort(function(a,b){ return (a.semana||0)-(b.semana||0); });
      if(filas.length===0) filas=[weekRow(1)];
      return {id: uid('un'), nombre: nombre, filas: filas.map(function(f){ return Object.assign({}, f); })};
    });
    if(unidades.length===0) unidades=[{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}];
    state.editingPca = Object.assign({}, header, {
      temporalizacion: (header.temporalizacion||[]).map(function(t){ return Object.assign({}, t); }),
      unidades: unidades
    });
    marcarBaseConflicto('pca', header.updatedAt);
  } else {
    state.editingPca = blankPca(d);
  }
  go('pcaform');
}

/* Duplicar PCA: crea una copia completa (temporalización + unidades + semanas) del PCA que el
   docente indique en la lista, con IDs nuevos, sin bloqueo y con la fecha límite vigente — pero
   sin guardarla en Firestore todavía: se abre en el formulario para que el docente ajuste nivel,
   curso o asignatura (p.ej. copiar el PCA de 7.º "A" para crear el de 7.º "B") y la guarde él
   mismo con "Guardar plan". */
function duplicatePca(pcaId){
  var d = currentDocente();
  var header = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  if(!header) return;
  var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  var unidades = (header.unidadesNombres || []).map(function(nombre){
    var filas = cont.filter(function(c){ return c.unidad===nombre; }).sort(function(a,b){ return (a.semana||0)-(b.semana||0); });
    if(filas.length===0) filas = [weekRow(1)];
    return { id: uid('un'), nombre: nombre, filas: filas.map(function(f){ return Object.assign({}, f, {id: uid('wk')}); }) };
  });
  if(unidades.length===0) unidades = [{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}];
  state.editingPca = Object.assign({}, header, {
    id: uid('pca'), docenteId: d.id, locked: false, fechaLimite: fechaLimiteVigente('pca'),
    temporalizacion: (header.temporalizacion||[]).map(function(t){ return Object.assign({}, t, {id: uid('tm')}); }),
    unidades: unidades, elaboradoPor: nombreFormal(d),
    createdAt: nowISO(), updatedAt: nowISO()
  });
  state.pcaReturnTo = state.subview==='admin' ? 'admin' : 'pcalist';
  toast('Se copió el PCA. Ajusta lo que necesites (p.ej. el curso) y presiona "Guardar plan" para crearlo.', 'success');
  go('pcaform');
}

/* Cuando la asignatura del PCA es de Inglés (cualquier variante: "Inglés" normal o los grupos
   "Inglés Grupo A1/A2/B1(...)"), todos los campos y leyendas del formulario de PCA se muestran
   en inglés — el resto del sistema (Carga Horaria, Plan Semanal, Administración) sigue en
   español; esto es exclusivo del formulario de PCA. */
function pcaEsIngles(p){
  var re = /inglés|english/i;
  return re.test(p.asignatura||'') || re.test(p.asignaturaManual||'');
}
/* El Plan Semanal no tiene un modo bilingüe completo como el PCA, pero cuando la asignatura es de
   Inglés, la categoría "Niveles de Logro" (y sus 3 columnas Básico/Intermedio/Avanzado) sí se
   muestra en inglés, con la terminología que usa el área de Inglés en vez de una traducción
   literal — ver NIVEL_LOGRO_DIA_LABEL_EN. */
function semanalEsIngles(s){
  return /inglés|english/i.test(s.asignatura||'');
}

  + '  </div>'
  + '</div>';
}

function bindPcaFormEvents(){

  };
  document.getElementById('btnExportWordNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaWord(p.id); };
  document.getElementById('btnExportExcelNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaExcel(p.id); };

  document.getElementById('pfEspecialidad').addEventListener('change', function(e){ p.especialidad=e.target.value; p.asignatura=''; renderPcaFormAgain(); });
  document.getElementById('pfCurso').addEventListener('change', function(e){ p.curso=e.target.value; renderPcaFormAgain(); });
  document.getElementById('pfAsignatura').addEventListener('change', function(e){ p.asignatura=e.target.value; renderPcaFormAgain(); });

    var el = document.getElementById(id);

    el.addEventListener('input', function(){ p[key] = el.value; });

  var pfLimite = document.getElementById('pfFechaLimite');

  // Temporalización
  document.getElementById('btnAddTemporalizacion').onclick = function(){
    var prefijo = esPcaAsignaturaTecnica(p) ? 'Proyecto ' : 'Unidad ';
    p.temporalizacion.push({id:uid('tm'), unidad:prefijo + (p.temporalizacion.length+1), nombreUnidad:'', trimestre:'1er Trimestre', semanas:''});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-tmremove]').forEach(function(btn){
    btn.onclick = function(){ p.temporalizacion = p.temporalizacion.filter(function(t){ return t.id!==btn.getAttribute('data-tmremove'); }); renderPcaFormAgain(); };
  });
  document.querySelectorAll('#tmBody tr').forEach(function(tr){
    var id = tr.getAttribute('data-tmrow');
    tr.querySelectorAll('[data-tf]').forEach(function(el){
      var t = p.temporalizacion.find(function(x){ return x.id===id; });
      el.addEventListener('input', function(){ t[el.getAttribute('data-tf')] = el.value; if(el.tagName==='SELECT') renderPcaFormAgain(); });
      if(el.tagName==='SELECT') el.addEventListener('change', function(){ t[el.getAttribute('data-tf')] = el.value; });
      if(el.getAttribute('data-tf')==='semanas') el.addEventListener('change', function(){ renderPcaFormAgain(); });
    });
  });

  // Unidades / semanas
  document.getElementById('btnAddUnidad').onclick = function(){
    var n = p.unidades.length + 1;
    var prefijo = esPcaAsignaturaTecnica(p) ? 'Proyecto ' : 'Unidad ';
    p.unidades.push({id:uid('un'), nombre:prefijo + n, filas:[weekRow(1)]});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-removeunit]').forEach(function(btn){
    btn.onclick = function(){
      if(p.unidades.length<=1){ toast('Debe existir al menos una unidad.', 'error'); return; }
      confirmDialog('¿Eliminar esta unidad y todo su contenido?', function(){
        var unitId = btn.getAttribute('data-removeunit');
        var idx = p.unidades.findIndex(function(u){ return u.id===unitId; });
        var unidadEliminada = p.unidades[idx];
        p.unidades = p.unidades.filter(function(u){ return u.id!==unitId; });
        renderPcaFormAgain();
        toastConDeshacer('Unidad eliminada.', function(){
          if(!p.unidades.some(function(u){ return u.id===unidadEliminada.id; })){
            p.unidades.splice(idx, 0, unidadEliminada);

          toast('Unidad restaurada.', 'success');

  document.querySelectorAll('[data-unitname]').forEach(function(el){

      u.nombre = el.value;
    });
  });
  document.querySelectorAll('[data-addweek]').forEach(function(btn){
    btn.onclick = function(){
      var u = p.unidades.find(function(x){ return x.id===btn.getAttribute('data-addweek'); });
      var nueva = weekRow(u.filas.length+1);
      var ultima = u.filas[u.filas.length-1];
      if(ultima){
        nueva.fechaInicio = addDays(ultima.fechaInicio, 7);
        nueva.fechaFin = addDays(ultima.fechaFin, 7);
      }
      u.filas.push(nueva);
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-wkremove]').forEach(function(btn){
    btn.onclick = function(){
      var tr = btn.closest('tr');
      var tbody = btn.closest('tbody');
      var unitId = tbody.getAttribute('data-unitbody');
      var u = p.unidades.find(function(x){ return x.id===unitId; });
      u.filas = u.filas.filter(function(f){ return f.id!==btn.getAttribute('data-wkremove'); });
      u.filas.forEach(function(f,i){ f.semana = i+1; });
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-unitbody]').forEach(function(tbody){
    var unitId = tbody.getAttribute('data-unitbody');
    var u = p.unidades.find(function(x){ return x.id===unitId; });
    tbody.querySelectorAll('tr').forEach(function(tr){
      var rowId = tr.getAttribute('data-wkrow');
      var f = u.filas.find(function(x){ return x.id===rowId; });
      tr.querySelectorAll('[data-wf]').forEach(function(el){
        el.addEventListener('input', function(){ f[el.getAttribute('data-wf')] = el.value; });
      });
      tr.querySelectorAll('.rte-editable').forEach(function(el){
        var key = el.getAttribute('data-rte-field');
        el.addEventListener('input', function(){ f[key] = el.innerHTML; });
      });
      bindRteToolbars(tr);
    });
  });
}

/* Red de seguridad además del fix en cerrarTodo() (ver insertarPegadoInmediato/
   mostrarBotonOpcionesPegado): si por cualquier motivo un <span data-paste-marker> sobrevive hasta
   el momento de guardar (p.ej. el docente cambió de Nivel/Curso — lo que fuerza un re-render del
   formulario — antes de que se limpiara), se quita aquí para que nunca llegue a Firestore. */
function quitarMarcasPegado(html){
  if(!html || html.indexOf('data-paste-marker')===-1) return html;
  var div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('[data-paste-marker]').forEach(function(marcador){
    while(marcador.firstChild) marcador.parentNode.insertBefore(marcador.firstChild, marcador);
    marcador.parentNode.removeChild(marcador);
  });
  return div.innerHTML;
}
function savePca(p, silent){
  var d = currentDocente();
  var existingHeader = load(LS.PCA).find(function(x){ return x.id===p.id; });
  if(existingHeader && !p._forzarGuardado && hayConflictoGuardado('pca', existingHeader.updatedAt)){
    if(silent){ toast('No se autoguardó: este PCA se modificó en otro dispositivo o pestaña. Recarga la página antes de seguir editando.', 'error'); return; }
    avisarConflictoGuardado('pca', existingHeader.updatedAt, function(){ p._forzarGuardado = true; savePca(p, silent); });
    return;
  }
  delete p._forzarGuardado;
  var isNew = !existingHeader;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  p.updatedAt = nowISO();
  p.unidadesNombres = p.unidades.map(function(u){ return u.nombre; });
  /* completadoEn: la fecha en que el PCA quedó completo por ÚLTIMA VEZ (para "Presentación de
     PCA", que compara ESTO contra la Fecha Límite en vez de la fecha de creación). Se calcula en
     cada guardado con el corte de unidades vigente en este momento: si ya estaba completo antes,
     se conserva la fecha original (no se corre solo por seguir editando); si no estaba completo y
     ahora sí, se marca "ahora"; si deja de estarlo (p.ej. el admin subió el corte, o se agregó una
     semana vacía), se borra para que la próxima vez que vuelva a completarse cuente como un nuevo
     momento de finalización. */
  var bandaPca = esEscuelaPorNivelCurso(p.nivel, p.curso==='Otro…' ? p.cursoManual : p.curso) ? 'escuela' : 'colegio';
  var completoAhora = pcaEstaCompleto({unidades: p.unidades}, unidadCortePca(bandaPca));
  var completadoEnPrevio = existingHeader ? (existingHeader.completadoEn||'') : '';
  var completadoEn = completoAhora ? (completadoEnPrevio || p.updatedAt) : '';
  var header = {
    id:p.id, docenteId:ownerId, nivel:p.nivel, especialidad:p.especialidad,
    curso:p.curso, cursoManual:p.cursoManual||'', asignatura:p.asignatura, asignaturaManual:p.asignaturaManual||'',
    cargaSemanal:p.cargaSemanal, semanasT1:p.semanasT1, semanasT2:p.semanasT2, semanasT3:p.semanasT3, fechaLimite:p.fechaLimite||'',
    temporalizacion:p.temporalizacion, unidadesNombres:p.unidadesNombres,
    elaboradoPor:p.elaboradoPor, revisadoPor:p.revisadoPor, aprobadoPor:p.aprobadoPor,
    locked: !!p.locked,
    importadoDeDocente: p.importadoDeDocente||'', importadoFecha: p.importadoFecha||'',
    completadoEn: completadoEn,
    createdAt:p.createdAt, updatedAt:p.updatedAt
  };
  var pcas = load(LS.PCA).filter(function(x){ return x.id!==p.id; });
  pcas.push(header);
  save(LS.PCA, pcas);
  marcarBaseConflicto('pca', header.updatedAt);

  var cont = load(LS.CONT).filter(function(c){ return c.pcaId!==p.id; });
  p.unidades.forEach(function(u){
    u.filas.forEach(function(f){
      cont.push({
        id: f.id, pcaId:p.id, docenteId:ownerId, unidad:u.nombre, semana:f.semana,
        fechaInicio:f.fechaInicio, fechaFin:f.fechaFin, destreza:quitarMarcasPegado(f.destreza),
        nivelLogroIntermedio:quitarMarcasPegado(f.nivelLogroIntermedio||''), nivelLogroAvanzado:quitarMarcasPegado(f.nivelLogroAvanzado||''),
        temas:quitarMarcasPegado(f.temas), pagina:f.pagina, observacion:f.observacion
      });
    });
  });
  save(LS.CONT, cont);
  if(!silent){
    if(isNew && p.fechaLimite && !isStaffRole(d.role)) toast('Plan guardado. Podrás seguir editándolo hasta la fecha límite de entrega.', 'success');
    else toast('Plan curricular guardado correctamente.', 'success');
  }
}

/* Resalta en la barra de herramientas del editor de texto enriquecido qué opciones están
   activas justo donde está el cursor (negrita, subrayado, viñetas, numeración, superíndice,
   subíndice) — así el docente sabe de un vistazo qué formato está usando en ese punto, sin tener
   que adivinar por el texto. */
var RTE_CMDS_CON_ESTADO = ['bold','underline','insertUnorderedList','insertOrderedList','superscript','subscript'];
function actualizarBarraRteActiva(editable){
  var wrap = editable.closest('.rte');
  if(!wrap) return;
  var toolbar = wrap.querySelector('.rte-toolbar');
  if(!toolbar) return;
  toolbar.querySelectorAll('[data-rte-cmd]').forEach(function(btn){
    var cmd = btn.getAttribute('data-rte-cmd');
    var activo = false;
    if(RTE_CMDS_CON_ESTADO.indexOf(cmd)!==-1){
      try{ activo = document.queryCommandState(cmd); }catch(e){ activo = false; }
    }
    btn.classList.toggle('active', activo);
  });
}
/* Resaltado persistente de selección: cuando el docente selecciona texto y luego hace clic en un
   control que le quita el foco al campo (color, símbolo, "Insertar enlace"), el navegador borra
   el resaltado azul nativo aunque la selección siga existiendo internamente. Usamos la CSS Custom
   Highlight API para redibujar esa selección manualmente hasta que el propio docente vuelva a
   hacer clic o a escribir dentro del texto (momento en el que se considera "quitada"). Se degrada
   sin errores en navegadores que no soporten la API (queda el comportamiento anterior). */
var RTE_HIGHLIGHT = (typeof Highlight !== 'undefined' && window.CSS && CSS.highlights) ? new Highlight() : null;
if(RTE_HIGHLIGHT) CSS.highlights.set('rte-manual-selection', RTE_HIGHLIGHT);
function limpiarSeleccionPersistenteRte(){ if(RTE_HIGHLIGHT) RTE_HIGHLIGHT.clear(); }
function guardarSeleccionPersistenteRte(editable){
  if(!RTE_HIGHLIGHT) return;
  var sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.isCollapsed && editable.contains(sel.anchorNode) && editable.contains(sel.focusNode)){
    RTE_HIGHLIGHT.clear();
    RTE_HIGHLIGHT.add(sel.getRangeAt(0).cloneRange());
  }
}
/* Para la numeración automática al escribir "1. ": confirma que no hay NINGÚN otro contenido
   antes del número en su línea — sube por los padres hasta el bloque (párrafo/div/li) que lo
   contiene, comprobando en cada nivel que no haya un hermano anterior. Si el número está en medio
   de una oración (p.ej. "ver punto 3. y 4.") no se activa. */
function esInicioDeLineaRte(nodo, editable){
  var actual = nodo;
  while(actual && actual !== editable){
    if(actual.previousSibling) return false;
    var padre = actual.parentNode;
    if(padre && /^(DIV|P|LI|TD|BLOCKQUOTE)$/.test(padre.tagName)) return true;
    actual = padre;
  }
  return true;
}
function bindRteToolbars(root){
  if(!root) return;
  root.querySelectorAll('[data-rte-cmd]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var wrap = btn.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      var cmd = btn.getAttribute('data-rte-cmd');
      if(cmd === 'createLink'){
        var sel = window.getSelection();
        var savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
        promptDialog('Ingresa la URL del enlace:', 'https://', function(url){
          limpiarSeleccionPersistenteRte();
          editable.focus();
          if(savedRange){ var sel2 = window.getSelection(); sel2.removeAllRanges(); sel2.addRange(savedRange); }
          document.execCommand('createLink', false, url);
        });
        return;
      }
      if(cmd === 'insertFraction'){
        editable.focus();
        document.execCommand('insertHTML', false, '<sup>1</sup>⁄<sub>2</sub>&nbsp;');
        return;
      }
      editable.focus();
      document.execCommand(cmd, false, null);
      actualizarBarraRteActiva(editable);
    });
  });
  root.querySelectorAll('.rte-editable').forEach(function(editable){
    ['keyup','mouseup','focus','input'].forEach(function(evt){
      editable.addEventListener(evt, function(){ actualizarBarraRteActiva(editable); });
    });
    editable.addEventListener('mousedown', limpiarSeleccionPersistenteRte);
    editable.addEventListener('keydown', limpiarSeleccionPersistenteRte);
    editable.addEventListener('blur', function(){
      var wrap = editable.closest('.rte');
      if(wrap) wrap.querySelectorAll('.rte-toolbar [data-rte-cmd].active').forEach(function(b){ b.classList.remove('active'); });
      guardarSeleccionPersistenteRte(editable);
    });
    /* Dentro de un campo editable, un clic normal sobre un enlace solo coloca el cursor ahí (no lo
       abre) — así funciona cualquier contenteditable, y normalmente hace falta Ctrl+clic. Como eso
       confunde a los docentes ("hago clic y no abre"), un clic simple sobre el enlace lo abre
       directamente en una pestaña nueva. */
    editable.addEventListener('click', function(e){
      var a = e.target.closest ? e.target.closest('a') : null;
      if(a && editable.contains(a) && a.href){
        e.preventDefault();
        window.open(a.href, '_blank', 'noopener');
      }
    });
    /* Tab / Shift+Tab como en Word: aumenta o reduce la sangría del párrafo o ítem de lista donde
       está el cursor, en vez de mover el foco al siguiente campo del formulario. */
    editable.addEventListener('keydown', function(e){
      if(e.key !== 'Tab') return;
      e.preventDefault();
      document.execCommand(e.shiftKey ? 'outdent' : 'indent', false, null);
      actualizarBarraRteActiva(editable);
    });
    /* Numeración automática como en Word: al escribir "1." (o cualquier número) seguido de un
       espacio, al INICIO de una línea vacía de contenido previo, esas dos teclas se reemplazan por
       una lista numerada real y el cursor queda listo para seguir escribiendo el primer ítem. */
    editable.addEventListener('keydown', function(e){
      if(e.key !== ' ') return;
      var sel = window.getSelection();
      if(!sel || !sel.rangeCount || !sel.isCollapsed) return;
      var range = sel.getRangeAt(0);
      var nodo = range.startContainer;
      if(nodo.nodeType !== 3) return;
      var textoAntes = nodo.textContent.slice(0, range.startOffset);
      if(!/^\d{1,3}\.$/.test(textoAntes)) return;
      if(!esInicioDeLineaRte(nodo, editable)) return;
      var enLista = range.startContainer.parentElement && range.startContainer.parentElement.closest('li, ol, ul');
      if(enLista) return;
      e.preventDefault();
      nodo.textContent = nodo.textContent.slice(range.startOffset);
      var r2 = document.createRange();
      r2.setStart(nodo, 0); r2.collapse(true);
      sel.removeAllRanges(); sel.addRange(r2);
      document.execCommand('insertOrderedList', false, null);
      editable.dispatchEvent(new Event('input', {bubbles:true}));
    });
  });
  root.querySelectorAll('[data-rte-symbol]').forEach(function(sel){
    var savedRange = null;
    sel.addEventListener('mousedown', function(){
      var s = window.getSelection();
      savedRange = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    });
    sel.addEventListener('change', function(){
      var symbol = sel.value;
      if(!symbol) return;
      var wrap = sel.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      limpiarSeleccionPersistenteRte();
      editable.focus();
      if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
      document.execCommand('insertText', false, symbol);
      sel.value = '';
    });
  });
  root.querySelectorAll('[data-rte-colorbtn]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var wrap = btn.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      mostrarMenuColorRte(btn, editable);
    });
  });
  root.querySelectorAll('[data-rte-font]').forEach(function(sel){
    var savedRange = null;
    sel.addEventListener('mousedown', function(){
      var s = window.getSelection();
      savedRange = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    });
    sel.addEventListener('change', function(){
      var fuente = sel.value;
      if(!fuente) return;
      var wrap = sel.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      limpiarSeleccionPersistenteRte();
      editable.focus();
      if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
      document.execCommand('fontName', false, fuente);
      sel.value = '';
    });
  });
  root.querySelectorAll('.rte-editable').forEach(function(editable){
    editable.addEventListener('paste', function(e){
      var cd = e.clipboardData || window.clipboardData;
      if(!cd) return;
      var htmlRaw = cd.getData('text/html');
      var textoPlano = cd.getData('text/plain');
      if(!htmlRaw && !textoPlano) return;
      e.preventDefault();
      insertarPegadoInmediato(editable, htmlRaw, textoPlano);
    });
  });
}
/* Colores del tema (paleta institucional de la app) y colores estándar (la fila clásica que usan
   Word/Excel) para el menú de color de texto — ver mostrarMenuColorRte. */
var RTE_COLORES_TEMA = ['#000000','#FFFFFF','#5B6B85','#16233A','#0A2A5E','#1848A0','#5C93EF','#D6A419','#B01C1C','#1E7B45'];
var RTE_COLORES_ESTANDAR = ['#C00000','#FF0000','#FFC000','#FFFF00','#92D050','#00B050','#00B0F0','#0070C0','#002060','#7030A0'];
var RTE_COLOR_AUTOMATICO = '#16233A';
/* Menú de color de texto al estilo Word/Office: "Automático", una fila de colores del tema, una
   fila de colores estándar, y "Más colores…" que abre el selector nativo del sistema operativo
   para cualquier color personalizado. Reemplaza al <input type="color"> plano de antes. */
function mostrarMenuColorRte(btn, editable){
  var previo = document.getElementById('rteColorMenu');
  if(previo) previo.remove();
  var sel = window.getSelection();
  var savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
  var rect = btn.getBoundingClientRect();
  var menu = document.createElement('div');
  menu.id = 'rteColorMenu';
  menu.className = 'rte-color-menu';
  menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 210)) + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';

  function swatchesHtml(colores){
    return colores.map(function(c){
      return '<button type="button" class="rte-color-swatch" data-color="'+c+'" style="background:'+c+';" title="'+c+'"></button>';
    }).join('');
  }
  menu.innerHTML = ''
    + '<button type="button" class="rte-color-auto" data-color="'+RTE_COLOR_AUTOMATICO+'"><span class="rte-color-auto-swatch"></span>Automático</button>'
    + '<div class="rte-color-label">Colores del tema</div>'
    + '<div class="rte-color-grid">' + swatchesHtml(RTE_COLORES_TEMA) + '</div>'
    + '<div class="rte-color-label">Colores estándar</div>'
    + '<div class="rte-color-grid">' + swatchesHtml(RTE_COLORES_ESTANDAR) + '</div>'
    + '<button type="button" class="rte-color-more" id="rteColorMoreBtn">🎨 Más colores…</button>';
  document.body.appendChild(menu);

  var nativePicker = document.createElement('input');
  nativePicker.type = 'color';
  nativePicker.style.cssText = 'position:fixed; left:' + rect.left + 'px; top:' + rect.bottom + 'px; width:1px; height:1px; opacity:0; pointer-events:none;';
  document.body.appendChild(nativePicker);

  function aplicar(color){
    limpiarSeleccionPersistenteRte();
    editable.focus();
    if(savedRange){ var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(savedRange); }
    document.execCommand('foreColor', false, color);
    btn.setAttribute('data-color', color);
    var barra = btn.querySelector('.rte-color-btn-bar');
    if(barra) barra.style.background = color;
    cerrar();
  }
  menu.querySelectorAll('[data-color]').forEach(function(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(){ aplicar(el.getAttribute('data-color')); });
  });
  var moreBtn = document.getElementById('rteColorMoreBtn');
  moreBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
  moreBtn.addEventListener('click', function(){ nativePicker.click(); });
  nativePicker.addEventListener('input', function(){ aplicar(nativePicker.value); });

  function onOutside(ev){
    if(menu.contains(ev.target) || ev.target === btn || ev.target === nativePicker) return;
    cerrar();
  }
  function cerrar(){
    menu.remove();
    nativePicker.remove();
    document.removeEventListener('mousedown', onOutside, true);
  }
  setTimeout(function(){ document.addEventListener('mousedown', onOutside, true); }, 0);
}
/* Al pegar contenido con formato en un campo de texto enriquecido, ofrece un pequeño menú (como
   en Word) para elegir cómo incorporarlo: manteniendo el formato de origen, combinándolo con uno
   más simple, o solo el texto plano. Si el docente hace clic fuera sin elegir, se pega con el
   formato de origen (la opción menos sorprendente) para que el pegado nunca quede "sin hacer
   nada" por descuido. */
/* Pegado al estilo Word: el contenido se inserta DE INMEDIATO (con el formato de origen, la
   opción menos sorprendente) para que se vea completo apenas se pega — antes, el docente tenía
   que elegir una opción o hacer clic afuera para que el pegado "terminara" de aparecer, lo cual
   se sentía como que el pegado se quedaba a medias. Justo después aparece un botoncito flotante
   "Opciones de pegado" (igual que en Word) que, si se necesita, permite cambiar a "Combinar
   formato" o "Pegar solo texto" — reemplazando lo ya pegado, sin tener que repetir el pegado. Ese
   botón desaparece solo si no se usa (al seguir escribiendo, hacer clic en otro lado, o pasados
   unos segundos). */
function insertarPegadoInmediato(editable, htmlRaw, textoPlano){
  var marcaId = 'pm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var htmlPorDefecto = htmlRaw ? quitarFuenteHtml(sanitizeRte(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
  htmlPorDefecto = linkificarUrls(htmlPorDefecto);
  document.execCommand('insertHTML', false, '<span data-paste-marker="' + marcaId + '">' + htmlPorDefecto + '</span>');
  editable.dispatchEvent(new Event('input', {bubbles:true}));
  var marcador = editable.querySelector('[data-paste-marker="' + marcaId + '"]');
  if(marcador) mostrarBotonOpcionesPegado(editable, marcador, htmlRaw, textoPlano);
}
function mostrarBotonOpcionesPegado(editable, marcador, htmlRaw, textoPlano){
  var previo = document.getElementById('rtePasteOptionsBtn');
  if(previo) previo.remove();
  var previoMenu = document.getElementById('rtePasteSubmenu');
  if(previoMenu) previoMenu.remove();
  var rect = marcador.getBoundingClientRect();
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'rtePasteOptionsBtn';
  btn.className = 'rte-paste-options-btn';
  btn.textContent = '📋 Opciones de pegado ▾';
  btn.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 190)) + 'px';
  btn.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(btn);

  function desenvolverMarcador(){
    if(marcador && marcador.parentNode){
      while(marcador.firstChild) marcador.parentNode.insertBefore(marcador.firstChild, marcador);
      marcador.parentNode.removeChild(marcador);
    }
  }
  var descartarTimer = setTimeout(cerrarTodo, 6000);
  function cerrarTodo(){
    clearTimeout(descartarTimer);
    btn.remove();
    var submenu = document.getElementById('rtePasteSubmenu');
    if(submenu) submenu.remove();
    desenvolverMarcador();
    /* Quitar el marcador del DOM no alcanza: el guardado lee el valor que quedó capturado en
       memoria la última vez que se disparó "input" (justo al pegar, CON el marcador todavía
       puesto) — sin este segundo "input", ese <span data-paste-marker> quedaba guardado para
       siempre en Firestore salvo que el docente volviera a escribir algo más en ese mismo campo. */
    editable.dispatchEvent(new Event('input', {bubbles:true}));
    document.removeEventListener('mousedown', onFueraDelBoton, true);
    editable.removeEventListener('keydown', cerrarTodo);
  }
  function onFueraDelBoton(ev){
    if(btn.contains(ev.target) || document.getElementById('rtePasteSubmenu')) return;
    cerrarTodo();
  }
  editable.addEventListener('keydown', cerrarTodo);
  btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
  btn.addEventListener('click', function(){
    clearTimeout(descartarTimer);
    mostrarSubmenuFormatoPegado(btn, marcador, htmlRaw, textoPlano, cerrarTodo);
  });
  setTimeout(function(){ document.addEventListener('mousedown', onFueraDelBoton, true); }, 0);
}
function mostrarSubmenuFormatoPegado(btn, marcador, htmlRaw, textoPlano, alTerminar){
  var previo = document.getElementById('rtePasteSubmenu');
  if(previo) previo.remove();
  var rect = btn.getBoundingClientRect();
  var menu = document.createElement('div');
  menu.id = 'rtePasteSubmenu';
  menu.className = 'rte-paste-menu';
  menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 190)) + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.innerHTML = ''
    + '<button type="button" data-modo="mantener">Mantener formato de origen</button>'
    + '<button type="button" data-modo="combinar">Combinar formato</button>'
    + '<button type="button" data-modo="texto">Pegar solo texto</button>';
  document.body.appendChild(menu);
  menu.querySelectorAll('button').forEach(function(b){
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){
      var modo = b.getAttribute('data-modo');
      var htmlFinal;
      if(modo === 'texto') htmlFinal = escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      else if(modo === 'combinar') htmlFinal = htmlRaw ? quitarFuenteHtml(limpiarHtmlPegadoCombinado(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      else htmlFinal = htmlRaw ? quitarFuenteHtml(sanitizeRte(htmlRaw)) : escapeHtml(textoPlano||'').replace(/\n/g,'<br>');
      htmlFinal = linkificarUrls(htmlFinal);
      var contenedorEditable = marcador && marcador.closest('.rte-editable');
      if(marcador) marcador.innerHTML = htmlFinal;
      menu.remove();
      if(contenedorEditable) contenedorEditable.dispatchEvent(new Event('input', {bubbles:true}));
      alTerminar();
    });
  });
  function onFueraDelMenu(ev){
    if(menu.contains(ev.target) || ev.target===btn) return;
    menu.remove();
    document.removeEventListener('mousedown', onFueraDelMenu, true);
  }
  setTimeout(function(){ document.addEventListener('mousedown', onFueraDelMenu, true); }, 0);
}
/* Versión más simple que sanitizeRte para "Combinar formato": conserva negrita/subrayado y
   saltos de línea/párrafo, pero descarta listas, enlaces, colores y demás formato del origen
   (las viñetas de listas se convierten en líneas separadas para no perder la separación). */
/* Etiquetas cuyo contenido NUNCA debe mostrarse como texto (a diferencia de una etiqueta de
   formato desconocida, donde sí queremos conservar el texto interior): Word (y en general
   "Pegar desde Office") agrega un bloque <style> completo con las definiciones de fuentes —
   @font-face, mso-*, etc. — antes del contenido real. Si esas etiquetas se tratan igual que
   cualquier otra etiqueta no permitida (conservando su textContent), ese bloque de CSS aparece
   como texto visible pegado al inicio del documento. */
var RTE_PASTE_TAGS_DESCARTAR = {STYLE:1, SCRIPT:1, HEAD:1, TITLE:1, META:1, LINK:1, 'O:P':1, XML:1};
function limpiarHtmlPegadoCombinado(html){
  if(!html) return '';
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var allowed = {DIV:1,P:1,B:1,STRONG:1,U:1,BR:1};
  function clean(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ node.removeChild(ch); return; }
      if(RTE_PASTE_TAGS_DESCARTAR[ch.tagName]){ node.removeChild(ch); return; }
      if(ch.tagName === 'LI') node.insertBefore(document.createElement('br'), ch);
      if(!allowed[ch.tagName]){
        var text = document.createTextNode(ch.textContent || '');
        node.replaceChild(text, ch);
        return;
      }
      Array.from(ch.attributes).forEach(function(attr){ ch.removeAttribute(attr.name); });
      clean(ch);
    });
  }
  clean(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
/* Por defecto, el texto pegado adopta el tipo de letra que ya tiene el casillero en vez de traer
   consigo la fuente de origen (Word, otra página, etc.) — se aplica a las 2 opciones de pegado
   que conservan formato ("Mantener formato de origen" y "Combinar formato"); "Pegar solo texto"
   ya es texto plano sin fuente. Quita <font face="..."> y cualquier font-family en "style". */
function quitarFuenteHtml(html){
  if(!html) return html;
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  doc.querySelectorAll('[face]').forEach(function(el){ el.removeAttribute('face'); });
  doc.querySelectorAll('[style]').forEach(function(el){
    el.style.removeProperty('font-family');
    if(!el.getAttribute('style')) el.removeAttribute('style');
  });
  return doc.body.firstChild.innerHTML;
}
/* Whitelist sanitizer applied at save time: strips any tag/attribute outside a small allowed
   set (bold/underline/lists/links/line-breaks) so pasted content can't smuggle scripts or
   event-handler attributes into localStorage. */
function sanitizeRte(html){
  if(!html) return '';
  var allowed = {DIV:1,P:1,B:1,STRONG:1,U:1,I:1,EM:1,UL:1,OL:1,LI:1,BR:1,A:1,SPAN:1,SUP:1,SUB:1,FONT:1,BLOCKQUOTE:1};
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  function clean(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ node.removeChild(ch); return; }
      if(RTE_PASTE_TAGS_DESCARTAR[ch.tagName]){ node.removeChild(ch); return; }
      if(!allowed[ch.tagName]){
        var text = document.createTextNode(ch.textContent || '');
        node.replaceChild(text, ch);
        return;
      }
      Array.from(ch.attributes).forEach(function(attr){
        if(ch.tagName === 'A' && attr.name === 'href'){
          var v = attr.value || '';
          if(!/^https?:\/\//i.test(v) && !/^mailto:/i.test(v)) ch.removeAttribute('href');
        } else if(ch.tagName === 'FONT' && (attr.name === 'color' || attr.name === 'face')){
          // El selector de color y de tipo de letra de la barra de herramientas usan execCommand,
          // que en este navegador produce <font color="..." face="...">, no <span style="...">
          // — por eso son las únicas etiquetas/atributos de formato "en crudo" que se conservan.
        } else if(ch.tagName === 'BLOCKQUOTE' && attr.name === 'style'){
          // La sangría con Tab (execCommand('indent')) genera <blockquote style="margin:...">
          // — sin conservar ese estilo, la sangría desaparecería apenas se guarda el campo.
        } else {
          ch.removeAttribute(attr.name);
        }
      });
      if(ch.tagName === 'A') ch.setAttribute('target', '_blank');
      clean(ch);
    });
  }
  clean(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
/* Convierte en enlace real cualquier URL que aparezca como texto plano (p.ej. al pegar
   "https://..." o "www...." copiado desde un chat o documento sin que venga ya como <a>) —
   recorre los nodos de texto que NO estén ya dentro de un <a> y envuelve cada URL encontrada.
   Se aplica sobre el HTML ya sanitizado, así que es seguro (no hay más etiquetas que <br>/<b>/etc.,
   ninguna con atributos que puedan confundirse con una URL). */
var RTE_URL_REGEX = /\b((?:https?:\/\/|www\.)[^\s<>"']+)/gi;
function linkificarUrls(html){
  if(!html || !/https?:\/\/|www\./i.test(html)) return html;
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  function procesar(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 1){
        if(ch.tagName !== 'A') procesar(ch);
        return;
      }
      if(ch.nodeType !== 3) return;
      var texto = ch.textContent;
      RTE_URL_REGEX.lastIndex = 0;
      if(!RTE_URL_REGEX.test(texto)) return;
      RTE_URL_REGEX.lastIndex = 0;
      var frag = document.createDocumentFragment();
      var lastIndex = 0, m;
      while((m = RTE_URL_REGEX.exec(texto))){
        var url = m[1];
        var trailing = '';
        var limpio = url.replace(/[.,;:!?)\]"']+$/, function(coincidencia){ trailing = coincidencia; return ''; });
        if(!limpio){ continue; }
        if(m.index > lastIndex) frag.appendChild(document.createTextNode(texto.slice(lastIndex, m.index)));
        var a = document.createElement('a');
        a.setAttribute('href', /^https?:\/\//i.test(limpio) ? limpio : 'https://' + limpio);
        a.setAttribute('target', '_blank');
        a.textContent = limpio;
        frag.appendChild(a);
        if(trailing) frag.appendChild(document.createTextNode(trailing));
        lastIndex = m.index + url.length;
      }
      if(lastIndex < texto.length) frag.appendChild(document.createTextNode(texto.slice(lastIndex)));
      node.replaceChild(frag, ch);
    });
  }
  procesar(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
function richTextToPlain(html){
  if(!html) return '';
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var BLOQUE = {P:1, DIV:1, LI:1};
  var lines = [];
  var current = '';
  function flush(){ var t = current.trim(); if(t) lines.push(t); current = ''; }
  /* Texto pegado desde Word/Google Docs a veces trae saltos de línea "\n" sueltos DENTRO de un
     mismo nodo de texto (el ajuste de línea original del documento de origen, no una viñeta ni un
     párrafo nuevo). Como esta función separa los ítems de Nivel de Logro/Contenidos con "\n"
     (ver parseLinesList), esos saltos sueltos partían una sola destreza en 4 o 5 casillas — se
     normalizan a espacio para que solo un <br>, <li>, <div> o <p> real cuente como ítem aparte. */
  function textoNodo(ch){ return ch.textContent.replace(/[\r\n]+/g, ' '); }
  /* Recorre en un solo paso recursivo, tratando P/DIV/LI como saltos de párrafo SIN IMPORTAR a
     qué profundidad estén anidados (antes solo contaban si eran hijos directos del nodo raíz —
     un <p> metido dentro de un <div>, como pega Word al copiar dos párrafos juntos, se aplanaba
     con el de al lado en una sola línea gigante). Las etiquetas de formato en línea (b, span,
     etc.) simplemente dejan pasar su texto sin cortar la línea. */
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ current += textoNodo(ch); return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag === 'BR'){ current += '\n'; return; }
      if(tag === 'UL' || tag === 'OL'){ flush(); walk(ch); return; }
      if(BLOQUE[tag]){
        flush();
        if(tag === 'LI') current = '• ';
        walk(ch);
        flush();
        return;
      }
      walk(ch);
    });
  }
  walk(doc.body.firstChild);
  flush();
  return lines.join('\n');
}

/* Une los 3 campos de Nivel de Logro de una fila de Contenidos (destreza=Básico,
   nivelLogroIntermedio, nivelLogroAvanzado) en un solo texto plano legible, para las
   exportaciones (Word/Markdown/CSV) que muestran una sola columna "Nivel de Logro". */
function nivelLogroTextoCompleto(f){
  var partes = [];
  var b = richTextToPlain(f.destreza); if(b) partes.push('Básico:\n' + b);
  var i = richTextToPlain(f.nivelLogroIntermedio); if(i) partes.push('Intermedio:\n' + i);
  var a = richTextToPlain(f.nivelLogroAvanzado); if(a) partes.push('Avanzado:\n' + a);
  return partes.join('\n\n');
}
/* Misma unión que nivelLogroTextoCompleto pero conservando el HTML enriquecido (negritas,
   viñetas…), para la exportación en HTML que sí interpreta etiquetas. */
function nivelLogroHtmlCompleto(f){
  var partes = [];
  if(f.destreza) partes.push('<p><strong>Básico:</strong></p>' + f.destreza);
  if(f.nivelLogroIntermedio) partes.push('<p><strong>Intermedio:</strong></p>' + f.nivelLogroIntermedio);
  if(f.nivelLogroAvanzado) partes.push('<p><strong>Avanzado:</strong></p>' + f.nivelLogroAvanzado);
  return partes.join('');
}

/* ============================= PLAN SEMANAL — LIST ============================= */
function renderSemanalList(d){ return renderSemanalListInner(d, false); }
function renderAdminSemanal(banda){ return renderSemanalListInner(currentDocente(), true, banda); }

/* Numeración de Planes Semanales: cada uno guarda su propio número (no es la posición en la
   lista), así que borrar uno no renumera a los demás. El siguiente plan que se crea continúa
   después del número más alto que exista actualmente para ese docente. */
function siguienteNumeroSemanal(docenteId){
  var max = load(LS.SEMANAL).filter(function(s){ return s.docenteId===docenteId; }).reduce(function(m,s){ return Math.max(m, s.numero||0); }, 0);
  return max + 1;
}
/* Agrupa por trimestre y mes según la fecha de inicio del plan. El año lectivo de esta
   institución arranca a fines de agosto (el 1er Trimestre empieza el 31/08), así que agosto
   cuenta como parte del 1er Trimestre y del inicio del ciclo, no como cierre del anterior. Si la
   institución maneja otros cortes, este mapeo es el único lugar que hay que ajustar. */
var MES_A_TRIMESTRE = {8:1, 9:1, 10:1, 11:1, 12:1, 1:2, 2:2, 3:2, 4:3, 5:3, 6:3, 7:3};
var MESES_CAP = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
/* El año lectivo empieza en agosto, así que al agrupar por mes, el ciclo debe empezar en agosto y
   terminar en julio (Ago,Sept,Oct,Nov,Dic,Ene,...,Jul) — no el orden calendario Ene-Dic. Esto se
   usa solo para ORDENAR los grupos de mes; dentro de un mismo mes-del-ciclo, se desempata por año
   calendario para que años lectivos distintos no se mezclen fuera de orden. */
var MES_ORDEN_ANIO_LECTIVO = {8:0, 9:1, 10:2, 11:3, 12:4, 1:5, 2:6, 3:7, 4:8, 5:9, 6:10, 7:11};
function trimestreYMesDe(fechaIso){
  if(!fechaIso) return null;
  var p = fechaIso.split('-');
  var year = parseInt(p[0],10), month = parseInt(p[1],10);
  if(!year || !month) return null;
  return {
    trimestre: MES_A_TRIMESTRE[month] || 1,
    mesKey: year + '-' + String(month).padStart(2,'0'),
    mesLabel: MESES_CAP[month-1] + ' ' + year,
    mesOrdenKey: String(MES_ORDEN_ANIO_LECTIVO[month]).padStart(2,'0') + '-' + year
  };
}

var TRIMESTRE_LABELS = {1:'1er Trimestre', 2:'2do Trimestre', 3:'3er Trimestre'};
/* Ordena y agrupa por docente los planes de un mismo mes: en Escuela el criterio es el curso que
   dicta cada docente (orden pedagógico, no alfabético — en Escuela cada docente suele tener un
   solo curso a cargo); en Colegio, donde un mismo docente dicta varios cursos, el criterio es su
   nombre en orden alfabético. */
function semanalDocenteGruposHtml(planesDelMes, docentesById, banda, theadHtml, rowHtml){
  var porDocente = {}; var orden = [];
  planesDelMes.forEach(function(s){
    var key = s.docenteId || '__sin__';
    if(!porDocente[key]){ porDocente[key] = {docenteId: s.docenteId, docente: docentesById[s.docenteId], planes: []}; orden.push(key); }
    porDocente[key].planes.push(s);
  });
  var grupos = orden.map(function(k){ return porDocente[k]; });
  function nombreOrden(g){ return g.docente ? ((g.docente.apellidos||'')+(g.docente.nombres||'')) : ''; }
  grupos.sort(function(a,b){
    if(!a.docente && !b.docente) return 0;
    if(!a.docente) return 1;
    if(!b.docente) return -1;
    if(banda === 'colegio') return nombreOrden(a).localeCompare(nombreOrden(b));
    var rankA = Math.min.apply(null, a.planes.map(function(s){ return ordenCursoEscuela(s.curso); }));
    var rankB = Math.min.apply(null, b.planes.map(function(s){ return ordenCursoEscuela(s.curso); }));
    return rankA !== rankB ? rankA - rankB : nombreOrden(a).localeCompare(nombreOrden(b));
  });
  return grupos.map(function(g){
    var nombre = g.docente ? nombreFormal(g.docente) : '(docente eliminado)';
    var filas = g.planes.slice().sort(function(a,b){ return (a.fechaInicio||'').localeCompare(b.fechaInicio||''); }).map(rowHtml).join('');
    return '<div style="margin-top:10px;"><h4 style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; font-weight:700;">' + escapeHtml(nombre) + '</h4><div class="table-wrap"><table>' + theadHtml + '<tbody>' + filas + '</tbody></table></div></div>';
  }).join('');
}

  var isAdmin = isStaffRole(currentDocente().role);
  var all = load(LS.SEMANAL);
  var planes = scopeAll ? all : all.filter(function(s){ return s.docenteId===d.id; });
  var docentesById = {};
  if(scopeAll) allDocentes().forEach(function(x){ docentesById[x.id] = x; });

  if(scopeAll && banda) planes = planes.filter(function(s){ return esEscuelaPorNivelCurso(s.nivel, s.curso) === (banda==='escuela'); });

  var filtroHtml = '';
  if(scopeAll){
    var filtro = state.adminSemanalFilter;
    if(filtro.docenteId) planes = planes.filter(function(s){ return s.docenteId===filtro.docenteId; });
    if(filtro.fechaInicio) planes = planes.filter(function(s){ return (s.fechaInicio||'') >= filtro.fechaInicio; });
    if(filtro.fechaFin) planes = planes.filter(function(s){ return (s.fechaInicio||'') <= filtro.fechaFin; });
    planes = planes.filter(function(s){
      var asigOk = !filtro.asignatura || s.asignatura===filtro.asignatura;

      var cursoOk = !filtro.curso || s.curso===filtro.curso;

    });
    filtroHtml = adminFiltroBarraHtml(filtro, 'asf', 'Curso (7.º EGB a 3.º BGU)');
  }

  function rowHtml(s){
    var owner = scopeAll ? docentesById[s.docenteId] : null;
    var docenteCell = scopeAll ? '<td>' + (owner ? escapeHtml(nombreFormal(owner)) : '<span class="hint">(docente eliminado)</span>') + '</td>' : '';
    return ''
    + '<tr>'
    + '  <td class="tabular">' + (s.numero ? 'N.º ' + s.numero : '—') + '</td>'

    + '    <button class="btn btn-ghost btn-sm" data-replanificar-semanal="' + s.id + '" title="Crea un nuevo plan duplicando este, agregando los temas y niveles de logro de la semana anterior del PCA para reforzar">Replanificar</button> '
    + '    <button class="btn btn-gold btn-sm" data-export-semanal-pdf="' + s.id + '" title="PDF real, sin restricciones de tu vista">PDF ✓</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-word="' + s.id + '">Word</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-excel="' + s.id + '">Excel</button> '
    + '    <button class="btn btn-danger btn-sm" data-delete-semanal="' + s.id + '">Eliminar</button>'
    + '  </td>'
    + '</tr>';
  }

  var theadDocente = scopeAll ? '<th>Docente</th>' : '';
  var theadHtml = '<thead><tr><th>N.º</th>' + theadDocente + '<th>Asignatura</th><th>Curso</th><th>Fecha</th><th>Días</th><th>Actualizado</th><th>Acciones</th></tr></thead>';

  var head = scopeAll
    ? '<p class="hint" style="margin-bottom:14px;">Puedes ver, editar y eliminar cualquier plan semanal. Los planes ya no se bloquean: siempre quedan abiertos para el docente.</p>'
    : '<div class="page-head"><div><div class="eyebrow">Plan Semanal</div><h1>Planes Semanales de Clase</h1><p>Un plan por cada semana de clase, enlazado con tu Plan Curricular Anual.</p></div><div style="display:flex; gap:10px;"><button class="btn btn-ghost" id="btnImportarSemanal">Importar de otro docente</button><button class="btn btn-primary" id="btnNewSemanal">+ Nuevo Plan Semanal</button></div></div>';

  var cardEstiloAdmin = (scopeAll && banda) ? pastelBorde(banda==='colegio' ? 'semanalcolegio' : 'semanal') : '';

  if(planes.length === 0){
    return head + filtroHtml + '<div class="card"'+cardEstiloAdmin+'><div class="empty-state"><div class="ic">📅</div>' + (scopeAll ? 'No hay planes semanales que coincidan con el filtro.' : 'Todavía no has creado ningún plan semanal.<br/><button class="btn btn-primary" id="btnNewSemanal2" style="margin-top:14px;">Crear el primero</button>') + '</div></div>';
  }

  // Agrupa por trimestre y, dentro de cada trimestre, por mes (según fecha de inicio del plan).
  var trimestres = {1:{}, 2:{}, 3:{}};
  var sinFecha = [];
  planes.forEach(function(s){
    var info = trimestreYMesDe(s.fechaInicio);
    if(!info){ sinFecha.push(s); return; }
    if(!trimestres[info.trimestre][info.mesKey]) trimestres[info.trimestre][info.mesKey] = {label: info.mesLabel, planes: []};
    trimestres[info.trimestre][info.mesKey].planes.push(s);

  var gruposHtml = [1,2,3].map(function(t){

    var mesesHtml = mesKeys.map(function(mk){
      var grupo = meses[mk];
      var cuerpoMes;
      if(scopeAll && banda){

        cuerpoMes = semanalDocenteGruposHtml(grupo.planes, docentesById, banda, theadHtml, rowHtml);
      } else {
        // Comportamiento original: agrupa dentro del mes por semana (mismo rango de fechas), para
        // que los planes de una misma semana (p.ej. varias asignaturas) queden juntos.
        var semanas = {}; var semanaOrder = [];
        grupo.planes.forEach(function(s){
          var key = (s.fechaInicio||'') + '|' + (s.fechaFin||'');
          if(!semanas[key]){ semanas[key] = {fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, planes:[]}; semanaOrder.push(key); }
          semanas[key].planes.push(s);

        semanaOrder.sort();
        cuerpoMes = semanaOrder.map(function(sk){
          var g = semanas[sk];
          var filas = g.planes.slice().sort(function(a,b){ return (a.asignatura||'').localeCompare(b.asignatura||''); }).map(rowHtml).join('');

          return '<div style="margin-top:10px;"><h4 style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; font-weight:700;">' + escapeHtml(label) + '</h4><div class="table-wrap"><table>' + theadHtml + '<tbody>' + filas + '</tbody></table></div></div>';
        }).join('');
      }
      return '<div style="margin-top:14px;"><h3 style="font-size:13.5px; color:var(--blue-700); margin-bottom:8px;">' + escapeHtml(grupo.label) + '</h3>' + cuerpoMes + '</div>';
    }).join('');
    return '<div class="card"'+cardEstiloAdmin+'><h2>' + TRIMESTRE_LABELS[t] + '</h2>' + mesesHtml + '</div>';
  }).join('');

  var sinFechaHtml = sinFecha.length
    ? '<div class="card"'+cardEstiloAdmin+'><h2>Sin fecha asignada</h2><div class="table-wrap"><table>' + theadHtml + '<tbody>' + sinFecha.map(rowHtml).join('') + '</tbody></table></div></div>'
    : '';

  return head + filtroHtml + gruposHtml + sinFechaHtml;
}

/* ============================= PLAN SEMANAL — FORM ============================= */
function blankDia(){ return {id:uid('dia'), fecha:'', contenidos:'', nivelLogroBasico:'', nivelLogroIntermedio:'', nivelLogroAvanzado:'', actividades:'', recursos:'', evaluacion:''}; }
/* Para "Presentación de Planes": un Plan Semanal cuenta como lleno si tiene al menos un día
   creado y CADA día tiene Contenidos, Actividades y al menos un Nivel de Logro marcado — un plan
   con días en blanco (creado pero sin llenar) no cuenta como presentado, aunque exista. */
function semanalEstaCompleto(s){
  var dias = s.dias||[];
  if(!dias.length) return false;
  return dias.every(function(dia){
    var contenidos = richTextToPlain(dia.contenidos||'').trim();
    var actividades = richTextToPlain(dia.actividades||'').trim();
    var nivelLogro = richTextToPlain(dia.nivelLogroBasico||'').trim()
      || richTextToPlain(dia.nivelLogroIntermedio||'').trim()
      || richTextToPlain(dia.nivelLogroAvanzado||'').trim();
    return contenidos && actividades && nivelLogro;
  });
}
/* Texto plano de los 3 niveles de logro seleccionados para un día del Plan Semanal, para usarlo
   en las exportaciones (Word/HTML/Markdown/CSV), que muestran una sola línea/columna por día. */
function nivelLogroDiaTexto(dia){
  var partes = [];
  if(dia.nivelLogroBasico) partes.push('Básico: ' + dia.nivelLogroBasico);
  if(dia.nivelLogroIntermedio) partes.push('Intermedio: ' + dia.nivelLogroIntermedio);
  if(dia.nivelLogroAvanzado) partes.push('Avanzado: ' + dia.nivelLogroAvanzado);
  return partes.join('\n');
}

/* La sección Contenidos del PCA (de donde sale "row.unidad", p.ej. "Unidad 1") y la tabla de
   Temporalización (de donde sale "Nombre de la Unidad", p.ej. "Los números reales") son dos
   listas separadas dentro del mismo PCA — se unen aquí por el texto de "unidad" para mostrar
   "Unidad 1 — Los números reales" en el campo Unidad Didáctica del Plan Semanal. */
function unidadDidacticaConNombre(pcaId, unidadLabel){
  if(!unidadLabel) return '';
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var tm = pca && (pca.temporalizacion||[]).find(function(t){ return t.unidad===unidadLabel; });
  var nombre = tm && tm.nombreUnidad;
  return nombre ? (unidadLabel + ' — ' + nombre) : unidadLabel;
}
/* Usada al vincular automáticamente un PCA (nueva ficha, o al cambiar nivel/curso/asignatura):
   precarga la fecha de la primera semana del PCA para que el docente tenga un punto de partida
   editable, en vez de forzarlo a elegir la semana de una lista. Nivel de Logro y Contenidos
   Esenciales ya NO se precargan aquí: ahora son listas de selección múltiple que el docente
   marca explícitamente (ver parseNivelesLogroTiers / temasSemana en renderSemanalForm). */
function applySemanaSelection(s, pcaId, rowId){
  s.pcaId = pcaId || '';
  s.semanaRowId = rowId || '';
  if(!pcaId) return;
  var row = semanasDePca(pcaId).find(function(r){ return r.id===rowId; });
  if(row){
    s.fechaInicio = row.fechaInicio || s.fechaInicio;
    s.fechaFin = row.fechaFin || s.fechaFin;
    s.unidadDidactica = unidadDidacticaConNombre(pcaId, row.unidad);
    if(s.dias && s.dias[0]) s.dias[0].fecha = s.fechaInicio;
  }
}
/* Usada cuando el docente edita manualmente la Fecha: busca, entre las semanas del PCA
   vinculado, aquella cuyo rango contiene la fecha de inicio ingresada, y si la encuentra
   actualiza Unidad Didáctica. Si no hay coincidencia (p.ej. porque esa semana del PCA todavía
   no tiene Fecha Inicio/Fin registrada, o el docente escribió una fecha distinta), NO se borra
   la semana ya vinculada — así Nivel de Logro y Contenidos Esenciales no desaparecen solo por
   escribir una fecha que no calza exactamente con el rango guardado en el PCA. */
function applyFechaSelection(s){
  if(!s.pcaId){ return; }
  if(!s.fechaInicio){ s.semanaRowId = ''; return; }
  var semanas = semanasDePca(s.pcaId);
  var match = semanas.find(function(r){
    return r.fechaInicio && r.fechaFin && s.fechaInicio >= r.fechaInicio && s.fechaInicio <= r.fechaFin;
  });
  if(match){
    s.semanaRowId = match.id;
    s.fechaFin = match.fechaFin || s.fechaFin;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, match.unidad);
    return;
  }
  // Sin coincidencia por fecha: si todavía no hay ninguna semana vinculada (p.ej. un plan
  // guardado antes de esta función, o cuya semana del PCA nunca tuvo Fecha Inicio/Fin), usa la
  // primera semana del PCA como respaldo en vez de dejar Nivel de Logro/Contenidos sin nada.
  if(!s.semanaRowId && semanas.length){
    s.semanaRowId = semanas[0].id;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, semanas[0].unidad);
  }
}
function recomputeSemanalPca(s){
  var pca = findMiPca(s.docenteId, s.nivel, s.especialidad, s.curso, s.asignatura);
  if(pca) applySemanaSelection(s, pca.id, (semanasDePca(pca.id)[0]||{}).id);
  else { s.pcaId=''; s.semanaRowId=''; s.unidadDidactica=''; }
}

function openSemanalForm(semId, returnTo){
  state.semanalReturnTo = returnTo || 'semanallist';
  var d = currentDocente();
  if(semId){
    var found = load(LS.SEMANAL).find(function(s){ return s.id===semId; });
    state.editingSemanal = Object.assign({}, found, { dias: (found.dias||[]).map(function(x){ return Object.assign({}, x); }) });
    marcarBaseConflicto('semanal', found.updatedAt);
  } else {
    state.editingSemanal = blankSemanal(d);
    var pca = findMiPca(d.id, state.editingSemanal.nivel, state.editingSemanal.especialidad, state.editingSemanal.curso, state.editingSemanal.asignatura);
    if(pca) applySemanaSelection(state.editingSemanal, pca.id, (semanasDePca(pca.id)[0]||{}).id);
  }
  go('semanalform');
}
