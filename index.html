<title>Sistema Académico · UEP Simón Bolívar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --blue-900:#0A2A5E;
    --blue-700:#123E8C;
    --blue-600:#1848A0;
    --blue-500:#2563C7;
    --blue-100:#E7EEFB;
    --blue-50:#F2F6FD;
    --gold-500:#F2B705;
    --gold-600:#D69E00;
    --gold-100:#FCF1CC;
    --red-600:#D62828;
    --red-100:#FBE4E4;
    --green-600:#1E8E5A;
    --green-100:#E3F5EC;
    --ink:#16233A;
    --paper:#F5F7FB;
    --surface:#FFFFFF;
    --surface-2:#FAFBFE;
    --line:#DCE3F0;
    --line-strong:#C3CEE3;
    --muted:#5B6B85;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --blue-900:#DCE8FF;
      --blue-700:#8FB6FA;
      --blue-600:#6FA0F4;
      --blue-500:#5C93EF;
      --blue-100:#16294D;
      --blue-50:#101B33;
      --gold-500:#F2B705;
      --gold-600:#F5C736;
      --gold-100:#3A2E08;
      --red-600:#FF6B6B;
      --red-100:#3A1414;
      --green-600:#4FCB92;
      --green-100:#0F2A20;
      --ink:#EAF0FB;
      --paper:#0B1220;
      --surface:#111A2E;
      --surface-2:#0E1626;
      --line:#233150;
      --line-strong:#31456E;
      --muted:#93A2C2;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --blue-900:#DCE8FF; --blue-700:#8FB6FA; --blue-600:#6FA0F4; --blue-500:#5C93EF;
    --blue-100:#16294D; --blue-50:#101B33; --gold-100:#3A2E08; --red-600:#FF6B6B; --red-100:#3A1414;
    --green-600:#4FCB92; --green-100:#0F2A20; --ink:#EAF0FB; --paper:#0B1220; --surface:#111A2E;
    --surface-2:#0E1626; --line:#233150; --line-strong:#31456E; --muted:#93A2C2;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --blue-900:#0A2A5E; --blue-700:#123E8C; --blue-600:#1848A0; --blue-500:#2563C7;
    --blue-100:#E7EEFB; --blue-50:#F2F6FD; --gold-100:#FCF1CC; --red-600:#D62828; --red-100:#FBE4E4;
    --green-600:#1E8E5A; --green-100:#E3F5EC; --ink:#16233A; --paper:#F5F7FB; --surface:#FFFFFF;
    --surface-2:#FAFBFE; --line:#DCE3F0; --line-strong:#C3CEE3; --muted:#5B6B85;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif); font-weight:700; text-wrap:balance; margin:0;}
  a{color:var(--blue-600);}
  button{font-family:var(--sans);}
  input,select,textarea{font-family:var(--sans); color:var(--ink);}
  ::selection{background:var(--gold-100);}
  .tabular{font-variant-numeric:tabular-nums; font-family:var(--mono);}

  #app{min-height:100vh;}
  .center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;}

  /* ---------- Auth screens ---------- */
  .auth-wrap{width:100%; max-width:920px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:0; background:var(--surface); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-2); border:1px solid var(--line);}
  @media (max-width:760px){ .auth-wrap{grid-template-columns:1fr;} .auth-banner{display:none;} }
  .auth-banner{position:relative; min-height:100%; background:var(--blue-900);}
  .auth-banner img{width:100%; height:100%; object-fit:contain; display:block; min-height:420px;}
  .auth-banner .banner-caption{position:absolute; left:0; right:0; bottom:0; padding:18px 22px; background:linear-gradient(to top, rgba(6,14,30,.88), rgba(6,14,30,0)); color:#fff;}
  .auth-banner .banner-caption .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
  .auth-form{padding:40px 36px; display:flex; flex-direction:column; gap:20px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-row img{width:44px; height:44px; border-radius:50%; object-fit:cover; box-shadow:var(--shadow-1); background:#fff;}
  .brand-row .brand-text .institution{font-family:var(--serif); font-weight:700; font-size:15px; line-height:1.25; color:var(--blue-900);}
  .brand-row .brand-text .tagline{font-size:11.5px; color:var(--muted); letter-spacing:.02em;}
  .auth-form h1{font-size:24px; color:var(--blue-900);}
  .auth-sub{color:var(--muted); font-size:13.5px; margin-top:-10px;}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.01em;}
  .field .required{color:var(--red-600);}
  .field input, .field select, .field textarea{
    padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:var(--surface-2); font-size:14.5px; color:var(--ink); width:100%; min-width:0;
  }
  .field textarea{resize:vertical; min-height:64px; font-family:var(--sans);}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);
  }
  .field .hint{font-size:11.5px; color:var(--muted);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }

  .btn{
    appearance:none; border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .04s ease, filter .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--blue-500); outline-offset:2px;}
  .btn-primary{background:var(--blue-700); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold-500); color:#3A2A00;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; color:var(--blue-700); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--blue-50);}
  .btn-danger{background:transparent; color:var(--red-600); border-color:var(--red-100);}
  .btn-danger:hover{background:var(--red-100);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .form-error{background:var(--red-100); color:var(--red-600); border:1px solid var(--red-100); padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; display:none;}
  .form-error.show{display:block;}
  .switch-line{font-size:13.5px; color:var(--muted); text-align:center;}
  .switch-line button{background:none; border:none; color:var(--blue-600); font-weight:600; cursor:pointer; padding:0; font-size:13.5px;}

  /* ---------- App shell ---------- */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;}
  @media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr);} .sidebar{position:fixed; z-index:40; inset:0 auto 0 0; width:248px; transform:translateX(-100%); transition:transform .2s ease;} .sidebar.open{transform:translateX(0);} .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(8,14,28,.45); z-index:35;} .sidebar-scrim.show{display:block;} .mobile-topbar{display:flex !important;} }
  .sidebar{background:var(--blue-900); color:#EAF0FF; display:flex; flex-direction:column; padding:20px 16px; gap:22px;}
  .sidebar .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .sidebar .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; background:#fff;}
  .sidebar .brand .name{font-family:var(--serif); font-weight:700; font-size:13.5px; line-height:1.25;}
  .sidebar .brand .year{font-size:10.5px; opacity:.7;}
  .sidebar nav{display:flex; flex-direction:column; gap:4px;}
  .sidebar nav button{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:#C9D7F5;
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .sidebar nav button .ic{width:18px; text-align:center; opacity:.85;}
  .sidebar nav button:hover{background:rgba(255,255,255,.06); color:#fff;}
  .sidebar nav button.active{background:var(--gold-500); color:#3A2A00;}
  .sidebar .spacer{flex:1;}
  .sidebar .who{border-top:1px solid rgba(255,255,255,.14); padding-top:14px; display:flex; flex-direction:column; gap:8px;}
  .sidebar .who .who-name{font-size:13px; font-weight:700;}
  .sidebar .who .who-role{font-size:11.5px; color:#AEC0EA;}
  .sidebar .who button{background:rgba(255,255,255,.08); color:#fff; border:none; padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; text-align:left;}
  .sidebar .who button:hover{background:rgba(255,255,255,.16);}

  .mobile-topbar{display:none; align-items:center; gap:10px; padding:12px 16px; background:var(--blue-900); color:#fff; position:sticky; top:0; z-index:20;}
  .mobile-topbar button{background:none; border:none; color:#fff; font-size:20px; cursor:pointer;}
  .mobile-topbar .name{font-size:13.5px; font-weight:700;}

  main.content{padding:28px 32px 80px; max-width:1180px; width:100%; margin:0 auto;}
  @media (max-width:600px){ main.content{padding:18px 14px 60px;} }

  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-head .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .page-head h1{font-size:26px; color:var(--blue-900); margin-top:2px;}
  .page-head p{color:var(--muted); font-size:13.5px; margin-top:4px; max-width:52ch;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:22px;}
  .card + .card{margin-top:18px;}
  .card h2{font-size:16px; color:var(--blue-900); margin-bottom:4px;}
  .card .card-sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}

  .grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;}
  @media (max-width:820px){ .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr);} }

  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-1);}
  .stat .stat-num{font-family:var(--serif); font-size:28px; font-weight:700; color:var(--blue-700);}
  .stat .stat-label{font-size:12px; color:var(--muted); margin-top:2px;}

  .action-card{display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-1); transition:border-color .15s, transform .06s;}
  .action-card:hover{border-color:var(--blue-500); transform:translateY(-1px);}
  .action-card .ic{width:34px; height:34px; border-radius:9px; background:var(--blue-100); color:var(--blue-700); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .action-card h3{font-size:14.5px; color:var(--ink);}
  .action-card p{font-size:12.5px; color:var(--muted); margin:0;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
  table thead th{background:var(--blue-50); color:var(--blue-900); text-align:left; padding:9px 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); white-space:nowrap;}
  table td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table tbody tr:last-child td{border-bottom:none;}
  table tbody tr:hover{background:var(--surface-2);}
  .cell-input, .cell-select{width:100%; min-width:120px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px;}
  .carga-table{table-layout:auto; width:auto;}
  .carga-table th, .carga-table td{width:auto; white-space:nowrap;}
  .carga-table .cell-select{width:auto; min-width:150px;}
  .carga-table .checkbox-grid{width:auto; max-width:340px; min-width:0;}
  .carga-table .cell-input{width:auto; min-width:0;}
  .cell-textarea{width:100%; min-width:160px; min-height:52px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px; resize:vertical;}
  .row-remove{background:none; border:none; color:var(--red-600); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:6px;}
  .row-remove:hover{background:var(--red-100);}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .pill-blue{background:var(--blue-100); color:var(--blue-700);}
  .pill-gold{background:var(--gold-100); color:var(--gold-600);}
  .pill-green{background:var(--green-100); color:var(--green-600);}
  .pill-muted{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
  .asis-cell{width:32px; height:28px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; cursor:pointer;}
  .asis-cell.asis-P{background:var(--green-100); color:var(--green-600); border-color:var(--green-100);}
  .asis-cell.asis-A{background:var(--gold-100); color:var(--gold-600); border-color:var(--gold-100);}
  .asis-cell.asis-F{background:var(--red-100); color:var(--red-600); border-color:var(--red-100);}


  .empty-state{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-state .ic{font-size:30px; margin-bottom:8px;}

  .confirm-overlay{position:fixed; inset:0; background:rgba(8,14,28,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .confirm-box{background:var(--surface); border-radius:12px; padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow-2);}
  .confirm-box p{margin:0 0 18px; font-size:14px; color:var(--ink); line-height:1.5;}
  .confirm-actions{display:flex; gap:10px; justify-content:flex-end;}

  .toast-region{position:fixed; top:16px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:340px;}
  .toast{background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow-2); animation:toast-in .18s ease;}
  .toast.success{background:var(--green-600); color:#06301c;}
  .toast.error{background:var(--red-600); color:#3A0000;}
  @keyframes toast-in{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- PCA document ---------- */
  .pca-toolbar{position:sticky; top:0; z-index:15; background:var(--paper); padding:10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .pca-toolbar .spacer{flex:1;}
  .pca-doc{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-1);}
  .pca-band{padding:12px 20px; font-weight:700; font-size:13px; letter-spacing:.02em; color:#fff;}
  .pca-band.band-top{background:var(--blue-900); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .pca-band.band-top .inst{font-family:var(--serif); font-size:16px;}
  .pca-band.band-title{background:var(--blue-700); text-align:center; font-family:var(--serif); font-size:15px; text-transform:uppercase; letter-spacing:.04em;}
  .pca-band.band-section{background:var(--gold-500); color:#3A2A00; text-transform:uppercase;}
  .pca-band.band-unit{background:var(--blue-600); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pca-section{padding:18px 20px;}
  .pca-doc .pca-band + .pca-section{padding-top:18px;}
  .unit-block{border-top:1px solid var(--line);}
  .unit-block:first-child{border-top:none;}
  .unit-head-input{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; font-weight:600; min-width:220px;}
  .unit-head-input::placeholder{color:rgba(255,255,255,.75);}
  .totals-row td{font-weight:700; background:var(--blue-50);}
  .signature-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:20px;}
  @media (max-width:760px){ .signature-grid{grid-template-columns:1fr;} }
  .signature-box{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; background:var(--surface-2);}
  .signature-box .role{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin-bottom:8px;}

  .db-warning{background:var(--gold-100); border:1px solid var(--gold-500); color:#5a4300; padding:14px 16px; border-radius:var(--radius-sm); font-size:13px; line-height:1.5;}
  :root[data-theme="dark"] .db-warning, @media (prefers-color-scheme:dark){ .db-warning{color:#F2D98A;} }
  .lock-banner{background:var(--gold-100); border:1px solid var(--gold-500); color:#5a4300; padding:12px 20px; font-size:13px; font-weight:600;}
  :root[data-theme="dark"] .lock-banner, @media (prefers-color-scheme:dark){ .lock-banner{color:#F2D98A;} }
  .admin-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .admin-tabs button{background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;}
  .admin-tabs button:hover{color:var(--blue-700);}
  .admin-tabs button.active{color:var(--blue-700); border-bottom-color:var(--blue-600);}

  .kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line-strong); padding:1px 6px; border-radius:4px;}
  .checkbox-grid{display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); min-height:20px;}
  .checkbox-pill{display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:5px 10px 5px 8px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; user-select:none; white-space:nowrap;}
  .checkbox-pill:has(input:checked){background:var(--blue-100); border-color:var(--blue-500); color:var(--blue-700);}
  .checkbox-pill input{accent-color:var(--blue-600); cursor:pointer; margin:0;}
  .obs-opts{display:flex; flex-wrap:wrap; gap:6px;}
  .obs-table{table-layout:fixed;}
  .obs-table td, .obs-table th{vertical-align:middle;}
  .obs-table .obs-evidencia{font-weight:700; font-size:12.5px; color:var(--blue-900);}
  .add-inline{display:flex; gap:8px; margin-top:8px;}
  .add-inline input{flex:1; min-width:0; padding:7px 9px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); font-size:13px; color:var(--ink);}
  .add-inline input:focus{outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);}
  .rte{border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); overflow:hidden;}
  .rte-toolbar{display:flex; gap:2px; flex-wrap:wrap; padding:5px; border-bottom:1px solid var(--line-strong); background:var(--surface);}
  .rte-toolbar button{background:none; border:1px solid transparent; border-radius:5px; width:28px; height:26px; font-size:12.5px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;}

<script>
(function(){
"use strict";

/* ============================= DATA / STORAGE (Firestore) ============================= */
/* LS sigue usándose como "nombre de tabla" en todo el código (DOCENTES, CARGA, etc.), pero ahora
   apunta al nombre de la colección de Firestore en vez de una llave de localStorage. load()/save()
   ya no son E/S directa: son una caché en memoria (FS_CACHE) mantenida en tiempo real por
   listeners de Firestore (ver attachRealtimeListeners). save() actualiza la caché al instante
   (para que la UI se sienta inmediata) y en paralelo sincroniza los cambios hacia Firestore
   comparando contra la versión anterior — así ningún llamador existente (load()/save() se usan
   igual en más de cien lugares del código) necesitó cambiar. */
var LS = {
  DOCENTES: 'DOCENTES',
  CARGA: 'CARGA',
  PCA: 'PCA',
  CONT: 'CONT',
  SEMANAL: 'SEMANAL',
  FECHAS_LIMITE: 'FECHAS_LIMITE',
  ESTUDIANTES: 'ESTUDIANTES',
  ASISTENCIA: 'ASISTENCIA',
  INCIDENTES: 'INCIDENTES',
  OBSERVACIONES: 'OBSERVACIONES'
};
var FS_COLLECTION = {
  DOCENTES: 'docentes', CARGA: 'carga', PCA: 'pca', CONT: 'contenidos', SEMANAL: 'semanal', FECHAS_LIMITE: 'fechaslimite',
  ESTUDIANTES: 'estudiantes', ASISTENCIA: 'asistencia', INCIDENTES: 'incidentes', OBSERVACIONES: 'observaciones'
};
var FS_CACHE = { DOCENTES: [], CARGA: [], PCA: [], CONT: [], SEMANAL: [], FECHAS_LIMITE: [], ESTUDIANTES: [], ASISTENCIA: [], INCIDENTES: [], OBSERVACIONES: [] };
function load(key){ return FS_CACHE[key] || []; }
function save(key, val){
  var old = FS_CACHE[key] || [];
  var oldById = {}; old.forEach(function(r){ oldById[r.id] = r; });
  var keptIds = {};
  var writes = [];
  (val||[]).forEach(function(r){
    keptIds[r.id] = true;
    var prev = oldById[r.id];
    if(!prev || JSON.stringify(prev) !== JSON.stringify(r)){
      writes.push(window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id)), r));
    }
  });
  old.forEach(function(r){
    if(!keptIds[r.id]) writes.push(window.FB.deleteDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id))));
  });
  FS_CACHE[key] = val;
  Promise.all(writes).catch(function(e){
    console.error('Error guardando en Firestore', key, e);
    toast('No se pudo guardar en la nube (' + (e.message||e.code||e) + '). Revisa tu conexión.', 'error');
  });
}
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  s = (s===undefined || s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(d){
  if(!d) return '—';
  try{ var p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; } catch(e){ return d; }
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-EC', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
}
/* Formatea un valor de <input type="datetime-local"> ("YYYY-MM-DDTHH:mm", sin zona horaria). */
function fmtDateTimeLocal(dtLocal){
  if(!dtLocal) return '—';
  var d = new Date(dtLocal);
  if(isNaN(d.getTime())) return dtLocal;
  return d.toLocaleDateString('es-EC', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
}

/* ============================= CURRICULUM (Ecuador) ============================= */
var NIVELES = ['Iniciales y Preparatoria','Básica Elemental','Básica Media','Básica Superior','Bachillerato'];

var ESPECIALIDADES = {

}
var CURSOS = {

};

var ASIGNATURAS = {
  'Iniciales y Preparatoria': ['Comprensión y Expresión de Lenguaje','Convivencia','Expresión Artística','Expresión Corporal y Motricidad','Identidad y Autonomía','Relación con el Medio Natural y Cultural','Relación Lógico-Matemática','Robótica','Inglés','Computación'],
  'Básica Elemental': ['Matemática','Lengua y Literatura','Ciencias Naturales','Estudios Sociales','Inglés','Educación Cultural y Artística','Educación Física','Computación','Robótica','Informática Aplicada (Programación)'],
  'Básica Media': ['Matemática','Lengua y Literatura','Ciencias Naturales','Estudios Sociales','Inglés','Educación Cultural y Artística','Educación Física','Computación','Robótica','Informática Aplicada (Programación)'],
  'Básica Superior': ['Matemática','Lengua y Literatura','Ciencias Naturales','Estudios Sociales','Inglés','Educación Cultural y Artística','Educación Física','Emprendimiento y Gestión','Computación','Robótica','Informática Aplicada (Programación)'],
  'Bachillerato': ['Matemática','Lengua y Literatura','Física','Química','Biología','Historia','Educación para la Ciudadanía','Filosofía','Inglés','Educación Física','Emprendimiento y Gestión','Computación','Robótica','Informática Aplicada (Programación)']
};
var ASIGNATURAS_ESP = {
  'Diseño Gráfico': [
    'Diseño Editorial/Diagramación',
    'Fundamentos del Diseño/Técnicas de Representación',
    'Ilustración Digital y Diseño/Branding',

  ]
};

/* Catálogo de bloques curriculares para Plan Semanal (2.º a 10.º EGB, cuatro asignaturas
   troncales). Fuera de este alcance, Bloque Curricular se captura como texto libre. */
var BLOQUES_CURRICULARES = {
  'Lengua y Literatura': ['Lengua y cultura','Comunicación oral','Lectura','Escritura','Literatura'],
  'Matemática': ['Álgebra y funciones','Geometría y medida','Estadística y probabilidad'],
  'Ciencias Naturales': ['Los seres vivos y su ambiente','Cuerpo humano y salud','Materia y energía','La Tierra y el universo'],
  'Estudios Sociales': ['Historia e identidad','Los seres humanos en el espacio','La convivencia']
};
var NIVELES_BLOQUE_CURRICULAR = ['Básica Elemental','Básica Media','Básica Superior'];
function bloquesFor(nivel, asignatura){
  if(NIVELES_BLOQUE_CURRICULAR.indexOf(nivel)===-1) return null;
  return BLOQUES_CURRICULARES[asignatura] || null;
}

/* Separa el texto enriquecido (destreza/temas del PCA) en líneas individuales — cada párrafo o
   viñeta se vuelve una entrada de la lista, quitando el marcador "• " si lo trae. */
function parseLinesList(html){
  var plain = richTextToPlain(html);
  if(!plain) return [];
  return plain.split('\n').map(function(l){ return l.replace(/^•\s*/, '').trim(); }).filter(Boolean);
}
/* El campo Nivel de Logro del PCA (para una sola semana) puede traer, línea por línea, la
   descripción de cada nivel (p.ej. "Básico: ...", "Intermedio: ...", "Avanzado: ..."). Esta
   función detecta esas líneas por palabra clave y devuelve las 3 descripciones por separado
   (recortando el marcador inicial), dejando vacía la que no esté presente. */
function parseNivelesLogroTiers(html){
  var out = {basico:'', intermedio:'', avanzado:''};
  parseLinesList(html).forEach(function(line){
    var t = line.toLowerCase();
    var limpio = line.replace(/^(nivel\s+)?(básico|basico|intermedio|avanzado)\s*[:\-–]?\s*/i, '').trim() || line;
    if(t.indexOf('avanzado')!==-1) out.avanzado = limpio;
    else if(t.indexOf('intermedio')!==-1) out.intermedio = limpio;
    else if(t.indexOf('básico')!==-1 || t.indexOf('basico')!==-1) out.basico = limpio;
  });
  return out;
}
var DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDateLargo(iso){
  if(!iso) return '';
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  if(isNaN(d.getTime())) return '';
  return DIAS_LARGO[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES_LARGO[d.getMonth()] + ' ' + d.getFullYear();
}
function addDays(iso, n){
  if(!iso) return '';
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function especialidadesFor(nivel){ return ESPECIALIDADES[nivel] || []; }
var CURSOS_BACHILLERATO_ESP = {
  'Diseño Gráfico': ['1.º Diseño','2.º Diseño','3.º Diseño'],
  'Ciencias Generales': ['1.º BGU','2.º BGU','3.º BGU'],
  'BGU y Diseño': ['1.º BGU/1.º DIS','2.º BGU/2.º DIS','3.º BGU/3.º DIS']
};
function cursosFor(nivel, especialidad){
  if(nivel === 'Bachillerato') return (especialidad && CURSOS_BACHILLERATO_ESP[especialidad]) || CURSOS['Bachillerato'];
  return CURSOS[nivel] || [];
}
function asignaturasFor(nivel, especialidad){
  var list = (ASIGNATURAS[nivel] || []).slice();
  if(especialidad && ASIGNATURAS_ESP[especialidad]) list = list.concat(ASIGNATURAS_ESP[especialidad]);
  var seen = {};
  return list.filter(function(a){ if(seen[a]) return false; seen[a]=1; return true; });
}
function misCargaRows(docenteId){ return load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId; }); }
function misCursosPara(docenteId, nivel, especialidad){
  var rows = misCargaRows(docenteId).filter(function(r){ return r.nivel===nivel && (!especialidad || r.especialidad===especialidad); });
  var set = {};
  rows.forEach(function(r){ if(r.curso) set[r.curso]=1; });
  return Object.keys(set).sort();
}
function misAsignaturasPara(docenteId, nivel, especialidad, curso){
  var rows = misCargaRows(docenteId).filter(function(r){ return r.nivel===nivel && (!especialidad || r.especialidad===especialidad) && (!curso || r.curso===curso); });
  var set = {};
  rows.forEach(function(r){ if(r.asignatura) set[r.asignatura]=1; });
  return Object.keys(set).sort();
}
/* ============================= SESSION ============================= */
/* La sesión la controla Firebase Auth (persistencia automática); CURRENT_UID lo mantiene
   actualizado el listener onAuthStateChanged (ver abajo, sección FIREBASE BOOTSTRAP). */
var CURRENT_UID = null;
var FB_READY = false;
function getSessionId(){ return CURRENT_UID; }

function allDocentes(){ return load(LS.DOCENTES); }
function currentDocente(){
  var id = getSessionId();

}
function misAsignaturas(docenteId){
  var set = {};
  load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId; }).forEach(function(r){ if(r.asignatura) set[r.asignatura]=1; });
  return Object.keys(set).sort();
}
function misCursosTodos(docenteId){
  var set = {};
  load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId; }).forEach(function(r){ if(r.curso) set[r.curso]=1; });
  return Object.keys(set).sort();
}
/* "Banda A" = Iniciales a 6.º EGB (Iniciales y Preparatoria / Básica Elemental / Básica Media):
   ahí se filtra solo por asignatura. "Banda B" = 7.º EGB a 3.º Bachillerato (Básica Superior /

var NIVELES_BANDA_A = ['Iniciales y Preparatoria','Básica Elemental','Básica Media'];
function nivelEsBandaA(nivel){ return NIVELES_BANDA_A.indexOf(nivel) !== -1; }

/* ============================= INSPECCIÓN GENERAL ============================= */
/* Jornada fija: 11 horas curriculares de 45 min desde las 07:15, con receso de 45 min
   (10:15-11:00) entre la 4.ª y la 5.ª hora. */
var PERIODOS = [
  {n:1, inicio:'07:15', fin:'08:00'},
  {n:2, inicio:'08:00', fin:'08:45'},
  {n:3, inicio:'08:45', fin:'09:30'},
  {n:4, inicio:'09:30', fin:'10:15'},
  {n:5, inicio:'11:00', fin:'11:45'},
  {n:6, inicio:'11:45', fin:'12:30'},
  {n:7, inicio:'12:30', fin:'13:15'},

];
var RECESO = {inicio:'10:15', fin:'11:00'};

/* Clave determinística del documento de asistencia de un curso en un día — así se puede leer
   directo con getDoc en vez de tener que hacer una query, y nunca se duplica la hoja del día. */
function asistenciaDocId(nivel, especialidad, curso, fecha){
  return ['asis', nivel, especialidad||'x', curso, fecha].join('|').replace(/[^\w|.-]/g, '_');
}
function estudiantesDe(nivel, especialidad, curso){
  return load(LS.ESTUDIANTES).filter(function(e){
    return e.nivel===nivel && (e.especialidad||'')===(especialidad||'') && e.curso===curso && e.estado!=='Inactivo';
  }).sort(function(a,b){ return (a.apellidos+a.nombres).localeCompare(b.apellidos+b.nombres); });
}
var TITULO_SIGLAS = {
  'licenciado':'Lic.', 'licenciada':'Lic.', 'ingeniero':'Ing.', 'ingeniera':'Ing.',
  'magister':'Mg.', 'máster':'Mg.', 'master':'Mg.', 'doctor':'Dr.', 'doctora':'Dra.',
  'profesor':'Prof.', 'profesora':'Prof.', 'tecnólogo':'Tlgo.', 'tecnóloga':'Tlga.',
  'arquitecto':'Arq.', 'arquitecta':'Arq.', 'economista':'Eco.', 'psicólogo':'Psc.', 'psicóloga':'Psc.',
  'bachiller':'Bach.', 'especialista':'Esp.'
};
/* Se compara solo la primera palabra del título (no el texto completo), porque los docentes
   suelen escribir frases como "Licenciada en Educación Básica" en vez de solo "Licenciada":
   con match exacto de la frase completa eso nunca abreviaba. */
function tituloSiglas(t){
  if(!t) return '';
  var trimmed = t.trim();
  var primeraPalabraTitulo = trimmed.split(/\s+/)[0].toLowerCase().replace(/\.$/, '');
  return TITULO_SIGLAS[primeraPalabraTitulo] || trimmed;
}
function primeraPalabra(s){ return (s||'').trim().split(/\s+/)[0] || ''; }
/* Firmas: título en siglas + un solo nombre y un solo apellido (no el nombre/apellido completo),
   para que las firmas queden cortas y consistentes en PCA y Plan Semanal. */
function nombreFormal(d){
  if(!d) return '';
  var sig = tituloSiglas(d.titulo);
  return ((sig ? sig+' ' : '') + primeraPalabra(d.nombres) + ' ' + primeraPalabra(d.apellidos)).trim();
}
function misNiveles(docenteId){
  var set = {};
  load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId; }).forEach(function(r){ if(r.nivel) set[r.nivel]=1; });
  return Object.keys(set).sort();
}
function misEspecialidadesPara(docenteId, nivel){
  var set = {};
  load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId && r.nivel===nivel; }).forEach(function(r){ if(r.especialidad) set[r.especialidad]=1; });
  return Object.keys(set).sort();
}
function findMiPca(docenteId, nivel, especialidad, curso, asignatura){
  return load(LS.PCA).find(function(p){
    if(p.docenteId!==docenteId) return false;
    if(p.nivel!==nivel) return false;
    if((p.especialidad||'')!==(especialidad||'')) return false;
    var pCurso = p.curso==='Otro…' ? p.cursoManual : p.curso;
    if((pCurso||'')!==(curso||'')) return false;
    var pAsig = p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura;
    if((pAsig||'')!==(asignatura||'')) return false;
    return true;
  }) || null;
}
function semanasDePca(pcaId){
  if(!pcaId) return [];
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var rows = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  var order = (pca && pca.unidadesNombres) || [];
  rows.sort(function(a,b){
    var ia = order.indexOf(a.unidad), ib = order.indexOf(b.unidad);
    if(ia!==ib) return ia-ib;
    return (a.semana||0)-(b.semana||0);
  });
  return rows;
}
/* Estado automático de la columna Observación. Un Plan Semanal solo se considera "de esta
   semana" si su fecha de inicio y fin coinciden EXACTAMENTE con las de la fila del PCA (no
   basta con que la fecha caiga dentro del rango). Una vez pasada la fecha fin, el estado
   depende de si los temas realmente vistos en los días del plan (creados por el docente)
   cubren todos los temas que el PCA planificó para esa semana: si los cubre todos → COMPLETADO,
   si falta alguno o no hay plan → CON RETRASO. No es editable manualmente: siempre refleja el
   estado actual. */
/* Busca la cobertura de temas en TODOS los planes semanales del PCA (no solo los vinculados
   exactamente a esta semana): así, si un tema pendiente de esta semana se termina marcando en
   el plan de la semana siguiente (ver temasPendientesAnteriores), esta semana también queda
   COMPLETADO — sin importar si el registro llegó tarde. */
function computeEstadoSemana(f, pcaId){
  var minD = f.fechaInicio || '';
  var maxD = f.fechaFin || '';
  if(!minD && !maxD) return null;

  var temasPca = parseLinesList(f.temas);
  if(temasPca.length){
    var vistos = {};
    load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
      (s.dias||[]).forEach(function(dia){
        (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
      });
    });
    if(temasPca.every(function(t){ return vistos[t]; })) return 'COMPLETADO';
  }

  var today = todayISO();
  if(minD && today < minD) return 'POR COMPLETAR';
  if(maxD && today > maxD) return 'CON RETRASO';
  return 'EN PROCESO';
}
/* Temas de la semana INMEDIATAMENTE ANTERIOR del PCA que ningún plan semanal marcó todavía —
   se agregan a las opciones de Contenidos Esenciales de la semana siguiente para que el
   docente pueda ponerse al día. */
function temasPendientesAnteriores(pcaId, semanaActualId){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  var anterior = semanas[idx-1];
  var temasAnt = parseLinesList(anterior.temas);
  if(!temasAnt.length) return [];
  var vistos = {};
  load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
    (s.dias||[]).forEach(function(dia){
      (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
    });
  });
  return temasAnt.filter(function(t){ return !vistos[t]; });
}
var ESTADO_SEMANA_STYLE = {
  'POR COMPLETAR': {color:'#8A6400', bg:'#FFF9DB'},
  'EN PROCESO': {color:'#D69E00', bg:'#FFF6D9'},
  'COMPLETADO': {color:'#0F5132', bg:'#E3F5EC'},
  'CON RETRASO': {color:'#7A1F1F', bg:'#EFD9DC'}
};
function estadoSemanaBadgeHtml(f, pcaId){
  var estado = computeEstadoSemana(f, pcaId);
  if(!estado) return '<div class="hint" style="text-align:center;">—</div>';
  var st = ESTADO_SEMANA_STYLE[estado];
  return '<div style="text-align:center; font-weight:700; font-size:11.5px; letter-spacing:.02em; padding:7px 6px; border-radius:6px; border:1px solid ' + st.bg + '; color:' + st.color + '; background:' + st.bg + ';">' + escapeHtml(estado) + '</div>';
}

/* ============================= TOAST ============================= */
function toast(msg, type){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}

/* Native confirm()/alert() are commonly blocked (or silently return false) inside the
   Artifact's sandboxed iframe — the same category of restriction that already required
   special handling for downloads and window.print(). This custom modal replaces every
   confirm() call in the app so delete actions actually work in that environment. */
function confirmDialog(message, onConfirm){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-box"><p>' + escapeHtml(message) + '</p><div class="confirm-actions"><button class="btn btn-ghost btn-sm" id="confirmCancelBtn">Cancelar</button><button class="btn btn-sm" id="confirmOkBtn" style="background:var(--red-600); color:#fff;">Eliminar</button></div></div>';
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#confirmCancelBtn').onclick = close;
  overlay.querySelector('#confirmOkBtn').onclick = function(){ close(); onConfirm(); };
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* Same rationale as confirmDialog: native prompt() is blocked in the sandboxed iframe, so the
   RTE "insertar enlace" button needs a custom replacement too. */
function promptDialog(message, defaultValue, onSubmit){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  var box = document.createElement('div');
  box.className = 'confirm-box';
  var p = document.createElement('p');
  p.textContent = message;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input';
  input.value = defaultValue || '';
  input.style.marginBottom = '14px';
  var actions = document.createElement('div');
  actions.className = 'confirm-actions';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost btn-sm';
  cancelBtn.textContent = 'Cancelar';
  var okBtn = document.createElement('button');
  okBtn.className = 'btn btn-primary btn-sm';
  okBtn.textContent = 'Aceptar';
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  input.focus();
  input.select();
  function close(){ overlay.remove(); }
  cancelBtn.onclick = close;
  okBtn.onclick = function(){ var v = input.value.trim(); close(); if(v) onSubmit(v); };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); okBtn.click(); } });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* ============================= RENDER ROOT ============================= */
function render(){
  var root = document.getElementById('app');
  if(!FB_READY){
    root.innerHTML = '<div class="center-screen"><div class="hint">Conectando…</div></div>';
    return;
  }
  if(!getSessionId()){
    root.innerHTML = state.authView === 'register' ? renderRegister() : renderLogin();
    bindAuthEvents();
  } else if(!currentDocente()){
    root.innerHTML = '<div class="center-screen"><div class="hint">Cargando tu perfil…</div></div>';
  } else {
    root.innerHTML = renderShell();
    bindShellEvents();
  }
}

function bindAuthEvents(){
  var toReg = document.getElementById('toRegister');
  if(toReg) toReg.onclick = function(){ goAuth('register'); };
  var toLog = document.getElementById('toLogin');
  if(toLog) toLog.onclick = function(){ goAuth('login'); };

  var btnLogin = document.getElementById('btnLogin');
  if(btnLogin) btnLogin.onclick = doLogin;
  var pwField = document.getElementById('loginPw');
  if(pwField) pwField.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  var idField = document.getElementById('loginId');
  if(idField) idField.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  var toReset = document.getElementById('toResetPw');
  if(toReset) toReset.onclick = doResetPassword;

  var btnReg = document.getElementById('btnRegister');
  if(btnReg) btnReg.onclick = doRegister;
}

/* Mapea los códigos de error de Firebase Auth a mensajes en español para el usuario. */
function mapAuthError(err){
  var code = err && err.code;
  var MAP = {
    'auth/invalid-email': 'El correo no es válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ese correo ya está registrado. Inicia sesión o usa "¿Olvidaste tu contraseña?".',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/network-request-failed': 'No se pudo conectar. Revisa tu conexión a internet.',
    'auth/requires-recent-login': 'Por seguridad, cierra sesión, vuelve a entrar, e intenta este cambio de inmediato.'
  };
  return (code && MAP[code]) || (err && err.message) || 'Ocurrió un error inesperado.';
}

async function doLogin(){
  var email = (document.getElementById('loginId').value || '').trim();
  var pw = document.getElementById('loginPw').value || '';
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email || !pw){ errEl.textContent='Ingresa tu correo y contraseña.'; errEl.classList.add('show'); return; }
  try{
    await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pw);
    /* onAuthStateChanged (ver FIREBASE BOOTSTRAP) se encarga de cargar el perfil, activar los
       listeners en tiempo real, y llamar a render() — aquí no hace falta hacerlo. */
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doResetPassword(){
  var email = (document.getElementById('loginId').value || '').trim();
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email){ errEl.textContent='Escribe tu correo arriba primero, luego haz clic en "¿Olvidaste tu contraseña?".'; errEl.classList.add('show'); return; }
  try{
    await window.FB.sendPasswordResetEmail(window.FB.auth, email);
    toast('Te enviamos un correo a ' + email + ' para restablecer tu contraseña.', 'success');
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doRegister(){
  var errEl = document.getElementById('registerError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('regTitulo').value.trim();
  var nombres = document.getElementById('regNombres').value.trim();
  var apellidos = document.getElementById('regApellidos').value.trim();
  var ci = document.getElementById('regCI').value.trim();
  var telefono = document.getElementById('regTelefono').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var usuarioId = document.getElementById('regUserId').value.trim();
  var pw = document.getElementById('regPw').value;

  if(!nombres || !apellidos || !ci || !email || !usuarioId || !pw) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Ingresa un correo institucional válido.');
  if(pw.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');

  var snap;
  try{
    snap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
  }catch(err){ return fail(mapAuthError(err)); }
  var existentes = []; snap.forEach(function(d){ existentes.push(d.data()); });
  if(existentes.some(function(d){ return (d.usuarioId||'').toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  /* Toda cuenta que se registra por sí misma queda como 'docente' — nunca 'admin' — reforzado
     también en las reglas de seguridad de Firestore, para que nadie pueda auto-otorgarse el rol
     de administrador. Un administrador ya existente promueve a alguien desde Editar Docente, o
     si el sistema está recién desplegado y todavía no hay ningún admin, se cambia el campo
     "role" a "admin" manualmente una sola vez desde la consola de Firebase (Firestore → docentes). */
  var role = 'docente';

  var cred;
  try{
    cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pw);
  }catch(err){ return fail(mapAuthError(err)); }

  var docente = {
    id: cred.user.uid,
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono,
    email: email, usuarioId: usuarioId,
    role: role,
    createdAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DOCENTES, docente.id), docente);
  }catch(err){
    return fail('Tu cuenta se creó pero no se pudo guardar tu perfil (' + mapAuthError(err) + '). Cierra esta página e intenta iniciar sesión de nuevo.');
  }

  toast('¡Bienvenido/a, ' + docente.nombres + '! Tu cuenta fue creada.', 'success');
  /* onAuthStateChanged toma el control desde aquí (perfil ya escrito arriba antes de que llegue). */
}

function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.onclick = function(){ go(btn.getAttribute('data-nav')); };
  });
  var logout = document.getElementById('btnLogout');
  if(logout) logout.onclick = function(){ state.subview='dashboard'; window.FB.signOut(window.FB.auth); };
  var openBtn = document.getElementById('btnOpenSidebar');
  if(openBtn) openBtn.onclick = function(){ state.sidebarOpen = true; render(); };
  var scrim = document.getElementById('sidebarScrim');
  if(scrim) scrim.onclick = function(){ state.sidebarOpen = false; render(); };

  bindSubviewEvents();
}

function bindSubviewEvents(){
  if(state.subview === 'cargahoraria') bindCargaHorariaEvents();
  else if(state.subview === 'pcalist') bindPcaListEvents();
  else if(state.subview === 'pcaform') bindPcaFormEvents();
  else if(state.subview === 'semanallist') bindSemanalListEvents();
  else if(state.subview === 'semanalform') bindSemanalFormEvents();
  else if(state.subview === 'perfil') bindPerfilEvents();
  else if(state.subview === 'database') bindDatabaseEvents();
  else if(state.subview === 'admin') bindAdminEvents();
  else if(state.subview === 'adminEditDocente') bindAdminEditDocenteEvents();
  else if(state.subview === 'adminNewDocente') bindAdminNewDocenteEvents();
  else if(state.subview === 'manualdocente') bindManualEvents();
  else if(state.subview === 'manualadmin') bindManualEvents();
  else if(state.subview === 'inspeccion') bindInspeccionEvents();
  else if(state.subview === 'observacion') bindObservacionEvents();
  else bindDashboardEvents();
}

function renderPerfil(d){
  return ''
  + '<div class="page-head"><div><div class="eyebrow">Mi Perfil</div><h1>Editar mis datos</h1><p>Actualiza tu información personal y de acceso. Tu carga horaria se administra desde "Mi Carga Horaria".</p></div></div>'
  + '<div class="card">'
  + '  <div class="form-error" id="perfilError"></div>'
  + '  <div class="field-row"><div class="field"><label>Título académico</label><input type="text" id="perfilTitulo" value="' + escapeHtml(d.titulo||'') + '" placeholder="Lic., Ing., Mg., Dr., etc." /></div><div class="field"></div></div>'
  + '  <div class="field-row"><div class="field"><label>Nombres <span class="required">*</span></label><input type="text" id="perfilNombres" value="' + escapeHtml(d.nombres) + '" /></div><div class="field"><label>Apellidos <span class="required">*</span></label><input type="text" id="perfilApellidos" value="' + escapeHtml(d.apellidos) + '" /></div></div>'
  + '  <div class="field-row"><div class="field"><label>Cédula (CI) <span class="required">*</span></label><input type="text" id="perfilCI" maxlength="10" value="' + escapeHtml(d.ci) + '" /></div><div class="field"><label>Teléfono</label><input type="text" id="perfilTelefono" value="' + escapeHtml(d.telefono||'') + '" /></div></div>'
  + '  <div class="field"><label>E-mail institucional (correo de acceso)</label><input type="email" id="perfilEmail" value="' + escapeHtml(d.email) + '" disabled /></div>'
  + '  <div class="field"><label>ID a usar <span class="required">*</span></label><input type="text" id="perfilUserId" value="' + escapeHtml(d.usuarioId) + '" /></div>'
  + '  <div class="field"><label>Nueva contraseña</label><input type="password" id="perfilPw" placeholder="Déjalo en blanco para no cambiarla" /></div>'
  + '  <button class="btn btn-primary" id="btnSavePerfil" style="margin-top:6px;">Guardar cambios</button>'
  + '</div>';
}
async function doSavePerfil(){
  var d = currentDocente();
  var errEl = document.getElementById('perfilError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('perfilTitulo').value.trim();
  var nombres = document.getElementById('perfilNombres').value.trim();
  var apellidos = document.getElementById('perfilApellidos').value.trim();
  var ci = document.getElementById('perfilCI').value.trim();
  var telefono = document.getElementById('perfilTelefono').value.trim();
  var usuarioId = document.getElementById('perfilUserId').value.trim();
  var pw = document.getElementById('perfilPw').value;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(pw && pw.length < 6) return fail('La nueva contraseña debe tener al menos 6 caracteres.');
  var docentes = allDocentes();
  if(docentes.some(function(x){ return x.id !== d.id && x.usuarioId.toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');

  if(pw){
    try{
      await window.FB.updatePassword(window.FB.auth.currentUser, pw);
    }catch(err){ return fail(mapAuthError(err)); }
  }

  d.titulo = titulo; d.nombres = nombres; d.apellidos = apellidos; d.ci = ci; d.telefono = telefono;
  d.usuarioId = usuarioId;

  save(LS.DOCENTES, docentes.map(function(x){ return x.id === d.id ? d : x; }));
  render();
  toast('Tus datos se actualizaron correctamente.', 'success');
}
function bindPerfilEvents(){
  document.getElementById('btnSavePerfil').onclick = doSavePerfil;
}

/* No es posible insertar fotografías/capturas de pantalla reales dentro de un Artifact (no hay
   forma de adjuntar archivos de imagen binarios al sistema), así que estos "mockups" reproducen
   fielmente cada pantalla con el mismo HTML/CSS y los mismos colores de marca que usa la
   aplicación real — visualmente son fieles al sistema, solo que se dibujan en vivo en vez de ser

    + '  <div class="spacer"></div>'
    + '  <button class="btn btn-gold btn-sm" id="btnManualPdf">Descargar PDF</button>'
    + '</div>';
}

}
function manualTip(html){ return '<div class="manual-tip"><b>💡 Consejo:</b> ' + html + '</div>'; }
function manualWarn(html){ return '<div class="manual-warn"><b>⚠️ Importante:</b> ' + html + '</div>'; }

function manualSideNav(items, activeKey){

}
function manualSection(id, titulo, bodyHtml){

}

  var secNav = manualSection('sec-3', '3. Cómo moverte por el sistema', ''

  var secPerfil = manualSection('sec-4', '4. Mi Perfil', ''
    + '<p>Aquí actualizas tu información personal: título académico, nombres, apellidos, cédula, teléfono e ID de referencia. Tu correo de acceso no se puede cambiar desde esta pantalla (es tu identificador único de ingreso).</p>'
    + '<p>También puedes cambiar tu contraseña: escribe la nueva en el campo “Nueva contraseña” y guarda — si la dejas en blanco, tu contraseña actual no cambia.</p>'
    + manualTip('Si el sistema te pide volver a iniciar sesión al cambiar tu contraseña, es una medida de seguridad normal: cierra sesión, entra de nuevo y repite el cambio.')

    + '<p>Aquí registras <b>qué asignaturas dictas y en qué cursos o grados</b>. El sistema usa esta información para sugerirte automáticamente las opciones correctas al crear tus PCA y Planes Semanales — por eso es el primer paso que debes completar.</p>'
    + '<h3>Registrar tu carga horaria</h3>'
    + manualStep(1, 'Elige el <b>Nivel Educativo</b> (por ejemplo, Básica Media).')
    + manualStep(2, 'Si tu nivel tiene especialidad (como Bachillerato), elígela.')

        + '<div style="margin-top:10px;"><span class="mbtn ghost">+ Agregar fila</span> <span class="mbtn primary">Guardar carga horaria</span></div>')

    + '<h3>Ver y editar lo ya registrado</h3>'
    + '<p>Una vez guardada, la pantalla muestra un resumen de solo lectura de lo que registraste. Haz clic en <b>“Editar”</b> para modificarlo, y en <b>“Guardar cambios”</b> o <b>“Cancelar”</b> para salir del modo de edición.</p>'
    + manualWarn('No puedes repetir la misma combinación de Nivel + Especialidad en dos filas distintas — el sistema oculta esa opción una vez usada, para evitar registros duplicados.')
  );

  var secPca = manualSection('sec-6', '6. Plan Curricular Anual (PCA)', ''
    + '<p>El PCA es el documento oficial de planificación anual por asignatura, siguiendo el formato institucional. Debes crear un PCA por cada combinación de nivel/curso/asignatura que dictas.</p>'
    + '<h3>Crear un PCA</h3>'
    + manualStep(1, 'Ve a <b>Planes Curriculares (PCA)</b> y haz clic en <b>“+ Nuevo Plan Curricular Anual”</b>.')

/* ============================= INSPECCIÓN GENERAL (solo admin) ============================= */
var INSPECCION_TABS = [
  {key:'estudiantes', label:'Estudiantes'},
  {key:'asistencia', label:'Asistencia'},
  {key:'disciplina', label:'Disciplina'},
  {key:'reportes', label:'Reportes'}
];
function renderInspeccion(d){
  if(d.role !== 'admin') return renderDashboard(d);
  var tab = state.inspeccionTab || 'estudiantes';
  var tabsHtml = INSPECCION_TABS.map(function(t){
    return '<button class="'+(tab===t.key?'active':'')+'" data-insptab="'+t.key+'">'+t.label+'</button>';
  }).join('');
  var body;
  if(tab === 'asistencia') body = renderInspAsistencia();
  else if(tab === 'disciplina') body = renderInspDisciplina();
  else if(tab === 'reportes') body = renderInspReportes();
  else body = renderInspEstudiantes();
  return ''
  + '<div class="page-head"><div><div class="eyebrow">Inspección General</div><h1>Disciplina, asistencia y convivencia</h1><p>Organiza, coordina y supervisa la disciplina, la asistencia y la convivencia armónica entre estudiantes, docentes y personal administrativo. Visible solo para administradores.</p></div></div>'
  + '<div class="admin-tabs">' + tabsHtml + '</div>'
  + body;
}
function bindInspeccionEvents(){
  document.querySelectorAll('[data-insptab]').forEach(function(btn){
    btn.onclick = function(){ state.inspeccionTab = btn.getAttribute('data-insptab'); render(); };
  });
  var tab = state.inspeccionTab || 'estudiantes';
  if(tab === 'asistencia') bindInspAsistenciaEvents();
  else if(tab === 'disciplina') bindInspDisciplinaEvents();
  else if(tab === 'reportes') bindInspReportesEvents();
  else bindInspEstudiantesEvents();
}

/* --- Inspección · Estudiantes --- */
function blankEstudiante(){
  return {id:uid('est'), nombres:'', apellidos:'', ci:'', nivel:'', especialidad:'', curso:'', cursoManual:'',
    nombreRepresentante:'', telefonoRepresentante:'', emailRepresentante:'', estado:'Activo', observaciones:''};
}
function renderInspEstudiantes(){
  var view = state.inspEstView || 'lista';
  if(view === 'nuevo' || view === 'editar') return renderInspEstudianteForm();
  if(view === 'masivo') return renderInspEstudiantesMasivo();
  return renderInspEstudiantesLista();
}
function bindInspEstudiantesEvents(){
  var view = state.inspEstView || 'lista';
  if(view === 'nuevo' || view === 'editar') bindInspEstudianteFormEvents();
  else if(view === 'masivo') bindInspEstudiantesMasivoEvents();
  else bindInspEstudiantesListaEvents();
}
function renderInspEstudiantesLista(){
  var f = state.inspEstFiltro || (state.inspEstFiltro = {nivel:'', especialidad:'', curso:''});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosFor(f.nivel, f.especialidad);
  var todos = load(LS.ESTUDIANTES).slice().sort(function(a,b){ return (a.apellidos+a.nombres).localeCompare(b.apellidos+b.nombres); });
  var filtrados = todos.filter(function(e){
    if(f.nivel && e.nivel !== f.nivel) return false;
    if(f.especialidad && (e.especialidad||'') !== f.especialidad) return false;
    if(f.curso && e.curso !== f.curso) return false;
    return true;
  });
  var rows = filtrados.map(function(e){
    return '<tr>'
    + '<td>' + escapeHtml(e.apellidos) + ' ' + escapeHtml(e.nombres) + '</td>'
    + '<td>' + escapeHtml(e.nivel) + (e.especialidad?' · '+escapeHtml(e.especialidad):'') + '</td>'
    + '<td>' + escapeHtml(e.curso==='Otro…'?e.cursoManual:e.curso) + '</td>'
    + '<td>' + escapeHtml(e.nombreRepresentante||'—') + '</td>'
    + '<td>' + (e.estado==='Inactivo' ? '<span class="pill pill-muted">Inactivo</span>' : '<span class="pill pill-gold">Activo</span>') + '</td>'
    + '<td><button class="btn btn-ghost btn-sm" data-est-edit="'+e.id+'">Editar</button></td>'
    + '</tr>';
  }).join('') || '<tr><td colspan="6" class="hint">No hay estudiantes registrados con este filtro.</td></tr>';
  return ''
  + '<div class="card">'
  + '  <h2>Estudiantes registrados <span class="hint">(' + filtrados.length + ' de ' + todos.length + ')</span></h2>'
  + '  <div class="field-row" style="margin:10px 0;">'
  + '    <div class="field"><label>Nivel</label><select class="cell-select" id="ieFNivel">' + optionsHtml(NIVELES, f.nivel, 'Todos') + '</select></div>'
  + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="ieFEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Todas':'No aplica') + '</select></div>'
  + '    <div class="field"><label>Curso</label><select class="cell-select" id="ieFCurso">' + optionsHtml(cursoOpts, f.curso, 'Todos') + '</select></div>'
  + '  </div>'
  + '  <div style="display:flex; gap:10px; margin-bottom:14px;">'
  + '    <button class="btn btn-primary btn-sm" id="btnEstNuevo">+ Nuevo estudiante</button>'
  + '    <button class="btn btn-ghost btn-sm" id="btnEstMasivo">+ Carga masiva</button>'
  + '  </div>'
  + '  <div class="table-wrap"><table><thead><tr><th>Estudiante</th><th>Nivel</th><th>Curso</th><th>Representante</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '</div>';
}
function bindInspEstudiantesListaEvents(){
  var f = state.inspEstFiltro;
  var nivelSel = document.getElementById('ieFNivel');
  if(nivelSel) nivelSel.onchange = function(e){ f.nivel = e.target.value; f.especialidad=''; f.curso=''; render(); };
  var espSel = document.getElementById('ieFEspecialidad');
  if(espSel) espSel.onchange = function(e){ f.especialidad = e.target.value; f.curso=''; render(); };
  var cursoSel = document.getElementById('ieFCurso');
  if(cursoSel) cursoSel.onchange = function(e){ f.curso = e.target.value; render(); };
  var newBtn = document.getElementById('btnEstNuevo');
  if(newBtn) newBtn.onclick = function(){ state.editingEstudiante = blankEstudiante(); state.inspEstView='nuevo'; render(); };
  var masBtn = document.getElementById('btnEstMasivo');
  if(masBtn) masBtn.onclick = function(){ estudianteEditRows = null; state.inspEstView='masivo'; render(); };
  document.querySelectorAll('[data-est-edit]').forEach(function(btn){
    btn.onclick = function(){
      var target = load(LS.ESTUDIANTES).find(function(x){ return x.id===btn.getAttribute('data-est-edit'); });
      if(target){ state.editingEstudiante = Object.assign({}, target); state.inspEstView='editar'; render(); }
    };
  });
}
function renderInspEstudianteForm(){
  var e = state.editingEstudiante;
  var isEdit = (state.inspEstView === 'editar');
  var espOpts = especialidadesFor(e.nivel);
  var cursoOpts = cursosFor(e.nivel, e.especialidad);
  return ''
  + '<div class="card">'
  + '  <h2>' + (isEdit ? 'Editar estudiante' : 'Nuevo estudiante') + '</h2>'

/* --- Inspección · Estudiantes: importar desde Excel/CSV -----------------------------------
   Lector .xlsx dependiente-cero: un .xlsx es un ZIP con XML adentro, así que reutilizamos el
   mismo ZIP/OOXML hecho a mano que ya existe para exportar .docx (makeZip, docxEsc). Para leer
   entradas comprimidas dentro del ZIP (lo normal en un .xlsx real de Excel/Sheets) usamos
   DecompressionStream('deflate-raw'), una API nativa del navegador — no una librería externa. */
function readZipEntriesFromLocalHeaders(bytes){
  var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  var entries = {};
  var pos = 0;
  while(pos + 30 <= bytes.length && view.getUint32(pos, true) === 0x04034b50){
    var method = view.getUint16(pos+8, true);
    var compSize = view.getUint32(pos+18, true);
    var nameLen = view.getUint16(pos+26, true);
    var extraLen = view.getUint16(pos+28, true);
    var nameStart = pos + 30;
    var name = new TextDecoder('utf-8').decode(bytes.subarray(nameStart, nameStart+nameLen));
    var dataStart = nameStart + nameLen + extraLen;
    var dataEnd = dataStart + compSize;
    entries[name] = {method: method, data: bytes.subarray(dataStart, dataEnd)};
    pos = dataEnd;
  }
  return entries;
}
async function inflateRaw(bytes){
  if(!window.DecompressionStream) throw new Error('Tu navegador no admite descomprimir archivos .xlsx. Usa Chrome o Edge actualizados, o guarda el archivo como .csv.');
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function getZipEntryText(entries, name){
  var e = entries[name];
  if(!e) return null;
  var raw = e.method === 8 ? await inflateRaw(e.data) : e.data;
  return new TextDecoder('utf-8').decode(raw);
}
function colLetterToIndex(ref){
  var m = ref.match(/^[A-Z]+/);
  if(!m) return 0;
  var n = 0;
  for(var i=0;i<m[0].length;i++){ n = n*26 + (m[0].charCodeAt(i) - 64); }
  return n - 1;
}
function parseSharedStrings(xmlText){
  if(!xmlText) return [];
  var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  var siEls = doc.getElementsByTagName('si');
  var out = [];
  for(var i=0;i<siEls.length;i++) out.push(siEls[i].textContent || '');
  return out;
}
function parseWorksheetRows(xmlText, sst){
  var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  var rowEls = doc.getElementsByTagName('row');
  var rowsOut = [];
  for(var i=0;i<rowEls.length;i++){
    var cellEls = rowEls[i].getElementsByTagName('c');
    var rowArr = [];
    for(var j=0;j<cellEls.length;j++){
      var c = cellEls[j];
      var ref = c.getAttribute('r') || '';
      var idx = ref ? colLetterToIndex(ref) : j;
      var type = c.getAttribute('t');
      var value = '';
      if(type === 'inlineStr'){
        var isEl = c.getElementsByTagName('is')[0];
        value = isEl ? isEl.textContent : '';
      } else {
        var vEl = c.getElementsByTagName('v')[0];
        var raw = vEl ? vEl.textContent : '';
        value = (type === 's') ? (sst[parseInt(raw,10)] || '') : raw;
      }
      rowArr[idx] = value;
    }
    rowsOut.push(rowArr);
  }
  return rowsOut;
}
async function parseXlsxFirstSheet(bytes){
  var entries = readZipEntriesFromLocalHeaders(bytes);
  var sheetKey = entries['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml'
    : Object.keys(entries).filter(function(k){ return /^xl\/worksheets\/sheet\d+\.xml$/i.test(k); }).sort()[0];
  if(!sheetKey) throw new Error('No se encontró ninguna hoja en el archivo. ¿Es un .xlsx válido?');
  var sheetXml = await getZipEntryText(entries, sheetKey);
  var sstXml = await getZipEntryText(entries, 'xl/sharedStrings.xml');
  return parseWorksheetRows(sheetXml, sstXml ? parseSharedStrings(sstXml) : []);
}
function detectCsvDelimiter(headerLine){
  var counts = {',': (headerLine.match(/,/g)||[]).length, ';': (headerLine.match(/;/g)||[]).length, '\t': (headerLine.match(/\t/g)||[]).length};
  var best = ',';
  if(counts[';'] > counts[best]) best = ';';
  if(counts['\t'] > counts[best]) best = '\t';
  return best;
}
function parseCsvText(text){
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){ return l.length>0; });
  if(!lines.length) return [];
  var delim = detectCsvDelimiter(lines[0]);
  return lines.map(function(line){
    var cells = [], cur = '', inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQuotes){
        if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQuotes = false; }
        else cur += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === delim){ cells.push(cur); cur=''; }
        else cur += ch;
      }
    }
    cells.push(cur);
    return cells;
  });
}
var COMBINING_MARKS_RE = new RegExp(String.fromCharCode(91,92,117,48,51,48,48,45,92,117,48,51,54,102,93), 'g');
function normImportHeader(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(COMBINING_MARKS_RE,'');
}
var ESTUDIANTE_IMPORT_HEADERS = {
  nombres: ['nombres','nombre'],
  apellidos: ['apellidos','apellido'],
  ci: ['cedula','ci'],
  nivel: ['nivel','nivel educativo'],
  especialidad: ['especialidad'],
  curso: ['curso','grado','curso/grado'],
  nombreRepresentante: ['representante','nombre del representante','nombre representante'],
  telefonoRepresentante: ['telefono','telefono representante','telefono del representante']
};
function mapImportedRowsToEstudianteRows(rows){
  if(!rows.length) return [];
  var headerRow = (rows[0]||[]).map(normImportHeader);
  var colIndex = {};
  Object.keys(ESTUDIANTE_IMPORT_HEADERS).forEach(function(field){
    var aliases = ESTUDIANTE_IMPORT_HEADERS[field];
    var idx = headerRow.findIndex(function(h){ return aliases.indexOf(h)!==-1; });
    if(idx!==-1) colIndex[field] = idx;
  });
  function cell(r, field){ return colIndex[field]!=null ? String(r[colIndex[field]]==null ? '' : r[colIndex[field]]).trim() : ''; }
  var out = [];
  for(var i=1;i<rows.length;i++){
    var r = rows[i] || [];
    var nombres = cell(r,'nombres'), apellidos = cell(r,'apellidos');
    if(!nombres && !apellidos) continue;
    var nivelRaw = cell(r,'nivel'), especialidadRaw = cell(r,'especialidad'), cursoRaw = cell(r,'curso');
    var nivel = NIVELES.find(function(n){ return normImportHeader(n)===normImportHeader(nivelRaw); }) || '';
    var especialidad = '';
    if(nivel){
      especialidad = especialidadesFor(nivel).find(function(e){ return normImportHeader(e)===normImportHeader(especialidadRaw); }) || '';
    }
    var curso = '', cursoManual = '';
    if(nivel){
      var match = cursosFor(nivel, especialidad).find(function(c){ return normImportHeader(c)===normImportHeader(cursoRaw); });
      if(match) curso = match;
      else if(cursoRaw){ curso = 'Otro…'; cursoManual = cursoRaw; }
    }
    out.push({
      id: uid('est'), nombres: nombres, apellidos: apellidos, ci: cell(r,'ci'),
      nivel: nivel, especialidad: especialidad, curso: curso, cursoManual: cursoManual,
      nombreRepresentante: cell(r,'nombreRepresentante'), telefonoRepresentante: cell(r,'telefonoRepresentante')
    });
  }
  return out;
}
async function doImportEstudiantesFile(ev){
  var file = ev.target.files[0];
  if(!file) return;
  var errEl = document.getElementById('estImportError');
  if(errEl) errEl.classList.remove('show');
  try{
    var rows;
    if(/\.csv$/i.test(file.name)) rows = parseCsvText(await file.text());
    else rows = await parseXlsxFirstSheet(new Uint8Array(await file.arrayBuffer()));
    var imported = mapImportedRowsToEstudianteRows(rows);
    if(!imported.length){ throw new Error('No se encontraron filas válidas. Revisa que la primera fila tenga los encabezados (Nombres, Apellidos, Nivel, Curso…) y que haya datos debajo.'); }
    estudianteEditRows = imported;
    renderInspEstMasivoBodyOnly();
    toast(imported.length + ' fila(s) importada(s) desde el archivo. Revisa nivel/curso y guarda.', 'success');
  }catch(err){
    console.error('Error al importar archivo de estudiantes', err);
    if(errEl){ errEl.textContent = err.message || String(err); errEl.classList.add('show'); }
  }
  ev.target.value = '';
}
/* Plantilla descargable (.xlsx) con los encabezados esperados + una fila de ejemplo. Reutiliza
   makeZip/docxEsc (ya definidos para el exportador de .docx) — mismo principio: un .xlsx es un
   ZIP de XML, sin necesitar ninguna librería externa. */
function buildXlsxTemplateBlob(){
  var headers = ['Nombres','Apellidos','Cédula','Nivel','Especialidad','Curso','Representante','Teléfono'];
  var ejemplo = ['María','Torres Salazar','2100456789','Básica Media','','5.º EGB A','Juan Torres','0991234567'];
  var cols = ['A','B','C','D','E','F','G','H'];
  function cellXml(col, rowNum, text){
    return '<c r="'+col+rowNum+'" t="inlineStr"><is><t xml:space="preserve">'+docxEsc(text)+'</t></is></c>';
  }
  var row1 = '<row r="1">' + headers.map(function(h,i){ return cellXml(cols[i],1,h); }).join('') + '</row>';
  var row2 = '<row r="2">' + ejemplo.map(function(v,i){ return cellXml(cols[i],2,v); }).join('') + '</row>';
  var sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+row1+row2+'</sheetData></worksheet>';
  var workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Estudiantes" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  var enc = new TextEncoder();
  var zipBytes = makeZip([
    {name:'[Content_Types].xml', data: enc.encode(contentTypes)},
    {name:'_rels/.rels', data: enc.encode(rootRels)},
    {name:'xl/workbook.xml', data: enc.encode(workbookXml)},
    {name:'xl/_rels/workbook.xml.rels', data: enc.encode(workbookRels)},
    {name:'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml)}

  return new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
