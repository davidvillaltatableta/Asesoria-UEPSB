<title>Sistema Académico · UEP Simón Bolívar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --blue-900:#0A2A5E;
    --blue-700:#123E8C;
    --blue-600:#1848A0;
    --blue-500:#2563C7;
    --blue-100:#E7EEFB;
    --blue-50:#F2F6FD;
    --gold-500:#F2B705;
    --gold-600:#D69E00;
    --gold-100:#FCF1CC;
    --red-600:#D62828;
    --red-100:#FBE4E4;
    --green-600:#1E8E5A;
    --green-100:#E3F5EC;
    --ink:#16233A;
    --paper:#F5F7FB;
    --surface:#FFFFFF;
    --surface-2:#FAFBFE;
    --line:#DCE3F0;
    --line-strong:#C3CEE3;
    --muted:#5B6B85;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace;
    /* Fondo del menú lateral: variable propia (no --blue-900) porque ese token se invierte a un
       azul claro en modo oscuro (para servir de texto legible sobre fondos oscuros en el resto de
       la app), lo cual volvía el menú casi blanco con texto claro encima — ilegible. */
    --sidebar-bg:#0A2A5E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --sidebar-bg:#000000;
      --blue-900:#DCE8FF;
      --blue-700:#8FB6FA;
      --blue-600:#6FA0F4;
      --blue-500:#5C93EF;
      --blue-100:#16294D;
      --blue-50:#101B33;
      --gold-500:#F2B705;
      --gold-600:#F5C736;
      --gold-100:#3A2E08;
      --red-600:#FF6B6B;
      --red-100:#3A1414;
      --green-600:#4FCB92;
      --green-100:#0F2A20;
      --ink:#EAF0FB;
      --paper:#0B1220;
      --surface:#111A2E;
      --surface-2:#0E1626;
      --line:#233150;
      --line-strong:#31456E;
      --muted:#93A2C2;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --sidebar-bg:#000000;
    --blue-900:#DCE8FF; --blue-700:#8FB6FA; --blue-600:#6FA0F4; --blue-500:#5C93EF;
    --blue-100:#16294D; --blue-50:#101B33; --gold-100:#3A2E08; --red-600:#FF6B6B; --red-100:#3A1414;
    --green-600:#4FCB92; --green-100:#0F2A20; --ink:#EAF0FB; --paper:#0B1220; --surface:#111A2E;
    --surface-2:#0E1626; --line:#233150; --line-strong:#31456E; --muted:#93A2C2;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --sidebar-bg:#0A2A5E;
    --blue-900:#0A2A5E; --blue-700:#123E8C; --blue-600:#1848A0; --blue-500:#2563C7;
    --blue-100:#E7EEFB; --blue-50:#F2F6FD; --gold-100:#FCF1CC; --red-600:#D62828; --red-100:#FBE4E4;
    --green-600:#1E8E5A; --green-100:#E3F5EC; --ink:#16233A; --paper:#F5F7FB; --surface:#FFFFFF;
    --surface-2:#FAFBFE; --line:#DCE3F0; --line-strong:#C3CEE3; --muted:#5B6B85;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif); font-weight:700; text-wrap:balance; margin:0;}
  a{color:var(--blue-600);}
  button{font-family:var(--sans);}
  input,select,textarea{font-family:var(--sans); color:var(--ink);}
  ::selection{background:var(--gold-100);}
  /* Cuando el docente selecciona texto en un campo enriquecido y luego usa un control de la
     barra (color, símbolo, enlace) que le quita el foco al campo, el navegador normalmente borra
     el resaltado visual de la selección aunque el texto siga "seleccionado" internamente. Este
     resaltado persistente (ver RTE_HIGHLIGHT en el script) lo mantiene visible hasta que el
     propio docente vuelve a hacer clic o a escribir en el texto. */
  ::highlight(rte-manual-selection){background:var(--gold-100);}
  .tabular{font-variant-numeric:tabular-nums; font-family:var(--mono);}

  #app{min-height:100vh;}
  .center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;}

  /* ---------- Auth screens ---------- */
  .auth-wrap{width:100%; max-width:920px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:0; background:var(--surface); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-2); border:1px solid var(--line);}
  @media (max-width:760px){ .auth-wrap{grid-template-columns:1fr;} .auth-banner{display:none;} }
  .auth-banner{position:relative; min-height:100%; background:var(--blue-900);}
  .auth-banner img{width:100%; height:100%; object-fit:contain; display:block; min-height:420px;}
  .auth-banner .banner-caption{position:absolute; left:0; right:0; bottom:0; padding:18px 22px; background:linear-gradient(to top, rgba(6,14,30,.88), rgba(6,14,30,0)); color:#fff;}
  .auth-banner .banner-caption .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
  .auth-form{padding:40px 36px; display:flex; flex-direction:column; gap:20px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-row img{width:44px; height:44px; border-radius:50%; object-fit:cover; box-shadow:var(--shadow-1); background:#fff;}
  .brand-row .brand-text .institution{font-family:var(--serif); font-weight:700; font-size:15px; line-height:1.25; color:var(--blue-900);}
  .brand-row .brand-text .tagline{font-size:11.5px; color:var(--muted); letter-spacing:.02em;}
  .auth-form h1{font-size:24px; color:var(--blue-900);}
  .auth-sub{color:var(--muted); font-size:13.5px; margin-top:-10px;}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.01em;}
  .field label.semanal-section-title{display:block; text-align:center; font-size:16px; color:var(--blue-900);}
  .field .required{color:var(--red-600);}
  .field input, .field select, .field textarea{
    padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:var(--surface-2); font-size:14.5px; color:var(--ink); width:100%; min-width:0;
  }
  .field textarea{resize:vertical; min-height:64px; font-family:var(--sans);}
  /* La regla de arriba está pensada para inputs de texto/select/textarea; sin este reset, un
     checkbox o radio dentro de un .field hereda width:100% + padding + fondo y se infla hasta
     ocupar casi todo el ancho del contenedor (aplastando el texto de su etiqueta a una columna
     casi de 0px de ancho — visible sobre todo con textos largos, como el checklist de Nivel de
     Logro). */
  .field input[type=checkbox], .field input[type=radio]{
    width:auto; min-width:0; flex:0 0 auto; padding:0; border:none; background:none; border-radius:0;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);
  }
  .field .hint{font-size:11.5px; color:var(--muted);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }

  .btn{
    appearance:none; border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .04s ease, filter .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--blue-500); outline-offset:2px;}
  .btn-primary{background:var(--blue-700); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold-500); color:#3A2A00;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; color:var(--blue-700); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--blue-50);}
  .btn-danger{background:transparent; color:var(--red-600); border-color:var(--red-100);}
  .btn-danger:hover{background:var(--red-100);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .form-error{background:var(--red-100); color:var(--red-600); border:1px solid var(--red-100); padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; display:none;}
  .form-error.show{display:block;}
  .switch-line{font-size:13.5px; color:var(--muted); text-align:center;}
  .switch-line button{background:none; border:none; color:var(--blue-600); font-weight:600; cursor:pointer; padding:0; font-size:13.5px;}

  /* ---------- App shell ---------- */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;}
  @media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr);} .sidebar{position:fixed; z-index:40; inset:0 auto 0 0; width:248px; transform:translateX(-100%); transition:transform .2s ease;} .sidebar.open{transform:translateX(0);} .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(8,14,28,.45); z-index:35;} .sidebar-scrim.show{display:block;} .mobile-topbar{display:flex !important;} }
  .sidebar{background:var(--sidebar-bg); color:#EAF0FF; display:flex; flex-direction:column; padding:20px 16px; gap:22px;}
  .sidebar .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .sidebar .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; background:#fff;}
  .sidebar .brand .name{font-family:var(--serif); font-weight:700; font-size:13.5px; line-height:1.25;}
  .sidebar .brand .year{font-size:10.5px; opacity:.7;}
  .sidebar nav{display:flex; flex-direction:column; gap:8px;}
  .nav-hue-blue{--hue-rgb:140,190,255;}
  .nav-hue-green{--hue-rgb:130,225,190;}
  .nav-hue-peach{--hue-rgb:255,180,130;}
  .nav-hue-purple{--hue-rgb:205,170,255;}
  .nav-hue-rose{--hue-rgb:255,155,195;}
  .sidebar nav .nav-group{border-radius:14px; background:rgba(var(--hue-rgb,255,255,255),.08); transition:background .15s ease;}
  .sidebar nav .nav-group.expanded{background:rgba(var(--hue-rgb,255,255,255),.16);}
  .sidebar nav .nav-group-header{
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    background:none; border:none; cursor:pointer; padding:12px 14px; color:rgb(var(--hue-rgb,147,168,214));
  }
  .sidebar nav .nav-group-header:hover{filter:brightness(1.2);}
  .sidebar nav .nav-group-label{font-size:12.5px; font-weight:700; letter-spacing:.005em; text-align:left;}
  .sidebar nav .nav-group-chevron{font-size:14px; line-height:1; opacity:.85; transition:transform .18s ease; flex-shrink:0;}
  .sidebar nav .nav-group.expanded .nav-group-chevron{transform:rotate(90deg);}
  .sidebar nav .nav-group-items{display:none; flex-direction:column; gap:2px; padding:0 6px 8px;}
  .sidebar nav .nav-group.expanded .nav-group-items{display:flex;}
  .sidebar nav button[data-nav]{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:#C9D7F5;
    padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .sidebar nav button[data-nav] .ic{width:18px; text-align:center; opacity:.85;}
  .sidebar nav button[data-nav]:hover{background:rgba(255,255,255,.07); color:#fff;}
  .sidebar nav button[data-nav].active{background:var(--gold-500); color:#3A2A00; box-shadow:0 2px 10px rgba(242,183,5,.3);}
  .sidebar .spacer{flex:1;}
  .sidebar .who{border-top:1px solid rgba(255,255,255,.14); padding-top:14px; display:flex; flex-direction:column; gap:8px;}
  .sidebar .who .who-name{font-size:13px; font-weight:700;}
  .sidebar .who .who-role{font-size:11.5px; color:#AEC0EA;}
  .sidebar .who button{background:rgba(255,255,255,.08); color:#fff; border:none; padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; text-align:left;}
  .sidebar .who button:hover{background:rgba(255,255,255,.16);}

  .mobile-topbar{display:none; align-items:center; gap:10px; padding:12px 16px; background:var(--sidebar-bg); color:#fff; position:sticky; top:0; z-index:20;}
  .mobile-topbar button{background:none; border:none; color:#fff; font-size:20px; cursor:pointer;}
  .mobile-topbar .name{font-size:13.5px; font-weight:700;}

  main.content{padding:28px 32px 80px; max-width:1180px; width:100%; margin:0 auto;}
  @media (max-width:600px){ main.content{padding:18px 14px 60px;} }

  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-head .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .page-head h1{font-size:26px; color:var(--blue-900); margin-top:2px;}
  .page-head p{color:var(--muted); font-size:13.5px; margin-top:4px; max-width:52ch;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:22px;}
  .card + .card{margin-top:18px;}
  .card h2{font-size:16px; color:var(--blue-900); margin-bottom:4px;}
  .card .card-sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}

  .grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;}
  @media (max-width:820px){ .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr);} }

  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-1);}
  .stat .stat-num{font-family:var(--serif); font-size:28px; font-weight:700; color:var(--blue-700);}
  .stat .stat-label{font-size:12px; color:var(--muted); margin-top:2px;}

  .action-card{display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-1); transition:border-color .15s, transform .06s;}
  .action-card:hover{border-color:var(--blue-500); transform:translateY(-1px);}
  .action-card .ic{width:34px; height:34px; border-radius:9px; background:var(--blue-100); color:var(--blue-700); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .action-card h3{font-size:14.5px; color:var(--ink);}
  .action-card p{font-size:12.5px; color:var(--muted); margin:0;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
  table thead th{background:var(--blue-50); color:var(--blue-900); text-align:left; padding:9px 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); white-space:nowrap;}
  .unit-block table thead th{text-align:center;}
  table td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table tbody tr:last-child td{border-bottom:none;}
  table tbody tr.group-head-row td{background:var(--blue-50); color:var(--blue-900); font-weight:700; font-size:12.5px; padding:10px 10px; border-top:2px solid var(--line-strong); border-bottom:1px solid var(--line-strong);}
  table tbody tr.group-head-row:first-child td{border-top:none;}
  table tbody tr:hover{background:var(--surface-2);}
  .cell-input, .cell-select{width:100%; min-width:120px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px;}
  .cell-select-lg{padding:12px 14px !important; font-size:16px !important; font-weight:600;}
  .signature-line{border-bottom:1px solid var(--ink); height:36px; margin-bottom:6px;}
  .carga-table{table-layout:auto; width:auto;}
  .carga-table th, .carga-table td{width:auto; white-space:nowrap;}
  .carga-table .cell-select{width:auto; min-width:150px;}
  .carga-table .checkbox-grid{width:auto; max-width:340px; min-width:0;}
  .carga-table .cell-input{width:auto; min-width:0;}
  .cell-textarea{width:100%; min-width:160px; min-height:52px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px; resize:vertical;}
  .row-remove{background:none; border:none; color:var(--red-600); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:6px;}
  .row-remove:hover{background:var(--red-100);}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .pill-blue{background:var(--blue-100); color:var(--blue-700);}
  .pill-gold{background:var(--gold-100); color:var(--gold-600);}
  .pill-green{background:var(--green-100); color:var(--green-600);}
  .pill-muted{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
  .asis-cell{width:32px; height:28px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; cursor:pointer;}
  .asis-cell.asis-P{background:var(--green-100); color:var(--green-600); border-color:var(--green-100);}
  .asis-cell.asis-A{background:var(--gold-100); color:var(--gold-600); border-color:var(--gold-100);}
  .asis-cell.asis-F{background:var(--red-100); color:var(--red-600); border-color:var(--red-100);}


  .empty-state{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-state .ic{font-size:30px; margin-bottom:8px;}

  .confirm-overlay{position:fixed; inset:0; background:rgba(8,14,28,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .confirm-box{background:var(--surface); border-radius:12px; padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow-2);}
  .confirm-box p{margin:0 0 18px; font-size:14px; color:var(--ink); line-height:1.5;}
  .confirm-actions{display:flex; gap:10px; justify-content:flex-end;}

  .toast-region{position:fixed; top:16px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:340px;}
  .toast{background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow-2); animation:toast-in .18s ease;}
  .toast.success{background:var(--green-600); color:#06301c;}
  .toast.error{background:var(--red-600); color:#3A0000;}
  .toast-undo{display:flex; align-items:center; gap:14px;}
  .toast-undo-btn{background:none; border:1px solid rgba(255,255,255,.4); color:inherit; border-radius:6px; padding:4px 10px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .toast-undo-btn:hover{background:rgba(255,255,255,.15);}
  @keyframes toast-in{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- PCA document ---------- */
  .pca-toolbar{position:sticky; top:0; z-index:15; background:var(--paper); padding:10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .pca-toolbar .spacer{flex:1;}
  .pca-doc{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-1);}
  .pca-band{padding:12px 20px; font-weight:700; font-size:13px; letter-spacing:.02em; color:#fff;}
  .pca-band.band-top{background:var(--blue-900); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .pca-band.band-top .inst{font-family:var(--serif); font-size:16px;}
  .pca-band.band-title{background:var(--blue-700); text-align:center; font-family:var(--serif); font-size:15px; text-transform:uppercase; letter-spacing:.04em;}
  .pca-band.band-section{background:var(--gold-500); color:#3A2A00; text-transform:uppercase;}
  .pca-band.band-unit{background:var(--blue-600); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pca-section{padding:18px 20px;}
  .pca-doc .pca-band + .pca-section{padding-top:18px;}

<script>
(function(){
"use strict";

/* ============================= DATA / STORAGE (Firestore) ============================= */
/* LS sigue usándose como "nombre de tabla" en todo el código (DOCENTES, CARGA, etc.), pero ahora
   apunta al nombre de la colección de Firestore en vez de una llave de localStorage. load()/save()
   ya no son E/S directa: son una caché en memoria (FS_CACHE) mantenida en tiempo real por
   listeners de Firestore (ver attachRealtimeListeners). save() actualiza la caché al instante
   (para que la UI se sienta inmediata) y en paralelo sincroniza los cambios hacia Firestore
   comparando contra la versión anterior — así ningún llamador existente (load()/save() se usan
   igual en más de cien lugares del código) necesitó cambiar. */
var LS = {
  DOCENTES: 'DOCENTES',
  CARGA: 'CARGA',
  PCA: 'PCA',
  CONT: 'CONT',
  SEMANAL: 'SEMANAL',
  FECHAS_LIMITE: 'FECHAS_LIMITE',
  ESTUDIANTES: 'ESTUDIANTES',
  ASISTENCIA: 'ASISTENCIA',
  INCIDENTES: 'INCIDENTES',
  OBSERVACIONES: 'OBSERVACIONES',
  DECE: 'DECE',
  FICHA_DETECCION: 'FICHA_DETECCION'
};
var FS_COLLECTION = {
  DOCENTES: 'docentes', CARGA: 'carga', PCA: 'pca', CONT: 'contenidos', SEMANAL: 'semanal', FECHAS_LIMITE: 'fechaslimite',
  ESTUDIANTES: 'estudiantes', ASISTENCIA: 'asistencia', INCIDENTES: 'incidentes', OBSERVACIONES: 'observaciones', DECE: 'dece',
  FICHA_DETECCION: 'fichadeteccion'
};
var FS_CACHE = { DOCENTES: [], CARGA: [], PCA: [], CONT: [], SEMANAL: [], FECHAS_LIMITE: [], ESTUDIANTES: [], ASISTENCIA: [], INCIDENTES: [], OBSERVACIONES: [], DECE: [], FICHA_DETECCION: [] };
function load(key){ return FS_CACHE[key] || []; }
function save(key, val){
  var old = FS_CACHE[key] || [];
  var oldById = {}; old.forEach(function(r){ oldById[r.id] = r; });
  var keptIds = {};
  var writes = [];
  (val||[]).forEach(function(r){
    keptIds[r.id] = true;
    var prev = oldById[r.id];
    if(!prev || JSON.stringify(prev) !== JSON.stringify(r)){
      writes.push(window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id)), r));
    }
  });
  old.forEach(function(r){
    if(!keptIds[r.id]) writes.push(window.FB.deleteDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id))));
  });
  FS_CACHE[key] = val;
  Promise.all(writes).catch(function(e){
    console.error('Error guardando en Firestore', key, e);
    toast('No se pudo guardar en la nube (' + (e.message||e.code||e) + '). Revisa tu conexión.', 'error');
  });
}
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  s = (s===undefined || s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(d){
  if(!d) return '—';
  try{ var p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; } catch(e){ return d; }
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('es-EC', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
}
/* Formatea un valor de <input type="datetime-local"> ("YYYY-MM-DDTHH:mm", sin zona horaria). */
function fmtDateTimeLocal(dtLocal){
  if(!dtLocal) return '—';
  var d = new Date(dtLocal);
  if(isNaN(d.getTime())) return dtLocal;
  return d.toLocaleDateString('es-EC', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
}

/* ============================= CURRICULUM (Ecuador) ============================= */
var NIVELES = ['Iniciales y Preparatoria','Básica Elemental','Básica Media','Básica Superior','Bachillerato'];

var ESPECIALIDADES = {
  'Bachillerato': ['Ciencias Generales','Diseño Gráfico','BGU y Diseño']
};

function conParalelos(grados){
  var out = [];
  grados.forEach(function(g){ out.push(g + ' A'); out.push(g + ' B'); });
  return out;
}
var CURSOS = {
  'Iniciales y Preparatoria': ['Inicial 1','Inicial 2','Preparatoria (1.º EGB)'],
  'Básica Elemental': conParalelos(['2.º EGB','3.º EGB','4.º EGB']),

/* Separa el texto enriquecido (destreza/temas del PCA) en líneas individuales — cada párrafo o
   viñeta se vuelve una entrada de la lista, quitando el marcador "• " si lo trae. */
function parseLinesList(html){
  var plain = richTextToPlain(html);
  if(!plain) return [];
  return plain.split('\n').map(function(l){ return l.replace(/^•\s*/, '').trim(); }).filter(Boolean);
}
/* El campo Nivel de Logro del PCA (para una sola semana) puede traer, línea por línea (un ítem
   por cada Enter que dio el docente), la descripción de cada nivel: una línea de encabezado
   (p.ej. "Básico:", "Intermedio: ...", "Avanzado ...") seguida de una o varias líneas de detalle
   sin palabra clave, que pertenecen a ese mismo nivel hasta que aparezca el encabezado del
   siguiente. Esta función devuelve, para cada nivel, la LISTA completa de ítems (sin mezclar
   niveles entre sí), no solo el último renglón. */
function parseNivelesLogroTiers(html){
  var out = {basico:[], intermedio:[], avanzado:[]};
  var tierActual = '';
  parseLinesList(html).forEach(function(line){
    var t = line.toLowerCase();
    var tierLinea = t.indexOf('avanzado')!==-1 ? 'avanzado'
      : t.indexOf('intermedio')!==-1 ? 'intermedio'
      : (t.indexOf('básico')!==-1 || t.indexOf('basico')!==-1) ? 'basico' : '';
    if(tierLinea){
      tierActual = tierLinea;
      var limpio = line.replace(/^(nivel\s+)?(básico|basico|intermedio|avanzado)\s*[:\-–]?\s*/i, '').trim();
      if(limpio) out[tierActual].push(limpio);
    } else if(tierActual){
      out[tierActual].push(line);
    }
  });
  return out;
}

function semanasDePca(pcaId){
  if(!pcaId) return [];
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var rows = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  var order = (pca && pca.unidadesNombres) || [];
  rows.sort(function(a,b){
    var ia = order.indexOf(a.unidad), ib = order.indexOf(b.unidad);
    if(ia!==ib) return ia-ib;
    return (a.semana||0)-(b.semana||0);
  });

}
/* Estado automático de la columna Observación. Un Plan Semanal solo se considera "de esta
   semana" si su fecha de inicio y fin coinciden EXACTAMENTE con las de la fila del PCA (no
   basta con que la fecha caiga dentro del rango). Una vez pasada la fecha fin, el estado
   depende de si los temas realmente vistos en los días del plan (creados por el docente)
   cubren todos los temas que el PCA planificó para esa semana: si los cubre todos → COMPLETADO,
   si falta alguno o no hay plan → CON RETRASO. No es editable manualmente: siempre refleja el
   estado actual. */
/* Busca la cobertura de temas en TODOS los planes semanales del PCA (no solo los vinculados
   exactamente a esta semana): así, si un tema pendiente de esta semana se termina marcando en
   el plan de la semana siguiente (ver temasPendientesAnteriores), esta semana también queda
   COMPLETADO — sin importar si el registro llegó tarde. */
function computeEstadoSemana(f, pcaId){
  var minD = f.fechaInicio || '';
  var maxD = f.fechaFin || '';
  if(!minD && !maxD) return null;

  var temasPca = parseLinesList(f.temas);
  if(temasPca.length){
    var vistos = {};
    load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
      (s.dias||[]).forEach(function(dia){
        (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
      });
    });
    if(temasPca.every(function(t){ return vistos[t]; })) return 'COMPLETADO';
  }

  var today = todayISO();
  if(minD && today < minD) return 'POR COMPLETAR';
  if(maxD && today > maxD) return 'CON RETRASO';
  return 'EN PROCESO';
}
/* Temas de la semana INMEDIATAMENTE ANTERIOR del PCA que ningún plan semanal marcó todavía —
   se agregan a las opciones de Contenidos Esenciales de la semana siguiente para que el
   docente pueda ponerse al día. */
function temasPendientesAnteriores(pcaId, semanaActualId){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  var anterior = semanas[idx-1];
  var temasAnt = parseLinesList(anterior.temas);
  if(!temasAnt.length) return [];
  var vistos = {};
  load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
    (s.dias||[]).forEach(function(dia){
      (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
    });
  });
  return temasAnt.filter(function(t){ return !vistos[t]; });
}
/* Campo del PCA (destreza=Básico) y del día del Plan Semanal donde vive cada nivel de logro —
   compartido por temasPendientesAnteriores-equivalente y por el formulario de Plan Semanal. */
var NIVEL_LOGRO_PCA_FIELD = {basico:'destreza', intermedio:'nivelLogroIntermedio', avanzado:'nivelLogroAvanzado'};
/* Igual que temasPendientesAnteriores, pero para los ítems de Nivel de Logro (Básico/Intermedio/
   Avanzado) de la semana INMEDIATAMENTE ANTERIOR del PCA que ningún plan semanal marcó todavía:
   se ofrecen como pendientes en la semana siguiente para que no se pierdan de vista. */
function nivelLogroPendientesAnteriores(pcaId, semanaActualId, tier){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  var anterior = semanas[idx-1];
  var itemsAnt = parseLinesList(anterior[NIVEL_LOGRO_PCA_FIELD[tier]]);
  if(!itemsAnt.length) return [];
  var campoDia = NIVEL_LOGRO_DIA_FIELD[tier];
  var vistos = {};
  load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
    (s.dias||[]).forEach(function(dia){
      (dia[campoDia]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
    });
  });
  return itemsAnt.filter(function(t){ return !vistos[t]; });
}

/* ============================= TOAST ============================= */
function toast(msg, type){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}
/* Toast con botón "Deshacer": igual que toast() pero se queda más tiempo (8s en vez de 3.6s) y
   ofrece un botón que ejecuta onDeshacer() una sola vez. Usado por eliminarConDeshacer para que
   cualquier "Eliminar" del sistema pueda revertirse justo después de confirmarse. */
function toastConDeshacer(msg, onDeshacer){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast toast-undo';
  el.innerHTML = '<span></span><button type="button" class="toast-undo-btn">Deshacer</button>';
  el.querySelector('span').textContent = msg;
  region.appendChild(el);
  var timer = setTimeout(function(){ el.remove(); }, 8000);
  el.querySelector('.toast-undo-btn').onclick = function(){
    clearTimeout(timer);
    el.remove();
    onDeshacer();
  };
}
/* ============================= ELIMINAR CON DESHACER =============================
   Envoltorio genérico para CUALQUIER botón "Eliminar" de una sola colección: guarda el registro
   completo antes de borrarlo, y ofrece deshacerlo desde el toast (ver toastConDeshacer). Se usa
   en lugar de escribir save(KEY, load(KEY).filter(...)) directamente en cada sitio, así que
   cualquier eliminación individual del sistema queda cubierta con el mismo mecanismo. */
function eliminarConDeshacer(key, id, mensajeEliminado, mensajeDeshecho){
  var registro = load(key).find(function(x){ return x.id===id; });
  if(!registro) return;
  save(key, load(key).filter(function(x){ return x.id!==id; }));
  toastConDeshacer(mensajeEliminado, function(){
    var actuales = load(key);
    if(!actuales.some(function(x){ return x.id===registro.id; })){
      save(key, actuales.concat([registro]));
    }
    toast(mensajeDeshecho || 'Se deshizo la eliminación.', 'success');
  });
}
/* Igual que eliminarConDeshacer, pero para un borrado en cascada que toca VARIAS colecciones a la
   vez (p.ej. eliminar un docente y todos sus datos). Recibe una lista de {key, registros} ya
   capturados ANTES de borrar nada. */
function eliminarVariasConDeshacer(bloques, mensajeEliminado, mensajeDeshecho){
  bloques.forEach(function(b){
    save(b.key, load(b.key).filter(function(x){ return b.ids.indexOf(x.id)===-1; }));
  });
  toastConDeshacer(mensajeEliminado, function(){
    bloques.forEach(function(b){
      var actuales = load(b.key);
      var actualesIds = {}; actuales.forEach(function(x){ actualesIds[x.id]=1; });
      var faltantes = b.registros.filter(function(r){ return !actualesIds[r.id]; });
      if(faltantes.length) save(b.key, actuales.concat(faltantes));
    });
    toast(mensajeDeshecho || 'Se deshizo la eliminación.', 'success');
  });
}

/* Autoguardado del PCA, Plan Semanal y Ficha de Detección: guarda en silencio (sin el toast de
   guardado manual) cada 5 minutos EXACTOS mientras haya cambios sin guardar — no antes, aunque
   el docente siga escribiendo — así el guardado nunca interrumpe mientras redacta. El reloj de
   5 minutos arranca con el primer cambio y sigue corriendo de fondo aunque agregue más cambios
   mientras tanto (no se reinicia con cada tecla); se detiene solo al salir del formulario. */
var AUTOSAVE_INTERVALO_MS = 5 * 60 * 1000;
var AUTOSAVE_SUCIO = {};
var AUTOSAVE_INTERVALS = {};
/* Marca de tiempo del último autoguardado exitoso por tipo ('pca'/'semanal'/'fichadeteccion'),
   usada para decidir si el indicador debe mostrarse (en vez de manipular el DOM directamente):
   guardar y volver a leer el texto en cada render hace que el indicador sobreviva al re-render
   que dispara el propio guardado (el listener en tiempo real del PCA/Plan Semanal vuelve a pintar
   la barra de herramientas apenas Firestore confirma el cambio, y eso borraba el texto si se
   ponía "a mano"). */
var AUTOSAVE_ULTIMO = {};
function marcarAutoguardadoPendiente(tipo){
  AUTOSAVE_SUCIO[tipo] = true;
  if(AUTOSAVE_INTERVALS[tipo]) return;
  AUTOSAVE_INTERVALS[tipo] = setInterval(function(){
    if(!AUTOSAVE_SUCIO[tipo]) return;
    ejecutarAutoguardado(tipo);
  }, AUTOSAVE_INTERVALO_MS);
}
function detenerAutoguardado(tipo){
  if(AUTOSAVE_INTERVALS[tipo]){ clearInterval(AUTOSAVE_INTERVALS[tipo]); AUTOSAVE_INTERVALS[tipo] = null; }
  AUTOSAVE_SUCIO[tipo] = false;
}
function detenerTodosLosAutoguardados(){
  Object.keys(AUTOSAVE_INTERVALS).forEach(detenerAutoguardado);
}
function ejecutarAutoguardado(tipo){
  AUTOSAVE_SUCIO[tipo] = false;
  if(tipo==='pca' && state.editingPca) savePca(state.editingPca, true);
  else if(tipo==='semanal' && state.editingSemanal) saveSemanal(state.editingSemanal, true);
  else if(tipo==='fichadeteccion' && state.editingFichaDeteccion) saveFichaDeteccion(state.editingFichaDeteccion, true);
  AUTOSAVE_ULTIMO[tipo] = Date.now();
  actualizarIndicadorAutoguardado(tipo);
  setTimeout(function(){ actualizarIndicadorAutoguardado(tipo); }, 6200);
}
function autoguardadoHintTexto(tipo){
  var ts = AUTOSAVE_ULTIMO[tipo];
  if(!ts || Date.now() - ts > 6000) return '';
  return '✓ Guardado automáticamente · ' + fmtDateTime(new Date(ts).toISOString());
}
var AUTOSAVE_HINT_ID = {pca:'pcaAutosaveHint', semanal:'semanalAutosaveHint', fichadeteccion:'fdAutosaveHint'};
function actualizarIndicadorAutoguardado(tipo){
  var el = document.getElementById(AUTOSAVE_HINT_ID[tipo]);
  if(el) el.textContent = autoguardadoHintTexto(tipo);
}
/* Escucha "input"/"change" delegado en todo el documento del formulario (burbujea desde
   cualquier campo, RTE incluido) en vez de engancharse campo por campo — así cualquier campo
   nuevo que se agregue queda cubierto automáticamente. */
function bindAutoguardadoDelegado(contenedorId, tipo){
  var contenedor = document.getElementById(contenedorId);
  if(!contenedor) return;
  ['input','change'].forEach(function(evt){
    contenedor.addEventListener(evt, function(){ marcarAutoguardadoPendiente(tipo); });
  });
}

/* Native confirm()/alert() are commonly blocked (or silently return false) inside the
   Artifact's sandboxed iframe — the same category of restriction that already required
   special handling for downloads and window.print(). This custom modal replaces every
   confirm() call in the app so delete actions actually work in that environment. */
function confirmDialog(message, onConfirm){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-box"><p>' + escapeHtml(message) + '</p><div class="confirm-actions"><button class="btn btn-ghost btn-sm" id="confirmCancelBtn">Cancelar</button><button class="btn btn-sm" id="confirmOkBtn" style="background:var(--red-600); color:#fff;">Eliminar</button></div></div>';
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#confirmCancelBtn').onclick = close;
  overlay.querySelector('#confirmOkBtn').onclick = function(){ close(); onConfirm(); };
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* Same rationale as confirmDialog: native prompt() is blocked in the sandboxed iframe, so the
   RTE "insertar enlace" button needs a custom replacement too. */
function promptDialog(message, defaultValue, onSubmit){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  var box = document.createElement('div');
  box.className = 'confirm-box';
  var p = document.createElement('p');
  p.textContent = message;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input';
  input.value = defaultValue || '';
  input.style.marginBottom = '14px';
  var actions = document.createElement('div');
  actions.className = 'confirm-actions';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost btn-sm';
  cancelBtn.textContent = 'Cancelar';
  var okBtn = document.createElement('button');
  okBtn.className = 'btn btn-primary btn-sm';
  okBtn.textContent = 'Aceptar';
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  input.focus();
  input.select();
  function close(){ overlay.remove(); }
  cancelBtn.onclick = close;
  okBtn.onclick = function(){ var v = input.value.trim(); close(); if(v) onSubmit(v); };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); okBtn.click(); } });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* Orientación de impresión dinámica: en vez de depender de "páginas con nombre" de CSS (soporte
   real de Chrome poco fiable para además ajustar el ANCHO del contenido, no solo el tamaño de
   papel — eso era la causa de las tablas angostas con espacio en blanco a la derecha), se
   reescribe la única regla @page justo antes de imprimir, según el tipo de documento visible en
   pantalla: los formularios del DECE, Observación de Clases, reportes y manuales van en A4
   vertical; PCA y Plan Semanal (documentos anchos de varias columnas) siguen en A4 horizontal. */
var PRINT_STYLE_EL = null;
function aplicarOrientacionImpresion(){
  var esVertical = !!document.querySelector('.dece-doc, .obs-doc, .manual-doc, .insp-report-doc');
  if(!PRINT_STYLE_EL){
    PRINT_STYLE_EL = document.createElement('style');
    document.head.appendChild(PRINT_STYLE_EL);
  }
  PRINT_STYLE_EL.textContent = esVertical
    ? '@media print{ @page{ size: A4 portrait; margin: 18mm; } }'
    : '@media print{ @page{ size: A4 landscape; margin: 14mm; } }';
}
function printAsPdf(){
  aplicarOrientacionImpresion();
  window.print();
}

  editingPca: null,   // working copy of a PCA while editing

  semanalReturnTo: 'semanallist',
  adminTab: 'docentes',
  adminEditingDocenteId: null,
  editingAdminDocente: null,  // working copy of the docente being edited by admin (survives concurrent real-time updates)
  adminPcaFilter: {docenteId:'', fechaInicio:'', fechaFin:'', asignatura:'', curso:''},
  adminSemanalFilter: {docenteId:'', fechaInicio:'', fechaFin:'', asignatura:'', curso:''},

  loginError: '',
  registerError: ''
};

function go(subview){ detenerTodosLosAutoguardados(); state.subview = subview; state.sidebarOpen = false; guardarUltimaVista(); render(); window.scrollTo(0,0); }
function goAuth(view){ state.authView = view; state.loginError=''; state.registerError=''; render(); }

/* Recuerda la última página visitada (por usuario) para que, al recargar la página del
   navegador, el sistema vuelva ahí en vez de mandarlo siempre a Inicio. Para el PCA y el Plan
   Semanal guarda también el id del registro abierto, para reabrirlo (no el borrador sin guardar:
   eso se pierde igual que antes, ya que solo existe en memoria). */
var SUBVIEW_ID_FIELD = {pcaform:'editingPca', semanalform:'editingSemanal'};
var SUBVIEW_RETURN_FIELD = {pcaform:'pcaReturnTo', semanalform:'semanalReturnTo'};
function guardarUltimaVista(){
  var d = currentDocente();
  if(!d) return;
  var idField = SUBVIEW_ID_FIELD[state.subview];
  var registro = idField && state[idField];
  try{
    localStorage.setItem('lastView_' + d.id, JSON.stringify({
      subview: state.subview,
      id: registro ? registro.id : null,
      returnTo: SUBVIEW_RETURN_FIELD[state.subview] ? state[SUBVIEW_RETURN_FIELD[state.subview]] : null
    }));
  }catch(e){}
}
/* No se restaura la vista de "editar a este docente" (adminEditDocente/adminNewDocente): depende
   de un working copy que no sobrevive un recargo, y reabrirla a ciegas podría confundir más de lo
   que ayuda — se queda simplemente en la pestaña "admin". */
var SUBVIEW_SIN_RESTAURAR = {adminEditDocente:'admin', adminNewDocente:'admin'};
var RESTORED_LAST_VIEW = false;
var RESTORE_STARTED_AT = null;
function intentarRestaurarUltimaVista(d){
  if(RESTORED_LAST_VIEW) return;
  if(RESTORE_STARTED_AT===null) RESTORE_STARTED_AT = Date.now();
  var saved;
  try{
    var raw = localStorage.getItem('lastView_' + d.id);
    saved = raw ? JSON.parse(raw) : null;
  }catch(e){ saved = null; }
  if(!saved || !saved.subview){ RESTORED_LAST_VIEW = true; return; }
  if(SUBVIEW_SIN_RESTAURAR[saved.subview]){
    RESTORED_LAST_VIEW = true;
    if(state.subview !== SUBVIEW_SIN_RESTAURAR[saved.subview]) go(SUBVIEW_SIN_RESTAURAR[saved.subview]);
    return;
  }
  var col = saved.subview==='pcaform' ? LS.PCA : (saved.subview==='semanalform' ? LS.SEMANAL : null);
  if(!col){
    RESTORED_LAST_VIEW = true;
    if(saved.subview !== state.subview) go(saved.subview);
    return;
  }
  if(!saved.id){ RESTORED_LAST_VIEW = true; return; }
  var existe = load(col).some(function(x){ return x.id===saved.id; });
  if(existe){
    RESTORED_LAST_VIEW = true;
    if(col===LS.PCA) openPcaForm(saved.id, saved.returnTo||'pcalist');
    else openSemanalForm(saved.id, saved.returnTo||'semanallist');
  } else if(Date.now() - RESTORE_STARTED_AT > 4000){
    // Se agotó la espera de los listeners en tiempo real, o el registro ya no existe (se borró):
    // mejor quedarse en Inicio que esperar indefinidamente.
    RESTORED_LAST_VIEW = true;
  }
  // si no existe todavía pero no se ha agotado el tiempo, se reintenta solo — cada onSnapshot
  // llama a render() al llegar datos nuevos, y render() vuelve a invocar esta función.
}

/* ============================= RENDER ROOT ============================= */
function render(){
  if(ES_FORMULARIO_PUBLICO){ renderFormularioPublico(); return; }
  var root = document.getElementById('app');
  if(!FB_READY){
    root.innerHTML = '<div class="center-screen"><div class="hint">Conectando…</div></div>';
    return;
  }
  if(!getSessionId()){
    root.innerHTML = state.authView === 'register' ? renderRegister() : renderLogin();
    bindAuthEvents();
  } else if(!currentDocente()){
    root.innerHTML = '<div class="center-screen"><div class="hint">Cargando tu perfil…</div></div>';
  } else {
    intentarRestaurarUltimaVista(currentDocente());
    root.innerHTML = renderShell();
    bindShellEvents();
  }
}

function bindAuthEvents(){
  var toReg = document.getElementById('toRegister');
  if(toReg) toReg.onclick = function(){ goAuth('register'); };
  var toLog = document.getElementById('toLogin');
  if(toLog) toLog.onclick = function(){ goAuth('login'); };

  var btnLogin = document.getElementById('btnLogin');
  if(btnLogin) btnLogin.onclick = doLogin;
  var pwField = document.getElementById('loginPw');
  if(pwField) pwField.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  var idField = document.getElementById('loginId');
  if(idField) idField.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  var toReset = document.getElementById('toResetPw');
  if(toReset) toReset.onclick = doResetPassword;

  var btnReg = document.getElementById('btnRegister');
  if(btnReg) btnReg.onclick = doRegister;
}

/* Mapea los códigos de error de Firebase Auth a mensajes en español para el usuario. */
function mapAuthError(err){
  var code = err && err.code;
  var MAP = {
    'auth/invalid-email': 'El correo no es válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ese correo ya está registrado. Inicia sesión o usa "¿Olvidaste tu contraseña?".',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/network-request-failed': 'No se pudo conectar. Revisa tu conexión a internet.',
    'auth/requires-recent-login': 'Por seguridad, cierra sesión, vuelve a entrar, e intenta este cambio de inmediato.'
  };
  return (code && MAP[code]) || (err && err.message) || 'Ocurrió un error inesperado.';
}

async function doLogin(){
  var email = (document.getElementById('loginId').value || '').trim();
  var pw = document.getElementById('loginPw').value || '';
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email || !pw){ errEl.textContent='Ingresa tu correo y contraseña.'; errEl.classList.add('show'); return; }
  try{
    await window.FB.signInWithEmailAndPassword(window.FB.auth, email, pw);
    /* onAuthStateChanged (ver FIREBASE BOOTSTRAP) se encarga de cargar el perfil, activar los
       listeners en tiempo real, y llamar a render() — aquí no hace falta hacerlo. */
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doResetPassword(){
  var email = (document.getElementById('loginId').value || '').trim();
  var errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  if(!email){ errEl.textContent='Escribe tu correo arriba primero, luego haz clic en "¿Olvidaste tu contraseña?".'; errEl.classList.add('show'); return; }
  try{
    await window.FB.sendPasswordResetEmail(window.FB.auth, email);
    toast('Te enviamos un correo a ' + email + ' para restablecer tu contraseña.', 'success');
  }catch(err){
    errEl.textContent = mapAuthError(err);
    errEl.classList.add('show');
  }
}

async function doRegister(){
  var errEl = document.getElementById('registerError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('regTitulo').value.trim();
  var nombres = document.getElementById('regNombres').value.trim();
  var apellidos = document.getElementById('regApellidos').value.trim();
  var ci = document.getElementById('regCI').value.trim();
  var telefono = document.getElementById('regTelefono').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var usuarioId = document.getElementById('regUserId').value.trim();
  var pw = document.getElementById('regPw').value;

  if(!nombres || !apellidos || !ci || !email || !usuarioId || !pw) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Ingresa un correo institucional válido.');
  if(pw.length < 6) return fail('La contraseña debe tener al menos 6 caracteres.');

  var snap;
  try{
    snap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
  }catch(err){ return fail(mapAuthError(err)); }
  var existentes = []; snap.forEach(function(d){ existentes.push(d.data()); });
  if(existentes.some(function(d){ return (d.usuarioId||'').toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  /* Toda cuenta que se registra por sí misma queda como 'docente' — nunca 'admin' — reforzado
     también en las reglas de seguridad de Firestore, para que nadie pueda auto-otorgarse el rol
     de administrador. Un administrador ya existente promueve a alguien desde Editar Docente, o
     si el sistema está recién desplegado y todavía no hay ningún admin, se cambia el campo
     "role" a "admin" manualmente una sola vez desde la consola de Firebase (Firestore → docentes). */
  var role = 'docente';

  var cred;
  try{
    cred = await window.FB.createUserWithEmailAndPassword(window.FB.auth, email, pw);
  }catch(err){ return fail(mapAuthError(err)); }

  var docente = {
    id: cred.user.uid,
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono,
    email: email, usuarioId: usuarioId,
    role: role,
    createdAt: nowISO()
  };
  try{
    await window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION.DOCENTES, docente.id), docente);
  }catch(err){
    return fail('Tu cuenta se creó pero no se pudo guardar tu perfil (' + mapAuthError(err) + '). Cierra esta página e intenta iniciar sesión de nuevo.');
  }

  toast('¡Bienvenido/a, ' + docente.nombres + '! Tu cuenta fue creada.', 'success');
  /* onAuthStateChanged toma el control desde aquí (perfil ya escrito arriba antes de que llegue). */
}

/* ============================= ROLES ============================= */
/* Además de 'docente', hay tres roles con acceso administrativo pleno y equivalente entre sí
   (Administrador, Directivo, DECE): todos ven Administración, Inspección General, Base de Datos
   y el módulo DECE. Se mantienen como valores de rol distintos (no fusionados) para identificar
   correctamente quién hizo qué (p.ej. "Atendido por" en un caso DECE), aunque hoy sus permisos
   sean idénticos. */
var STAFF_ROLES = ['admin','directivo','dece'];
function isStaffRole(role){ return STAFF_ROLES.indexOf(role) !== -1; }
var ROLE_LABELS = { admin:'Administrador', directivo:'Directivo', dece:'DECE', docente:'Docente' };
function rolePillHtml(role){
  if(role==='admin') return '<span class="pill pill-gold">Administrador</span>';
  if(role==='directivo') return '<span class="pill pill-blue">Directivo</span>';
  if(role==='dece') return '<span class="pill pill-green">DECE</span>';
  return '<span class="pill pill-muted">Docente</span>';
}

function renderShell(){
  var d = currentDocente();
  var isAdmin = isStaffRole(d.role);
  if(!isAdmin && (state.subview === 'admin' || state.subview === 'adminEditDocente' || state.subview === 'adminNewDocente' || state.subview === 'manualadmin' || state.subview === 'inspeccion' || state.subview === 'dece' || state.subview === 'dececonsultas')) state.subview = 'dashboard';
  function navItemActive(item){
    return (state.subview === item.key
      || (state.subview==='pcaform' && item.key==='pcalist' && state.pcaReturnTo!=='admin')
      || (state.subview==='semanalform' && item.key==='semanallist' && state.semanalReturnTo!=='admin')
      || ((state.subview==='pcaform'||state.subview==='semanalform') && item.key==='admin' && (state.pcaReturnTo==='admin'||state.semanalReturnTo==='admin'))
      || ((state.subview==='adminEditDocente'||state.subview==='adminNewDocente') && item.key==='admin'));
  }
  var navHtml = NAV_GROUPS.map(function(group){
    var visibleItems = group.items.filter(function(item){ return !item.adminOnly || isAdmin; });
    if(!visibleItems.length) return '';
    var hasActive = visibleItems.some(navItemActive);
    /* Por defecto la categoría se abre sola si contiene la página activa; si el usuario la
       colapsa/expande a mano, se respeta esa elección mientras siga en esa página. */
    var collapsed = (group.label in state.navCollapsed) ? state.navCollapsed[group.label] : !hasActive;
    var itemsHtml = visibleItems.map(function(item){
      var active = navItemActive(item);
      return '<button data-nav="'+item.key+'" class="'+(active?'active':'')+'"><span class="ic">'+item.ic+'</span>'+item.label+'</button>';
    }).join('');
    return ''
    + '<div class="nav-group nav-hue-' + (group.hue||'blue') + (collapsed?'':' expanded') + '">'

function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.onclick = function(){ go(btn.getAttribute('data-nav')); };
  });
  document.querySelectorAll('[data-navgroup]').forEach(function(btn){
    btn.onclick = function(){
      var label = btn.getAttribute('data-navgroup');
      var currentlyCollapsed = btn.closest('.nav-group').className.indexOf('expanded') === -1;
      state.navCollapsed[label] = !currentlyCollapsed;
      render();
    };
  });
  var logout = document.getElementById('btnLogout');
  if(logout) logout.onclick = function(){ state.subview='dashboard'; window.FB.signOut(window.FB.auth); };
  var openBtn = document.getElementById('btnOpenSidebar');
  if(openBtn) openBtn.onclick = function(){ state.sidebarOpen = true; render(); };
  var scrim = document.getElementById('sidebarScrim');
  if(scrim) scrim.onclick = function(){ state.sidebarOpen = false; render(); };

  bindSubviewEvents();
}

function bindSubviewEvents(){
  if(state.subview === 'cargahoraria') bindCargaHorariaEvents();
  else if(state.subview === 'pcalist') bindPcaListEvents();
  else if(state.subview === 'pcaform') bindPcaFormEvents();
  else if(state.subview === 'semanallist') bindSemanalListEvents();
  else if(state.subview === 'semanalform') bindSemanalFormEvents();
  else if(state.subview === 'perfil') bindPerfilEvents();
  else if(state.subview === 'database') bindDatabaseEvents();
  else if(state.subview === 'admin') bindAdminEvents();
  else if(state.subview === 'adminEditDocente') bindAdminEditDocenteEvents();
  else if(state.subview === 'adminNewDocente') bindAdminNewDocenteEvents();
  else if(state.subview === 'manualdocente') bindManualEvents();
  else if(state.subview === 'manualadmin') bindManualEvents();
  else if(state.subview === 'inspeccion') bindInspeccionEvents();
  else if(state.subview === 'observacion') bindObservacionEvents();
  else if(state.subview === 'dece') bindDeceEvents();
  else if(state.subview === 'fichadeteccion') bindFichaDeteccionEvents();
  else if(state.subview === 'dececonsultas') bindDeceConsultasEvents();
  else bindDashboardEvents();
}

function renderPerfil(d){

  + '<div class="page-head"><div><div class="eyebrow">Mi Perfil</div><h1>Editar mis datos</h1><p>Actualiza tu información personal y de acceso. Tu carga horaria se administra desde "Mi Carga Horaria".</p></div></div>'
  + '<div class="card">'
  + '  <div class="form-error" id="perfilError"></div>'
  + '  <div class="field-row"><div class="field"><label>Título académico</label><input type="text" id="perfilTitulo" value="' + escapeHtml(d.titulo||'') + '" placeholder="Lic., Ing., Mg., Dr., etc." /></div><div class="field"></div></div>'
  + '  <div class="field-row"><div class="field"><label>Nombres <span class="required">*</span></label><input type="text" id="perfilNombres" value="' + escapeHtml(d.nombres) + '" /></div><div class="field"><label>Apellidos <span class="required">*</span></label><input type="text" id="perfilApellidos" value="' + escapeHtml(d.apellidos) + '" /></div></div>'
  + '  <div class="field-row"><div class="field"><label>Cédula (CI) <span class="required">*</span></label><input type="text" id="perfilCI" maxlength="10" value="' + escapeHtml(d.ci) + '" /></div><div class="field"><label>Teléfono</label><input type="text" id="perfilTelefono" value="' + escapeHtml(d.telefono||'') + '" /></div></div>'
  + '  <div class="field"><label>E-mail institucional (correo de acceso)</label><input type="email" id="perfilEmail" value="' + escapeHtml(d.email) + '" disabled /></div>'
  + '  <div class="field"><label>ID a usar <span class="required">*</span></label><input type="text" id="perfilUserId" value="' + escapeHtml(d.usuarioId) + '" /></div>'
  + '  <div class="field"><label>Nueva contraseña</label><input type="password" id="perfilPw" placeholder="Déjalo en blanco para no cambiarla" /></div>'
  + '  <button class="btn btn-primary" id="btnSavePerfil" style="margin-top:6px;">Guardar cambios</button>'
  + '</div>';
}
async function doSavePerfil(){
  var d = currentDocente();
  var errEl = document.getElementById('perfilError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var titulo = document.getElementById('perfilTitulo').value.trim();
  var nombres = document.getElementById('perfilNombres').value.trim();
  var apellidos = document.getElementById('perfilApellidos').value.trim();
  var ci = document.getElementById('perfilCI').value.trim();
  var telefono = document.getElementById('perfilTelefono').value.trim();
  var usuarioId = document.getElementById('perfilUserId').value.trim();
  var pw = document.getElementById('perfilPw').value;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  if(pw && pw.length < 6) return fail('La nueva contraseña debe tener al menos 6 caracteres.');
  var docentes = allDocentes();
  if(docentes.some(function(x){ return x.id !== d.id && x.usuarioId.toLowerCase() === usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');

  if(pw){
    try{
      await window.FB.updatePassword(window.FB.auth.currentUser, pw);
    }catch(err){ return fail(mapAuthError(err)); }
  }

  /* No mutar `d` directamente: currentDocente() devuelve la MISMA referencia que vive en
     FS_CACHE.DOCENTES, así que mutarla antes de save() hace que el detector de cambios compare
     el registro contra sí mismo (ya mutado) y no vea diferencia — el cambio nunca se escribe a
     Firestore, aunque la UI muestre "guardado" porque la caché local sí quedó actualizada. Hay
     que construir un objeto nuevo. */
  var toSave = Object.assign({}, d, {
    titulo: titulo, nombres: nombres, apellidos: apellidos, ci: ci, telefono: telefono, usuarioId: usuarioId
  });

  save(LS.DOCENTES, docentes.map(function(x){ return x.id === d.id ? toSave : x; }));
  render();
  toast('Tus datos se actualizaron correctamente.', 'success');
}
function bindPerfilEvents(){
  document.getElementById('btnSavePerfil').onclick = doSavePerfil;
}

/* No es posible insertar fotografías/capturas de pantalla reales dentro de un Artifact (no hay

}
function manualShot(caption, innerHtml){
  return '<div class="manual-shot"><div class="bar"><span></span><span></span><span></span><span class="cap">' + escapeHtml(caption) + '</span></div><div class="zone">' + innerHtml + '</div></div>';
}
function manualTip(html){ return '<div class="manual-tip"><b>💡 Consejo:</b> ' + html + '</div>'; }
function manualWarn(html){ return '<div class="manual-warn"><b>⚠️ Importante:</b> ' + html + '</div>'; }
function manualExample(label, html){ return '<div class="manual-example"><b>Ejemplo práctico — ' + escapeHtml(label) + '</b>' + html + '</div>'; }
function manualStep(n, html){ return '<div class="manual-step"><span class="manual-num">' + n + '</span><div>' + html + '</div></div>'; }
function manualSideNav(items, activeLabel){
  return '<div class="mini-side">' + items.map(function(it){
    return '<div class="mi' + (it.label===activeLabel?' active':'') + '">' + escapeHtml(it.ic) + ' ' + escapeHtml(it.label) + '</div>';
  }).join('') + '</div>';
}
/* Igual que manualSideNav, pero agrupado en categorías (como el menú real de la app desde la
   reorganización en acordeón): groups = [{label, items:[{ic,label}]}]. */
function manualSideNavGrouped(groups, activeLabel){
  return '<div class="mini-side">' + groups.map(function(g){
    return '<div class="mi-group-label">' + escapeHtml(g.label) + '</div>'
      + g.items.map(function(it){
          return '<div class="mi' + (it.label===activeLabel?' active':'') + '">' + escapeHtml(it.ic) + ' ' + escapeHtml(it.label) + '</div>';
        }).join('');
  }).join('') + '</div>';
}
function manualSection(id, titulo, bodyHtml){

function renderManualDocente(){
  var toc = '<div class="manual-toc"><h2>Índice</h2><ol>'
    + '<li>Bienvenida</li>'
    + '<li>Crear tu cuenta e iniciar sesión</li>'
    + '<li>Cómo moverte por el sistema</li>'
    + '<li>Mi Perfil</li>'
    + '<li>Mi Carga Horaria</li>'
    + '<li>Plan Curricular Anual (PCA)</li>'
    + '<li>Planes Semanales de Clase</li>'
    + '<li>Observación de Clases</li>'
    + '<li>Ficha de Detección (DECE)</li>'
    + '<li>Base de Datos (respaldo)</li>'
    + '<li>Preguntas frecuentes</li>'
    + '</ol></div>';

  var secIntro = manualSection('sec-1', '1. Bienvenida', ''
    + '<p>Este manual te guía paso a paso por el <b>Sistema Académico de la Unidad Educativa Particular “Simón Bolívar”</b>, la herramienta donde registras tu carga horaria, tus Planes Curriculares Anuales (PCA) y tus Planes Semanales de Clase.</p>'
    + '<p>Todo lo que guardas aquí se sincroniza automáticamente en la nube: no necesitas guardar copias por tu cuenta ni preocuparte de perder tu trabajo si cambias de computadora — con tu correo y contraseña puedes entrar desde cualquier dispositivo y verás siempre la información más reciente.</p>'
    + manualTip('Si en algún momento te pierdes, recuerda que este manual está siempre disponible desde el botón <b>“Manual de Usuario”</b> en la pantalla de Inicio.')
  );

  var secCuenta = manualSection('sec-2', '2. Crear tu cuenta e iniciar sesión', ''
    + '<h3>Crear tu cuenta por primera vez</h3>'
    + manualStep(1, 'En la pantalla de ingreso, haz clic en <b>“Crear usuario”</b>.')
    + manualStep(2, 'Completa tus datos: Título académico, Nombres, Apellidos, Cédula, Teléfono, tu <b>correo institucional</b> y un ID de referencia (solo para identificarte internamente — para entrar siempre usarás tu correo).')
    + manualStep(3, 'Elige una contraseña de al menos 6 caracteres.')
    + manualStep(4, 'Haz clic en <b>“Crear usuario e ingresar”</b>. Entrarás directo al sistema.')
    + manualShot('Crear usuario docente', ''
        + '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:480px;">'
        + '  <div class="mfield"><label>Nombres</label><div class="mval">María Fernanda</div></div>'
        + '  <div class="mfield"><label>Apellidos</label><div class="mval">Torres Salazar</div></div>'
        + '  <div class="mfield"><label>Cédula (CI)</label><div class="mval">2100456789</div></div>'
        + '  <div class="mfield"><label>Teléfono</label><div class="mval">0991234567</div></div>'
        + '</div>'
        + '<div class="mfield" style="max-width:480px; margin-top:8px;"><label>E-mail institucional</label><div class="mval">maria.torres@simonbolivar-ec.com</div></div>'
        + '<div style="margin-top:12px;"><span class="mbtn primary">Crear usuario e ingresar</span></div>')
    + manualWarn('Tu correo es lo único que usarás para iniciar sesión de ahora en adelante — anótalo en un lugar seguro.')
    + '<h3>Iniciar sesión</h3>'
    + manualStep(1, 'Escribe tu <b>correo institucional</b> y tu <b>contraseña</b>.')
    + manualStep(2, 'Haz clic en <b>“Ingresar”</b>.')
    + manualShot('Ingresar al sistema', ''
        + '<div class="mfield" style="max-width:320px;"><label>Correo institucional</label><div class="mval">maria.torres@simonbolivar-ec.com</div></div>'
        + '<div class="mfield" style="max-width:320px; margin-top:8px;"><label>Contraseña</label><div class="mval">••••••••</div></div>'
        + '<div style="margin-top:12px;"><span class="mbtn primary">Ingresar</span></div>')
    + '<h3>Olvidé mi contraseña</h3>'
    + '<p>En la pantalla de ingreso, escribe tu correo y haz clic en <b>“¿Olvidaste tu contraseña?”</b>. Te llegará un correo con un enlace para crear una nueva contraseña.</p>'
  );

  var secNav = manualSection('sec-3', '3. Cómo moverte por el sistema', ''
    + '<p>Todo el sistema se maneja desde el menú de la izquierda (en el celular, tócalo con el botón ☰ de arriba). El menú está organizado en <b>categorías con un color distinto cada una</b>: haz clic en el título de una categoría para expandirla o contraerla — la categoría donde te encuentras se abre sola automáticamente.</p>'
    + manualShot('Menú principal (docente)', manualSideNavGrouped([
        {label:'Perfil y Datos del Docente', items:[{ic:'🏠', label:'Inicio'}, {ic:'👤', label:'Mi Perfil'}, {ic:'🗂️', label:'Mi Carga Horaria'}]},
        {label:'Lo Pedagógico', items:[{ic:'📘', label:'Planes Curriculares (PCA)'}, {ic:'📅', label:'Planes Semanales'}, {ic:'📋', label:'Observación de Clases'}]},
        {label:'Departamento de Consejería Estudiantil (DECE)', items:[{ic:'🚨', label:'Ficha de Detección'}]},
        {label:'Administración y Base de Datos', items:[{ic:'💾', label:'Base de Datos'}]}
      ], 'Mi Carga Horaria'))
    + '<p>Desde <b>Inicio</b> también puedes entrar directamente a cada sección con las tarjetas grandes de acceso rápido.</p>'
    + manualTip('Si no ves alguna categoría u opción (por ejemplo, “Inspección” o parte de “Administración”), es normal: esas secciones son exclusivas de Administradores, Directivos o personal del DECE.')
  );

  var secPerfil = manualSection('sec-4', '4. Mi Perfil', ''
    + '<p>Aquí actualizas tu información personal: título académico, nombres, apellidos, cédula, teléfono e ID de referencia. Tu correo de acceso no se puede cambiar desde esta pantalla (es tu identificador único de ingreso).</p>'
    + '<p>También puedes cambiar tu contraseña: escribe la nueva en el campo “Nueva contraseña” y guarda — si la dejas en blanco, tu contraseña actual no cambia.</p>'
    + manualTip('Si el sistema te pide volver a iniciar sesión al cambiar tu contraseña, es una medida de seguridad normal: cierra sesión, entra de nuevo y repite el cambio.')
  );

  var secCarga = manualSection('sec-5', '5. Mi Carga Horaria', ''
    + '<p>Aquí registras <b>qué asignaturas dictas y en qué cursos o grados</b>. El sistema usa esta información para sugerirte automáticamente las opciones correctas al crear tus PCA y Planes Semanales — por eso es el primer paso que debes completar.</p>'
    + '<h3>Registrar tu carga horaria</h3>'
    + manualStep(1, 'Elige el <b>Nivel Educativo</b> (por ejemplo, Básica Media).')
    + manualStep(2, 'Si tu nivel tiene especialidad (como Bachillerato), elígela.')
    + manualStep(3, 'Marca uno o varios <b>Cursos/Grados</b> y una o varias <b>Asignaturas</b> con las casillas.')
    + manualStep(4, 'Si dictas más de una combinación de nivel/curso/asignatura, haz clic en <b>“+ Agregar fila”</b> para añadir otra.')
    + manualStep(5, 'Haz clic en <b>“Guardar carga horaria”</b>.')
    + manualShot('Mi carga horaria', ''
        + '<table><thead><tr><th>Nivel</th><th>Curso</th><th>Asignatura</th></tr></thead><tbody>'
        + '<tr><td>Básica Media</td><td>5.º EGB A</td><td>Matemática</td></tr>'
        + '</tbody></table>'
        + '<div style="margin-top:10px;"><span class="mbtn ghost">+ Agregar fila</span> <span class="mbtn primary">Guardar carga horaria</span></div>')
    + manualExample('Una docente con dos cursos', 'La Lic. Torres dicta Matemática en 5.º y 6.º EGB A. En Carga Horaria marca ambos cursos en la misma fila, junto con la asignatura Matemática — no necesita crear dos filas separadas.')
    + '<h3>Ver y editar lo ya registrado</h3>'
    + '<p>Una vez guardada, la pantalla muestra un resumen de solo lectura de lo que registraste. Haz clic en <b>“Editar”</b> para modificarlo, y en <b>“Guardar cambios”</b> o <b>“Cancelar”</b> para salir del modo de edición.</p>'
    + manualWarn('No puedes repetir la misma combinación de Nivel + Especialidad en dos filas distintas — el sistema oculta esa opción una vez usada, para evitar registros duplicados.')
  );

  var secPca = manualSection('sec-6', '6. Plan Curricular Anual (PCA)', ''
    + '<p>El PCA es el documento oficial de planificación anual por asignatura, siguiendo el formato institucional. Debes crear un PCA por cada combinación de nivel/curso/asignatura que dictas.</p>'
    + '<h3>Crear un PCA</h3>'
    + manualStep(1, 'Ve a <b>Planes Curriculares (PCA)</b> y haz clic en <b>“+ Nuevo Plan Curricular Anual”</b>.')
    + manualStep(2, 'En <b>Datos Informativos</b>, elige Nivel, Especialidad (si aplica), Curso y Asignatura — se sugieren automáticamente según tu Carga Horaria.')
    + manualStep(3, 'Completa la Carga horaria semanal y el número de semanas por trimestre.')
    + manualStep(4, 'Completa la <b>Temporalización</b>: una fila por cada unidad, con su nombre y el trimestre en que la trabajarás. El total de semanas se suma solo, apenas cambias de casilla.')
    + manualStep(5, 'Completa <b>Contenidos</b>: cada unidad tiene semanas con destreza (nivel de logro), temas y subtemas, página del texto y observación.')
    + manualStep(6, 'Completa las <b>Firmas</b> (Elaborado por, Revisado por, Aprobado por).')
    + manualStep(7, 'Haz clic en <b>“Guardar plan”</b>.')
    + manualShot('Temporalización del PCA', ''
        + '<table><thead><tr><th>Unidad didáctica</th><th>Nombre de la Unidad</th><th>Trimestre</th><th>N.º semanas</th></tr></thead><tbody>'
        + '<tr><td>Unidad 1</td><td>Los números reales</td><td>1er Trimestre</td><td>6</td></tr>'
        + '<tr><td>Unidad 2</td><td>Fracciones y decimales</td><td>1er Trimestre</td><td>7</td></tr>'
        + '</tbody></table>')
    + manualWarn('Una vez que guardas el PCA por primera vez, queda <b>bloqueado</b> para ti (verás un candado 🔒) — así se garantiza que la planificación oficial no cambie sin control. Si necesitas corregir algo después, contacta a un administrador para que lo desbloquee.')
    + '<h3>Fecha límite de entrega</h3>'
    + '<p>Arriba del documento verás la <b>Fecha y hora límite de entrega</b>, definida por el administrador — es de solo lectura para ti, y se usa para saber si entregaste tu PCA a tiempo.</p>'
    + '<h3>Exportar tu PCA</h3>'
    + '<p>Desde la lista de PCA, cada plan tiene tres botones: <b>PDF ✓</b> (abre el diálogo de impresión para guardar como PDF con el formato oficial completo), <b>Word</b> (descarga un .docx editable) y <b>Excel</b> (descarga el detalle de contenidos en .csv).</p>'
    + manualTip('Si tu vista no permite el formato .docx real, el sistema intenta automáticamente con .html y luego .md — siempre te entrega algo que puedes abrir en Word.')
    + '<h3>Cuando la asignatura es de Inglés</h3>'
    + '<p>Si tu asignatura contiene la palabra <b>“Inglés”</b> o <b>“ENGLISH”</b> (por ejemplo, cualquiera de los grupos ENGLISH A1/A2/B1 de tu Carga Horaria), el formulario completo del PCA — título, etiquetas de los campos, encabezados de tablas y botones — se muestra automáticamente en inglés. Solo cambia el idioma de las etiquetas del formulario: lo que tú escribas en Contenidos, Temas y Nivel de Logro sigue siendo el texto que redactes.</p>'
  );

  var secSemanal = manualSection('sec-7', '7. Planes Semanales de Clase', ''
    + '<p>El Plan Semanal es la planificación detallada de una semana de clase, enlazada automáticamente a tu PCA.</p>'
    + '<h3>Crear un Plan Semanal</h3>'
    + manualStep(1, 'Ve a <b>Planes Semanales</b> y haz clic en <b>“+ Nuevo Plan Semanal”</b>.')

    + '<h3>¿Qué pasa si pierdo internet mientras trabajo?</h3>'

/* Lee cualquier archivo de imagen (jpg, png, webp, heic si el navegador lo soporta, etc.), lo
   redimensiona a tamaño carnet y lo comprime a JPEG antes de guardarlo como base64 en Firestore
   (no hay almacenamiento de archivos aparte en esta app). */
function resizeImageFileToDataUrl(file, maxW, maxH, quality, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var ratio = Math.min(maxW/img.width, maxH/img.height, 1);
      var w = Math.max(1, Math.round(img.width*ratio)), h = Math.max(1, Math.round(img.height*ratio));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ callback(null); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

  if(delBtn) delBtn.onclick = doDeleteEstudiante;

function doSaveEstudiante(){
  var e = state.editingEstudiante;
  var errEl = document.getElementById('estError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!e.nombres.trim() || !e.apellidos.trim() || !e.nivel || !e.curso) return fail('Completa nombres, apellidos, nivel y curso.');
  if(e.curso==='Otro…' && !(e.cursoManual||'').trim()) return fail('Especifica el curso.');
  if(e.ci && !/^\d{10}$/.test(e.ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  var todos = load(LS.ESTUDIANTES);
  var exists = todos.some(function(x){ return x.id===e.id; });
  var toSave = Object.assign({}, e, {updatedAt: nowISO()});
  save(LS.ESTUDIANTES, exists ? todos.map(function(x){ return x.id===e.id?toSave:x; }) : todos.concat([toSave]));
  state.editingEstudiante=null; state.inspEstView='lista'; render();
  toast('Estudiante guardado correctamente.', 'success');
}
function doDeleteEstudiante(){
  var e = state.editingEstudiante;
  confirmDialog('¿Eliminar a ' + e.nombres + ' ' + e.apellidos + '?', function(){
    eliminarConDeshacer(LS.ESTUDIANTES, e.id, 'Estudiante eliminado.', 'Estudiante restaurado.');
    state.editingEstudiante=null; state.inspEstView='lista'; render();
  });
}
