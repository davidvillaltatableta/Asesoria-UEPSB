<title>Sistema Académico · UEP Simón Bolívar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --blue-900:#0A2A5E;
    --blue-700:#123E8C;
    --blue-600:#1848A0;
    --blue-500:#2563C7;
    --blue-100:#E7EEFB;
    --blue-50:#F2F6FD;
    --gold-500:#F2B705;
    --gold-600:#D69E00;
    --gold-100:#FCF1CC;
    --red-600:#D62828;
    --red-100:#FBE4E4;
    --green-600:#1E8E5A;
    --green-100:#E3F5EC;
    --purple-100:#EDE4FB;
    --teal-100:#DFF6F4;
    --pink-100:#FBE3EF;
    --orange-100:#FDEAD6;
    --indigo-100:#E3E8FD;
    --lime-100:#EFF7DA;
    --brown-100:#F1E7DA;
    --ink:#16233A;
    --paper:#F5F7FB;
    --surface:#FFFFFF;
    --surface-2:#FAFBFE;
    --line:#DCE3F0;
    --line-strong:#C3CEE3;
    --muted:#5B6B85;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
    --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace;
    /* Fondo del menú lateral: variable propia (no --blue-900) porque ese token se invierte a un
       azul claro en modo oscuro (para servir de texto legible sobre fondos oscuros en el resto de
       la app), lo cual volvía el menú casi blanco con texto claro encima — ilegible. */
    --sidebar-bg:#0A2A5E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --sidebar-bg:#000000;
      --blue-900:#DCE8FF;
      --blue-700:#8FB6FA;
      --blue-600:#6FA0F4;
      --blue-500:#5C93EF;
      --blue-100:#16294D;
      --blue-50:#101B33;
      --gold-500:#F2B705;
      --gold-600:#F5C736;
      --gold-100:#3A2E08;
      --red-600:#FF6B6B;
      --red-100:#3A1414;
      --green-600:#4FCB92;
      --green-100:#0F2A20;
      --purple-100:#271A40;
      --teal-100:#0D2E2C;
      --pink-100:#391629;
      --orange-100:#3A2712;
      --indigo-100:#1B2049;
      --lime-100:#262E10;
      --brown-100:#2E2318;
      --ink:#EAF0FB;
      --paper:#0B1220;
      --surface:#111A2E;
      --surface-2:#0E1626;
      --line:#233150;
      --line-strong:#31456E;
      --muted:#93A2C2;
      --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --sidebar-bg:#000000;
    --blue-900:#DCE8FF; --blue-700:#8FB6FA; --blue-600:#6FA0F4; --blue-500:#5C93EF;
    --blue-100:#16294D; --blue-50:#101B33; --gold-100:#3A2E08; --red-600:#FF6B6B; --red-100:#3A1414;
    --green-600:#4FCB92; --green-100:#0F2A20; --ink:#EAF0FB; --paper:#0B1220; --surface:#111A2E;
    --surface-2:#0E1626; --line:#233150; --line-strong:#31456E; --muted:#93A2C2;
    --purple-100:#271A40; --teal-100:#0D2E2C; --pink-100:#391629; --orange-100:#3A2712;
    --indigo-100:#1B2049; --lime-100:#262E10; --brown-100:#2E2318;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --sidebar-bg:#0A2A5E;
    --blue-900:#0A2A5E; --blue-700:#123E8C; --blue-600:#1848A0; --blue-500:#2563C7;
    --blue-100:#E7EEFB; --blue-50:#F2F6FD; --gold-100:#FCF1CC; --red-600:#D62828; --red-100:#FBE4E4;
    --green-600:#1E8E5A; --green-100:#E3F5EC; --ink:#16233A; --paper:#F5F7FB; --surface:#FFFFFF;
    --surface-2:#FAFBFE; --line:#DCE3F0; --line-strong:#C3CEE3; --muted:#5B6B85;
    --purple-100:#EDE4FB; --teal-100:#DFF6F4; --pink-100:#FBE3EF; --orange-100:#FDEAD6;
    --indigo-100:#E3E8FD; --lime-100:#EFF7DA; --brown-100:#F1E7DA;
    --shadow-1:0 1px 2px rgba(16,32,64,.06), 0 6px 20px rgba(16,32,64,.06);
    --shadow-2:0 2px 6px rgba(16,32,64,.10), 0 16px 40px rgba(16,32,64,.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif); font-weight:700; text-wrap:balance; margin:0;}
  a{color:var(--blue-600);}
  button{font-family:var(--sans);}
  input,select,textarea{font-family:var(--sans); color:var(--ink);}
  ::selection{background:var(--gold-100);}
  /* Cuando el docente selecciona texto en un campo enriquecido y luego usa un control de la
     barra (color, símbolo, enlace) que le quita el foco al campo, el navegador normalmente borra
     el resaltado visual de la selección aunque el texto siga "seleccionado" internamente. Este
     resaltado persistente (ver RTE_HIGHLIGHT en el script) lo mantiene visible hasta que el
     propio docente vuelve a hacer clic o a escribir en el texto. */
  ::highlight(rte-manual-selection){background:var(--gold-100);}
  .tabular{font-variant-numeric:tabular-nums; font-family:var(--mono);}

  #app{min-height:100vh;}
  .center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;}

  /* ---------- Auth screens ---------- */
  .auth-wrap{width:100%; max-width:920px; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:0; background:var(--surface); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-2); border:1px solid var(--line);}
  @media (max-width:760px){ .auth-wrap{grid-template-columns:1fr;} .auth-banner{display:none;} }
  .auth-banner{position:relative; min-height:100%; background:var(--blue-900);}
  .auth-banner img{width:100%; height:100%; object-fit:contain; display:block; min-height:420px;}
  .auth-banner .banner-caption{position:absolute; left:0; right:0; bottom:0; padding:18px 22px; background:linear-gradient(to top, rgba(6,14,30,.88), rgba(6,14,30,0)); color:#fff;}
  .auth-banner .banner-caption .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
  .auth-form{padding:40px 36px; display:flex; flex-direction:column; gap:20px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-row img{width:44px; height:44px; border-radius:50%; object-fit:cover; box-shadow:var(--shadow-1); background:#fff;}
  .brand-row .brand-text .institution{font-family:var(--serif); font-weight:700; font-size:15px; line-height:1.25; color:var(--blue-900);}
  .brand-row .brand-text .tagline{font-size:11.5px; color:var(--muted); letter-spacing:.02em;}
  .auth-form h1{font-size:24px; color:var(--blue-900);}
  .auth-sub{color:var(--muted); font-size:13.5px; margin-top:-10px;}

  /* ---------- Pantalla de agradecimiento (formulario público) ---------- */
  .thanks-card{ width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-2); padding:44px 40px 36px; text-align:center; position:relative; overflow:hidden; animation:thanksCardIn .55s cubic-bezier(.22,1,.36,1) both; }
  .thanks-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, var(--blue-700), var(--gold-500), var(--blue-700)); }
  .thanks-brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px; opacity:.8; }
  .thanks-brand img{ width:32px; height:32px; border-radius:50%; object-fit:cover; box-shadow:var(--shadow-1); background:#fff; flex-shrink:0; }
  .thanks-brand span{ font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:700; text-align:left; line-height:1.4; }
  .thanks-icon-wrap{ width:84px; height:84px; margin:0 auto 22px; border-radius:50%; background:linear-gradient(135deg, var(--green-600), #14785C); display:flex; align-items:center; justify-content:center; animation:thanksPop .6s cubic-bezier(.34,1.56,.64,1) .1s both, thanksRipple 1.6s ease-out .7s 2; }
  .thanks-check-svg{ width:42px; height:42px; }
  .thanks-check-path{ stroke:#fff; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:32; stroke-dashoffset:32; animation:thanksCheckDraw .5s .45s ease-out forwards; }
  .thanks-title{ font-size:30px; font-weight:800; margin-bottom:14px; background:linear-gradient(90deg, var(--blue-900), var(--blue-700)); -webkit-background-clip:text; background-clip:text; color:var(--blue-900); }
  @supports (-webkit-background-clip:text) or (background-clip:text){ .thanks-title{ color:transparent; } }
  .thanks-text{ color:var(--ink); font-size:15px; line-height:1.6; max-width:380px; margin:0 auto; }
  .thanks-footnote{ margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted); }
  @keyframes thanksCardIn{ from{ opacity:0; transform:translateY(20px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes thanksPop{ 0%{ transform:scale(.3); opacity:0; } 60%{ transform:scale(1.1); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes thanksCheckDraw{ to{ stroke-dashoffset:0; } }
  @keyframes thanksRipple{ 0%{ box-shadow:0 0 0 0 rgba(30,142,90,.4); } 70%{ box-shadow:0 0 0 16px rgba(30,142,90,0); } 100%{ box-shadow:0 0 0 0 rgba(30,142,90,0); } }
  @media (prefers-reduced-motion:reduce){ .thanks-card, .thanks-icon-wrap, .thanks-check-path{ animation:none; } .thanks-check-path{ stroke-dashoffset:0; } }
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.01em;}
  .field label.semanal-section-title{display:block; text-align:center; font-size:16px; color:var(--blue-900);}
  .field .required{color:var(--red-600);}
  .field input, .field select, .field textarea{
    padding:10px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:var(--surface-2); font-size:14.5px; color:var(--ink); width:100%; min-width:0;
  }
  .field textarea{resize:vertical; min-height:64px; font-family:var(--sans);}
  /* La regla de arriba está pensada para inputs de texto/select/textarea; sin este reset, un
     checkbox o radio dentro de un .field hereda width:100% + padding + fondo y se infla hasta
     ocupar casi todo el ancho del contenedor (aplastando el texto de su etiqueta a una columna
     casi de 0px de ancho — visible sobre todo con textos largos, como el checklist de Nivel de
     Logro). */
  .field input[type=checkbox], .field input[type=radio]{
    width:auto; min-width:0; flex:0 0 auto; padding:0; border:none; background:none; border-radius:0;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);
  }
  .field .hint{font-size:11.5px; color:var(--muted);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .field-row{grid-template-columns:1fr;} }

  .btn{
    appearance:none; border:1px solid transparent; border-radius:var(--radius-sm); padding:10px 16px;
    font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .04s ease, filter .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--blue-500); outline-offset:2px;}
  .btn-primary{background:var(--blue-700); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold-500); color:#3A2A00;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; color:var(--blue-700); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--blue-50);}
  .btn-danger{background:transparent; color:var(--red-600); border-color:var(--red-100);}
  .btn-danger:hover{background:var(--red-100);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  .form-error{background:var(--red-100); color:var(--red-600); border:1px solid var(--red-100); padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; display:none;}
  .form-error.show{display:block;}
  .switch-line{font-size:13.5px; color:var(--muted); text-align:center;}
  .switch-line button{background:none; border:none; color:var(--blue-600); font-weight:600; cursor:pointer; padding:0; font-size:13.5px;}

  /* ---------- App shell ---------- */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;}
  @media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr);} .sidebar{position:fixed; z-index:40; inset:0 auto 0 0; width:248px; transform:translateX(-100%); transition:transform .2s ease;} .sidebar.open{transform:translateX(0);} .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(8,14,28,.45); z-index:35;} .sidebar-scrim.show{display:block;} .mobile-topbar{display:flex !important;} }
  .sidebar{background:var(--sidebar-bg); color:#EAF0FF; display:flex; flex-direction:column; padding:20px 16px; gap:22px;}
  .sidebar .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .sidebar .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; background:#fff;}
  .sidebar .brand .name{font-family:var(--serif); font-weight:700; font-size:13.5px; line-height:1.25;}
  .sidebar .brand .year{font-size:10.5px; opacity:.7;}
  .sidebar nav{display:flex; flex-direction:column; gap:8px;}
  .nav-hue-blue{--hue-rgb:140,190,255;}
  .nav-hue-green{--hue-rgb:130,225,190;}
  .nav-hue-peach{--hue-rgb:255,180,130;}
  .nav-hue-purple{--hue-rgb:205,170,255;}
  .nav-hue-rose{--hue-rgb:255,155,195;}
  .sidebar nav .nav-group{border-radius:14px; background:rgba(var(--hue-rgb,255,255,255),.08); transition:background .15s ease;}
  .sidebar nav .nav-group.expanded{background:rgba(var(--hue-rgb,255,255,255),.16);}
  .sidebar nav .nav-group-header{
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    background:none; border:none; cursor:pointer; padding:12px 14px; color:rgb(var(--hue-rgb,147,168,214));
  }
  .sidebar nav .nav-group-header:hover{filter:brightness(1.2);}
  .sidebar nav .nav-group-label{font-size:12.5px; font-weight:700; letter-spacing:.005em; text-align:left;}
  .sidebar nav .nav-group-chevron{font-size:14px; line-height:1; opacity:.85; transition:transform .18s ease; flex-shrink:0;}
  .sidebar nav .nav-group.expanded .nav-group-chevron{transform:rotate(90deg);}
  .sidebar nav .nav-group-items{display:none; flex-direction:column; gap:2px; padding:0 6px 8px;}
  .sidebar nav .nav-group.expanded .nav-group-items{display:flex;}
  .sidebar nav button[data-nav]{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:#C9D7F5;
    padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .sidebar nav button[data-nav] .ic{width:18px; text-align:center; opacity:.85;}
  .sidebar nav button[data-nav]:hover{background:rgba(255,255,255,.07); color:#fff;}
  .sidebar nav button[data-nav].active{background:var(--gold-500); color:#3A2A00; box-shadow:0 2px 10px rgba(242,183,5,.3);}
  .sidebar .spacer{flex:1;}
  .sidebar .who{border-top:1px solid rgba(255,255,255,.14); padding-top:14px; display:flex; flex-direction:column; gap:8px;}
  .sidebar .who .who-name{font-size:13px; font-weight:700;}
  .sidebar .who .who-role{font-size:11.5px; color:#AEC0EA;}
  .sidebar .who button{background:rgba(255,255,255,.08); color:#fff; border:none; padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer; text-align:left;}
  .sidebar .who button:hover{background:rgba(255,255,255,.16);}

  .mobile-topbar{display:none; align-items:center; gap:10px; padding:12px 16px; background:var(--sidebar-bg); color:#fff; position:sticky; top:0; z-index:20;}
  .mobile-topbar button{background:none; border:none; color:#fff; font-size:20px; cursor:pointer;}
  .mobile-topbar .name{font-size:13.5px; font-weight:700;}

  main.content{padding:28px 32px 80px; max-width:1180px; width:100%; margin:0 auto;}
  @media (max-width:600px){ main.content{padding:18px 14px 60px;} }

  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-head .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .page-head h1{font-size:26px; color:var(--blue-900); margin-top:2px;}
  .page-head p{color:var(--muted); font-size:13.5px; margin-top:4px; max-width:52ch;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); padding:22px;}
  .card + .card{margin-top:18px;}
  .card h2{font-size:16px; color:var(--blue-900); margin-bottom:4px;}
  .card .card-sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}

  .grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;}
  @media (max-width:820px){ .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr);} }

  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-1);}
  .stat .stat-num{font-family:var(--serif); font-size:28px; font-weight:700; color:var(--blue-700);}
  .stat .stat-label{font-size:12px; color:var(--muted); margin-top:2px;}

  .action-card{display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-1); transition:border-color .15s, transform .06s;}
  .action-card:hover{border-color:var(--blue-500); transform:translateY(-1px);}
  .action-card .ic{width:34px; height:34px; border-radius:9px; background:var(--blue-100); color:var(--blue-700); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .action-card h3{font-size:14.5px; color:var(--ink);}
  .action-card p{font-size:12.5px; color:var(--muted); margin:0;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm);}
  table thead th{background:var(--blue-50); color:var(--blue-900); text-align:left; padding:9px 10px; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); white-space:nowrap;}
  .unit-block table thead th{text-align:center;}
  table td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table tbody tr:last-child td{border-bottom:none;}
  table tbody tr.group-head-row td{background:var(--blue-50); color:var(--blue-900); font-weight:700; font-size:12.5px; padding:10px 10px; border-top:2px solid var(--line-strong); border-bottom:1px solid var(--line-strong);}
  table tbody tr.group-head-row:first-child td{border-top:none;}
  table tbody tr:hover{background:var(--surface-2);}
  .cell-input, .cell-select{width:100%; min-width:120px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px;}
  .cell-select-lg{padding:12px 14px !important; font-size:16px !important; font-weight:600;}
  .signature-line{border-bottom:1px solid var(--ink); height:36px; margin-bottom:6px;}
  .carga-table{table-layout:auto; width:auto;}
  .carga-table th, .carga-table td{width:auto; white-space:nowrap;}
  .carga-table .cell-select{width:auto; min-width:150px;}
  .carga-table .checkbox-grid{width:auto; max-width:340px; min-width:0;}
  .carga-table .cell-input{width:auto; min-width:0;}
  .cell-textarea{width:100%; min-width:160px; min-height:52px; padding:7px 8px; border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); font-size:13px; resize:vertical;}
  /* Ícono para abrir un enlace pegado/escrito en un campo de texto simple (sin barra de formato) —
     ver activarEnlacesEnCamposDeTexto. Se envuelve el input en este span sin cambiar su ancho. */
  .input-link-wrap{position:relative; display:block; flex:1 1 auto; min-width:0;}
  .input-link-wrap .input-link-btn{
    display:none; position:absolute; right:3px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; padding:0; border:none; background:transparent; cursor:pointer;
    font-size:13px; line-height:1; border-radius:5px; align-items:center; justify-content:center;
  }
  .input-link-wrap .input-link-btn:hover{background:var(--line-strong);}
  .input-link-wrap.has-link input.cell-input{padding-right:28px;}
  .input-link-wrap.has-link .input-link-btn{display:flex;}
  .row-remove{background:none; border:none; color:var(--red-600); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:6px;}
  .row-remove:hover{background:var(--red-100);}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em;}
  .pill-blue{background:var(--blue-100); color:var(--blue-700);}
  .pill-gold{background:var(--gold-100); color:var(--gold-600);}
  .pill-green{background:var(--green-100); color:var(--green-600);}
  .pill-muted{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
  .asis-cell{width:32px; height:28px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:12px; cursor:pointer;}
  .asis-cell.asis-P{background:var(--green-100); color:var(--green-600); border-color:var(--green-100);}
  .asis-cell.asis-A{background:var(--gold-100); color:var(--gold-600); border-color:var(--gold-100);}
  .asis-cell.asis-F{background:var(--red-100); color:var(--red-600); border-color:var(--red-100);}


  .empty-state{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-state .ic{font-size:30px; margin-bottom:8px;}

  .confirm-overlay{position:fixed; inset:0; background:rgba(8,14,28,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .confirm-box{background:var(--surface); border-radius:12px; padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow-2);}
  .confirm-box p{margin:0 0 18px; font-size:14px; color:var(--ink); line-height:1.5;}
  .confirm-actions{display:flex; gap:10px; justify-content:flex-end;}

  .toast-region{position:fixed; top:16px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:340px;}
  .toast{background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:9px; font-size:13.5px; box-shadow:var(--shadow-2); animation:toast-in .18s ease;}
  .toast.success{background:var(--green-600); color:#06301c;}
  .toast.error{background:var(--red-600); color:#3A0000;}
  .toast-undo{display:flex; align-items:center; gap:14px;}
  .toast-undo-btn{background:none; border:1px solid rgba(255,255,255,.4); color:inherit; border-radius:6px; padding:4px 10px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .toast-undo-btn:hover{background:rgba(255,255,255,.15);}
  @keyframes toast-in{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- PCA document ---------- */
  .pca-toolbar{position:sticky; top:0; z-index:15; background:var(--paper); padding:10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .pca-toolbar .spacer{flex:1;}
  .pca-doc{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-1);}
  .pca-band{padding:12px 20px; font-weight:700; font-size:13px; letter-spacing:.02em; color:#fff;}
  .pca-band.band-top{background:var(--blue-900); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .pca-band.band-top .inst{font-family:var(--serif); font-size:16px;}
  .pca-band.band-title{background:var(--blue-700); text-align:center; font-family:var(--serif); font-size:15px; text-transform:uppercase; letter-spacing:.04em;}
  .pca-band.band-section{background:var(--gold-500); color:#3A2A00; text-transform:uppercase;}
  .pca-band.band-unit{background:var(--blue-600); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pca-section{padding:18px 20px;}
  .pca-doc .pca-band + .pca-section{padding-top:18px;}
  .unit-block{border-top:1px solid var(--line);}
  .unit-block:first-child{border-top:none;}
  .unit-head-input{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; font-weight:600; min-width:220px;}
  .unit-head-input::placeholder{color:rgba(255,255,255,.75);}
  .totals-row td{font-weight:700; background:var(--blue-50);}
  .signature-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:20px;}
  @media (max-width:760px){ .signature-grid{grid-template-columns:1fr;} }
  .signature-box{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; background:var(--surface-2);}
  .signature-box .role{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin-bottom:8px;}

  .db-warning{background:var(--gold-100); border:1px solid var(--gold-500); color:#5a4300; padding:14px 16px; border-radius:var(--radius-sm); font-size:13px; line-height:1.5;}
  :root[data-theme="dark"] .db-warning, @media (prefers-color-scheme:dark){ .db-warning{color:#F2D98A;} }
  .lock-banner{background:var(--gold-100); border:1px solid var(--gold-500); color:#5a4300; padding:12px 20px; font-size:13px; font-weight:600;}
  :root[data-theme="dark"] .lock-banner, @media (prefers-color-scheme:dark){ .lock-banner{color:#F2D98A;} }
  .admin-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .admin-tabs button{background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;}
  .admin-tabs button:hover{color:var(--blue-700);}
  .admin-tabs button.active{color:var(--blue-700); border-bottom-color:var(--blue-600);}
  /* Submenús de Administración: cada grupo temático (Personal, Planificación Curricular,
     Presentaciones, Configuración) se puede plegar/desplegar; solo uno se muestra abierto a la vez,
     por defecto el que contiene la pestaña activa. Dentro, reutiliza el mismo .admin-tabs de arriba. */
  .admin-groups{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .admin-group{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface);}
  .admin-group-head{width:100%; display:flex; align-items:center; gap:9px; text-align:left; padding:13px 16px; background:var(--surface-2); border:none; cursor:pointer; font-size:14px; font-weight:700; color:var(--muted);}
  .admin-group-head:hover{background:var(--blue-50);}
  .admin-group.has-active .admin-group-head{color:var(--blue-700);}
  .admin-group-caret{font-size:11px; color:var(--muted); transition:transform .15s ease; width:12px; display:inline-block; flex-shrink:0;}
  .admin-group.open .admin-group-caret{transform:rotate(90deg);}
  .admin-group .admin-tabs{margin:0; padding:8px 12px 2px; border-bottom:none;}

  .kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line-strong); padding:1px 6px; border-radius:4px;}
  .checkbox-grid{display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); min-height:20px;}
  .checkbox-grid.checkbox-grid-2col{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;}
  @media (max-width:560px){ .checkbox-grid.checkbox-grid-2col{grid-template-columns:1fr;} }
  .checkbox-pill{display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:5px 10px 5px 8px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; user-select:none; white-space:nowrap;}
  .checkbox-pill:has(input:checked){background:var(--blue-100); border-color:var(--blue-500); color:var(--blue-700);}
  .checkbox-pill input{accent-color:var(--blue-600); cursor:pointer; margin:0;}
  .nivel-logro-pill{display:flex; align-items:flex-start; justify-content:flex-start; height:auto; white-space:normal; padding:10px 12px; width:100%; text-align:left; gap:10px; border-radius:var(--radius-sm); box-sizing:border-box;}
  .nivel-logro-pill input{margin-top:3px; flex-shrink:0;}
  .nivel-logro-pill span{flex:1 1 0%; min-width:0; text-align:justify; display:block;}
  .obs-opts{display:flex; flex-wrap:wrap; gap:6px;}
  .obs-table{table-layout:fixed;}
  .obs-table td, .obs-table th{vertical-align:middle;}
  .obs-table .obs-evidencia{font-weight:700; font-size:12.5px; color:var(--blue-900);}
  .add-inline{display:flex; gap:8px; margin-top:8px;}
  .add-inline input{flex:1; min-width:0; padding:7px 9px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); font-size:13px; color:var(--ink);}
  .add-inline input:focus{outline:2px solid var(--blue-500); outline-offset:1px; border-color:var(--blue-500);}
  .rte{border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--surface-2); overflow:hidden;}
  .rte-toolbar{display:flex; gap:2px; flex-wrap:wrap; padding:5px; border-bottom:1px solid var(--line-strong); background:var(--surface);}
  .rte-toolbar button{background:none; border:1px solid transparent; border-radius:5px; width:28px; height:26px; font-size:12.5px; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .rte-toolbar button:hover{background:var(--blue-100); border-color:var(--line);}
  .rte-toolbar button.active{background:var(--blue-600); border-color:var(--blue-600); color:#fff;}
  .rte-toolbar button.active:hover{background:var(--blue-700);}
  .rte-editable{min-height:90px; height:auto; overflow-y:visible; padding:9px 10px; font-size:13.5px; line-height:1.5; outline:none;}
  .rte-color-btn{width:30px; height:26px; padding:2px 4px 4px; border:1px solid var(--line); border-radius:5px; cursor:pointer; background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:1px;}
  .rte-color-btn:hover{background:var(--blue-100);}
  .rte-color-btn-a{font-weight:700; font-size:12px; line-height:1; color:var(--ink);}
  .rte-color-btn-bar{width:16px; height:3px; border-radius:1px;}
  .rte-symbol{height:26px; font-size:12px; color:var(--ink); border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; max-width:92px;}
  .rte-font{height:26px; font-size:12px; color:var(--ink); border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; max-width:110px;}
  .rte-editable sup, .rte-editable sub{font-size:.75em;}
  .rte-paste-menu{position:fixed; z-index:80; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm); box-shadow:var(--shadow-2); padding:5px; display:flex; flex-direction:column; gap:2px; min-width:180px;}
  .rte-paste-menu button{background:none; border:none; text-align:left; padding:7px 9px; font-size:12.5px; color:var(--ink); border-radius:5px; cursor:pointer;}
  .rte-paste-menu button:hover{background:var(--blue-100);}
  .rte-paste-options-btn{position:fixed; z-index:80; background:var(--surface); border:1px solid var(--line-strong); border-radius:99px; box-shadow:var(--shadow-2); padding:5px 12px; font-size:11.5px; font-weight:600; color:var(--ink); cursor:pointer;}
  .rte-paste-options-btn:hover{background:var(--blue-100);}
  .rte-color-menu{position:fixed; z-index:80; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-sm); box-shadow:var(--shadow-2); padding:8px; width:196px;}
  .rte-color-auto{width:100%; display:flex; align-items:center; gap:8px; background:none; border:none; text-align:left; padding:6px 5px; font-size:12.5px; color:var(--ink); border-radius:5px; cursor:pointer; margin-bottom:4px;}
  .rte-color-auto:hover{background:var(--blue-100);}
  .rte-color-auto-swatch{width:16px; height:16px; border-radius:3px; border:1px solid var(--line-strong); background:#000;}
  .rte-color-label{font-size:11px; color:var(--muted); font-weight:600; margin:6px 2px 4px;}
  .rte-color-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
  .rte-color-swatch{width:100%; aspect-ratio:1; border-radius:4px; border:1px solid var(--line-strong); cursor:pointer; padding:0;}
  .rte-color-swatch:hover{outline:2px solid var(--blue-500); outline-offset:1px;}
  .rte-color-more{width:100%; margin-top:8px; background:none; border:1px solid var(--line); border-radius:6px; text-align:left; padding:6px 8px; font-size:12.5px; color:var(--ink); cursor:pointer;}
  .rte-color-more:hover{background:var(--blue-100);}
  .rte-editable ul, .rte-editable ol{margin:4px 0; padding-left:22px;}
  .rte-editable a{color:var(--blue-600); text-decoration:underline;}
  .rte-editable:empty:before{content:attr(data-placeholder); color:var(--muted);}
  .semanal-day{border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; background:var(--surface-2); margin-bottom:14px;}
  .semanal-day .day-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}

  @media print{
    @page{ size: A4 landscape; margin: 14mm; }
    .sidebar, .mobile-topbar, .pca-toolbar, .lock-banner, .no-print{display:none !important;}
    .only-print{display:block !important;}
    body{background:#fff;}
    /* .shell reserva una columna de 248px para el menú lateral (grid-template-columns:248px
       minmax(0,1fr)) — ocultar el <aside> con display:none no cambia esa plantilla, así que sin
       este reinicio el <main> quedaba encajado en esa franja angosta de 248px y el resto de la
       hoja se imprimía en blanco (la causa real de las tablas angostas al imprimir). */
    .shell{display:block;}
    main.content{padding:0; max-width:100%;}
    .pca-doc{box-shadow:none; border:none;}
    .card{box-shadow:none;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;}
    table{page-break-inside:auto;}
    tr{page-break-inside:avoid; page-break-after:auto;}
    .unit-block{page-break-inside:avoid;}
    .pca-band{page-break-after:avoid;}
    .signature-grid{page-break-inside:avoid;}
    /* Los select/input/textarea dentro de tablas usan un min-width fijo en pantalla para que sean
       cómodos de editar; al imprimir eso hace que se desborden de celdas angostas. En los
       documentos imprimibles (PCA, Plan Semanal, Observación, DECE) se quita ese mínimo y se
       fuerza el contenido a envolver dentro del ancho real de la celda. */
    .pca-doc table, .obs-doc table, .dece-doc table{table-layout:fixed;}
    .pca-doc td, .pca-doc th, .obs-doc td, .obs-doc th, .dece-doc td, .dece-doc th{word-break:break-word; overflow-wrap:break-word; white-space:normal;}
    .pca-doc .cell-input, .pca-doc .cell-select, .pca-doc .cell-textarea,
    .obs-doc .cell-input, .obs-doc .cell-select, .obs-doc .cell-textarea,
    .dece-doc .cell-input, .dece-doc .cell-select, .dece-doc .cell-textarea{
      min-width:0 !important; width:100% !important; box-sizing:border-box; border-color:var(--line); background:transparent;
    }
    .pca-doc select.cell-select, .obs-doc select.cell-select, .dece-doc select.cell-select{-webkit-appearance:none; appearance:none;}
    .rte-editable{overflow:visible; min-height:0;}
    .rte-toolbar{display:none !important;}
  }

  /* ============================= REPORTE FOTOGRÁFICO (Inspección) ============================= */
  .foto-report-page{ page-break-after:always; }
  .foto-report-page:last-child{ page-break-after:auto; }
  .foto-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; padding:16px 20px 20px; }
  .foto-card{ display:flex; flex-direction:column; align-items:center; text-align:center; border:1px solid var(--line); border-radius:8px; padding:6px 4px 8px; background:#fff; }
  .foto-card img{ width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:4px; display:block; }
  .foto-card-vacio{ width:100%; aspect-ratio:3/4; border-radius:4px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); }
  .foto-card-nombre{ margin-top:6px; font-size:10.5px; line-height:1.25; font-weight:600; }

  /* ============================= MANUALES DE USUARIO ============================= */
  .manual-doc{ background:#fff; max-width:900px; margin:0 auto; }
  .manual-cover{
    min-height:90vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(160deg, var(--blue-900), var(--blue-700)); color:#fff; border-radius:var(--radius); padding:60px 40px;
    page-break-after:always;
  }
  .manual-cover img{ width:96px; height:96px; border-radius:50%; background:#fff; object-fit:cover; box-shadow:var(--shadow-2); margin-bottom:22px; }
  .manual-cover .eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.8; margin-bottom:10px; }
  .manual-cover h1{ font-family:var(--serif); font-size:34px; line-height:1.25; max-width:16ch; }
  .manual-cover .subt{ font-size:15px; opacity:.9; margin-top:14px; max-width:44ch; }
  .manual-cover .badge{ margin-top:34px; background:var(--gold-500); color:#3A2A00; font-weight:700; font-size:12.5px; padding:8px 18px; border-radius:99px; }
  .manual-cover .foot{ margin-top:40px; font-size:11.5px; opacity:.75; }
  .manual-toc{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px 26px; margin:0 0 30px; page-break-after:always; }
  .manual-toc h2{ color:var(--blue-900); font-size:18px; margin-bottom:14px; }
  .manual-toc ol{ margin:0; padding-left:22px; }
  .manual-toc li{ padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .manual-toc li:last-child{ border-bottom:none; }
  .manual-section{ margin:0 0 34px; page-break-inside:avoid; }
  .manual-section h2{ color:#fff; background:var(--blue-900); font-size:16px; padding:10px 16px; border-radius:8px 8px 0 0; margin:0; }
  .manual-section .manual-body{ border:1px solid var(--line); border-top:none; border-radius:0 0 8px 8px; padding:18px 20px; }
  .manual-section h3{ color:var(--blue-700); font-size:14px; margin:18px 0 8px; }
  .manual-section h3:first-child{ margin-top:0; }
  .manual-section p{ font-size:13.5px; line-height:1.65; margin:0 0 10px; color:var(--ink); }
  .manual-section ol, .manual-section ul{ font-size:13.5px; line-height:1.7; padding-left:22px; margin:0 0 12px; }
  .manual-section li{ margin-bottom:4px; }
  .manual-tip{ background:var(--blue-50); border-left:3px solid var(--blue-600); border-radius:6px; padding:10px 14px; font-size:12.5px; margin:12px 0; }
  .manual-tip b{ color:var(--blue-700); }
  .manual-warn{ background:#FFF6D9; border-left:3px solid var(--gold-500); border-radius:6px; padding:10px 14px; font-size:12.5px; margin:12px 0; }
  .manual-example{ background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:6px; padding:10px 14px; font-size:12.5px; margin:12px 0; }
  .manual-example b{ display:block; color:var(--blue-700); margin-bottom:4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  /* Marcos que imitan una captura de pantalla real de la interfaz, reutilizando los mismos
     colores de marca — como no se pueden insertar imágenes rasterizadas dentro del sistema,
     esto reproduce fielmente el aspecto real de cada pantalla con HTML/CSS en vivo. */
  .manual-shot{ border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; margin:14px 0 18px; box-shadow:var(--shadow-1); page-break-inside:avoid; }
  .manual-shot .bar{ background:#E4E9F2; padding:7px 12px; display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--line-strong); }
  .manual-shot .bar span{ width:9px; height:9px; border-radius:50%; background:#C7CEDB; display:inline-block; }
  .manual-shot .bar .cap{ margin-left:8px; font-size:11px; color:var(--muted); font-weight:600; }
  .manual-shot .zone{ padding:16px; background:#fff; }
  .manual-shot .mini-side{ background:var(--blue-900); color:#EAF0FF; border-radius:8px; padding:12px; font-size:11.5px; display:flex; flex-direction:column; gap:6px; width:170px; }
  .manual-shot .mini-side .mi{ padding:6px 8px; border-radius:6px; }
  .manual-shot .mini-side .mi.active{ background:var(--gold-500); color:#3A2A00; font-weight:700; }
  .manual-shot .mini-side .mi-group-label{ font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#8FA3D6; padding:8px 8px 2px; }
  .manual-shot .mini-side .mi-group-label:first-child{ padding-top:2px; }
  .manual-shot table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .manual-shot th{ background:var(--blue-50); color:var(--blue-900); text-align:left; padding:6px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }
  .manual-shot td{ padding:6px 8px; border-top:1px solid var(--line); }

/* ============================= DATA / STORAGE (Firestore) ============================= */
/* LS sigue usándose como "nombre de tabla" en todo el código (DOCENTES, CARGA, etc.), pero ahora
   apunta al nombre de la colección de Firestore en vez de una llave de localStorage. load()/save()
   ya no son E/S directa: son una caché en memoria (FS_CACHE) mantenida en tiempo real por
   listeners de Firestore (ver attachRealtimeListeners). save() actualiza la caché al instante
   (para que la UI se sienta inmediata) y en paralelo sincroniza los cambios hacia Firestore
   comparando contra la versión anterior — así ningún llamador existente (load()/save() se usan
   igual en más de cien lugares del código) necesitó cambiar. */
var LS = {
  DOCENTES: 'DOCENTES',
  CARGA: 'CARGA',
  PCA: 'PCA',
  CONT: 'CONT',
  SEMANAL: 'SEMANAL',
  FECHAS_LIMITE: 'FECHAS_LIMITE',

  ASISTENCIA: 'ASISTENCIA',

  OBSERVACIONES: 'OBSERVACIONES',
  DECE: 'DECE',
  FICHA_DETECCION: 'FICHA_DETECCION',
  CONFIG: 'CONFIG',
  PAPELERA: 'PAPELERA',
  TALLER: 'TALLER'
};
var FS_COLLECTION = {
  DOCENTES: 'docentes', CARGA: 'carga', PCA: 'pca', CONT: 'contenidos', SEMANAL: 'semanal', FECHAS_LIMITE: 'fechaslimite',
  ESTUDIANTES: 'estudiantes', ASISTENCIA: 'asistencia', INCIDENTES: 'incidentes', OBSERVACIONES: 'observaciones', DECE: 'dece',
  FICHA_DETECCION: 'fichadeteccion', CONFIG: 'config', PAPELERA: 'papelera', TALLER: 'taller'
};
var FS_CACHE = { DOCENTES: [], CARGA: [], PCA: [], CONT: [], SEMANAL: [], FECHAS_LIMITE: [], ESTUDIANTES: [], ASISTENCIA: [], INCIDENTES: [], OBSERVACIONES: [], DECE: [], FICHA_DETECCION: [], CONFIG: [], PAPELERA: [], TALLER: [] };
function load(key){ return FS_CACHE[key] || []; }
function save(key, val){
  var old = FS_CACHE[key] || [];
  var oldById = {}; old.forEach(function(r){ oldById[r.id] = r; });
  var keptIds = {};
  var writes = [];
  (val||[]).forEach(function(r){
    keptIds[r.id] = true;
    var prev = oldById[r.id];
    if(!prev || JSON.stringify(prev) !== JSON.stringify(r)){
      writes.push(window.FB.setDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id)), r));
    }
  });
  old.forEach(function(r){
    if(!keptIds[r.id]) writes.push(window.FB.deleteDoc(window.FB.doc(window.FB.db, FS_COLLECTION[key], String(r.id))));
  });
  FS_CACHE[key] = val;
  Promise.all(writes).catch(function(e){
    console.error('Error guardando en Firestore', key, e);
    toast('No se pudo guardar en la nube (' + (e.message||e.code||e) + '). Revisa tu conexión.', 'error');
  });
}
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }

function escapeHtml(s){
  s = (s===undefined || s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(d){

}
function fmtDateTime(iso){

}
/* Formatea un valor de <input type="datetime-local"> ("YYYY-MM-DDTHH:mm", sin zona horaria). */

/* ============================= CURRICULUM (Ecuador) ============================= */

/* Separa el texto enriquecido (destreza/temas del PCA) en líneas individuales — cada párrafo o
   viñeta se vuelve una entrada de la lista, quitando el marcador "• " si lo trae. */
function parseLinesList(html){
  var plain = richTextToPlain(html);
  if(!plain) return [];
  return plain.split('\n').map(function(l){ return l.replace(/^•\s*/, '').trim(); }).filter(Boolean);
}
/* El campo Nivel de Logro del PCA (para una sola semana) puede traer, línea por línea (un ítem
   por cada Enter que dio el docente), la descripción de cada nivel: una línea de encabezado
   (p.ej. "Básico:", "Intermedio: ...", "Avanzado ...") seguida de una o varias líneas de detalle
   sin palabra clave, que pertenecen a ese mismo nivel hasta que aparezca el encabezado del
   siguiente. Esta función devuelve, para cada nivel, la LISTA completa de ítems (sin mezclar
   niveles entre sí), no solo el último renglón. */
function parseNivelesLogroTiers(html){
  var out = {basico:[], intermedio:[], avanzado:[]};
  var tierActual = '';
  parseLinesList(html).forEach(function(line){
    var t = line.toLowerCase();
    var tierLinea = t.indexOf('avanzado')!==-1 ? 'avanzado'
      : t.indexOf('intermedio')!==-1 ? 'intermedio'
      : (t.indexOf('básico')!==-1 || t.indexOf('basico')!==-1) ? 'basico' : '';
    if(tierLinea){
      tierActual = tierLinea;
      var limpio = line.replace(/^(nivel\s+)?(básico|basico|intermedio|avanzado)\s*[:\-–]?\s*/i, '').trim();
      if(limpio) out[tierActual].push(limpio);
    } else if(tierActual){
      out[tierActual].push(line);
    }
  });
  return out;
}
var DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS_LARGO_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MESES_LARGO_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
/* isIngles es opcional (por defecto español) — solo el Plan Semanal en modo inglés lo pasa en
   true; el resto de usos (Disciplina, Consultas) siguen en español sin tocarlos. */
function fmtDateLargo(iso, isIngles){
  if(!iso) return '';
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  if(isNaN(d.getTime())) return '';
  if(isIngles) return MESES_LARGO_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' (' + DIAS_LARGO_EN[d.getDay()] + ')';
  return DIAS_LARGO[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES_LARGO[d.getMonth()] + ' ' + d.getFullYear();
}
function addDays(iso, n){
  if(!iso) return '';
  var p = iso.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function especialidadesFor(nivel){ return ESPECIALIDADES[nivel] || []; }

}
function asignaturasFor(nivel, especialidad){

  var seen = {};

function misCargaRows(docenteId){ return load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId; }); }

  rows.forEach(function(r){ if(r.curso) set[r.curso]=1; });
  return Object.keys(set).sort();
}
function misAsignaturasPara(docenteId, nivel, especialidad, curso){
  var rows = misCargaRows(docenteId).filter(function(r){ return r.nivel===nivel && (!especialidad || r.especialidad===especialidad) && (!curso || r.curso===curso); });
  var set = {};
  rows.forEach(function(r){ if(r.asignatura) set[r.asignatura]=1; });
  return Object.keys(set).sort();
}
/* Asignaturas que usan el formulario de "Taller Práctico" en vez del Plan Semanal normal.
   Computación y Robótica activan el Taller Práctico en CUALQUIER nivel educativo (Iniciales,
   Básica y Bachillerato) porque son prácticas en todos los niveles donde se dictan. Informática
   Aplicada y las asignaturas de la especialidad Diseño Gráfico que son prácticas/de taller solo
   existen (y por tanto solo aplican) en Bachillerato — se excluyen a propósito las teóricas de esa
   especialidad: Historia del Arte, Formación y Orientación Laboral, y Publicidad del Colegio, que
   siguen usando el Plan Semanal normal. */
var ASIGNATURAS_TALLER_PRACTICO_CUALQUIER_NIVEL = ['Computación', 'Robótica'];
var ASIGNATURAS_TALLER_PRACTICO_BACHILLERATO = [
  'Informática Aplicada (Programación)',
  'Diseño Editorial/Diagramación', 'Fundamentos del Diseño/Técnicas de Representación',
  'Ilustración Digital y Diseño/Branding', 'Publicidad/Comunicación Visual', 'Dibujo Técnico Aplicado',
  'Producción Gráfica Integral', 'Desarrollo Multimedia y Web', 'Módulos Prácticos',
  'Procesos del Diseño', 'Elaboración del Arte', 'Diseño Asistido por el Ordenador', 'Arte Final'
];
var ASIGNATURAS_TALLER_PRACTICO = ASIGNATURAS_TALLER_PRACTICO_CUALQUIER_NIVEL.concat(ASIGNATURAS_TALLER_PRACTICO_BACHILLERATO);
function esAsignaturaTallerPractico(nivel, asignatura){
  if(ASIGNATURAS_TALLER_PRACTICO_CUALQUIER_NIVEL.indexOf(asignatura) !== -1) return true;
  return nivel === 'Bachillerato' && ASIGNATURAS_TALLER_PRACTICO_BACHILLERATO.indexOf(asignatura) !== -1;
}
/* Mismo criterio de "asignatura técnica" (Computación, Robótica, Diseño Gráfico práctico) pero
   aplicado a un PCA — usado para cambiar la terminología "Unidad" → "Proyecto" en Temporalización
   y Contenidos sin tocar el dato guardado (solo las etiquetas/valores por defecto de filas nuevas;
   ver renderPcaForm). */
function esPcaAsignaturaTecnica(p){
  var asig = p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura;
  return esAsignaturaTallerPractico(p.nivel, asig);
}
/* Para decidir qué mostrar en el menú lateral: si el docente tiene alguna asignatura técnica
   (Computación, Robótica, Informática Aplicada, Diseño Gráfico práctico), ve "Taller Práctico" —
   ADEMÁS de "Planes Semanales", que ven todos los docentes sin excepción. */
function tieneAsignaturaTallerPractico(docenteId){
  return misCargaRows(docenteId).some(function(r){ return esAsignaturaTallerPractico(r.nivel, r.asignatura); });
}
function misNivelesTallerPara(docenteId){
  var set = {};
  misCargaRows(docenteId).forEach(function(r){ if(esAsignaturaTallerPractico(r.nivel, r.asignatura)) set[r.nivel]=1; });
  return Object.keys(set).sort();
}
function misAsignaturasTallerPara(docenteId, nivel, especialidad, curso){
  var rows = misCargaRows(docenteId).filter(function(r){
    return r.nivel===nivel && (!especialidad || r.especialidad===especialidad) && (!curso || r.curso===curso) && esAsignaturaTallerPractico(r.nivel, r.asignatura);
  });
  var set = {};
  rows.forEach(function(r){ if(r.asignatura) set[r.asignatura]=1; });
  return Object.keys(set).sort();
}
function misCursosTallerPara(docenteId, nivel, especialidad, asignatura){
  var rows = misCargaRows(docenteId).filter(function(r){
    return r.nivel===nivel && (!especialidad || r.especialidad===especialidad) && (!asignatura || r.asignatura===asignatura) && esAsignaturaTallerPractico(r.nivel, r.asignatura);
  });
  var set = {};
  rows.forEach(function(r){ if(r.curso) set[r.curso]=1; });

}
/* ============================= SESSION ============================= */
/* La sesión la controla Firebase Auth (persistencia automática); CURRENT_UID lo mantiene
   actualizado el listener onAuthStateChanged (ver abajo, sección FIREBASE BOOTSTRAP). */
var CURRENT_UID = null;

var ES_FORMULARIO_PUBLICO = (function(){

  return Object.keys(set).sort();
}
/* "Banda A" = Iniciales a 6.º EGB (Iniciales y Preparatoria / Básica Elemental / Básica Media):
   ahí se filtra solo por asignatura. "Banda B" = 7.º EGB a 3.º Bachillerato (Básica Superior /
   Bachillerato): ahí se filtra también por curso. Se evalúa por el nivel de CADA PCA/Plan (no un
   nivel fijo del docente), porque un mismo docente puede dictar en niveles de ambas bandas. */
var NIVELES_BANDA_A = ['Iniciales y Preparatoria','Básica Elemental','Básica Media'];
function nivelEsBandaA(nivel){ return NIVELES_BANDA_A.indexOf(nivel) !== -1; }

/* "Escuela" (Inicial a 6.º EGB) vs "Colegio" (7.º EGB a 3.º Bachillerato): distinción
   administrativa aparte de "Banda A/B" de arriba — esta corta "Básica Media" a la mitad, porque
   ese nivel agrupa 5.º/6.º/7.º EGB pero 7.º ya pertenece a Colegio. Se usa solo para agrupar y
   ordenar las pestañas de Planes Semanales y Presentación de PCA en Administración. */
function esEscuelaPorNivelCurso(nivel, curso){
  if(nivel==='Iniciales y Preparatoria' || nivel==='Básica Elemental') return true;
  if(nivel==='Básica Media') return (curso||'').indexOf('7.º EGB') !== 0;
  return false;
}
/* Orden pedagógico (no alfabético) de los cursos de Escuela, para agrupar a sus docentes en ese
   orden en vez de por nombre — cada docente de Escuela suele tener un solo curso a cargo, así que
   ordenar "por docente" en la práctica es ordenar por el curso que dicta. */
var ORDEN_CURSOS_ESCUELA = CURSOS['Iniciales y Preparatoria']
  .concat(CURSOS['Básica Elemental'])
  .concat(conParalelos(['5.º EGB','6.º EGB']));
function ordenCursoEscuela(curso){
  var idx = ORDEN_CURSOS_ESCUELA.indexOf(curso);
  return idx===-1 ? ORDEN_CURSOS_ESCUELA.length : idx;
}

/* ============================= INSPECCIÓN GENERAL ============================= */
/* Jornada fija: 11 horas curriculares de 45 min desde las 07:15, con receso de 45 min
   (10:15-11:00) entre la 4.ª y la 5.ª hora. */
/* Desde las 11:00 (después del receso) las horas pasan de 45 a 40 minutos cada una. */
var PERIODOS = [
  {n:1, inicio:'07:15', fin:'08:00'},

/* Clave determinística del documento de asistencia de un curso en un día — así se puede leer

/* El curso real de un estudiante: si se registró eligiendo "Otro…", el valor que cuenta es el que

function cursoRealDe(e){ return e.curso==='Otro…' ? (e.cursoManual||'') : (e.curso||''); }
function estudiantesDe(nivel, especialidad, curso){

function cursosDeEstudiantesRegistrados(nivel, especialidad){

var TITULO_SIGLAS = {
  'licenciado':'Lic.', 'licenciada':'Lic.', 'ingeniero':'Ing.', 'ingeniera':'Ing.',
  'magister':'Mg.', 'máster':'Mg.', 'master':'Mg.', 'doctor':'Dr.', 'doctora':'Dra.',
  'profesor':'Prof.', 'profesora':'Prof.', 'tecnólogo':'Tlgo.', 'tecnóloga':'Tlga.',
  'arquitecto':'Arq.', 'arquitecta':'Arq.', 'economista':'Eco.', 'psicólogo':'Psc.', 'psicóloga':'Psc.',
  'bachiller':'Bach.', 'especialista':'Esp.'
};
/* Se compara solo la primera palabra del título (no el texto completo), porque los docentes
   suelen escribir frases como "Licenciada en Educación Básica" en vez de solo "Licenciada":
   con match exacto de la frase completa eso nunca abreviaba. */
function tituloSiglas(t){
  if(!t) return '';
  var trimmed = t.trim();
  var primeraPalabraTitulo = trimmed.split(/\s+/)[0].toLowerCase().replace(/\.$/, '');
  return TITULO_SIGLAS[primeraPalabraTitulo] || trimmed;
}
function primeraPalabra(s){ return (s||'').trim().split(/\s+/)[0] || ''; }
/* Firmas: título en siglas + un solo nombre y un solo apellido (no el nombre/apellido completo),
   para que las firmas queden cortas y consistentes en PCA y Plan Semanal. */
function nombreFormal(d){
  if(!d) return '';
  var sig = tituloSiglas(d.titulo);
  return ((sig ? sig+' ' : '') + primeraPalabra(d.nombres) + ' ' + primeraPalabra(d.apellidos)).trim();
}
function misNiveles(docenteId){

}
function misEspecialidadesPara(docenteId, nivel){

  load(LS.CARGA).filter(function(r){ return r.docenteId===docenteId && r.nivel===nivel; }).forEach(function(r){ if(r.especialidad) set[r.especialidad]=1; });

function findMiPca(docenteId, nivel, especialidad, curso, asignatura){
  return load(LS.PCA).find(function(p){

    var pCurso = p.curso==='Otro…' ? p.cursoManual : p.curso;
    if((pCurso||'')!==(curso||'')) return false;
    var pAsig = p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura;
    if((pAsig||'')!==(asignatura||'')) return false;

}
function semanasDePca(pcaId){
  if(!pcaId) return [];
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var rows = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
  var order = (pca && pca.unidadesNombres) || [];
  rows.sort(function(a,b){
    var ia = order.indexOf(a.unidad), ib = order.indexOf(b.unidad);
    if(ia!==ib) return ia-ib;
    return (a.semana||0)-(b.semana||0);
  });
  return rows;
}
/* Estado automático de la columna Observación. Un Plan Semanal solo se considera "de esta
   semana" si su fecha de inicio y fin coinciden EXACTAMENTE con las de la fila del PCA (no
   basta con que la fecha caiga dentro del rango). Una vez pasada la fecha fin, el estado
   depende de si los temas realmente vistos en los días del plan (creados por el docente)
   cubren todos los temas que el PCA planificó para esa semana: si los cubre todos → COMPLETADO,
   si falta alguno o no hay plan → CON RETRASO. No es editable manualmente: siempre refleja el
   estado actual. */
/* Busca la cobertura de temas en TODOS los planes semanales del PCA (no solo los vinculados
   exactamente a esta semana): así, si un tema pendiente de esta semana se termina marcando en
   el plan de la semana siguiente (ver temasPendientesAnteriores), esta semana también queda
   COMPLETADO — sin importar si el registro llegó tarde. */
/* Un tema/ítem de nivel de logro cuenta como "visto" si quedó marcado en CUALQUIERA de los dos
   planes que pueden registrar el avance semanal de un PCA — Plan Semanal (por día) o Taller
   Práctico (por semana de cada fase) — así un docente de Computación/Robótica/Informática
   Aplicada/Diseño que solo llena Taller Práctico (o que usa ambos planes a la vez) no ve temas
   ya cubiertos ofrecidos otra vez como pendientes, y la OBSERVACION del PCA (computeEstadoSemana)
   se calcula igual sin importar en cuál de los dos planes se registró el avance. */
function temasVistosDelPca(pcaId){
  var vistos = {};
  load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
    (s.dias||[]).forEach(function(dia){
      (dia.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
    });
  });
  load(LS.TALLER).filter(function(t){ return t.pcaId===pcaId; }).forEach(function(t){
    (t.fases||[]).forEach(function(fase){
      (fase.semanas||[]).forEach(function(sem){
        (sem.contenidos||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
      });
    });
  });
  return vistos;
}
function nivelLogroVistosDelPca(pcaId, tier){
  var campoDia = NIVEL_LOGRO_DIA_FIELD[tier];
  var vistos = {};
  load(LS.SEMANAL).filter(function(s){ return s.pcaId===pcaId; }).forEach(function(s){
    (s.dias||[]).forEach(function(dia){
      (dia[campoDia]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
    });
  });
  load(LS.TALLER).filter(function(t){ return t.pcaId===pcaId; }).forEach(function(t){
    (t.fases||[]).forEach(function(fase){
      (fase.semanas||[]).forEach(function(sem){
        (sem[campoDia]||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(t){ vistos[t]=1; });
      });
    });
  });
  return vistos;
}
function computeEstadoSemana(f, pcaId){
  var minD = f.fechaInicio || '';
  var maxD = f.fechaFin || '';
  if(!minD && !maxD) return null;

  var temasPca = parseLinesList(f.temas);
  if(temasPca.length){
    var vistos = temasVistosDelPca(pcaId);
    if(temasPca.every(function(t){ return vistos[t]; })) return 'COMPLETADO';
  }

  var today = todayISO();
  if(minD && today < minD) return 'POR COMPLETAR';
  if(maxD && today > maxD) return 'CON RETRASO';
  return 'EN PROCESO';
}
/* Temas de la semana INMEDIATAMENTE ANTERIOR del PCA que ningún Plan Semanal ni Taller Práctico
   marcó todavía — se agregan a las opciones de Contenidos Esenciales / Temas asociados a la
   práctica de la semana siguiente para que el docente pueda ponerse al día. */
function temasPendientesAnteriores(pcaId, semanaActualId){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  var anterior = semanas[idx-1];
  var temasAnt = parseLinesList(anterior.temas);
  if(!temasAnt.length) return [];
  var vistos = temasVistosDelPca(pcaId);
  return temasAnt.filter(function(t){ return !vistos[t]; });
}
/* Para el botón "Replanificar": a diferencia de temasPendientesAnteriores (que solo trae lo que
   NUNCA se marcó), esta devuelve TODOS los temas de la semana anterior del PCA, ya se hayan
   cubierto o no — para que el docente pueda elegir reforzar algo aunque ya se haya visto. */
function temasSemanaAnteriorCompleta(pcaId, semanaActualId){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  return parseLinesList(semanas[idx-1].temas);
}
/* Campo del PCA (destreza=Básico) y del día del Plan Semanal / semana del Taller Práctico donde
   vive cada nivel de logro — compartido por temasPendientesAnteriores-equivalente y por ambos
   formularios. */
var NIVEL_LOGRO_PCA_FIELD = {basico:'destreza', intermedio:'nivelLogroIntermedio', avanzado:'nivelLogroAvanzado'};
/* Igual que temasPendientesAnteriores, pero para los ítems de Nivel de Logro (Básico/Intermedio/
   Avanzado) de la semana INMEDIATAMENTE ANTERIOR del PCA que ningún Plan Semanal ni Taller
   Práctico marcó todavía: se ofrecen como pendientes en la semana siguiente para que no se
   pierdan de vista. */
function nivelLogroPendientesAnteriores(pcaId, semanaActualId, tier){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  var anterior = semanas[idx-1];
  var itemsAnt = parseLinesList(anterior[NIVEL_LOGRO_PCA_FIELD[tier]]);
  if(!itemsAnt.length) return [];
  var vistos = nivelLogroVistosDelPca(pcaId, tier);
  return itemsAnt.filter(function(t){ return !vistos[t]; });
}
/* Para "Replanificar": TODOS los ítems de Nivel de Logro de la semana anterior del PCA, ya se
   hayan marcado o no (ver temasSemanaAnteriorCompleta). */
function nivelLogroSemanaAnteriorCompleta(pcaId, semanaActualId, tier){
  var semanas = semanasDePca(pcaId);
  var idx = semanas.findIndex(function(r){ return r.id===semanaActualId; });
  if(idx <= 0) return [];
  return parseLinesList(semanas[idx-1][NIVEL_LOGRO_PCA_FIELD[tier]]);
}

/* ============================= TOAST ============================= */
function toast(msg, type){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3600);
}
/* Toast con botón "Deshacer": igual que toast() pero se queda más tiempo (8s en vez de 3.6s) y
   ofrece un botón que ejecuta onDeshacer() una sola vez. Usado por eliminarConDeshacer para que
   cualquier "Eliminar" del sistema pueda revertirse justo después de confirmarse. */
/* ============================= DETECCIÓN DE CONFLICTOS AL GUARDAR =============================
   Si el mismo PCA/Plan Semanal se abre en dos pestañas o dispositivos a la vez, el que guarda
   último pisaba en silencio lo que el otro ya había guardado — sin ningún aviso. Para evitarlo,
   se recuerda el updatedAt que tenía el registro justo cuando se ABRIÓ el formulario; al guardar,
   si el updatedAt actual en la nube ya no coincide con ese (porque alguien más guardó algo en el
   mientras tanto — el listener en tiempo real ya trajo ese cambio a esta misma pestaña), se avisa
   antes de sobrescribir en vez de hacerlo directamente. */
var CONFLICTO_BASE = {};
function marcarBaseConflicto(tipo, updatedAt){ CONFLICTO_BASE[tipo] = updatedAt || ''; }
function hayConflictoGuardado(tipo, updatedAtActual){
  var base = CONFLICTO_BASE[tipo];
  return !!base && !!updatedAtActual && updatedAtActual !== base;
}
function avisarConflictoGuardado(tipo, updatedAtActual, onSobrescribir){
  confirmDialog(
    'Este plan fue modificado en otro dispositivo o pestaña después de que lo abriste aquí (última actualización: ' + fmtDateTime(updatedAtActual) + '). Si continúas, vas a reemplazar esos cambios con lo que tienes en esta pantalla ahora mismo. Si no estás seguro, cancela y recarga la página para revisar la versión más reciente antes de seguir editando.',
    onSobrescribir,
    'Sobrescribir de todas formas'
  );
}
function toastConDeshacer(msg, onDeshacer){
  var region = document.getElementById('toastRegion');
  var el = document.createElement('div');
  el.className = 'toast toast-undo';
  el.innerHTML = '<span></span><button type="button" class="toast-undo-btn">Deshacer</button>';
  el.querySelector('span').textContent = msg;
  region.appendChild(el);
  var timer = setTimeout(function(){ el.remove(); }, 8000);
  el.querySelector('.toast-undo-btn').onclick = function(){
    clearTimeout(timer);
    el.remove();
    onDeshacer();
  };
}
/* ============================= PAPELERA =============================
   Cada eliminación (individual o en cascada) queda registrada aquí ANTES de borrarse de verdad,
   para que un administrador pueda restaurarla después — no solo durante los 8 segundos del toast
   "Deshacer". Un solo documento de papelera puede agrupar VARIOS bloques de VARIAS colecciones
   (p.ej. un PCA + sus filas de Contenidos), para que restaurar sea una sola acción atómica. La
   purga definitiva (pasados PAPELERA_DIAS_RETENCION días) es oportunista: se revisa cada vez que
   un admin abre la pantalla de Papelera, no hay una tarea de fondo en el servidor. */
var PAPELERA_DIAS_RETENCION = 7;
var PAPELERA_COLECCION_LABEL = {
  PCA:'Plan Curricular (PCA)', CONT:'Semana del PCA', SEMANAL:'Plan Semanal', TALLER:'Taller Práctico', ESTUDIANTES:'Estudiante',
  CARGA:'Carga Horaria', INCIDENTES:'Incidente de disciplina', OBSERVACIONES:'Observación de clase',
  DECE:'Ficha de Datos Informativos (DECE)', FICHA_DETECCION:'Ficha de Detección', DOCENTES:'Docente'
};
function resumenPapelera(bloques){
  var primero = bloques[0];
  var r = primero && primero.registros && primero.registros[0];
  var etiqueta = PAPELERA_COLECCION_LABEL[primero.key] || primero.key;
  if(!r) return etiqueta;
  var detalle;
  if(r.nombres && r.apellidos) detalle = r.apellidos + ' ' + r.nombres;
  else if(r.numero!==undefined && (r.curso || r.asignatura)) detalle = 'N.º ' + r.numero + ' · ' + (r.asignatura||'') + (r.curso?(' · '+r.curso):'');
  else if(r.asignatura || r.curso) detalle = ((r.asignatura==='Otra…'?r.asignaturaManual:r.asignatura)||'') + (r.curso ? (' · ' + (r.curso==='Otro…'?r.cursoManual:r.curso)) : '');
  else if(r.titulo) detalle = r.titulo;
  else detalle = r.id;
  var extra = bloques.length>1 ? (' (+' + bloques.slice(1).reduce(function(n,b){ return n+b.registros.length; },0) + ' registro(s) relacionado(s))') : '';
  return etiqueta + ' — ' + detalle + extra;
}
function moverAPapelera(bloques, motivo){
  var d = currentDocente();
  var entrada = {
    id: uid('trash'), bloques: bloques, resumen: resumenPapelera(bloques), motivo: motivo||'',
    eliminadoPor: d.id, eliminadoPorNombre: nombreFormal(d), eliminadoEn: nowISO()
  };
  save(LS.PAPELERA, load(LS.PAPELERA).concat([entrada]));
  return entrada.id;
}
function quitarDePapelera(trashId){
  save(LS.PAPELERA, load(LS.PAPELERA).filter(function(x){ return x.id!==trashId; }));
}
/* Trae de vuelta TODOS los bloques de una entrada de papelera (todas las colecciones que tocó esa
   eliminación) y la quita de la papelera. Usada tanto por "Deshacer" del toast como por el botón
   "Restaurar" de la propia pantalla de Papelera. */
function restaurarDePapelera(trashId){
  var entrada = load(LS.PAPELERA).find(function(x){ return x.id===trashId; });
  if(!entrada) return;
  entrada.bloques.forEach(function(b){
    var actuales = load(b.key);
    var actualesIds = {}; actuales.forEach(function(x){ actualesIds[x.id]=1; });
    var faltantes = b.registros.filter(function(r){ return !actualesIds[r.id]; });
    if(faltantes.length) save(b.key, actuales.concat(faltantes));
  });
  quitarDePapelera(trashId);
}
/* ============================= ELIMINAR CON DESHACER =============================
   Envoltorio genérico para CUALQUIER botón "Eliminar" de una sola colección: guarda el registro
   completo antes de borrarlo (en la papelera, no solo en memoria) y ofrece deshacerlo desde el
   toast (ver toastConDeshacer). Se usa en lugar de escribir save(KEY, load(KEY).filter(...))
   directamente en cada sitio, así que cualquier eliminación individual del sistema queda
   protegida por la papelera automáticamente, sin tener que tocar cada botón "Eliminar" uno por
   uno. */
function eliminarConDeshacer(key, id, mensajeEliminado, mensajeDeshecho){
  var registro = load(key).find(function(x){ return x.id===id; });
  if(!registro) return;
  save(key, load(key).filter(function(x){ return x.id!==id; }));
  var trashId = moverAPapelera([{key:key, registros:[registro]}]);
  toastConDeshacer(mensajeEliminado, function(){
    restaurarDePapelera(trashId);
    toast(mensajeDeshecho || 'Se deshizo la eliminación.', 'success');
  });
}
/* Igual que eliminarConDeshacer, pero para un borrado en cascada que toca VARIAS colecciones a la
   vez (p.ej. eliminar un docente y todos sus datos). Recibe una lista de {key, registros} ya
   capturados ANTES de borrar nada. */
function eliminarVariasConDeshacer(bloques, mensajeEliminado, mensajeDeshecho){
  bloques.forEach(function(b){
    var ids = b.ids || b.registros.map(function(r){ return r.id; });
    save(b.key, load(b.key).filter(function(x){ return ids.indexOf(x.id)===-1; }));
  });
  var trashId = moverAPapelera(bloques.map(function(b){ return {key:b.key, registros:b.registros}; }));
  toastConDeshacer(mensajeEliminado, function(){
    restaurarDePapelera(trashId);
    toast(mensajeDeshecho || 'Se deshizo la eliminación.', 'success');
  });
}

/* Autoguardado del PCA, Plan Semanal y Ficha de Detección: guarda en silencio (sin el toast de
   guardado manual) cada 5 minutos EXACTOS mientras haya cambios sin guardar — no antes, aunque
   el docente siga escribiendo — así el guardado nunca interrumpe mientras redacta. El reloj de
   5 minutos arranca con el primer cambio y sigue corriendo de fondo aunque agregue más cambios
   mientras tanto (no se reinicia con cada tecla); se detiene solo al salir del formulario. */
var AUTOSAVE_INTERVALO_MS = 5 * 60 * 1000;
var AUTOSAVE_SUCIO = {};
var AUTOSAVE_INTERVALS = {};
/* Marca de tiempo del último autoguardado exitoso por tipo ('pca'/'semanal'/'fichadeteccion'),
   usada para decidir si el indicador debe mostrarse (en vez de manipular el DOM directamente):
   guardar y volver a leer el texto en cada render hace que el indicador sobreviva al re-render
   que dispara el propio guardado (el listener en tiempo real del PCA/Plan Semanal vuelve a pintar
   la barra de herramientas apenas Firestore confirma el cambio, y eso borraba el texto si se
   ponía "a mano"). */
var AUTOSAVE_ULTIMO = {};
function marcarAutoguardadoPendiente(tipo){
  AUTOSAVE_SUCIO[tipo] = true;
  if(AUTOSAVE_INTERVALS[tipo]) return;
  AUTOSAVE_INTERVALS[tipo] = setInterval(function(){
    if(!AUTOSAVE_SUCIO[tipo]) return;
    ejecutarAutoguardado(tipo);
  }, AUTOSAVE_INTERVALO_MS);
}
function detenerAutoguardado(tipo){
  if(AUTOSAVE_INTERVALS[tipo]){ clearInterval(AUTOSAVE_INTERVALS[tipo]); AUTOSAVE_INTERVALS[tipo] = null; }
  AUTOSAVE_SUCIO[tipo] = false;
}
function detenerTodosLosAutoguardados(){
  Object.keys(AUTOSAVE_INTERVALS).forEach(detenerAutoguardado);
}
function ejecutarAutoguardado(tipo){
  AUTOSAVE_SUCIO[tipo] = false;
  if(tipo==='pca' && state.editingPca) savePca(state.editingPca, true);
  else if(tipo==='semanal' && state.editingSemanal) saveSemanal(state.editingSemanal, true);
  else if(tipo==='taller' && state.editingTaller) saveTaller(state.editingTaller, true);
  else if(tipo==='fichadeteccion' && state.editingFichaDeteccion) saveFichaDeteccion(state.editingFichaDeteccion, true);
  AUTOSAVE_ULTIMO[tipo] = Date.now();
  actualizarIndicadorAutoguardado(tipo);
  setTimeout(function(){ actualizarIndicadorAutoguardado(tipo); }, 6200);
}
function autoguardadoHintTexto(tipo){
  var ts = AUTOSAVE_ULTIMO[tipo];
  if(!ts || Date.now() - ts > 6000) return '';
  return '✓ Guardado automáticamente · ' + fmtDateTime(new Date(ts).toISOString());
}
var AUTOSAVE_HINT_ID = {pca:'pcaAutosaveHint', semanal:'semanalAutosaveHint', taller:'tallerAutosaveHint', fichadeteccion:'fdAutosaveHint'};
function actualizarIndicadorAutoguardado(tipo){
  var el = document.getElementById(AUTOSAVE_HINT_ID[tipo]);
  if(el) el.textContent = autoguardadoHintTexto(tipo);
}
/* Escucha "input"/"change" delegado en todo el documento del formulario (burbujea desde
   cualquier campo, RTE incluido) en vez de engancharse campo por campo — así cualquier campo
   nuevo que se agregue queda cubierto automáticamente. */
function bindAutoguardadoDelegado(contenedorId, tipo){
  var contenedor = document.getElementById(contenedorId);
  if(!contenedor) return;
  ['input','change'].forEach(function(evt){
    contenedor.addEventListener(evt, function(){ marcarAutoguardadoPendiente(tipo); });
  });
}

/* Native confirm()/alert() are commonly blocked (or silently return false) inside the
   Artifact's sandboxed iframe — the same category of restriction that already required
   special handling for downloads and window.print(). This custom modal replaces every
   confirm() call in the app so delete actions actually work in that environment. */
function confirmDialog(message, onConfirm, okLabel){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-box"><p>' + escapeHtml(message) + '</p><div class="confirm-actions"><button class="btn btn-ghost btn-sm" id="confirmCancelBtn">Cancelar</button><button class="btn btn-sm" id="confirmOkBtn" style="background:var(--red-600); color:#fff;">' + escapeHtml(okLabel || 'Eliminar') + '</button></div></div>';
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('#confirmCancelBtn').onclick = close;
  overlay.querySelector('#confirmOkBtn').onclick = function(){ close(); onConfirm(); };
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* Same rationale as confirmDialog: native prompt() is blocked in the sandboxed iframe, so the
   RTE "insertar enlace" button needs a custom replacement too. */
function promptDialog(message, defaultValue, onSubmit){
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  var box = document.createElement('div');
  box.className = 'confirm-box';
  var p = document.createElement('p');
  p.textContent = message;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input';
  input.value = defaultValue || '';
  input.style.marginBottom = '14px';
  var actions = document.createElement('div');
  actions.className = 'confirm-actions';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost btn-sm';
  cancelBtn.textContent = 'Cancelar';
  var okBtn = document.createElement('button');
  okBtn.className = 'btn btn-primary btn-sm';
  okBtn.textContent = 'Aceptar';
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  input.focus();
  input.select();
  function close(){ overlay.remove(); }
  cancelBtn.onclick = close;
  okBtn.onclick = function(){ var v = input.value.trim(); close(); if(v) onSubmit(v); };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); okBtn.click(); } });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
}

/* Orientación de impresión dinámica: en vez de depender de "páginas con nombre" de CSS (soporte
   real de Chrome poco fiable para además ajustar el ANCHO del contenido, no solo el tamaño de
   papel — eso era la causa de las tablas angostas con espacio en blanco a la derecha), se
   reescribe la única regla @page justo antes de imprimir, según el tipo de documento visible en
   pantalla: los formularios del DECE, Observación de Clases, reportes y manuales van en A4
   vertical; PCA y Plan Semanal (documentos anchos de varias columnas) siguen en A4 horizontal. */
var PRINT_STYLE_EL = null;
function aplicarOrientacionImpresion(){
  var esVertical = !!document.querySelector('.dece-doc, .obs-doc, .manual-doc, .insp-report-doc');
  if(!PRINT_STYLE_EL){
    PRINT_STYLE_EL = document.createElement('style');
    document.head.appendChild(PRINT_STYLE_EL);
  }
  PRINT_STYLE_EL.textContent = esVertical
    ? '@media print{ @page{ size: A4 portrait; margin: 18mm; } }'
    : '@media print{ @page{ size: A4 landscape; margin: 14mm; } }';
}
function printAsPdf(){
  aplicarOrientacionImpresion();
  window.print();
}
