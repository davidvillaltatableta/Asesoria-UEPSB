/* --- Inspección · Asistencia --- */
function blankAsistenciaDoc(nivel, especialidad, curso, fecha){
  return { id: asistenciaDocId(nivel,especialidad,curso,fecha), nivel:nivel, especialidad:especialidad||'', curso:curso, fecha:fecha, periodos:{}, justificativos:{}, registradoPor:'', updatedAt:'' };
}
function renderInspAsistencia(){
  var f = state.inspAsisFiltro || (state.inspAsisFiltro = {nivel:'', especialidad:'', curso:'', fecha: todayISO()});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosFor(f.nivel, f.especialidad);
  return ''
  + '<div class="card">'
  + '  <h2>Tomar / revisar asistencia</h2>'
  + '  <div class="field-row">'
  + '    <div class="field"><label>Nivel</label><select class="cell-select" id="iaNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
  + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="iaEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
  + '  </div>'
  + '  <div class="field-row">'
  + '    <div class="field"><label>Curso</label><select class="cell-select" id="iaCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
  + '    <div class="field"><label>Fecha</label><input class="cell-input" type="date" id="iaFecha" value="'+escapeHtml(f.fecha)+'" /></div>'
  + '  </div>'
  + '</div>'
  + '<div id="asistenciaResultWrap">' + asistenciaResultHtml() + '</div>';
}
function asistenciaResultHtml(){
  var f = state.inspAsisFiltro;
  if(!f.nivel || !f.curso || !f.fecha) return '<div class="hint" style="margin-top:14px;">Elige nivel, curso y fecha para ver o tomar la asistencia.</div>';
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  if(!estudiantes.length) return '<div class="hint" style="margin-top:14px;">No hay estudiantes activos registrados en este curso. Ve a la pestaña "Estudiantes" para registrarlos.</div>';
  var docId = asistenciaDocId(f.nivel, f.especialidad, f.curso, f.fecha);
  if(!state.editingAsistencia || state.editingAsistencia.id !== docId){
    var existing = load(LS.ASISTENCIA).find(function(x){ return x.id === docId; });
    state.editingAsistencia = existing
      ? Object.assign({}, existing, {periodos: JSON.parse(JSON.stringify(existing.periodos||{})), justificativos: JSON.parse(JSON.stringify(existing.justificativos||{}))})
      : blankAsistenciaDoc(f.nivel, f.especialidad, f.curso, f.fecha);
  }
  var a = state.editingAsistencia;
  var headCells = PERIODOS.map(function(p){ return '<th class="tabular" title="'+p.inicio+' – '+p.fin+'">H'+p.n+'</th>'; }).join('');
  var rows = estudiantes.map(function(e){
    var cells = PERIODOS.map(function(p){
      var val = (a.periodos[p.n] && a.periodos[p.n][e.id]) || '';
      return '<td class="tabular"><button type="button" class="asis-cell asis-'+(val||'na')+'" data-asis-cell="'+p.n+'|'+e.id+'">'+(val||'·')+'</button></td>';
    }).join('');
    var just = a.justificativos[e.id];
    return '<tr><td>' + escapeHtml(e.apellidos) + ' ' + escapeHtml(e.nombres) + '</td>' + cells + '<td style="text-align:center;"><input type="checkbox" class="asis-just-cb" data-asis-just="'+e.id+'" '+(just&&just.recibido?'checked':'')+' /></td></tr>';
  }).join('');
  return ''
  + '<div class="card" style="margin-top:16px;">'
  + '  <h2>Asistencia · ' + escapeHtml(f.curso==='Otro…'?'':f.curso) + ' · ' + fmtDate(f.fecha) + '</h2>'
  + '  <div class="card-sub">Haz clic en cada celda para cambiar el estado: sin marcar → P (presente) → A (atraso) → F (falta). Receso ' + RECESO.inicio + '–' + RECESO.fin + ' (entre H4 y H5).</div>'
  + '  <div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th>Estudiante</th>' + headCells + '<th>Justif.</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  <div style="display:flex; gap:10px; margin-top:14px; align-items:center;">'
  + '    <button class="btn btn-ghost btn-sm" id="btnAsisTodosPresentes">Marcar todos Presente</button>'
  + '    <div class="spacer"></div>'
  + '    <button class="btn btn-primary" id="btnGuardarAsistencia">Guardar asistencia</button>'
  + '  </div>'
  + '</div>';
}
function renderAsistenciaResultOnly(){
  document.getElementById('asistenciaResultWrap').innerHTML = asistenciaResultHtml();
  bindAsistenciaResultEvents();
}
function bindInspAsistenciaEvents(){
  var f = state.inspAsisFiltro;
  var nivelSel = document.getElementById('iaNivel');
  if(nivelSel) nivelSel.onchange = function(e){ f.nivel=e.target.value; f.especialidad=''; f.curso=''; state.editingAsistencia=null; render(); };
  var espSel = document.getElementById('iaEspecialidad');
  if(espSel) espSel.onchange = function(e){ f.especialidad=e.target.value; f.curso=''; state.editingAsistencia=null; render(); };
  var cursoSel = document.getElementById('iaCurso');
  if(cursoSel) cursoSel.onchange = function(e){ f.curso=e.target.value; state.editingAsistencia=null; render(); };
  var fechaInp = document.getElementById('iaFecha');
  if(fechaInp) fechaInp.onchange = function(e){ f.fecha=e.target.value; state.editingAsistencia=null; render(); };
  bindAsistenciaResultEvents();
}
function bindAsistenciaResultEvents(){
  var f = state.inspAsisFiltro;
  var a = state.editingAsistencia;
  if(!a) return;
  document.querySelectorAll('[data-asis-cell]').forEach(function(btn){
    btn.onclick = function(){
      var parts = btn.getAttribute('data-asis-cell').split('|');
      var periodo = parts[0], estId = parts[1];
      var cur = (a.periodos[periodo] && a.periodos[periodo][estId]) || '';
      var next = cur==='' ? 'P' : (cur==='P' ? 'A' : (cur==='A' ? 'F' : ''));
      a.periodos[periodo] = a.periodos[periodo] || {};
      if(next===''){ delete a.periodos[periodo][estId]; } else { a.periodos[periodo][estId] = next; }
      renderAsistenciaResultOnly();
    };
  });
  document.querySelectorAll('.asis-just-cb').forEach(function(cb){
    cb.onchange = function(){
      var estId = cb.getAttribute('data-asis-just');
      a.justificativos[estId] = a.justificativos[estId] || {};
      a.justificativos[estId].recibido = cb.checked;
    };
  });
  var todosBtn = document.getElementById('btnAsisTodosPresentes');
  if(todosBtn) todosBtn.onclick = function(){
    var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
    PERIODOS.forEach(function(p){
      a.periodos[p.n] = a.periodos[p.n] || {};
      estudiantes.forEach(function(e){ a.periodos[p.n][e.id] = 'P'; });
    });
    renderAsistenciaResultOnly();
  };
  var saveBtn = document.getElementById('btnGuardarAsistencia');
  if(saveBtn) saveBtn.onclick = function(){
    var d = currentDocente();
    var toSave = Object.assign({}, a, {registradoPor: d.id, updatedAt: nowISO()});
    var all = load(LS.ASISTENCIA).filter(function(x){ return x.id!==toSave.id; });
    save(LS.ASISTENCIA, all.concat([toSave]));
    toast('Asistencia guardada.', 'success');
  };
}

function bindInspDisciplinaEvents(){
  document.querySelectorAll('[data-discsub]').forEach(function(btn){

  else bindInspIncidentesListaEvents();
}
function bindInspIncidentesListaEvents(){
  var newBtn = document.getElementById('btnNuevoIncidente');
  if(newBtn) newBtn.onclick = function(){
    state.editingIncidente = blankIncidente(state.inspDiscTab==='personal' ? 'Personal' : 'Estudiante');
    state.inspDiscView = 'form';
    render();
  };
  document.querySelectorAll('[data-inc-edit]').forEach(function(btn){
    btn.onclick = function(){
      var target = load(LS.INCIDENTES).find(function(x){ return x.id===btn.getAttribute('data-inc-edit'); });

function bindInspIncidenteFormEvents(){
  var i = state.editingIncidente;
  document.getElementById('incFecha').oninput = function(e){ i.fecha = e.target.value; };
  document.getElementById('incHora').oninput = function(e){ i.hora = e.target.value; };
  var pn = document.getElementById('incPersonalNombre'); if(pn) pn.oninput = function(e){ i.personalNombre = e.target.value; };
  var pc = document.getElementById('incPersonalCargo'); if(pc) pc.oninput = function(e){ i.personalCargo = e.target.value; };
  var es = document.getElementById('incEstudiante'); if(es) es.onchange = function(e){ i.estudianteId = e.target.value; };
  document.getElementById('incTipoFalta').onchange = function(e){ i.tipoFalta = e.target.value; };
  document.getElementById('incCategoria').onchange = function(e){ i.categoria = e.target.value; render(); };
  var cm = document.getElementById('incCategoriaManual'); if(cm) cm.oninput = function(e){ i.categoriaManual = e.target.value; };
  document.getElementById('incCitacion').onchange = function(e){ i.citacionRepresentante = e.target.checked; };
  var dece = document.getElementById('incDece'); if(dece) dece.onchange = function(e){ i.derivadoDece = e.target.checked; };
  document.getElementById('incEstado').onchange = function(e){ i.estado = e.target.value; };
  document.querySelectorAll('.rte-editable').forEach(function(el){
    var key = el.getAttribute('data-rte-field');
    el.addEventListener('input', function(){ i[key] = el.innerHTML; });
  });
  bindRteToolbars(document.querySelector('.card'));
  document.getElementById('btnAddNota').onclick = function(){
    var input = document.getElementById('incNuevaNota');
    var v = (input.value||'').trim();
    if(!v) return;
    i.bitacora = i.bitacora || [];
    i.bitacora.push({fecha: todayISO(), nota: v});
    render();
  };
  document.getElementById('btnGuardarIncidente').onclick = doSaveIncidente;
  document.getElementById('btnCancelarIncidente').onclick = function(){ state.editingIncidente=null; state.inspDiscView='lista'; render(); };
  var delBtn = document.getElementById('btnEliminarIncidente');
  if(delBtn) delBtn.onclick = function(){
    confirmDialog('¿Eliminar este incidente? Esta acción no se puede deshacer.', function(){
      save(LS.INCIDENTES, load(LS.INCIDENTES).filter(function(x){ return x.id!==i.id; }));
      state.editingIncidente=null; state.inspDiscView='lista'; render();
      toast('Incidente eliminado.', 'success');
    });
  };
}
function doSaveIncidente(){
  var i = state.editingIncidente;
  var errEl = document.getElementById('incError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');
  if(!i.fecha) return fail('Elige la fecha del incidente.');
  if(i.tipoInvolucrado==='Personal' && !(i.personalNombre||'').trim()) return fail('Escribe el nombre de la persona.');
  if(i.tipoInvolucrado==='Estudiante' && !i.estudianteId) return fail('Elige el estudiante.');
  var d = currentDocente();
  var toSave = Object.assign({}, i, {
    descripcion: sanitizeRte(i.descripcion), accionTomada: sanitizeRte(i.accionTomada),
    registradoPor: i.registradoPor || d.id, updatedAt: nowISO(), createdAt: i.createdAt || nowISO()
  });
  var all = load(LS.INCIDENTES);
  var exists = all.some(function(x){ return x.id===i.id; });
  save(LS.INCIDENTES, exists ? all.map(function(x){ return x.id===i.id?toSave:x; }) : all.concat([toSave]));
  state.editingIncidente=null; state.inspDiscView='lista'; render();
  toast('Incidente guardado correctamente.', 'success');
}

function repFirmaInspeccion(){
  return '<div class="signature-grid" style="grid-template-columns:1fr; max-width:320px;">'
       + '  <div class="signature-box"><div class="role">Elaborado por</div><div style="font-weight:700; font-size:14px;">Inspección General</div></div>'
       + '</div>';
}
function renderInspReportes(){
  var tipo = state.inspReportTipo || 'diaria';
  var selectorHtml = ''
    + '<div class="card no-print">'
    + '  <h2>Reportes</h2>'
    + '  <div class="field"><label>Tipo de reporte</label><select class="cell-select" id="repTipo" style="max-width:380px;">' + INSP_REPORT_TIPOS.map(function(t){ return '<option value="'+t.key+'" '+(t.key===tipo?'selected':'')+'>'+escapeHtml(t.label)+'</option>'; }).join('') + '</select></div>'
    + '</div>';
  var body;
  if(tipo==='semanal') body = renderRepSemanal();
  else if(tipo==='individual') body = renderRepIndividual();
  else if(tipo==='mensual') body = renderRepMensual();
  else if(tipo==='incidentes') body = renderRepIncidentes();
  else body = renderRepDiaria();
  return selectorHtml + body;
}
function bindInspReportesEvents(){
  document.getElementById('repTipo').onchange = function(e){ state.inspReportTipo = e.target.value; render(); };
  var tipo = state.inspReportTipo || 'diaria';
  if(tipo==='semanal') bindRepSemanalEvents();
  else if(tipo==='individual') bindRepIndividualEvents();
  else if(tipo==='mensual') bindRepMensualEvents();
  else if(tipo==='incidentes') bindRepIncidentesEvents();
  else bindRepDiariaEvents();
}
function renderRepDiaria(){
  var f = state.repDiariaFiltro || (state.repDiariaFiltro = {nivel:'', especialidad:'', curso:'', fecha: todayISO()});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosFor(f.nivel, f.especialidad);
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Nivel</label><select class="cell-select" id="rdNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="rdEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
    + '  </div>'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Curso</label><select class="cell-select" id="rdCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Fecha</label><input class="cell-input" type="date" id="rdFecha" value="'+escapeHtml(f.fecha)+'" /></div>'
    + '  </div>'
    + '</div>';
  if(!f.nivel || !f.curso || !f.fecha) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  var docId = asistenciaDocId(f.nivel, f.especialidad, f.curso, f.fecha);
  var a = load(LS.ASISTENCIA).find(function(x){ return x.id===docId; }) || {periodos:{}};
  var headCells = PERIODOS.map(function(p){ return '<th class="tabular">H'+p.n+'</th>'; }).join('');
  var rows = estudiantes.map(function(e){
    var tot = {P:0,A:0,F:0};
    var cells = PERIODOS.map(function(p){
      var val = (a.periodos[p.n] && a.periodos[p.n][e.id]) || '';
      if(val) tot[val]++;
      return '<td class="tabular">' + (val||'—') + '</td>';
    }).join('');
    return '<tr><td>' + escapeHtml(e.apellidos) + ' ' + escapeHtml(e.nombres) + '</td>' + cells + '<td class="tabular">' + tot.P + '</td><td class="tabular">' + tot.A + '</td><td class="tabular">' + tot.F + '</td></tr>';

  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepDiaria">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repDiariaDoc">'
  + repInstitucionalHead('Reporte de Asistencia Diaria')
  + '  <div class="pca-section">'
  + '    <div class="grid-2"><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(f.nivel + (f.especialidad?' · '+f.especialidad:'') + ' · ' + f.curso)+'" /></div><div class="field"><label>Fecha</label><input class="cell-input" readonly value="'+escapeHtml(fmtDateLargo(f.fecha)||fmtDate(f.fecha))+'" /></div></div>'
  + '    <div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th>Estudiante</th>' + headCells + '<th>P</th><th>A</th><th>F</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  </div>'

  + '</div>';

var DIAS_SEMANA_CORTOS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
function renderRepSemanal(){
  var f = state.repSemanalFiltro || (state.repSemanalFiltro = {nivel:'', especialidad:'', curso:'', fechaInicio:''});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosFor(f.nivel, f.especialidad);
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Nivel</label><select class="cell-select" id="rsNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="rsEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
    + '  </div>'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Curso</label><select class="cell-select" id="rsCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Semana del (lunes)</label><input class="cell-input" type="date" id="rsFechaInicio" value="'+escapeHtml(f.fechaInicio)+'" /></div>'
    + '  </div>'
    + '</div>';
  if(!f.nivel || !f.curso || !f.fechaInicio) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  var dias = [0,1,2,3,4].map(function(i){ return addDays(f.fechaInicio, i); });
  var docsPorDia = dias.map(function(fecha){
    var docId = asistenciaDocId(f.nivel, f.especialidad, f.curso, fecha);
    return load(LS.ASISTENCIA).find(function(x){ return x.id===docId; }) || {periodos:{}};
  });
  var headCells = dias.map(function(fecha,i){ return '<th>' + DIAS_SEMANA_CORTOS[i] + '<br>' + fmtDate(fecha) + '</th>'; }).join('');
  var rows = estudiantes.map(function(e){
    var totSemana = {P:0,A:0,F:0};
    var cells = docsPorDia.map(function(a){
      var tot = {P:0,A:0,F:0};
      PERIODOS.forEach(function(p){
        var val = a.periodos[p.n] && a.periodos[p.n][e.id];
        if(val){ tot[val]++; totSemana[val]++; }
      });
      var hayIncidencia = (tot.A+tot.F) > 0;
      return '<td class="tabular"' + (hayIncidencia ? ' style="background:var(--gold-100); font-weight:700;"' : '') + '>' + tot.P + '/' + tot.A + '/' + tot.F + '</td>';
    }).join('');
    return '<tr><td>' + escapeHtml(e.apellidos) + ' ' + escapeHtml(e.nombres) + '</td>' + cells + '<td class="tabular">' + totSemana.P + '/' + totSemana.A + '/' + totSemana.F + '</td></tr>';
  }).join('') || '<tr><td colspan="7" class="hint">No hay estudiantes en este curso.</td></tr>';
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepSemanal">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repSemanalDoc">'
  + repInstitucionalHead('Reporte de Asistencia Semanal')
  + '  <div class="pca-section">'
  + '    <div class="grid-2"><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(f.nivel + (f.especialidad?' · '+f.especialidad:'') + ' · ' + f.curso)+'" /></div><div class="field"><label>Semana</label><input class="cell-input" readonly value="'+escapeHtml(fmtDate(dias[0])+' al '+fmtDate(dias[4]))+'" /></div></div>'
  + '    <div class="hint" style="margin:8px 0;">Cada celda muestra Presente/Atraso/Falta del día (sumando las 11 horas curriculares). Las celdas resaltadas tuvieron al menos un atraso o falta.</div>'
  + '    <div class="table-wrap" style="margin-top:8px;"><table><thead><tr><th>Estudiante</th>' + headCells + '<th>Total semana</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  </div>'
  + repFirmaInspeccion()
  + '</div>';
}

  var f = state.repSemanalFiltro;
  var nivelSel = document.getElementById('rsNivel'); if(nivelSel) nivelSel.onchange = function(e){ f.nivel=e.target.value; f.especialidad=''; f.curso=''; render(); };
  var espSel = document.getElementById('rsEspecialidad'); if(espSel) espSel.onchange = function(e){ f.especialidad=e.target.value; f.curso=''; render(); };

function renderRepIndividual(){
  var f = state.repIndividualFiltro || (state.repIndividualFiltro = {estudianteId:'', fechaInicio:'', fechaFin: todayISO()});
  var estudiantes = load(LS.ESTUDIANTES).slice().sort(function(a,b){ return (a.apellidos+a.nombres).localeCompare(b.apellidos+b.nombres); });
  var estOpts = '<option value="">Elija un elemento…</option>' + estudiantes.map(function(e){
    return '<option value="'+e.id+'" '+(f.estudianteId===e.id?'selected':'')+'>'+escapeHtml(e.apellidos+' '+e.nombres)+'</option>';
  }).join('');
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field"><label>Estudiante</label><select class="cell-select" id="riEstudiante">' + estOpts + '</select></div>'
    + '  <div class="field-row" style="margin-top:8px;"><div class="field"><label>Desde</label><input class="cell-input" type="date" id="riInicio" value="'+escapeHtml(f.fechaInicio)+'" /></div><div class="field"><label>Hasta</label><input class="cell-input" type="date" id="riFin" value="'+escapeHtml(f.fechaFin)+'" /></div></div>'
    + '</div>';
  if(!f.estudianteId) return selHtml;
  var e = estudiantes.find(function(x){ return x.id===f.estudianteId; });
  if(!e) return selHtml;
  var docs = load(LS.ASISTENCIA).filter(function(a){
    return a.nivel===e.nivel && (a.especialidad||'')===(e.especialidad||'') && a.curso===e.curso
      && (!f.fechaInicio || a.fecha >= f.fechaInicio) && (!f.fechaFin || a.fecha <= f.fechaFin);
  }).sort(function(a,b){ return a.fecha.localeCompare(b.fecha); });
  var totales = {P:0,A:0,F:0};
  var filas = [];
  docs.forEach(function(a){
    var marcasDia = [];
    PERIODOS.forEach(function(p){
      var val = a.periodos[p.n] && a.periodos[p.n][e.id];
      if(val){ totales[val]++; if(val!=='P') marcasDia.push('H'+p.n+':'+val); }
    });
    if(marcasDia.length) filas.push('<tr><td class="tabular">'+fmtDate(a.fecha)+'</td><td>'+marcasDia.join(', ')+'</td><td>'+((a.justificativos[e.id]&&a.justificativos[e.id].recibido)?'Sí':'No')+'</td></tr>');
  });
  var filasHtml = filas.join('') || '<tr><td colspan="3" class="hint">Sin atrasos ni faltas registradas en el rango elegido.</td></tr>';
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepIndividual">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repIndividualDoc">'
  + repInstitucionalHead('Historial de Asistencia — Estudiante')
  + '  <div class="pca-section">'
  + '    <div class="grid-2"><div class="field"><label>Estudiante</label><input class="cell-input" readonly value="'+escapeHtml(e.apellidos+' '+e.nombres)+'" /></div><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(e.nivel+' · '+(e.curso==='Otro…'?e.cursoManual:e.curso))+'" /></div></div>'
  + '    <div class="grid-3" style="margin-top:10px;"><div class="field"><label>Total Presente</label><input class="cell-input tabular" readonly value="'+totales.P+'" /></div><div class="field"><label>Total Atrasos</label><input class="cell-input tabular" readonly value="'+totales.A+'" /></div><div class="field"><label>Total Faltas</label><input class="cell-input tabular" readonly value="'+totales.F+'" /></div></div>'
  + '    <div class="table-wrap" style="margin-top:12px;"><table><thead><tr><th>Fecha</th><th>Detalle (atrasos / faltas por período)</th><th>Justificado</th></tr></thead><tbody>' + filasHtml + '</tbody></table></div>'
  + '  </div>'
  + repFirmaInspeccion()
  + '</div>';
}

function renderRepMensual(){
  var f = state.repMensualFiltro || (state.repMensualFiltro = {nivel:'', especialidad:'', curso:'', mes: todayISO().slice(0,7)});
  var espOpts = especialidadesFor(f.nivel);
  var cursoOpts = cursosFor(f.nivel, f.especialidad);
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Nivel</label><select class="cell-select" id="rmNivel">' + optionsHtml(NIVELES, f.nivel, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Especialidad</label><select class="cell-select" id="rmEspecialidad" '+(espOpts.length?'':'disabled')+'>' + optionsHtml(espOpts, f.especialidad, espOpts.length?'Elija un elemento…':'No aplica') + '</select></div>'
    + '  </div>'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Curso</label><select class="cell-select" id="rmCurso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, f.curso, 'Elija un elemento…') + '</select></div>'
    + '    <div class="field"><label>Mes</label><input class="cell-input" type="month" id="rmMes" value="'+escapeHtml(f.mes)+'" /></div>'
    + '  </div>'
    + '</div>';
  if(!f.nivel || !f.curso || !f.mes) return selHtml;
  var estudiantes = estudiantesDe(f.nivel, f.especialidad, f.curso);
  var docs = load(LS.ASISTENCIA).filter(function(a){
    return a.nivel===f.nivel && (a.especialidad||'')===(f.especialidad||'') && a.curso===f.curso && (a.fecha||'').indexOf(f.mes)===0;
  });
  var totalesPorEst = {};
  estudiantes.forEach(function(e){ totalesPorEst[e.id] = {P:0,A:0,F:0}; });
  docs.forEach(function(a){
    PERIODOS.forEach(function(p){
      var marcas = a.periodos[p.n] || {};
      Object.keys(marcas).forEach(function(estId){
        if(!totalesPorEst[estId]) return;
        totalesPorEst[estId][marcas[estId]]++;
      });
    });
  });
  var rows = estudiantes.slice().sort(function(a,b){ return totalesPorEst[b.id].F - totalesPorEst[a.id].F; }).map(function(e){
    var t = totalesPorEst[e.id];
    return '<tr><td>'+escapeHtml(e.apellidos+' '+e.nombres)+'</td><td class="tabular">'+t.P+'</td><td class="tabular">'+t.A+'</td><td class="tabular">'+t.F+'</td></tr>';
  }).join('') || '<tr><td colspan="4" class="hint">No hay estudiantes en este curso.</td></tr>';
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepMensual">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repMensualDoc">'
  + repInstitucionalHead('Consolidado Mensual de Asistencia')
  + '  <div class="pca-section">'
  + '    <div class="grid-2"><div class="field"><label>Curso</label><input class="cell-input" readonly value="'+escapeHtml(f.nivel+(f.especialidad?' · '+f.especialidad:'')+' · '+f.curso)+'" /></div><div class="field"><label>Mes</label><input class="cell-input" readonly value="'+escapeHtml(f.mes)+'" /></div></div>'
  + '    <div class="hint" style="margin:8px 0;">Los totales suman las marcas de las 11 horas curriculares en cada día del mes (no días completos).</div>'
  + '    <div class="table-wrap" style="margin-top:8px;"><table><thead><tr><th>Estudiante</th><th>Presente</th><th>Atrasos</th><th>Faltas</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  </div>'
  + repFirmaInspeccion()
  + '</div>';
}

function renderRepIncidentes(){
  var f = state.repIncidentesFiltro || (state.repIncidentesFiltro = {tipoInvolucrado:'', fechaInicio:'', fechaFin:''});
  var selHtml = ''
    + '<div class="card no-print">'
    + '  <div class="field-row">'
    + '    <div class="field"><label>Tipo</label><select class="cell-select" id="rcTipo">' + optionsHtml(['Estudiante','Personal'], f.tipoInvolucrado, 'Todos') + '</select></div>'
    + '    <div class="field"></div>'
    + '  </div>'
    + '  <div class="field-row"><div class="field"><label>Desde</label><input class="cell-input" type="date" id="rcInicio" value="'+escapeHtml(f.fechaInicio)+'" /></div><div class="field"><label>Hasta</label><input class="cell-input" type="date" id="rcFin" value="'+escapeHtml(f.fechaFin)+'" /></div></div>'
    + '</div>';
  var incidentes = load(LS.INCIDENTES).filter(function(i){
    if(f.tipoInvolucrado && i.tipoInvolucrado!==f.tipoInvolucrado) return false;
    if(f.fechaInicio && i.fecha < f.fechaInicio) return false;
    if(f.fechaFin && i.fecha > f.fechaFin) return false;
    return true;
  }).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
  var rows = incidentes.map(function(i){
    var nombre = i.tipoInvolucrado==='Estudiante' ? nombreEstudiante(i.estudianteId) : (i.personalNombre||'—');
    return '<tr><td class="tabular">'+fmtDate(i.fecha)+'</td><td>'+escapeHtml(nombre)+'</td><td>'+escapeHtml(i.tipoInvolucrado)+'</td><td>'+escapeHtml(i.tipoFalta)+'</td><td>'+escapeHtml(i.categoria==='Otro'?(i.categoriaManual||'Otro'):i.categoria)+'</td><td>'+escapeHtml(i.estado)+'</td></tr>';
  }).join('') || '<tr><td colspan="6" class="hint">No hay incidentes en este rango.</td></tr>';
  return selHtml
  + '<div class="pca-toolbar no-print"><div class="spacer"></div><button class="btn btn-gold btn-sm" id="btnPrintRepIncidentes">Imprimir / PDF (A4)</button></div>'
  + '<div class="pca-doc insp-report-doc" id="repIncidentesDoc">'
  + repInstitucionalHead('Reporte de Incidentes de Disciplina')
  + '  <div class="pca-section">'
  + '    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Tipo</th><th>Gravedad</th><th>Categoría</th><th>Estado</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  + '  </div>'
  + repFirmaInspeccion()
  + '</div>';
}

/* ============================= OBSERVACIÓN DE CLASES (Admin) ============================= */
/* Mapeado 1:1 del formato institucional "FORMATO PARA OBSERVAR Y VALORAR CLASES INSPIRADORAS"

var cargaEditRows = null;
function blankCargaRow(){ return {id:uid('cg'), nivel:'', especialidad:'', cursos:[], asignaturas:[], horas:{}}; }
function ensureCargaRows(d){
  if(cargaEditRows) return cargaEditRows;
  var flat = load(LS.CARGA).filter(function(r){ return r.docenteId === d.id; });
  if(flat.length === 0){
    cargaEditRows = [1].map(blankCargaRow);
    return cargaEditRows;
  }
  // Step 1: bucket flat records by (nivel, especialidad, curso) → set of asignaturas, same as before.
  var cursoBuckets = {}, cursoOrder = [];
  flat.forEach(function(r){
    var key = r.nivel + '||' + (r.especialidad||'') + '||' + r.curso;
    if(!cursoBuckets[key]){
      cursoBuckets[key] = {nivel: r.nivel, especialidad: r.especialidad||'', curso: r.curso, asignaturas: [], horas: {}};
      cursoOrder.push(key);
    }
    if(r.asignatura && cursoBuckets[key].asignaturas.indexOf(r.asignatura)===-1) cursoBuckets[key].asignaturas.push(r.asignatura);
    if(r.asignatura && r.horasSemanales) cursoBuckets[key].horas[r.asignatura] = r.horasSemanales;
  });
  // Step 2: merge cursos that share the exact same (nivel, especialidad, asignaturas) into one
  // multi-curso edit row, so bulk-selected combinations collapse back into a single row on reload
  // without corrupting cursos whose asignatura sets differ.
  var rowGroups = {}, rowOrder = [];
  cursoOrder.forEach(function(key){
    var b = cursoBuckets[key];
    var horasSig = b.asignaturas.slice().sort().map(function(a){ return a + ':' + (b.horas[a]||''); }).join('|');
    var sig = b.nivel + '||' + b.especialidad + '||' + horasSig;
    if(!rowGroups[sig]){
      rowGroups[sig] = {id: uid('cg'), nivel: b.nivel, especialidad: b.especialidad, cursos: [], asignaturas: b.asignaturas.slice(), horas: Object.assign({}, b.horas)};
      rowOrder.push(sig);
    }
    if(rowGroups[sig].cursos.indexOf(b.curso)===-1) rowGroups[sig].cursos.push(b.curso);
  });
  cargaEditRows = rowOrder.map(function(k){ return rowGroups[k]; });
  return cargaEditRows;
}

/* Iniciales/Preparatoria y Básica Elemental: horas semanales se activa apenas se marca la
   asignatura. Del resto de niveles (que incluyen 7.º EGB en adelante) en adelante, se activa
   solo cuando ya se eligió al menos un curso, para no mostrar un valor ambiguo antes de saber
   el curso/paralelo exacto. */
function horasRequiereCurso(nivel){
  return nivel !== 'Iniciales y Preparatoria' && nivel !== 'Básica Elemental';
}
/* Evita que el docente registre la misma combinación Nivel+Especialidad en dos filas distintas
   de su Carga Horaria: una vez usada en una fila, esa combinación deja de ofrecerse en las
   demás filas (debe seguir agregando cursos/asignaturas dentro de la misma fila en su lugar). */
function cargaPairsUsadosEnOtrasFilas(rows, excludeId){
  var used = {};
  (rows||[]).forEach(function(r){
    if(r.id===excludeId || !r.nivel) return;
    used[r.nivel + '||' + (r.especialidad||'')] = true;
  });
  return used;
}
function cargaNivelAgotado(nivel, used){
  var esps = especialidadesFor(nivel);
  var posibles = esps.length ? esps : [''];
  return posibles.every(function(e){ return used[nivel+'||'+e]; });
}
function cargaRowHtml(r, i, rows){
  var usedPairs = cargaPairsUsadosEnOtrasFilas(rows, r.id);
  var nivelOpts = NIVELES.filter(function(n){ return n===r.nivel || !cargaNivelAgotado(n, usedPairs); });
  var espOpts = especialidadesFor(r.nivel).filter(function(e){ return e===r.especialidad || !usedPairs[r.nivel+'||'+e]; });

  var cursoOpts = cursosFor(r.nivel, r.especialidad);
  var allCursoOpts = cursoOpts.concat((r.cursos||[]).filter(function(c){ return cursoOpts.indexOf(c)===-1; }));
  var cursoBoxHtml = !r.nivel
    ? '<div class="hint">Selecciona primero el nivel educativo.</div>'
    : (allCursoOpts.length===0
        ? '<div class="hint">No hay cursos registrados para este nivel.</div>'
        : allCursoOpts.map(function(c){
            return '<label class="checkbox-pill"><input type="checkbox" class="carga-curso-cb" value="'+escapeHtml(c)+'" '+((r.cursos||[]).indexOf(c)!==-1?'checked':'')+' />'+escapeHtml(c)+'</label>';
          }).join(''));

  var asigOpts = asignaturasFor(r.nivel, r.especialidad);
  // include any already-selected asignaturas not in the standard list (manually added) so they still show as pills
  var allAsigOpts = asigOpts.concat((r.asignaturas||[]).filter(function(a){ return asigOpts.indexOf(a)===-1; }));
  var asigBoxHtml = !r.nivel
    ? '<div class="hint">Selecciona primero el nivel educativo.</div>'
    : (allAsigOpts.length===0
        ? '<div class="hint">No hay asignaturas registradas para este nivel.</div>'
        : allAsigOpts.map(function(a){
            return '<label class="checkbox-pill"><input type="checkbox" class="carga-asig-cb" value="'+escapeHtml(a)+'" '+((r.asignaturas||[]).indexOf(a)!==-1?'checked':'')+' />'+escapeHtml(a)+'</label>';
          }).join(''));

  var horasHtml;
  if(!r.nivel || !(r.asignaturas||[]).length){
    horasHtml = '<div class="hint">—</div>';
  } else if(horasRequiereCurso(r.nivel) && !(r.cursos||[]).length){
    horasHtml = '<div class="hint">Elige primero el curso.</div>';
  } else {
    horasHtml = (r.asignaturas||[]).map(function(a){
      var v = (r.horas && r.horas[a]!=null) ? r.horas[a] : '';
      return '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; white-space:nowrap;"><span style="font-size:12px;">'+escapeHtml(a)+'</span><input type="number" min="0" step="0.5" class="cell-input carga-horas-input" data-asig="'+escapeHtml(a)+'" style="width:56px; flex:none;" value="'+escapeHtml(v)+'" /></div>';
    }).join('');
  }

  return ''
  + '<tr data-row="' + r.id + '">'
  + '  <td class="tabular">' + (i+1) + '</td>'
  + '  <td><select class="cell-select" data-f="nivel">' + optionsHtml(nivelOpts, r.nivel, 'Selecciona…') + '</select></td>'
  + '  <td><select class="cell-select" data-f="especialidad" ' + (espOpts.length? '' : 'disabled') + '>' + optionsHtml(espOpts, r.especialidad, espOpts.length? 'Selecciona…':'No aplica') + '</select></td>'
  + '  <td>'
  + '    <div class="checkbox-grid" data-cursobox="' + r.id + '">' + cursoBoxHtml + '</div>'
  + (r.nivel ? (
      '    <div class="add-inline"><input type="text" class="cell-input carga-curso-manual" data-rowid="'+r.id+'" placeholder="¿No está en la lista? Escríbelo…" /><button type="button" class="btn btn-ghost btn-sm" data-addcursomanual="'+r.id+'">+ Agregar</button></div>'
      + '    <div style="display:flex; gap:8px; margin-top:6px;"><button type="button" class="btn btn-ghost btn-sm" data-cursoall="'+r.id+'">Todos</button><button type="button" class="btn btn-ghost btn-sm" data-cursonone="'+r.id+'">Ninguno</button></div>'
    ) : '')
  + '  </td>'
  + '  <td>'
  + '    <div class="checkbox-grid" data-asigbox="' + r.id + '">' + asigBoxHtml + '</div>'
  + (r.nivel ? (
      '    <div class="add-inline"><input type="text" class="cell-input carga-asig-manual" data-rowid="'+r.id+'" placeholder="¿No está en la lista? Escríbela…" /><button type="button" class="btn btn-ghost btn-sm" data-addasigmanual="'+r.id+'">+ Agregar</button></div>'
      + '    <div style="display:flex; gap:8px; margin-top:6px;"><button type="button" class="btn btn-ghost btn-sm" data-asigall="'+r.id+'">Todas</button><button type="button" class="btn btn-ghost btn-sm" data-asignone="'+r.id+'">Ninguna</button></div>'
    ) : '')
  + '  </td>'
  + '  <td>' + horasHtml + '</td>'
  + '  <td><button class="row-remove" data-remove-row="' + r.id + '" title="Quitar fila">✕</button></td>'
  + '</tr>';
}
function optionsHtml(list, selected, placeholder){
  var html = placeholder ? '<option value="">' + escapeHtml(placeholder) + '</option>' : '';
  html += list.map(function(o){ return '<option value="' + escapeHtml(o) + '" ' + (o===selected?'selected':'') + '>' + escapeHtml(o) + '</option>'; }).join('');
  return html;
}

function bindCargaHorariaEvents(){
  var editBtn = document.getElementById('btnEditCarga');
  if(editBtn){
    editBtn.onclick = function(){
      cargaEditRows = null;
      state.cargaEditing = true;
      render();
    };
    return;
  }
  var body = document.getElementById('cargaBody');
  function findRow(id){ return cargaEditRows.find(function(r){ return r.id===id; }); }

  body.querySelectorAll('tr').forEach(function(tr){
    var id = tr.getAttribute('data-row');
    tr.querySelectorAll('select[data-f]').forEach(function(el){
      el.addEventListener('change', function(){
        var row = findRow(id);
        row[el.getAttribute('data-f')] = el.value;
        if(el.getAttribute('data-f') === 'nivel'){ row.especialidad=''; row.cursos=[]; row.asignaturas=[]; row.horas={}; renderCargaBodyOnly(); }
        else if(el.getAttribute('data-f') === 'especialidad'){ row.cursos=[]; row.asignaturas=[]; row.horas={}; renderCargaBodyOnly(); }
      });
    });
    tr.querySelectorAll('.carga-curso-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var row = findRow(id);
        row.cursos = row.cursos || [];
        if(cb.checked){ if(row.cursos.indexOf(cb.value)===-1) row.cursos.push(cb.value); }
        else{ row.cursos = row.cursos.filter(function(c){ return c!==cb.value; }); }
        renderCargaBodyOnly();
      });
    });
    tr.querySelectorAll('.carga-asig-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        var row = findRow(id);
        row.asignaturas = row.asignaturas || [];
        if(cb.checked){ if(row.asignaturas.indexOf(cb.value)===-1) row.asignaturas.push(cb.value); }
        else{ row.asignaturas = row.asignaturas.filter(function(a){ return a!==cb.value; }); if(row.horas) delete row.horas[cb.value]; }
        renderCargaBodyOnly();
      });
    });
    tr.querySelectorAll('.carga-horas-input').forEach(function(inp){
      inp.addEventListener('input', function(){
        var row = findRow(id);
        row.horas = row.horas || {};
        row.horas[inp.getAttribute('data-asig')] = inp.value;
      });
    });
  });
  document.querySelectorAll('[data-cursoall]').forEach(function(btn){
    btn.onclick = function(){
      var row = findRow(btn.getAttribute('data-cursoall'));
      row.cursos = cursosFor(row.nivel, row.especialidad).slice();
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('[data-cursonone]').forEach(function(btn){
    btn.onclick = function(){ findRow(btn.getAttribute('data-cursonone')).cursos = []; renderCargaBodyOnly(); };
  });
  document.querySelectorAll('[data-addcursomanual]').forEach(function(btn){
    btn.onclick = function(){
      var rowId = btn.getAttribute('data-addcursomanual');
      var input = document.querySelector('.carga-curso-manual[data-rowid="'+rowId+'"]');
      var v = (input.value||'').trim();
      if(!v) return;
      var row = findRow(rowId);
      row.cursos = row.cursos || [];
      var exists = row.cursos.some(function(c){ return c.toLowerCase()===v.toLowerCase(); });
      if(!exists) row.cursos.push(v);
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('.carga-curso-manual').forEach(function(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-addcursomanual="'+input.getAttribute('data-rowid')+'"]').click(); }
    });
  });
  document.querySelectorAll('[data-asigall]').forEach(function(btn){
    btn.onclick = function(){
      var row = findRow(btn.getAttribute('data-asigall'));
      row.asignaturas = asignaturasFor(row.nivel, row.especialidad).slice();
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('[data-asignone]').forEach(function(btn){
    btn.onclick = function(){ var row = findRow(btn.getAttribute('data-asignone')); row.asignaturas = []; row.horas = {}; renderCargaBodyOnly(); };
  });
  document.querySelectorAll('[data-addasigmanual]').forEach(function(btn){
    btn.onclick = function(){
      var rowId = btn.getAttribute('data-addasigmanual');
      var input = document.querySelector('.carga-asig-manual[data-rowid="'+rowId+'"]');
      var v = (input.value||'').trim();
      if(!v) return;
      var row = findRow(rowId);
      row.asignaturas = row.asignaturas || [];
      var exists = row.asignaturas.some(function(a){ return a.toLowerCase()===v.toLowerCase(); });
      if(!exists) row.asignaturas.push(v);
      renderCargaBodyOnly();
    };
  });
  document.querySelectorAll('.carga-asig-manual').forEach(function(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-addasigmanual="'+input.getAttribute('data-rowid')+'"]').click(); }
    });
  });
  document.querySelectorAll('[data-remove-row]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-remove-row');
      cargaEditRows = cargaEditRows.filter(function(r){ return r.id!==id; });
      renderCargaBodyOnly();
    };
  });
  document.getElementById('btnAddCargaRow').onclick = function(){
    cargaEditRows.push(blankCargaRow());
    renderCargaBodyOnly();
  };
  var cancelBtn = document.getElementById('btnCancelCarga');
  if(cancelBtn) cancelBtn.onclick = function(){
    cargaEditRows = null;
    state.cargaEditing = false;
    render();
  };
  document.getElementById('btnSaveCarga').onclick = function(){
    var d = currentDocente();
    var all = load(LS.CARGA).filter(function(r){ return r.docenteId !== d.id; });
    var toSave = [];
    cargaEditRows.forEach(function(r){
      if(!r.nivel || !(r.cursos||[]).length || !(r.asignaturas||[]).length) return;
      r.cursos.forEach(function(curso){
        r.asignaturas.forEach(function(asig){
          toSave.push({ id: uid('cg'), docenteId: d.id, nivel:r.nivel, especialidad:r.especialidad||'', curso:curso, asignatura:asig, horasSemanales:(r.horas && r.horas[asig])||'', updatedAt: nowISO() });
        });
      });
    });
    save(LS.CARGA, all.concat(toSave));
    toast('Carga horaria guardada (' + toSave.length + ' asignaturas).', 'success');
    cargaEditRows = null;
    state.cargaEditing = false;
    render();
  };
}
function renderCargaBodyOnly(){
  document.getElementById('cargaBody').innerHTML = cargaEditRows.map(function(r,i){ return cargaRowHtml(r,i,cargaEditRows); }).join('');
  bindCargaHorariaEvents();
}

/* ============================= FILTRO ADMIN: Docente / Fecha de corte / Asignatura / Curso =============================
   Compartido entre la lista de PCA y la de Planes Semanales (solo admin). Asignatura y Curso solo
   se habilitan una vez elegido un docente (sus opciones salen de la Carga Horaria de ESE docente).
   El campo Curso solo tiene efecto sobre los PCA/Planes de niveles 7.º EGB a 3.º BGU — para
   Iniciales a 6.º EGB, ver nivelEsBandaA(), el filtro de curso se ignora. */
function adminFiltroBarraHtml(filtro, idPrefix, tituloCurso){
  var docentes = allDocentes().sort(function(a,b){ return (a.nombres||'').localeCompare(b.nombres||''); });
  var docOpts = '<option value="">Todos los docentes</option>' + docentes.map(function(x){
    return '<option value="'+x.id+'" '+(filtro.docenteId===x.id?'selected':'')+'>'+escapeHtml(nombreFormal(x))+'</option>';
  }).join('');
  var asigOpts = filtro.docenteId ? misAsignaturas(filtro.docenteId) : [];
  var cursoOpts = filtro.docenteId ? misCursosTodos(filtro.docenteId) : [];
  return ''
    + '<div class="card" style="margin-bottom:16px;">'
    + '  <h2 style="font-size:14px;">Filtrar</h2>'
    + '  <div class="grid-4">'
    + '    <div class="field"><label>Docente</label><select class="cell-select" id="'+idPrefix+'Docente">'+docOpts+'</select></div>'
    + '    <div class="field"><label>Asignatura</label><select class="cell-select" id="'+idPrefix+'Asignatura" '+(asigOpts.length?'':'disabled')+'>' + optionsHtml(asigOpts, filtro.asignatura, asigOpts.length?'Todas':'Elige un docente primero') + '</select></div>'
    + '    <div class="field"><label>' + escapeHtml(tituloCurso) + '</label><select class="cell-select" id="'+idPrefix+'Curso" '+(cursoOpts.length?'':'disabled')+'>' + optionsHtml(cursoOpts, filtro.curso, cursoOpts.length?'Todos':'Elige un docente primero') + '</select></div>'
    + '    <div class="field"></div>'
    + '  </div>'
    + '  <div class="grid-2" style="max-width:520px; margin-top:10px;">'
    + '    <div class="field"><label>Fecha de corte — inicio</label><input class="cell-input" type="date" id="'+idPrefix+'FechaInicio" value="'+escapeHtml(filtro.fechaInicio||'')+'" /></div>'
    + '    <div class="field"><label>Fecha de corte — fin</label><input class="cell-input" type="date" id="'+idPrefix+'FechaFin" value="'+escapeHtml(filtro.fechaFin||'')+'" /></div>'
    + '  </div>'
    + '</div>';
}
function bindAdminFiltroBarraEvents(filtro, idPrefix){
  document.getElementById(idPrefix+'Docente').addEventListener('change', function(e){ filtro.docenteId=e.target.value; filtro.asignatura=''; filtro.curso=''; render(); });
  var asigSel = document.getElementById(idPrefix+'Asignatura');
  if(asigSel) asigSel.addEventListener('change', function(e){ filtro.asignatura=e.target.value; render(); });
  var cursoSel = document.getElementById(idPrefix+'Curso');
  if(cursoSel) cursoSel.addEventListener('change', function(e){ filtro.curso=e.target.value; render(); });
  document.getElementById(idPrefix+'FechaInicio').addEventListener('change', function(e){ filtro.fechaInicio=e.target.value; render(); });
  document.getElementById(idPrefix+'FechaFin').addEventListener('change', function(e){ filtro.fechaFin=e.target.value; render(); });
}

function renderPcaList(d){ return renderPcaListInner(d, false); }
function renderAdminPca(){ return renderPcaListInner(currentDocente(), true); }

function renderPcaListInner(d, scopeAll){
  var isAdmin = currentDocente().role === 'admin';
  var all = load(LS.PCA);
  var pcas = (scopeAll ? all : all.filter(function(p){ return p.docenteId === d.id; })).sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
  var docentesById = {};
  if(scopeAll) allDocentes().forEach(function(x){ docentesById[x.id] = x; });

  var filtroHtml = '';
  if(scopeAll){
    var filtro = state.adminPcaFilter;
    if(filtro.docenteId) pcas = pcas.filter(function(p){ return p.docenteId===filtro.docenteId; });
    if(filtro.fechaInicio) pcas = pcas.filter(function(p){ return (p.updatedAt||'').slice(0,10) >= filtro.fechaInicio; });
    if(filtro.fechaFin) pcas = pcas.filter(function(p){ return (p.updatedAt||'').slice(0,10) <= filtro.fechaFin; });
    pcas = pcas.filter(function(p){
      var asigOk = !filtro.asignatura || p.asignatura===filtro.asignatura || p.asignaturaManual===filtro.asignatura;
      if(nivelEsBandaA(p.nivel)) return asigOk;
      var cursoOk = !filtro.curso || p.curso===filtro.curso || p.cursoManual===filtro.curso;
      return asigOk && cursoOk;
    });
    filtroHtml = adminFiltroBarraHtml(filtro, 'apf', 'Curso (7.º EGB a 3.º BGU)');
  }

  var rows = pcas.map(function(p){
    var nombre = (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || '(sin asignatura)';
    var curso = (p.curso==='Otro…' ? p.cursoManual : p.curso) || '—';
    var lockedForViewer = !!p.locked && !isAdmin;
    var owner = scopeAll ? docentesById[p.docenteId] : null;
    var docenteCell = scopeAll ? '<td>' + (owner ? escapeHtml(owner.nombres) + ' ' + escapeHtml(owner.apellidos) : '<span class="hint">(docente eliminado)</span>') + '</td>' : '';
    return ''
    + '<tr>'
    + docenteCell
    + '  <td><strong>' + escapeHtml(nombre) + '</strong>' + (p.locked ? ' <span class="pill pill-muted" title="Bloqueado para el docente">🔒</span>' : '') + '</td>'
    + '  <td>' + escapeHtml(p.nivel||'—') + (p.especialidad? '<br/><span class="pill pill-blue">'+escapeHtml(p.especialidad)+'</span>':'') + '</td>'
    + '  <td>' + escapeHtml(curso) + '</td>'
    + '  <td class="tabular">' + (p.unidadesNombres||[]).length + '</td>'
    + '  <td>' + fmtDateTime(p.updatedAt) + '</td>'
    + '  <td style="white-space:nowrap;">'
    + '    <button class="btn btn-ghost btn-sm" data-edit-pca="' + p.id + '">' + (lockedForViewer ? 'Ver' : 'Ver / Editar') + '</button> '
    + '    <button class="btn btn-gold btn-sm" data-export-pca-pdf="' + p.id + '" title="PDF real, sin restricciones de tu vista">PDF ✓</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-pca-word="' + p.id + '">Word</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-pca-excel="' + p.id + '">Excel</button> '
    + (isAdmin ? '    <button class="btn btn-danger btn-sm" data-delete-pca="' + p.id + '">Eliminar</button>' : '')
    + '  </td>'
    + '</tr>';
  }).join('');

  var theadDocente = scopeAll ? '<th>Docente</th>' : '';
  var head = scopeAll
    ? '<p class="hint" style="margin-bottom:14px;">Puedes ver, editar y eliminar cualquier plan, incluidos los bloqueados para los docentes.</p>'
    : '<div class="page-head"><div><div class="eyebrow">PCA</div><h1>Planes Curriculares Anuales</h1><p>Un plan por cada asignatura que impartes, siguiendo el formato institucional 2026-2027.</p></div><button class="btn btn-primary" id="btnNewPca">+ Nuevo Plan Curricular Anual</button></div>';

  return head + filtroHtml
  + (pcas.length === 0
      ? '<div class="card"><div class="empty-state"><div class="ic">📘</div>' + (scopeAll ? 'No hay planes curriculares que coincidan con el filtro.' : 'Todavía no has creado ningún plan curricular anual.<br/><button class="btn btn-primary" id="btnNewPca2" style="margin-top:14px;">Crear el primero</button>') + '</div></div>'
      : '<div class="card"><div class="table-wrap"><table><thead><tr>' + theadDocente + '<th>Asignatura</th><th>Nivel</th><th>Curso</th><th>Unidades</th><th>Actualizado</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>');
}

function blankPca(d){
  var misFilas = misCargaRows(d.id);
  var base = misFilas[0] || {nivel:'', especialidad:''};
  return {
    id: uid('pca'), docenteId: d.id,
    nivel: base.nivel||'', especialidad: base.especialidad||'', curso:'', cursoManual:'', asignatura:'', asignaturaManual:'',
    cargaSemanal:'', semanasT1:13, semanasT2:13, semanasT3:13, fechaLimite: fechaLimiteVigente('pca'),
    temporalizacion:[{id:uid('tm'), unidad:'Unidad 1', nombreUnidad:'', trimestre:'1er Trimestre', semanas:''}],
    unidades:[{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}],
    elaboradoPor: nombreFormal(d),
    revisadoPor:'Lic. David Villalta', aprobadoPor:'Lic. José Gómez',
    createdAt: nowISO(), updatedAt: nowISO()
  };
}
function weekRow(n){ return {id:uid('wk'), semana:n, fechaInicio:'', fechaFin:'', destreza:'', temas:'', pagina:'', observacion:''}; }

function openPcaForm(pcaId, returnTo){
  state.pcaReturnTo = returnTo || 'pcalist';
  var d = currentDocente();
  if(pcaId){
    var header = load(LS.PCA).find(function(p){ return p.id===pcaId; });
    var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; });
    var unidades = (header.unidadesNombres || []).map(function(nombre){
      var filas = cont.filter(function(c){ return c.unidad===nombre; }).sort(function(a,b){ return (a.semana||0)-(b.semana||0); });
      if(filas.length===0) filas=[weekRow(1)];
      return {id: uid('un'), nombre: nombre, filas: filas.map(function(f){ return Object.assign({}, f); })};
    });
    if(unidades.length===0) unidades=[{id:uid('un'), nombre:'Unidad 1', filas:[weekRow(1)]}];
    state.editingPca = Object.assign({}, header, {
      temporalizacion: (header.temporalizacion||[]).map(function(t){ return Object.assign({}, t); }),
      unidades: unidades
    });
  } else {
    state.editingPca = blankPca(d);
  }
  go('pcaform');
}

function bindPcaFormEvents(){
  var p = state.editingPca;
  var isAdmin = currentDocente().role === 'admin';
  var locked = !!p.locked && !isAdmin;

  document.getElementById('btnBackToList').onclick = function(){ go(state.pcaReturnTo || 'pcalist'); };
  var saveBtn = document.getElementById('btnSavePca');
  if(saveBtn) saveBtn.onclick = function(){
    savePca(p);
    go(state.pcaReturnTo || 'pcalist');
  };
  document.getElementById('btnExportWordNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaWord(p.id); };
  document.getElementById('btnExportExcelNow').onclick = function(){ if(!locked) savePca(p, true); exportPcaExcel(p.id); };
  document.getElementById('btnExportPdfNow').onclick = printAsPdf;
  var lockToggle = document.getElementById('pfLockToggle');
  if(lockToggle){
    lockToggle.addEventListener('change', function(){
      p.locked = lockToggle.checked;
      var all = load(LS.PCA);
      var found = all.find(function(x){ return x.id===p.id; });
      if(found){ found.locked = p.locked; save(LS.PCA, all); }
      toast(p.locked ? 'Plan bloqueado para el docente.' : 'Plan desbloqueado: el docente ya puede editarlo de nuevo.', 'success');
    });
  }

  if(locked){
    document.querySelectorAll('#pcaDoc input, #pcaDoc select, #pcaDoc textarea, #pcaDoc button').forEach(function(el){ el.disabled = true; });
    document.querySelectorAll('#pcaDoc [contenteditable]').forEach(function(el){ el.setAttribute('contenteditable','false'); });
    return;
  }

  document.getElementById('pfNivel').addEventListener('change', function(e){ p.nivel=e.target.value; p.especialidad=''; p.curso=''; p.asignatura=''; renderPcaFormAgain(); });
  document.getElementById('pfEspecialidad').addEventListener('change', function(e){ p.especialidad=e.target.value; p.asignatura=''; renderPcaFormAgain(); });
  document.getElementById('pfCurso').addEventListener('change', function(e){ p.curso=e.target.value; renderPcaFormAgain(); });
  document.getElementById('pfAsignatura').addEventListener('change', function(e){ p.asignatura=e.target.value; renderPcaFormAgain(); });
  var cm = document.getElementById('pfCursoManual'); if(cm) cm.addEventListener('input', function(e){ p.cursoManual = e.target.value; });
  var am = document.getElementById('pfAsignaturaManual'); if(am) am.addEventListener('input', function(e){ p.asignaturaManual = e.target.value; });

  ['pfCargaSemanal','pfT1','pfT2','pfT3','pfRevisado','pfAprobado'].forEach(function(id){
    var el = document.getElementById(id);
    var key = {pfCargaSemanal:'cargaSemanal', pfT1:'semanasT1', pfT2:'semanasT2', pfT3:'semanasT3', pfRevisado:'revisadoPor', pfAprobado:'aprobadoPor'}[id];
    el.addEventListener('input', function(){ p[key] = el.value; });
  });
  var pfLimite = document.getElementById('pfFechaLimite');
  if(pfLimite) pfLimite.addEventListener('change', function(){ p.fechaLimite = pfLimite.value; });

  // Temporalización
  document.getElementById('btnAddTemporalizacion').onclick = function(){
    p.temporalizacion.push({id:uid('tm'), unidad:'Unidad ' + (p.temporalizacion.length+1), nombreUnidad:'', trimestre:'1er Trimestre', semanas:''});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-tmremove]').forEach(function(btn){
    btn.onclick = function(){ p.temporalizacion = p.temporalizacion.filter(function(t){ return t.id!==btn.getAttribute('data-tmremove'); }); renderPcaFormAgain(); };
  });
  document.querySelectorAll('#tmBody tr').forEach(function(tr){
    var id = tr.getAttribute('data-tmrow');
    tr.querySelectorAll('[data-tf]').forEach(function(el){
      var t = p.temporalizacion.find(function(x){ return x.id===id; });
      el.addEventListener('input', function(){ t[el.getAttribute('data-tf')] = el.value; if(el.tagName==='SELECT') renderPcaFormAgain(); });
      if(el.tagName==='SELECT') el.addEventListener('change', function(){ t[el.getAttribute('data-tf')] = el.value; });
      if(el.getAttribute('data-tf')==='semanas') el.addEventListener('change', function(){ renderPcaFormAgain(); });
    });
  });

  // Unidades / semanas
  document.getElementById('btnAddUnidad').onclick = function(){
    var n = p.unidades.length + 1;
    p.unidades.push({id:uid('un'), nombre:'Unidad ' + n, filas:[weekRow(1)]});
    renderPcaFormAgain();
  };
  document.querySelectorAll('[data-removeunit]').forEach(function(btn){
    btn.onclick = function(){
      if(p.unidades.length<=1){ toast('Debe existir al menos una unidad.', 'error'); return; }
      confirmDialog('¿Eliminar esta unidad y todo su contenido?', function(){
        p.unidades = p.unidades.filter(function(u){ return u.id!==btn.getAttribute('data-removeunit'); });
        renderPcaFormAgain();
      });
    };
  });
  document.querySelectorAll('[data-unitname]').forEach(function(el){
    el.addEventListener('input', function(){
      var u = p.unidades.find(function(x){ return x.id===el.getAttribute('data-unitname'); });
      u.nombre = el.value;
    });
  });
  document.querySelectorAll('[data-addweek]').forEach(function(btn){
    btn.onclick = function(){
      var u = p.unidades.find(function(x){ return x.id===btn.getAttribute('data-addweek'); });
      var nueva = weekRow(u.filas.length+1);
      var ultima = u.filas[u.filas.length-1];
      if(ultima){
        nueva.fechaInicio = addDays(ultima.fechaInicio, 7);
        nueva.fechaFin = addDays(ultima.fechaFin, 7);
      }
      u.filas.push(nueva);
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-wkremove]').forEach(function(btn){
    btn.onclick = function(){
      var tr = btn.closest('tr');
      var tbody = btn.closest('tbody');
      var unitId = tbody.getAttribute('data-unitbody');
      var u = p.unidades.find(function(x){ return x.id===unitId; });
      u.filas = u.filas.filter(function(f){ return f.id!==btn.getAttribute('data-wkremove'); });
      u.filas.forEach(function(f,i){ f.semana = i+1; });
      renderPcaFormAgain();
    };
  });
  document.querySelectorAll('[data-unitbody]').forEach(function(tbody){
    var unitId = tbody.getAttribute('data-unitbody');
    var u = p.unidades.find(function(x){ return x.id===unitId; });
    tbody.querySelectorAll('tr').forEach(function(tr){
      var rowId = tr.getAttribute('data-wkrow');
      var f = u.filas.find(function(x){ return x.id===rowId; });
      tr.querySelectorAll('[data-wf]').forEach(function(el){
        el.addEventListener('input', function(){ f[el.getAttribute('data-wf')] = el.value; });
      });
      tr.querySelectorAll('.rte-editable').forEach(function(el){
        var key = el.getAttribute('data-rte-field');
        el.addEventListener('input', function(){ f[key] = el.innerHTML; });
      });
      bindRteToolbars(tr);
    });
  });
}

function renderPcaFormAgain(){
  document.querySelector('main.content').innerHTML = pcaToolbarHtml(state.editingPca) + renderPcaDocOnly();
  bindPcaFormEvents();
}
function renderPcaDocOnly(){
  // Re-render just the document part (used after any structural edit) by calling full render minus toolbar duplication.
  var full = renderPcaForm(currentDocente());
  var marker = '<div class="pca-doc" id="pcaDoc">';
  return marker + full.split(marker)[1];
}

function savePca(p, silent){
  var d = currentDocente();
  var existingHeader = load(LS.PCA).find(function(x){ return x.id===p.id; });
  var isNew = !existingHeader;
  var ownerId = existingHeader ? existingHeader.docenteId : d.id;
  if(isNew) p.locked = true;
  p.updatedAt = nowISO();
  p.unidadesNombres = p.unidades.map(function(u){ return u.nombre; });
  var header = {
    id:p.id, docenteId:ownerId, nivel:p.nivel, especialidad:p.especialidad,
    curso:p.curso, cursoManual:p.cursoManual||'', asignatura:p.asignatura, asignaturaManual:p.asignaturaManual||'',
    cargaSemanal:p.cargaSemanal, semanasT1:p.semanasT1, semanasT2:p.semanasT2, semanasT3:p.semanasT3, fechaLimite:p.fechaLimite||'',
    temporalizacion:p.temporalizacion, unidadesNombres:p.unidadesNombres,
    elaboradoPor:p.elaboradoPor, revisadoPor:p.revisadoPor, aprobadoPor:p.aprobadoPor,
    locked: !!p.locked,
    createdAt:p.createdAt, updatedAt:p.updatedAt
  };
  var pcas = load(LS.PCA).filter(function(x){ return x.id!==p.id; });
  pcas.push(header);
  save(LS.PCA, pcas);

  var cont = load(LS.CONT).filter(function(c){ return c.pcaId!==p.id; });
  p.unidades.forEach(function(u){
    u.filas.forEach(function(f){
      cont.push({
        id: f.id, pcaId:p.id, docenteId:ownerId, unidad:u.nombre, semana:f.semana,
        fechaInicio:f.fechaInicio, fechaFin:f.fechaFin, destreza:f.destreza,
        temas:f.temas, pagina:f.pagina, observacion:f.observacion
      });
    });
  });
  save(LS.CONT, cont);
  if(!silent){
    if(isNew && d.role !== 'admin') toast('Plan guardado. A partir de ahora queda bloqueado: para corregirlo, contacta a un administrador.', 'success');
    else toast('Plan curricular guardado correctamente.', 'success');
  }
}

/* ============================= RICH TEXT EDITOR (RTE) ============================= */
function richEditorHtml(fieldKey, ownerId, html, placeholder){
  var id = 'rte_' + ownerId + '_' + fieldKey;
  return ''
  + '<div class="rte">'
  + '  <div class="rte-toolbar no-print">'
  + '    <button type="button" data-rte-cmd="bold" title="Negrita"><strong>B</strong></button>'
  + '    <button type="button" data-rte-cmd="underline" title="Subrayado"><u>S</u></button>'
  + '    <button type="button" data-rte-cmd="insertUnorderedList" title="Viñetas">•≡</button>'
  + '    <button type="button" data-rte-cmd="insertOrderedList" title="Numeración">1≡</button>'
  + '    <button type="button" data-rte-cmd="indent" title="Sangría">→|</button>'
  + '    <button type="button" data-rte-cmd="outdent" title="Quitar sangría">|←</button>'
  + '    <input type="color" class="rte-color" data-rte-color title="Color de texto" value="#16233A" />'
  + '    <button type="button" data-rte-cmd="createLink" title="Insertar enlace">🔗</button>'
  + '    <button type="button" data-rte-cmd="removeFormat" title="Quitar formato">✕</button>'
  + '  </div>'
  + '  <div class="rte-editable" contenteditable="true" id="' + id + '" data-rte-field="' + fieldKey + '" data-placeholder="' + escapeHtml(placeholder||'') + '">' + (html||'') + '</div>'
  + '</div>';
}
function bindRteToolbars(root){
  if(!root) return;
  root.querySelectorAll('[data-rte-cmd]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var wrap = btn.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      var cmd = btn.getAttribute('data-rte-cmd');
      if(cmd === 'createLink'){
        var sel = window.getSelection();
        var savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
        promptDialog('Ingresa la URL del enlace:', 'https://', function(url){
          editable.focus();
          if(savedRange){ var sel2 = window.getSelection(); sel2.removeAllRanges(); sel2.addRange(savedRange); }
          document.execCommand('createLink', false, url);
        });
        return;
      }
      editable.focus();
      document.execCommand(cmd, false, null);
    });
  });
  root.querySelectorAll('[data-rte-color]').forEach(function(inp){
    var savedRange = null;
    inp.addEventListener('mousedown', function(){
      var sel = window.getSelection();
      savedRange = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
    });
    inp.addEventListener('input', function(){
      var wrap = inp.closest('.rte');
      var editable = wrap.querySelector('.rte-editable');
      editable.focus();
      if(savedRange){ var sel2 = window.getSelection(); sel2.removeAllRanges(); sel2.addRange(savedRange); }
      document.execCommand('foreColor', false, inp.value);
    });
  });
}
/* Whitelist sanitizer applied at save time: strips any tag/attribute outside a small allowed
   set (bold/underline/lists/links/line-breaks) so pasted content can't smuggle scripts or
   event-handler attributes into localStorage. */
function sanitizeRte(html){
  if(!html) return '';
  var allowed = {DIV:1,P:1,B:1,STRONG:1,U:1,I:1,EM:1,UL:1,OL:1,LI:1,BR:1,A:1,SPAN:1};
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  function clean(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ node.removeChild(ch); return; }
      if(!allowed[ch.tagName]){
        var text = document.createTextNode(ch.textContent || '');
        node.replaceChild(text, ch);
        return;
      }
      Array.from(ch.attributes).forEach(function(attr){
        if(ch.tagName === 'A' && attr.name === 'href'){
          var v = attr.value || '';
          if(!/^https?:\/\//i.test(v) && !/^mailto:/i.test(v)) ch.removeAttribute('href');
        } else {
          ch.removeAttribute(attr.name);
        }
      });
      if(ch.tagName === 'A') ch.setAttribute('target', '_blank');
      clean(ch);
    });
  }
  clean(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
function richTextToPlain(html){
  if(!html) return '';
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var lines = [];
  var current = '';
  function flush(){ var t = current.trim(); if(t) lines.push(t); current = ''; }
  function inlineText(node){
    var out = '';
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ out += ch.textContent; return; }
      if(ch.nodeType !== 1) return;
      if(ch.tagName === 'BR'){ out += '\n'; return; }
      out += inlineText(ch);
    });
    return out;
  }
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ current += ch.textContent; return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag === 'LI'){ flush(); lines.push('• ' + inlineText(ch).trim()); }
      else if(tag === 'UL' || tag === 'OL'){ flush(); walk(ch); }
      else if(tag === 'BR'){ current += '\n'; }
      else if(tag === 'DIV' || tag === 'P'){ flush(); var t = inlineText(ch).trim(); if(t) lines.push(t); }
      else { current += inlineText(ch); }
    });
  }
  walk(doc.body.firstChild);
  flush();
  return lines.join('\n');
}

/* Numeración de Planes Semanales: cada uno guarda su propio número (no es la posición en la
   lista), así que borrar uno no renumera a los demás. El siguiente plan que se crea continúa
   después del número más alto que exista actualmente para ese docente. */
function siguienteNumeroSemanal(docenteId){
  var max = load(LS.SEMANAL).filter(function(s){ return s.docenteId===docenteId; }).reduce(function(m,s){ return Math.max(m, s.numero||0); }, 0);
  return max + 1;
}
/* Agrupa por trimestre y mes según la fecha de inicio del plan. Los límites de trimestre son
   una aproximación estándar del calendario Sierra (Sept-Dic / Ene-Mar / Abr-Jun); si la
   institución maneja otros cortes, este mapeo es el único lugar que hay que ajustar. */
var MES_A_TRIMESTRE = {9:1, 10:1, 11:1, 12:1, 1:2, 2:2, 3:2, 4:3, 5:3, 6:3, 7:3, 8:3};
var MESES_CAP = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
/* El año lectivo empieza en septiembre, así que al agrupar por mes, el ciclo debe empezar en
   septiembre y terminar en agosto (Sept,Oct,Nov,Dic,Ene,...,Ago) — no el orden calendario Ene-Dic.
   Esto se usa solo para ORDENAR los grupos de mes; dentro de un mismo mes-del-ciclo, se desempata
   por año calendario para que años lectivos distintos no se mezclen fuera de orden. */
var MES_ORDEN_ANIO_LECTIVO = {9:0, 10:1, 11:2, 12:3, 1:4, 2:5, 3:6, 4:7, 5:8, 6:9, 7:10, 8:11};
function trimestreYMesDe(fechaIso){
  if(!fechaIso) return null;
  var p = fechaIso.split('-');
  var year = parseInt(p[0],10), month = parseInt(p[1],10);
  if(!year || !month) return null;
  return {
    trimestre: MES_A_TRIMESTRE[month] || 1,
    mesKey: year + '-' + String(month).padStart(2,'0'),
    mesLabel: MESES_CAP[month-1] + ' ' + year,
    mesOrdenKey: String(MES_ORDEN_ANIO_LECTIVO[month]).padStart(2,'0') + '-' + year
  };
}

var TRIMESTRE_LABELS = {1:'1er Trimestre', 2:'2do Trimestre', 3:'3er Trimestre'};
function renderSemanalListInner(d, scopeAll){

    if(filtro.docenteId) planes = planes.filter(function(s){ return s.docenteId===filtro.docenteId; });
    if(filtro.fechaInicio) planes = planes.filter(function(s){ return (s.fechaInicio||'') >= filtro.fechaInicio; });
    if(filtro.fechaFin) planes = planes.filter(function(s){ return (s.fechaInicio||'') <= filtro.fechaFin; });

  function rowHtml(s){
    var lockedForViewer = !!s.locked && !isAdmin;

    + '    <button class="btn btn-ghost btn-sm" data-edit-semanal="' + s.id + '">' + (lockedForViewer ? 'Ver' : 'Ver / Editar') + '</button> '
    + '    <button class="btn btn-gold btn-sm" data-export-semanal-pdf="' + s.id + '" title="PDF real, sin restricciones de tu vista">PDF ✓</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-word="' + s.id + '">Word</button> '
    + '    <button class="btn btn-ghost btn-sm" data-export-semanal-excel="' + s.id + '">Excel</button> '
    + (isAdmin ? '    <button class="btn btn-danger btn-sm" data-delete-semanal="' + s.id + '">Eliminar</button>' : '')
    + '  </td>'
    + '</tr>';
  }

  var theadDocente = scopeAll ? '<th>Docente</th>' : '';
  var theadHtml = '<thead><tr><th>N.º</th>' + theadDocente + '<th>Asignatura</th><th>Curso</th><th>Fecha</th><th>Días</th><th>Actualizado</th><th>Acciones</th></tr></thead>';

  var head = scopeAll
    ? '<p class="hint" style="margin-bottom:14px;">Puedes ver, editar y eliminar cualquier plan semanal, incluidos los bloqueados para los docentes.</p>'
    : '<div class="page-head"><div><div class="eyebrow">Plan Semanal</div><h1>Planes Semanales de Clase</h1><p>Un plan por cada semana de clase, enlazado con tu Plan Curricular Anual.</p></div><button class="btn btn-primary" id="btnNewSemanal">+ Nuevo Plan Semanal</button></div>';

  if(planes.length === 0){
    return head + filtroHtml + '<div class="card"><div class="empty-state"><div class="ic">📅</div>' + (scopeAll ? 'No hay planes semanales que coincidan con el filtro.' : 'Todavía no has creado ningún plan semanal.<br/><button class="btn btn-primary" id="btnNewSemanal2" style="margin-top:14px;">Crear el primero</button>') + '</div></div>';
  }

  // Agrupa por trimestre y, dentro de cada trimestre, por mes (según fecha de inicio del plan).
  var trimestres = {1:{}, 2:{}, 3:{}};
  var sinFecha = [];
  planes.forEach(function(s){
    var info = trimestreYMesDe(s.fechaInicio);
    if(!info){ sinFecha.push(s); return; }
    if(!trimestres[info.trimestre][info.mesKey]) trimestres[info.trimestre][info.mesKey] = {label: info.mesLabel, planes: []};
    trimestres[info.trimestre][info.mesKey].planes.push(s);
  });

  var gruposHtml = [1,2,3].map(function(t){
    var meses = trimestres[t];
    var mesKeys = Object.keys(meses).sort();
    if(!mesKeys.length) return '';
    var mesesHtml = mesKeys.map(function(mk){
      var grupo = meses[mk];
      // Dentro del mes, agrupa además por semana (mismo rango Fecha Inicio/Fin) para que los
      // planes de una misma semana (p.ej. varias asignaturas) queden juntos bajo un encabezado.
      var semanas = {}; var semanaOrder = [];
      grupo.planes.forEach(function(s){
        var key = (s.fechaInicio||'') + '|' + (s.fechaFin||'');
        if(!semanas[key]){ semanas[key] = {fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, planes:[]}; semanaOrder.push(key); }
        semanas[key].planes.push(s);
      });
      semanaOrder.sort();
      var semanasHtml = semanaOrder.map(function(sk){
        var g = semanas[sk];
        var filas = g.planes.slice().sort(function(a,b){ return (a.asignatura||'').localeCompare(b.asignatura||''); }).map(rowHtml).join('');
        var label = g.fechaInicio ? ('Semana del ' + fmtDate(g.fechaInicio) + ' al ' + fmtDate(g.fechaFin)) : 'Sin fecha de inicio';
        return '<div style="margin-top:10px;"><h4 style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; font-weight:700;">' + escapeHtml(label) + '</h4><div class="table-wrap"><table>' + theadHtml + '<tbody>' + filas + '</tbody></table></div></div>';
      }).join('');
      return '<div style="margin-top:14px;"><h3 style="font-size:13.5px; color:var(--blue-700); margin-bottom:8px;">' + escapeHtml(grupo.label) + '</h3>' + semanasHtml + '</div>';
    }).join('');
    return '<div class="card"><h2>' + TRIMESTRE_LABELS[t] + '</h2>' + mesesHtml + '</div>';
  }).join('');

  var sinFechaHtml = sinFecha.length
    ? '<div class="card"><h2>Sin fecha asignada</h2><div class="table-wrap"><table>' + theadHtml + '<tbody>' + sinFecha.map(rowHtml).join('') + '</tbody></table></div></div>'
    : '';

  return head + filtroHtml + gruposHtml + sinFechaHtml;
}

/* La sección Contenidos del PCA (de donde sale "row.unidad", p.ej. "Unidad 1") y la tabla de
   Temporalización (de donde sale "Nombre de la Unidad", p.ej. "Los números reales") son dos
   listas separadas dentro del mismo PCA — se unen aquí por el texto de "unidad" para mostrar
   "Unidad 1 — Los números reales" en el campo Unidad Didáctica del Plan Semanal. */
function unidadDidacticaConNombre(pcaId, unidadLabel){
  if(!unidadLabel) return '';
  var pca = load(LS.PCA).find(function(p){ return p.id===pcaId; });
  var tm = pca && (pca.temporalizacion||[]).find(function(t){ return t.unidad===unidadLabel; });
  var nombre = tm && tm.nombreUnidad;
  return nombre ? (unidadLabel + ' — ' + nombre) : unidadLabel;
}
/* Usada al vincular automáticamente un PCA (nueva ficha, o al cambiar nivel/curso/asignatura):
   precarga la fecha de la primera semana del PCA para que el docente tenga un punto de partida
   editable, en vez de forzarlo a elegir la semana de una lista. Nivel de Logro y Contenidos
   Esenciales ya NO se precargan aquí: ahora son listas de selección múltiple que el docente
   marca explícitamente (ver parseNivelesLogroTiers / temasSemana en renderSemanalForm). */
function applySemanaSelection(s, pcaId, rowId){
  s.pcaId = pcaId || '';
  s.semanaRowId = rowId || '';
  if(!pcaId) return;
  var row = semanasDePca(pcaId).find(function(r){ return r.id===rowId; });
  if(row){
    s.fechaInicio = row.fechaInicio || s.fechaInicio;
    s.fechaFin = row.fechaFin || s.fechaFin;
    s.unidadDidactica = unidadDidacticaConNombre(pcaId, row.unidad);
    if(s.dias && s.dias[0]) s.dias[0].fecha = s.fechaInicio;
  }
}
/* Usada cuando el docente edita manualmente la Fecha: busca, entre las semanas del PCA
   vinculado, aquella cuyo rango contiene la fecha de inicio ingresada, y si la encuentra
   actualiza Unidad Didáctica. Si no hay coincidencia (p.ej. porque esa semana del PCA todavía
   no tiene Fecha Inicio/Fin registrada, o el docente escribió una fecha distinta), NO se borra
   la semana ya vinculada — así Nivel de Logro y Contenidos Esenciales no desaparecen solo por
   escribir una fecha que no calza exactamente con el rango guardado en el PCA. */
function applyFechaSelection(s){
  if(!s.pcaId){ return; }
  if(!s.fechaInicio){ s.semanaRowId = ''; return; }
  var semanas = semanasDePca(s.pcaId);
  var match = semanas.find(function(r){
    return r.fechaInicio && r.fechaFin && s.fechaInicio >= r.fechaInicio && s.fechaInicio <= r.fechaFin;
  });
  if(match){
    s.semanaRowId = match.id;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, match.unidad);
    return;
  }
  // Sin coincidencia por fecha: si todavía no hay ninguna semana vinculada (p.ej. un plan
  // guardado antes de esta función, o cuya semana del PCA nunca tuvo Fecha Inicio/Fin), usa la
  // primera semana del PCA como respaldo en vez de dejar Nivel de Logro/Contenidos sin nada.
  if(!s.semanaRowId && semanas.length){
    s.semanaRowId = semanas[0].id;
    s.unidadDidactica = unidadDidacticaConNombre(s.pcaId, semanas[0].unidad);
  }
}
function recomputeSemanalPca(s){
  var pca = findMiPca(s.docenteId, s.nivel, s.especialidad, s.curso, s.asignatura);
  if(pca) applySemanaSelection(s, pca.id, (semanasDePca(pca.id)[0]||{}).id);
  else { s.pcaId=''; s.semanaRowId=''; s.unidadDidactica=''; s.nivelLogro=''; }
}
