  });

  body += docxPara('FIRMAS', {bold:true, color:'3A2A00', size:11, shd:'F2B705'});
  body += docxTable([docxRow([
    docxCell('Elaborado por (Docente)\n' + (p.elaboradoPor||''), {pct:1666}),
    docxCell('Revisado por (Asesor Pedagógico)\n' + (p.revisadoPor||''), {pct:1667}),
    docxCell('Aprobado por (Vicerrector)\n' + (p.aprobadoPor||''), {pct:1667})
  ])], [1666,1667,1667]);

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:body>' + body
    + '<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"/></w:sectPr>'
    + '</w:body></w:document>';
}

function buildDocxBlob(p, cont){
  var documentXml = buildPcaDocxXml(p, cont);
  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '</Types>';
  var relsRoot = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    + '</Relationships>';
  var enc = new TextEncoder();
  var files = [
    {name:'[Content_Types].xml', data: enc.encode(contentTypes)},
    {name:'_rels/.rels', data: enc.encode(relsRoot)},
    {name:'word/document.xml', data: enc.encode(documentXml)}
  ];
  var zipBytes = makeZip(files);
  return new Blob([zipBytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* Converts our sanitized rich-text HTML (bold/underline/lists/links) into OOXML paragraphs,
   so Actividades/Recursos/Evaluación keep their formatting in the exported .docx. */
function docxRunFormatted(text, fmt){
  fmt = fmt || {};
  var rpr = '';
  if(fmt.bold) rpr += '<w:b/>';
  if(fmt.underline || fmt.link) rpr += '<w:u w:val="single"/>';
  if(fmt.link) rpr += '<w:color w:val="1848A0"/>';
  var rprXml = rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '';
  return docxRunsInline(text, rprXml);
}
function docxParaFromRuns(runsXml, opts){
  opts = opts || {};
  var pPr = '<w:spacing w:before="' + (opts.before!=null?opts.before:20) + '" w:after="' + (opts.after!=null?opts.after:20) + '"/>';
  if(opts.indent) pPr += '<w:ind w:left="' + opts.indent + '"/>';
  return '<w:p><w:pPr>' + pPr + '</w:pPr>' + (runsXml || docxRunFormatted('',{})) + '</w:p>';
}
function richTextToDocxParas(html){
  if(!html || !html.trim()) return [docxParaFromRuns(docxRunFormatted('—',{}))];
  var doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  var out = [];
  function inlineRuns(node, fmt){
    var runs = '';
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){ if(ch.textContent) runs += docxRunFormatted(ch.textContent, fmt); return; }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      var f2 = Object.assign({}, fmt);
      if(tag==='B'||tag==='STRONG') f2.bold = true;
      if(tag==='U') f2.underline = true;
      if(tag==='A'){ f2.link = true; runs += docxRunFormatted((ch.textContent||'') + ' (' + (ch.getAttribute('href')||'') + ')', f2); return; }
      if(tag==='BR'){ runs += '<w:br/>'; return; }
      runs += inlineRuns(ch, f2);
    });
    return runs;
  }
  function walk(node){
    Array.from(node.childNodes).forEach(function(ch){
      if(ch.nodeType === 3){
        if(ch.textContent && ch.textContent.trim()) out.push(docxParaFromRuns(docxRunFormatted(ch.textContent,{})));
        return;
      }
      if(ch.nodeType !== 1) return;
      var tag = ch.tagName;
      if(tag==='UL' || tag==='OL'){
        Array.from(ch.children).filter(function(c){ return c.tagName==='LI'; }).forEach(function(li, idx){
          var prefix = tag==='OL' ? (idx+1) + '. ' : '• ';
          out.push(docxParaFromRuns(docxRunFormatted(prefix,{}) + inlineRuns(li,{}), {indent:360}));
        });
      } else if(tag==='LI'){
        out.push(docxParaFromRuns(docxRunFormatted('• ',{}) + inlineRuns(ch,{}), {indent:360}));
      } else if(tag==='DIV' || tag==='P'){
        var runs = inlineRuns(ch, {});
        out.push(docxParaFromRuns(runs));
      } else if(tag==='BR'){
        /* skip standalone */
      } else {
        var runs2 = inlineRuns(ch, {});
        if(runs2) out.push(docxParaFromRuns(runs2));
      }
    });
  }
  walk(doc.body.firstChild);
  if(out.length===0) out.push(docxParaFromRuns(docxRunFormatted('—',{})));
  return out;
}

function pcaDisplayName(p){
  var asig = (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || 'PCA';
  var curso = (p.curso==='Otro…' ? p.cursoManual : p.curso) || '';
  return (asig + (curso ? ' - ' + curso : '')).replace(/[\\/:*?"<>|]/g,'-');
}

/* Fuera del visor de Claude Artifacts (por ejemplo, cuando este archivo se aloja o se abre
   directamente en un navegador normal) window.claude no existe, así que la descarga se hace con
   el mecanismo estándar del navegador en vez de window.claude.downloads.save(). */
function browserDownloadFallback(filename, data){
  var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* Tries a list of {ext, data} attempts in priority order (best format first).
   Moves to the next attempt only when the viewer rejects the extension itself
   (extension_not_enabled / rejected_extension) — any other failure stops immediately. */
async function saveAttempts(baseName, attempts){
  if(!window.claude || !window.claude.downloads){
    var first = attempts[0];
    browserDownloadFallback(baseName + '.' + first.ext, first.data);
    toast('Archivo .' + first.ext + ' descargado.', 'success');
    return;
  }
  for(var i=0; i<attempts.length; i++){
    var a = attempts[i];
    try{
      await window.claude.downloads.save({filename: baseName + '.' + a.ext, data: a.data});
      toast(i===0
        ? 'Archivo .' + a.ext + ' descargado.'
        : 'Tu vista no admite .' + attempts[0].ext + ' — se descargó como .' + a.ext + ' en su lugar.', 'success');
      return;
    }catch(err){
      var isExtIssue = err && (err.code==='extension_not_enabled' || err.code==='rejected_extension');
      var isLast = i === attempts.length-1;
      if(err && err.code === 'declined') return;
      if(!isExtIssue || isLast){
        if(err) toast('No se pudo descargar el archivo: ' + (err.message||err.code), 'error');
        return;
      }
      // else: extension rejected and more attempts remain — try the next format
    }
  }
}

function buildPcaContext(pcaId){
  var p = load(LS.PCA).find(function(x){ return x.id===pcaId; });
  if(!p) return null;
  var cont = load(LS.CONT).filter(function(c){ return c.pcaId===pcaId; }).sort(function(a,b){ return (a.semana||0)-(b.semana||0); });
  var d = allDocentes().find(function(x){ return x.id===p.docenteId; });
  return {p:p, cont:cont, d:d};
}

  + '<h1 style="text-align:center; background:#123E8C; color:#fff; padding:8px;">PLAN CURRICULAR ANUAL</h1>'
  + '<h2 style="background:#F2B705; padding:8px;">Datos Informativos</h2>'

  + '<p><strong>Asignatura:</strong> '+escapeHtml(asig)+' &nbsp; <strong>Carga horaria semanal:</strong> '+escapeHtml(p.cargaSemanal)+'</p>'
  + '<p><strong>N.º de semanas:</strong> 1er Trimestre: '+escapeHtml(p.semanasT1)+' · 2do Trimestre: '+escapeHtml(p.semanasT2)+' · 3er Trimestre: '+escapeHtml(p.semanasT3)+'</p>'

  + '<table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-size:11pt;"><tr style="background:#E7EEFB;"><th>Unidad didáctica</th><th>Nombre de la Unidad</th><th>Trimestre</th><th>N.º semanas</th></tr>' + temporalizacionRows + '</table>'
  + '<h2 style="background:#F2B705; padding:8px;">Contenidos</h2>'

function mdEsc(v){ return String(v===undefined||v===null?'':v).replace(/\|/g,'\\|').replace(/\n/g,' '); }
function buildPcaMarkdown(p, cont){
  var asig = (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || '';
  var curso = (p.curso==='Otro…' ? p.cursoManual : p.curso) || '';
  var lines = [];
  lines.push('# UNIDAD EDUCATIVA PARTICULAR "SIMÓN BOLÍVAR"');
  lines.push('### Año lectivo 2026-2027');
  lines.push('');
  lines.push('## PLAN CURRICULAR ANUAL');
  lines.push('');
  lines.push('### Datos Informativos');
  lines.push('- **Nivel Educativo:** ' + (p.nivel||'—'));
  lines.push('- **Especialidad:** ' + (p.especialidad||'No aplica'));
  lines.push('- **Curso/Grado:** ' + (curso||'—'));
  lines.push('- **Asignatura:** ' + (asig||'—'));
  lines.push('- **Carga horaria semanal:** ' + (p.cargaSemanal||'—'));
  lines.push('- **N.º de semanas:** 1er Trimestre: ' + p.semanasT1 + ' · 2do Trimestre: ' + p.semanasT2 + ' · 3er Trimestre: ' + p.semanasT3);
  lines.push('');
  lines.push('### Temporalización');
  lines.push('| Unidad didáctica | Nombre de la Unidad | Trimestre | N.º semanas |');
  lines.push('|---|---|---|---|');
  (p.temporalizacion||[]).forEach(function(t){
    lines.push('| ' + mdEsc(t.unidad) + ' | ' + mdEsc(t.nombreUnidad||'') + ' | ' + mdEsc(t.trimestre) + ' | ' + mdEsc(t.semanas) + ' |');
  });
  lines.push('');
  lines.push('### Contenidos');
  (p.unidadesNombres||[]).forEach(function(nombre){
    lines.push('');
    lines.push('#### ' + nombre);
    lines.push('| Semana | Fecha | Nivel de Logro | Temas y subtemas | Página | Observación |');
    lines.push('|---|---|---|---|---|---|');
    cont.filter(function(c){ return c.unidad===nombre; }).forEach(function(f){
      lines.push('| ' + mdEsc(f.semana) + ' | ' + mdEsc(fmtDate(f.fechaInicio)+' al '+fmtDate(f.fechaFin)) + ' | ' + mdEsc(nivelLogroTextoCompleto(f)) + ' | ' + mdEsc(richTextToPlain(f.temas)) + ' | ' + mdEsc(f.pagina) + ' | ' + mdEsc(computeEstadoSemana(f, p.id)) + ' |');
    });
  });
  lines.push('');
  lines.push('### Firmas');
  lines.push('- **Elaborado por (Docente):** ' + (p.elaboradoPor||''));
  lines.push('- **Revisado por (Asesor Pedagógico):** ' + (p.revisadoPor||''));
  lines.push('- **Aprobado por (Vicerrector):** ' + (p.aprobadoPor||''));
  return lines.join('\n');
}

function exportPcaWord(pcaId){
  var ctx = buildPcaContext(pcaId); if(!ctx) return;
  var p=ctx.p, cont=ctx.cont;

  var docxBlob = buildDocxBlob(p, cont);
  var html = buildPcaWordHtml(p, cont);
  var md = buildPcaMarkdown(p, cont);

  saveAttempts('PCA_' + pcaDisplayName(p), [
    {ext:'docx', data:docxBlob},
    {ext:'html', data:html},
    {ext:'md', data:md}
  ]);
}

function exportPcaExcel(pcaId){
  var ctx = buildPcaContext(pcaId); if(!ctx) return;
  var p=ctx.p, cont=ctx.cont;
  function csvEsc(v){ v = (v===undefined||v===null)?'':String(v); if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"'; return v; }
  var lines = [];
  lines.push(['UNIDAD','SEMANA','FECHA INICIO','FECHA FIN','NIVEL DE LOGRO','TEMAS Y SUBTEMAS','PÁGINA','OBSERVACIÓN'].map(csvEsc).join(','));
  cont.forEach(function(f){
    lines.push([f.unidad, f.semana, f.fechaInicio, f.fechaFin, nivelLogroTextoCompleto(f), richTextToPlain(f.temas), f.pagina, computeEstadoSemana(f, p.id)].map(csvEsc).join(','));
  });
  var csv = '﻿' + lines.join('\r\n');

  var tsvLines = lines.map(function(l){
    // simple re-split respecting our own comma quoting is overkill; rebuild from cont directly for txt fallback
    return l;
  });
  var txt = '﻿' + ['UNIDAD','SEMANA','FECHA INICIO','FECHA FIN','NIVEL DE LOGRO','TEMAS Y SUBTEMAS','PÁGINA','OBSERVACIÓN'].join('\t') + '\n'
    + cont.map(function(f){ return [f.unidad,f.semana,f.fechaInicio,f.fechaFin,nivelLogroTextoCompleto(f),richTextToPlain(f.temas),f.pagina,computeEstadoSemana(f, p.id)].join('\t'); }).join('\n');

  saveAttempts('CONTENIDOS_' + pcaDisplayName(p), [
    {ext:'csv', data:csv},
    {ext:'txt', data:txt}
  ]);
}

function buildSemanalMarkdown(s, d){
  var lines = [];
  lines.push('# UNIDAD EDUCATIVA PARTICULAR "SIMÓN BOLÍVAR"');
  lines.push('### Año lectivo 2026-2027');
  lines.push('');
  lines.push('## PLAN SEMANAL DE CLASE' + (s.numero ? ' — N.º ' + s.numero : ''));
  lines.push('');
  lines.push('### Datos Informativos');
  lines.push('- **Nivel Educativo:** ' + (s.nivel||'—'));
  lines.push('- **Especialidad:** ' + (s.especialidad||'No aplica'));
  lines.push('- **Curso/Grado:** ' + (s.curso||'—'));
  lines.push('- **Asignatura:** ' + (s.asignatura||'—'));
  lines.push('- **Docente:** ' + nombreFormal(d));
  lines.push('- **Fecha:** ' + fmtDate(s.fechaInicio) + ' al ' + fmtDate(s.fechaFin));
  lines.push('');
  lines.push('### Datos Curriculares');
  lines.push('- **Unidad Didáctica:** ' + (s.unidadDidactica||'—'));
  lines.push('- **Bloque Curricular:** ' + (s.bloqueCurricular||'—'));
  lines.push('');
  lines.push('### Desarrollo de las Clases');
  (s.dias||[]).forEach(function(dia, i){
    lines.push('');
    lines.push('#### Día ' + (i+1) + ' — ' + fmtDate(dia.fecha));
    lines.push('**Niveles de Logro:** ' + (nivelLogroDiaTexto(dia) || '—'));
    lines.push('**Contenidos Esenciales:** ' + (dia.contenidos||'—'));
    lines.push('');
    lines.push('**Actividades de Aprendizaje:**');
    lines.push(richTextToPlain(dia.actividades) || '—');
    lines.push('');
    lines.push('**Recursos:**');
    lines.push(richTextToPlain(dia.recursos) || '—');
    lines.push('');
    lines.push('**Evaluación:**');
    lines.push(richTextToPlain(dia.evaluacion) || '—');
  });
  lines.push('');
  lines.push('### Firmas de Responsabilidad');
  lines.push('- **Docente:** ' + nombreFormal(d));
  lines.push('- **Asesor Pedagógico:** ' + (s.revisadoPor||''));
  lines.push('- **Vicerrector:** ' + (s.aprobadoPor||''));
  return lines.join('\n');
}
function exportSemanalWord(semId){
  var s = load(LS.SEMANAL).find(function(x){ return x.id===semId; }); if(!s) return;
  var d = allDocentes().find(function(x){ return x.id===s.docenteId; }) || {};
  var docxBlob = buildSemanalDocxBlob(s, d);
  var html = buildSemanalWordHtml(s, d);
  var md = buildSemanalMarkdown(s, d);
  saveAttempts('PLAN_SEMANAL_' + semanalDisplayName(s), [
    {ext:'docx', data:docxBlob},
    {ext:'html', data:html},
    {ext:'md', data:md}
  ]);
}
function exportSemanalExcel(semId){
  var s = load(LS.SEMANAL).find(function(x){ return x.id===semId; }); if(!s) return;
  var d = allDocentes().find(function(x){ return x.id===s.docenteId; }) || {};
  function csvEsc(v){ v=(v===undefined||v===null)?'':String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
  var headCols = ['NIVEL','ESPECIALIDAD','CURSO','ASIGNATURA','DOCENTE','FECHA INICIO','FECHA FIN','UNIDAD DIDÁCTICA','BLOQUE CURRICULAR','NIVEL DE LOGRO','FECHA DEL DÍA','CONTENIDOS ESENCIALES','ACTIVIDADES DE APRENDIZAJE','RECURSOS','EVALUACIÓN'];
  var lines = [headCols.map(csvEsc).join(',')];
  (s.dias||[]).forEach(function(dia){
    lines.push([
      s.nivel, s.especialidad, s.curso, s.asignatura, nombreFormal(d), s.fechaInicio, s.fechaFin,
      s.unidadDidactica, s.bloqueCurricular, nivelLogroDiaTexto(dia),
      dia.fecha, dia.contenidos, richTextToPlain(dia.actividades), richTextToPlain(dia.recursos), richTextToPlain(dia.evaluacion)
    ].map(csvEsc).join(','));
  });
  var csv = '﻿' + lines.join('\r\n');
  var txt = '﻿' + headCols.join('\t') + '\n'
    + (s.dias||[]).map(function(dia){
        return [s.nivel,s.especialidad,s.curso,s.asignatura,nombreFormal(d),s.fechaInicio,s.fechaFin,s.unidadDidactica,s.bloqueCurricular,nivelLogroDiaTexto(dia),dia.fecha,dia.contenidos,richTextToPlain(dia.actividades),richTextToPlain(dia.recursos),richTextToPlain(dia.evaluacion)].join('\t');
      }).join('\n');
  saveAttempts('PLAN_SEMANAL_' + semanalDisplayName(s), [
    {ext:'csv', data:csv},
    {ext:'txt', data:txt}
  ]);
}

async function doSaveAdminDocente(){
  var target = state.editingAdminDocente;
  var errEl = document.getElementById('adminDocenteError');
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }
  errEl.classList.remove('show');

  var original = allDocentes().find(function(x){ return x.id === target.id; }) || target;
  var titulo = target.titulo.trim();
  var nombres = target.nombres.trim();
  var apellidos = target.apellidos.trim();
  var ci = target.ci.trim();
  var telefono = (target.telefono||'').trim();
  var usuarioId = target.usuarioId.trim();
  var role = target.role;

  if(!nombres || !apellidos || !ci || !usuarioId) return fail('Completa todos los campos obligatorios (*).');
  if(!/^\d{10}$/.test(ci)) return fail('La cédula debe tener 10 dígitos numéricos.');
  var all = allDocentes();
  if(all.some(function(x){ return x.id!==target.id && x.usuarioId.toLowerCase()===usuarioId.toLowerCase(); })) return fail('Ese ID de usuario ya existe. Elige otro.');
  if(isStaffRole(original.role) && !isStaffRole(role)){
    var otherStaff = all.filter(function(x){ return isStaffRole(x.role) && x.id!==target.id; });
    if(otherStaff.length===0) return fail('No puedes quitar este rol: es el único usuario con acceso administrativo del sistema.');
  }

  target.titulo=titulo; target.nombres=nombres; target.apellidos=apellidos; target.ci=ci; target.telefono=telefono;
  target.usuarioId=usuarioId; target.role=role;
  save(LS.DOCENTES, all.map(function(x){ return x.id===target.id ? target : x; }));
  state.editingAdminDocente = null;
  toast('Docente actualizado correctamente.', 'success');
  state.subview = 'admin'; state.adminTab = 'docentes';
  render();
}
function bindAdminEditDocenteEvents(){
  var target = state.editingAdminDocente;
  document.getElementById('btnBackToAdminDocentes').onclick = function(){ state.editingAdminDocente=null; state.subview='admin'; state.adminTab='docentes'; render(); };
  document.getElementById('btnSaveAdminDocente').onclick = doSaveAdminDocente;
  [['adTTitulo','titulo'], ['adTNombres','nombres'], ['adTApellidos','apellidos'], ['adTCI','ci'], ['adTTelefono','telefono'], ['adTUserId','usuarioId']].forEach(function(pair){
    var el = document.getElementById(pair[0]);
    el.addEventListener('input', function(){ target[pair[1]] = el.value; });
  });
  document.getElementById('adTRol').addEventListener('change', function(e){ target.role = e.target.value; });
  var prevBtn = document.getElementById('btnPrevDocente');
  if(prevBtn && !prevBtn.disabled) prevBtn.onclick = function(){ state.editingAdminDocente=null; state.adminEditingDocenteId = prevBtn.getAttribute('data-prev-id'); render(); };
  var nextBtn = document.getElementById('btnNextDocente');
  if(nextBtn && !nextBtn.disabled) nextBtn.onclick = function(){ state.editingAdminDocente=null; state.adminEditingDocenteId = nextBtn.getAttribute('data-next-id'); render(); };
  var resetBtn = document.getElementById('btnResetPwAdminDocente');
  if(resetBtn) resetBtn.onclick = async function(){
    try{
      await window.FB.sendPasswordResetEmail(window.FB.auth, target.email);
      toast('Correo de restablecimiento enviado a ' + target.email + '.', 'success');
    }catch(err){ toast(mapAuthError(err), 'error'); }
  };
  var delBtn = document.getElementById('btnDeleteAdminDocente');
  if(delBtn) delBtn.onclick = function(){
    if(isStaffRole(target.role)){
      var otherStaff = allDocentes().filter(function(x){ return isStaffRole(x.role) && x.id!==target.id; });
      if(otherStaff.length===0){ toast('No puedes eliminar al único usuario con acceso administrativo del sistema.', 'error'); return; }
    }
    confirmDialog('¿Eliminar a ' + target.nombres + ' ' + target.apellidos + ' y TODOS sus datos (carga horaria, planes curriculares, contenidos y planes semanales)? Su cuenta de acceso quedará sin ningún dato ni permiso.', function(){
      var docenteReg = allDocentes().filter(function(x){ return x.id===target.id; });
      var cargaReg = load(LS.CARGA).filter(function(r){ return r.docenteId===target.id; });
      var pcaReg = load(LS.PCA).filter(function(p){ return p.docenteId===target.id; });
      var pcaIds = pcaReg.map(function(p){ return p.id; });
      var contReg = load(LS.CONT).filter(function(c){ return pcaIds.indexOf(c.pcaId)!==-1; });
      var semanalReg = load(LS.SEMANAL).filter(function(s){ return s.docenteId===target.id; });
      eliminarVariasConDeshacer([
        {key: LS.DOCENTES, ids: docenteReg.map(function(x){return x.id;}), registros: docenteReg},
        {key: LS.CARGA, ids: cargaReg.map(function(x){return x.id;}), registros: cargaReg},
        {key: LS.PCA, ids: pcaIds, registros: pcaReg},
        {key: LS.CONT, ids: contReg.map(function(x){return x.id;}), registros: contReg},
        {key: LS.SEMANAL, ids: semanalReg.map(function(x){return x.id;}), registros: semanalReg}
      ], 'Docente eliminado.', 'Docente y sus datos restaurados.');
      state.editingAdminDocente = null;
      state.subview='admin'; state.adminTab='docentes';
      render();
    });
  };
}

var adminCargaEditRows = null;
function ensureAdminCargaRows(){
  if(adminCargaEditRows) return adminCargaEditRows;
  adminCargaEditRows = load(LS.CARGA).map(function(r){ return Object.assign({}, r); });
  return adminCargaEditRows;
}
/* Agrupa las filas de carga por docente (orden alfabético apellidos+nombres); las filas cuyo
   docente ya no existe quedan en un grupo aparte al final. */
function groupCargaByDocente(rows, docentesById){
  var groups = {}; var order = [];
  rows.forEach(function(r){
    var key = r.docenteId || '__sin__';
    if(!groups[key]){ groups[key] = {docenteId: r.docenteId, docente: docentesById[r.docenteId], rows: []}; order.push(key); }
    groups[key].rows.push(r);
  });
  var list = order.map(function(k){ return groups[k]; });
  list.sort(function(a,b){
    if(!a.docente && !b.docente) return 0;
    if(!a.docente) return 1;
    if(!b.docente) return -1;
    return (a.docente.apellidos+a.docente.nombres).localeCompare(b.docente.apellidos+b.docente.nombres);
  });
  return list;
}
function renderAdminCarga(){
  var rows = ensureAdminCargaRows();
  var docentesById = {}; allDocentes().forEach(function(x){ docentesById[x.id] = x; });
  var groups = groupCargaByDocente(rows, docentesById);
  var bodyHtml = groups.map(function(g){ return adminCargaGroupHtml(g); }).join('');
  return ''
  + '<div class="card">'
  + '  <h2>Carga horaria de todos los docentes</h2>'
  + '  <div class="card-sub">Agrupada por docente. Puedes editar o eliminar cualquier fila. Los cambios se guardan al presionar "Guardar cambios".</div>'
  + (rows.length === 0
      ? '<div class="empty-state"><div class="ic">🗂️</div>Todavía no hay filas de carga horaria registradas.</div>'
      : '<div class="table-wrap"><table><thead><tr><th style="width:28px;">#</th><th>Nivel educativo</th><th>Especialidad</th><th>Curso / grado</th><th>Asignatura</th><th style="width:36px;"></th></tr></thead><tbody id="adminCargaBody">' + bodyHtml + '</tbody></table></div>'
      + '<div style="display:flex; gap:10px; margin-top:14px;"><div class="spacer"></div><button class="btn btn-primary" id="btnSaveAdminCarga">Guardar cambios</button></div>')
  + '</div>';
}
function adminCargaGroupHtml(g){
  var nombre = g.docente ? (escapeHtml(g.docente.nombres) + ' ' + escapeHtml(g.docente.apellidos)) : '(docente eliminado)';
  var rowsHtml = g.rows.map(function(r, i){ return adminCargaRowHtml(r, i); }).join('');

  + '  <td><select class="cell-select" data-f="curso">' + optionsHtml(cursoOpts.concat(['Otro…']), r.curso, 'Selecciona…') + '</select>' + (r.curso==='Otro…' ? '<input class="cell-input" style="margin-top:6px;" data-f="cursoManual" placeholder="Especifica el curso" value="'+escapeHtml(r.cursoManual||'')+'" />' : '') + '</td>'

function bindAdminCargaEvents(){
  var body = document.getElementById('adminCargaBody');
  if(!body) return;
  var docentesById = {}; allDocentes().forEach(function(x){ docentesById[x.id] = x; });
  function findRow(id){ return adminCargaEditRows.find(function(r){ return r.id===id; }); }

  body.querySelectorAll('tr').forEach(function(tr){
    var id = tr.getAttribute('data-row');
    tr.querySelectorAll('[data-f]').forEach(function(el){
      el.addEventListener('change', function(){
        var row = findRow(id);
        row[el.getAttribute('data-f')] = el.value;
        if(el.getAttribute('data-f') === 'nivel'){ row.especialidad=''; row.curso=''; row.asignatura=''; row.cursoManual=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'especialidad'){ row.asignatura=''; row.asignaturaManual=''; renderAdminCargaBodyOnly(docentesById); }
        else if(el.getAttribute('data-f') === 'curso' || el.getAttribute('data-f') === 'asignatura'){ renderAdminCargaBodyOnly(docentesById); }
      });
      el.addEventListener('input', function(){
        if(el.tagName === 'INPUT'){ findRow(id)[el.getAttribute('data-f')] = el.value; }
      });
    });
  });
  document.querySelectorAll('[data-admin-remove-carga]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-admin-remove-carga');
      adminCargaEditRows = adminCargaEditRows.filter(function(r){ return r.id!==id; });
      renderAdminCargaBodyOnly(docentesById);
    };
  });
  var saveBtn = document.getElementById('btnSaveAdminCarga');
  if(saveBtn) saveBtn.onclick = function(){
    var toSave = adminCargaEditRows.map(function(r){
      return {
        id: r.id, docenteId: r.docenteId,
        nivel: r.nivel, especialidad: r.especialidad || '',
        curso: r.curso === 'Otro…' ? (r.cursoManual||'') : r.curso,
        asignatura: r.asignatura === 'Otra…' ? (r.asignaturaManual||'') : r.asignatura,
        updatedAt: nowISO()
      };
    }).filter(function(r){ return r.nivel && r.curso && r.asignatura; });
    save(LS.CARGA, toSave);
    adminCargaEditRows = null;
    toast('Carga horaria actualizada (' + toSave.length + ' filas).', 'success');
    render();
  };
}
function renderAdminCargaBodyOnly(docentesById){
  var groups = groupCargaByDocente(adminCargaEditRows, docentesById);
  document.getElementById('adminCargaBody').innerHTML = groups.map(function(g){ return adminCargaGroupHtml(g); }).join('');

/* Toma los Planes Semanales del docente cuya fecha (fechaInicio) cae dentro del rango de corte
   [fechaInicioParte, fechaFinParte] que el admin elige. La puntualidad se calcula comparando la
   fecha y hora en que se CREÓ cada plan contra la Fecha y hora límite que ese MISMO plan tiene
   guardada (campo editable solo por el admin, visible en la parte de arriba del documento) — ya
   no se pide una fecha límite aparte en este formulario. Tareas/Talleres/Lecciones se detectan
   revisando el texto del campo Evaluación de cada día del plan. */
function filasPresentacionDocente(docenteId, fechaInicioParte, fechaFinParte){
  return load(LS.SEMANAL).filter(function(s){
    return s.docenteId===docenteId && s.fechaInicio && s.fechaInicio>=fechaInicioParte && s.fechaInicio<=fechaFinParte;
  }).map(function(s){
    var estado;
    if(!s.fechaHoraLimite) estado = 'sin_limite';
    else {
      var limiteISO = new Date(s.fechaHoraLimite).toISOString();
      estado = (s.createdAt && s.createdAt <= limiteISO) ? 'a_tiempo' : 'con_retraso';
    }
    var evalTexto = (s.dias||[]).map(function(dia){ return richTextToPlain(dia.evaluacion||''); }).join(' ').toLowerCase();
    return {
      numero:s.numero, fechaInicio:s.fechaInicio, fechaFin:s.fechaFin, asignatura:s.asignatura, curso:s.curso,
      createdAt:s.createdAt, fechaHoraLimite:s.fechaHoraLimite, estado:estado,
      tareas: evalTexto.indexOf('tarea')!==-1,
      talleres: evalTexto.indexOf('taller')!==-1,
      lecciones: evalTexto.indexOf('lecci')!==-1
    };
  });
}

/* ============================= ADMIN: PRESENTACIÓN DE PCA (solo admin) ============================= */
/* Toma los PCA del docente cuya fecha de creación cae dentro del rango de corte elegido por el
   admin. La puntualidad se calcula comparando la fecha y hora en que se CREÓ cada PCA contra la
   Fecha Límite que ese MISMO PCA tiene guardada (campo editable solo por el admin, visible arriba
   del documento). */
function filasPresentacionPcaDocente(docenteId, fechaInicioParte, fechaFinParte){
  return load(LS.PCA).filter(function(p){
    var fecha = (p.createdAt||'').slice(0,10);
    return p.docenteId===docenteId && fecha && fecha>=fechaInicioParte && fecha<=fechaFinParte;
  }).map(function(p){
    var estado;
    if(!p.fechaLimite) estado = 'sin_limite';
    else {
      var limiteISO = new Date(p.fechaLimite).toISOString();
      estado = (p.createdAt && p.createdAt <= limiteISO) ? 'a_tiempo' : 'con_retraso';
    }
    return {
      asignatura: (p.asignatura==='Otra…' ? p.asignaturaManual : p.asignatura) || '—',
      curso: (p.curso==='Otro…' ? p.cursoManual : p.curso) || '—',
      nivel: p.nivel||'—', especialidad: p.especialidad||'',
      unidades: (p.unidadesNombres||[]).length,
      createdAt:p.createdAt, fechaLimite:p.fechaLimite, estado:estado
    };
  });
}

/* La fecha límite VIGENTE de una categoría es la más recientemente registrada — esa es la que
   se usa para autorellenar el campo Fecha Límite de un PCA o Plan Semanal nuevo. */
function fechaLimiteVigente(categoria){
  var entradas = load(LS.FECHAS_LIMITE).filter(function(x){ return x.categoria===categoria; });
  if(!entradas.length) return '';
  entradas.sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); });
  return entradas[entradas.length-1].fechaHoraLimite || '';
}

function bindAdminFechasLimiteEvents(){
  document.querySelectorAll('[data-add-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var categoria = btn.getAttribute('data-add-fechalimite');
      var fechaInput = document.getElementById('fl-fecha-' + categoria);
      var notaInput = document.getElementById('fl-nota-' + categoria);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .concat() en vez de .push() sobre load(): load() devuelve la MISMA referencia que
         FS_CACHE, así que empujar directo a ese arreglo hacía que save() comparara el caché
         contra sí mismo (ya con la fila nueva adentro) y creyera que "nada cambió" — la fila
         se veía en pantalla pero nunca se escribía a Firestore. */
      var entradas = load(LS.FECHAS_LIMITE).concat([{id: uid('fl'), categoria: categoria, fechaHoraLimite: fecha, nota: (notaInput.value||'').trim(), createdAt: nowISO()}]);
      save(LS.FECHAS_LIMITE, entradas);
      toast('Fecha límite agregada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-edit-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = btn.getAttribute('data-edit-fechalimite');
      render();
    };
  });
  document.querySelectorAll('[data-cancel-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      state.editingFechaLimiteId = null;
      render();
    };
  });
  document.querySelectorAll('[data-save-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-save-fechalimite');
      var fechaInput = document.getElementById('fl-edit-fecha-' + id);
      var notaInput = document.getElementById('fl-edit-nota-' + id);
      var fecha = fechaInput.value;
      if(!fecha){ toast('Ingresa la fecha y hora límite.', 'error'); return; }
      /* .map() para construir un objeto y un arreglo nuevos, por la misma razón que en
         "+ Agregar": mutar la entrada y el arreglo que devuelve load() en el sitio hacía que
         save() los comparara contra sí mismos y nunca detectara el cambio. */
      var entradas = load(LS.FECHAS_LIMITE).map(function(x){
        return x.id===id ? Object.assign({}, x, {fechaHoraLimite: fecha, nota: (notaInput.value||'').trim()}) : x;
      });
      save(LS.FECHAS_LIMITE, entradas);
      state.editingFechaLimiteId = null;
      toast('Fecha límite actualizada.', 'success');
      render();
    };
  });
  document.querySelectorAll('[data-delete-fechalimite]').forEach(function(btn){
    btn.onclick = function(){
      confirmDialog('¿Eliminar esta fecha límite?', function(){
        eliminarConDeshacer(LS.FECHAS_LIMITE, btn.getAttribute('data-delete-fechalimite'), 'Fecha límite eliminada.', 'Fecha límite restaurada.');
        render();
      });
    };
  });
}

function bindDatabaseEvents(){
  document.getElementById('btnExportAll').onclick = async function(){
    var payload = {
      exportedAt: nowISO(),
      DOCENTES: load(LS.DOCENTES),
      CARGA_HORARIA: load(LS.CARGA),
      PCA: load(LS.PCA),
      CONTENIDOS_ANUALES: load(LS.CONT),
      PLAN_SEMANAL: load(LS.SEMANAL)
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = 'respaldo_seb_' + todayISO() + '.json';
    if(!window.claude || !window.claude.downloads){
      browserDownloadFallback(filename, json);
      toast('Respaldo descargado.', 'success');
      return;
    }
    try{
      await window.claude.downloads.save({filename: filename, data: json});
      toast('Respaldo descargado.', 'success');
    }catch(err){ if(err && err.code!=='declined') toast('No se pudo exportar: ' + (err.message||err.code), 'error'); }
  };
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var res = mergeBy(LS.DOCENTES, data.DOCENTES || []);
        var res2 = mergeBy(LS.CARGA, data.CARGA_HORARIA || []);
        var res3 = mergeBy(LS.PCA, data.PCA || []);
        var res4 = mergeBy(LS.CONT, data.CONTENIDOS_ANUALES || []);
        var res5 = mergeBy(LS.SEMANAL, data.PLAN_SEMANAL || []);
        document.getElementById('importResult').textContent = 'Fusionado: ' + (res+res2+res3+res4+res5) + ' registros procesados.';
        toast('Base de datos fusionada correctamente.', 'success');
        render();
      }catch(err){ toast('El archivo no es un respaldo válido.', 'error'); }
    };
    reader.readAsText(file);
  });
}
function mergeBy(key, incoming){
  var current = load(key);
  var map = {};
  current.forEach(function(r){ map[r.id] = r; });
  incoming.forEach(function(r){ if(r && r.id) map[r.id] = r; });
  save(key, Object.values(map));
  return incoming.length;
}

/* ============================= FIREBASE BOOTSTRAP ============================= */
/* Mantiene FS_CACHE sincronizada en tiempo real con Firestore mientras haya sesión activa:
   onSnapshot entrega el estado inicial y cada cambio posterior (propio o de otro docente/admin),
   así que un simple render() en cada callback basta para reflejar los cambios al instante en
   todas las pestañas/dispositivos abiertos. */
var FS_UNSUBS = [];
function detachRealtimeListeners(){
  FS_UNSUBS.forEach(function(u){ try{ u(); }catch(e){} });
  FS_UNSUBS = [];
}
/* Observación de Clases se lee completa solo si eres admin; un docente solo puede LEER sus
   propias observaciones (nunca escribirlas — eso lo exigen también las reglas de Firestore).
   Firestore exige que una consulta de colección completa esté acotada con un where() que calce
   exactamente con la regla de seguridad basada en resource.data, así que hace falta saber el rol
   ANTES de armar la consulta — por eso esta única lectura puntual (no en tiempo real) de la
   colección "docentes" (de lectura pública) se hace primero y se espera antes de suscribirse. */
/* Estudiantes, Asistencia, Incidentes y la Ficha de Datos Informativos (DECE) son de acceso
   exclusivo para roles con acceso administrativo (ver firestore.rules: solo isStaff() puede leer)
   — ni siquiera de forma acotada a lo propio, como sí ocurre con Observaciones/Fichas de
   Detección. Un docente jamás navega
   a esas secciones (no aparecen en su menú), así que no tiene sentido intentar sincronizarlas
   para él: Firestore rechazaría la lectura y solo generaría avisos de error en pantalla. */
var COLECCIONES_SOLO_STAFF = ['ESTUDIANTES', 'ASISTENCIA', 'INCIDENTES', 'DECE'];
/* Ver el comentario dentro de attachRealtimeListeners: evita el redibujado completo (y el
   "congelamiento" que se siente en documentos grandes) cuando el cambio recién llegado es
   simplemente el eco del autoguardado del formulario que el propio docente tiene abierto en este
   momento — su copia en memoria (state.editingPca/editingSemanal/etc.) ya refleja ese cambio. */
function debeOmitirRenderPorEdicionActiva(key){
  if((key === 'PCA' || key === 'CONT') && state.subview === 'pcaform' && state.editingPca) return true;
  if(key === 'SEMANAL' && state.subview === 'semanalform' && state.editingSemanal) return true;
  if(key === 'FICHA_DETECCION' && state.subview === 'fichadeteccion' && state.fichaDeteccionView === 'form' && state.editingFichaDeteccion) return true;
  if(key === 'DECE' && state.subview === 'dece' && state.deceView === 'form' && state.editingDece) return true;
  return false;
}
async function attachRealtimeListeners(){
  detachRealtimeListeners();
  var soyAdmin = false;
  try{
    var docentesSnap = await window.FB.getDocs(window.FB.collection(window.FB.db, FS_COLLECTION.DOCENTES));
    docentesSnap.forEach(function(d){ if(d.id === CURRENT_UID && isStaffRole(d.data().role)) soyAdmin = true; });
  }catch(e){ console.error('No se pudo determinar el rol antes de sincronizar', e); }

  Object.keys(FS_COLLECTION).forEach(function(key){
    if(!soyAdmin && COLECCIONES_SOLO_STAFF.indexOf(key)!==-1){ FS_CACHE[key] = []; return; }
    var colRef = window.FB.collection(window.FB.db, FS_COLLECTION[key]);
    var queryRef = ((key === 'OBSERVACIONES' || key === 'FICHA_DETECCION') && !soyAdmin)
      ? window.FB.query(colRef, window.FB.where('docenteId', '==', CURRENT_UID))
      : colRef;
    var unsub = window.FB.onSnapshot(queryRef, function(snap){
      var arr = [];
      snap.forEach(function(docSnap){ arr.push(docSnap.data()); });
      FS_CACHE[key] = arr;
      // El eco de Firestore por el propio autoguardado del docente llega segundos después de
      // escribir; si en ese momento sigue con ese mismo formulario abierto, NO hace falta
      // reconstruir todo el HTML (su copia en memoria ya está al día — es la que se acaba de
      // guardar) y evita el "congelamiento" visible al redibujar un PCA/Plan Semanal grande con
      // muchos editores de texto enriquecido. Las listas y otras vistas sí se siguen refrescando
      // normalmente.
      if(!debeOmitirRenderPorEdicionActiva(key)) render();
    }, function(err){
      console.error('Error de sincronización en tiempo real (' + key + ')', err);
      toast('Se perdió la sincronización en tiempo real: ' + (err.message||err.code), 'error');
    });
    FS_UNSUBS.push(unsub);
  });
}

window.addEventListener('firebase-ready', function(){
  if(ES_FORMULARIO_PUBLICO){
    /* Modo formulario público: solo necesita una sesión anónima para poder ESCRIBIR una ficha
       nueva; nunca activa los listeners en tiempo real ni carga el perfil docente. */
    window.FB.onAuthStateChanged(window.FB.auth, function(user){
      FB_READY = true;
      if(!user){
        window.FB.signInAnonymously(window.FB.auth).catch(function(e){
          console.error('Error de autenticación anónima', e);
        });
      }
      render();
    });
    return;
  }
  window.FB.onAuthStateChanged(window.FB.auth, function(user){
    /* Una sesión anónima (creada por el enlace público del representante legal) puede quedar
       persistida en el mismo navegador; si alguien luego abre el sistema normal con esa sesión
       todavía activa, nunca tendrá un perfil docente — hay que cerrarla en vez de quedarse
       esperando "Cargando tu perfil…" para siempre. */
    if(user && user.isAnonymous){
      window.FB.signOut(window.FB.auth);
      return;
    }
    if(user){
      CURRENT_UID = user.uid;
      attachRealtimeListeners();
    } else {
      CURRENT_UID = null;
      detachRealtimeListeners();
      detenerTodosLosAutoguardados();
      Object.keys(FS_CACHE).forEach(function(k){ FS_CACHE[k] = []; });
      state.subview = 'dashboard';
      RESTORED_LAST_VIEW = false;
      RESTORE_STARTED_AT = null;
    }
    FB_READY = true;
    render();
  });
});

/* ============================= INIT ============================= */
render();
})();
</script>
